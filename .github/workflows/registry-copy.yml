name: Registry Copy

# Copies an image or artifact, pinned by digest, into the project's registry as <name>:<tag> with the
# repository's token, which may create packages there. Run by hand, e.g. for first-release.md Step 0.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source reference pinned by digest (<registry>/<name>@sha256:...)"
        required: true
        type: string
      destination:
        description: "Destination <name>:<tag> under the project's registry"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  registry-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      SRC: ${{ inputs.source }}
      DST: ${{ inputs.destination }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Copy by digest and check the digest
        run: make registry-copy
