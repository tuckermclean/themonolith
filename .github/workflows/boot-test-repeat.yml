name: Boot Test Repeat

# Boots the `uefi` mode of one finished build.yml run's ISO `count` times, one job per boot, without a
# rebuild (O03, issue #46). Dispatch it from the Actions tab or `gh workflow run`. Each job downloads the
# artifact iso-<build-run-id> (a single file, boot-test.iso) and uploads its serial log and tool versions
# as boot-test-uefi-<build-run-id>-<index>. A failed job is not re-run: each failure is a result.

on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: "ID of a finished build.yml run whose iso-<id> artifact is still retained"
        required: true
        type: string
      count:
        description: "Number of uefi boots (one job each)"
        required: true
        type: string
        default: "10"

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      index: ${{ steps.matrix.outputs.index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: matrix
        env:
          COUNT: ${{ inputs.count }}
        run: make repeat-matrix

  # Pulls or builds the toolbox image once for this run and shares it with the jobs that run toolbox/run.
  toolbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull or build the toolbox image
        run: make toolbox-save

      - name: Upload the toolbox image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-${{ github.run_id }}
          path: output/toolbox/toolbox.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  expected-kernel:
    needs: toolbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the toolbox image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolbox-${{ github.run_id }}
          path: output/toolbox

      - name: Load the toolbox image
        run: make toolbox-load

      - id: compute
        run: |
          toolbox/run -- sh -c 'V=$(grep "^sys-kernel/monolith-kernel:" configs/portage/versions.lock | cut -d: -f2 | sed -E "s/-r[0-9]+\$//"); L=$(grep "^CONFIG_LOCALVERSION=" configs/portage/savedconfig/sys-kernel/monolith-kernel | cut -d\" -f2); test -n "$V" && test -n "$L" || { echo "::error::no expected kernel version"; exit 1; }; KVER=$V$L; echo "version=$KVER" >> "$GITHUB_OUTPUT"; echo "==> Expected uname -r: $KVER"'

  uefi:
    needs: [plan, expected-kernel, toolbox]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.plan.outputs.index) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the toolbox image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolbox-${{ github.run_id }}
          path: output/toolbox

      - name: Load the toolbox image
        run: make toolbox-load

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-${{ inputs.build-run-id }}
          path: output/iso
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}

      - name: Boot test — UEFI (GRUB + OVMF), boot ${{ matrix.index }}
        env:
          EXPECTED_KERNEL: ${{ needs.expected-kernel.outputs.version }}
        run: make test-boot MODE=uefi ISO=output/iso/boot-test.iso

      - name: Upload serial console log and tool versions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-test-uefi-${{ inputs.build-run-id }}-${{ matrix.index }}
          path: |
            output/boot-test-uefi.log
            output/tool-versions.txt
          retention-days: 14
          if-no-files-found: warn
