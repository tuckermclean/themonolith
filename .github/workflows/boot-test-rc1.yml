name: Boot Test rc1

# The rc1 lane: the 17 original boot modes, plus entry and serial-net, on the v0.1.0-rc1 release ISO, fetched by URL and checked by sha256, before
# this repository builds anything. workflow_dispatch runs only for a workflow on the default branch, so a
# pull_request trigger on the oracle's own files runs it on the PR that changes them. A dispatch with a
# wrong iso-sha256 must fail the fetch-iso job before any mode runs.
# persist-init is left out because rc1 lacks the persistence fixes it checks.
on:
  workflow_dispatch:
    inputs:
      iso-sha256:
        description: "sha256 the ISO must match"
        required: true
        type: string
        default: a96006596b13cc09fa951f54aadc0b816765d783e5d0e40895d7d0945edeb27a
  pull_request:
    paths:
      - scripts/boot-test.py
      - Makefile
      - toolbox/**
      - .github/workflows/boot-test.yml
      - .github/workflows/boot-test-rc1.yml

permissions:
  contents: read

jobs:
  # Pulls or builds the toolbox image once for this run and shares it with the jobs that run toolbox/run.
  toolbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull or build the toolbox image
        run: make toolbox-save

      - name: Upload the toolbox image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-${{ github.run_id }}
          path: output/toolbox/toolbox.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # The right digest, on the pull request.
  boot-test:
    needs: toolbox
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/boot-test.yml
    with:
      iso-url: https://github.com/tuckermclean/linux-live-iso-factory/releases/download/v0.1.0-rc1/themonolith-0.1.0-rc1.iso
      iso-sha256: a96006596b13cc09fa951f54aadc0b816765d783e5d0e40895d7d0945edeb27a
      kernel-version: 6.12.80-i486-monolith
      modes: bios uefi toram ahci nvme usb virtio nicless nic vga fbdev-modprobe nat gui stele-acid2 clock-epoch clock-1996 persist entry serial-net

  # The digest of the dispatch, right or wrong.
  boot-test-dispatch:
    needs: toolbox
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/boot-test.yml
    with:
      iso-url: https://github.com/tuckermclean/linux-live-iso-factory/releases/download/v0.1.0-rc1/themonolith-0.1.0-rc1.iso
      iso-sha256: ${{ inputs.iso-sha256 }}
      kernel-version: 6.12.80-i486-monolith
      modes: bios uefi toram ahci nvme usb virtio nicless nic vga fbdev-modprobe nat gui stele-acid2 clock-epoch clock-1996 persist entry serial-net
