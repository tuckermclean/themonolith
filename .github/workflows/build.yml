name: Build

# NOTE on tag pushes: this workflow triggers DIRECTLY on `push: tags:
# ['v*.*.*']` and produces the release build + SLSA attestation itself. It
# MUST be the OIDC entry point for a release: GitHub's attestation store binds
# the Sigstore certificate to the *entry* workflow, so when this build ran as a
# `workflow_call` reusable library under release.yml, `actions/attest` failed
# to persist with "Invalid Argument - values do not match: build.yml !=
# release.yml" (the cert's SAN was build.yml, but the persist API validated the
# caller, release.yml). Signing only succeeds when the workflow that runs the
# job is also the workflow that triggered it — i.e. build.yml on its own tag.
#
# There is still exactly ONE build per release and ONE definition of
# build+attest (this file). release.yml no longer calls this workflow; it fires
# AFTER this build completes, via `workflow_run`, and does publish-only work
# (download the already-attested ISO, verify the digest chain, cut the
# GitHub Release). See release.yml's header and docs/releasing.md.
on:
  push:
    branches: [main]
    # Only a change to a build input starts a push build (GitHub does not apply paths to tag pushes).
    paths:
      - configs/portage/**
      - configs/overlay/**
      - scripts/**
      - rootfs/**
      - Dockerfile
      - Makefile
    tags: ['v*.*.*']
  # Full build as a PR check, but ONLY when the PR carries the 'full-ci' label
  # (gated in the `changes` job below). This keeps the expensive Gentoo build
  # off every push while still letting a maintainer demand end-to-end proof on
  # a PR. `labeled` fires the run when the label is added; `synchronize` re-runs
  # it on subsequent pushes to an already-labeled PR.
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  # gate: run the reproducibility gate (fetch, two offline builds, compare) as a tag run does, without publishing.
  # drop-distfile: remove that one distfile from the archive before the builds (the offline build must then fail on it).
  workflow_dispatch:
    inputs:
      gate:
        description: "Run the reproducibility gate path (the tag pipeline without publishing)"
        type: boolean
        default: false
      drop-distfile:
        description: "Gate path: name of one distfile to remove before the builds (the builds must fail on it)"
        type: string
        default: ""
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

# Cancel a superseded run for the SAME pull request when a new commit is pushed,
# so rapid pushes to a 'full-ci'-labeled PR don't stack expensive builds. Non-PR
# events (push to main, tag pushes, schedule, and workflow_dispatch) get a
# unique per-run group, so they never cancel one another.
concurrency:
  group: >-
    build-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || github.run_id }}
  cancel-in-progress: true


jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # On pull_request the (expensive) build chain runs only when the PR is labeled 'full-ci' (scripts/full-ci-label.sh);
    # a branch push is filtered by on.push.paths. A false output skips
    # build, static-rebuild, boot-test and attestation through their `needs:`.
    outputs:
      build: ${{ steps.filter.outputs.build }}
      gate: ${{ steps.route.outputs.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: make changes

      # A tag, or a dispatch with the gate input, takes the gate path (fetch, build-a, build-b, compare); every
      # other run keeps the build job.
      - id: route
        env:
          GATE: ${{ inputs.gate }}
        run: make gate-route

  # Pulls or builds the toolbox image once for this run and shares it with the jobs that run toolbox/run. It runs
  # when something builds, so a pull request without full-ci does not move the toolbox for nothing.
  toolbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    permissions:
      contents: read
    if: needs.changes.outputs.build == 'true' || needs.changes.outputs.gate == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull or build the toolbox image
        run: make toolbox-save

      - name: Upload the toolbox image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-${{ github.run_id }}
          path: output/toolbox/toolbox.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Builds the packages, the root filesystem, the initramfs and the ISO from the pinned builder image and tree
  # (iteration builds: binary packages allowed). A tag or a gate dispatch runs fetch, build-a, build-b and compare instead.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: [changes, toolbox]
    permissions:
      contents: read
      # write: this job pushes the binary package cache to GHCR.
      packages: write
    if: needs.changes.outputs.build == 'true' && github.ref_type != 'tag' && needs.changes.outputs.gate != 'true'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the toolbox image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolbox-${{ github.run_id }}
          path: output/toolbox

      - name: Load the toolbox image
        run: make toolbox-load

      - name: Set build version
        run: make build-version

      # The builder is pulled by its digest (Makefile BUILDER_DIGEST); its manifest is kept with the run.
      - name: Pull the builder image
        run: make pull-image

      - name: Record the builder image
        run: make builder-manifest

      - name: Upload the builder manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builder-manifest-${{ github.run_id }}
          path: output/builder-manifest.txt
          retention-days: 14
          if-no-files-found: error

      - name: Sync the pinned portage tree
        run: make sync-portage

      # Iteration builds only (a tag or a gate dispatch takes the fetch, build-a, build-b path, which uses no cache).
      - name: Pull the binary package cache
        run: make cache-pull

      - name: Build packages (from the cache)
        if: github.ref_type != 'tag'
        env:
          JOBS: 2
          LOAD_AVG: 2
          MONOLITH_USEPKG: 'y'
        run: make build-packages

      # scripts/build-packages.sh copies each failed package's build.log to output/logs.
      - name: Upload package build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-build-logs-${{ github.run_id }}
          path: output/logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Check the kernel modules in the sysroot
        run: make verify-kernel-modules

      # Best-effort: the cache is an accelerator, so a failed push does not fail a good build.
      - name: Take ownership of the binary packages
        if: always()
        continue-on-error: true
        run: make take-packages

      - name: Save the binary package cache
        if: always()
        continue-on-error: true
        run: make cache-push

      - name: Pack the sysroot
        run: make sysroot-pack

      - name: Build the root filesystem and the initramfs
        run: make build-rootfs

      - name: Build the ISO
        run: make iso

      - name: Copy the ISO to the name of its artifact
        run: make iso-stage

      - name: Upload the squashfs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: squashfs-${{ github.run_id }}
          path: output/themonolith-${{ env.BUILD_VERSION }}.squashfs
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload the ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-${{ github.run_id }}
          path: output/iso/boot-test.iso
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload the sysroot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sysroot-${{ github.run_id }}
          path: output/sysroot.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # The reproducibility gate (P02). fetch is the only job with a network for the build inputs: it downloads the
  # distfiles once and records every pin in release-inputs.json. build-a and build-b run on separate runners, each
  # needing only fetch, and take nothing but the source commit, release-inputs.json and the distfiles archive.
  # Nothing is published before compare, the boot modes, the artifact checks and the gates have passed.
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: changes
    permissions:
      contents: read
      packages: read
    if: needs.changes.outputs.gate == 'true'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the distfiles and write release-inputs.json
        run: make repro-fetch

      - name: Upload release-inputs.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs-${{ github.run_id }}
          path: output/release-inputs.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload the builder manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builder-manifest-${{ github.run_id }}
          path: output/builder-manifest.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload the distfiles archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distfiles-${{ github.run_id }}
          path: output/distfiles.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  # Build A: offline (--network none), from the recorded pins only. The ISO of build A is the one the boot
  # modes, the artifact checks and the gates run on.
  build-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: fetch
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release-inputs.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs-${{ github.run_id }}
          path: output

      - name: Download the distfiles archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distfiles-${{ github.run_id }}
          path: output

      - name: Build offline
        env:
          DROP_DISTFILE: ${{ inputs.drop-distfile }}
        run: make repro-build-a

      - name: Upload the ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-${{ github.run_id }}
          path: output/repro-a/iso/boot-test.iso
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload the squashfs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: squashfs-${{ github.run_id }}
          path: output/repro-a/themonolith-*.squashfs
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload the sysroot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sysroot-${{ github.run_id }}
          path: output/repro-a/sysroot.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload the source audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-audit-${{ github.run_id }}
          path: output/repro-a/source-audit.tsv
          retention-days: 7
          if-no-files-found: error

      - name: Upload package build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-build-logs-a-${{ github.run_id }}
          path: output/repro-a/logs/
          retention-days: 7
          if-no-files-found: warn

  # Build B: offline (--network none), from the recorded pins only. The ISO of build A is the one the boot
  # modes, the artifact checks and the gates run on.
  build-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: fetch
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release-inputs.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs-${{ github.run_id }}
          path: output

      - name: Download the distfiles archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distfiles-${{ github.run_id }}
          path: output

      - name: Build offline
        env:
          DROP_DISTFILE: ${{ inputs.drop-distfile }}
        run: make repro-build-b

      - name: Upload the ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-b-iso-${{ github.run_id }}
          path: output/repro-b/iso/boot-test.iso
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload package build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-build-logs-b-${{ github.run_id }}
          path: output/repro-b/logs/
          retention-days: 7
          if-no-files-found: warn

  # The gate: the two ISOs must have the same SHA-256. There is no list of accepted differences.
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [build-a, build-b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build A's ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-${{ github.run_id }}
          path: output/repro-a/iso

      - name: Download build B's ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-b-iso-${{ github.run_id }}
          path: output/repro-b/iso

      - name: Compare the ISOs
        run: make compare

      # The release job reads the two digests back from this log (P01 digest chain).
      - name: Upload the compare log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare-log-${{ github.run_id }}
          path: output/compare.log
          retention-days: 14
          if-no-files-found: error

      - name: Upload the diffoscope report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diffoscope-${{ github.run_id }}
          path: output/diffoscope.html
          retention-days: 14
          if-no-files-found: warn

  # B01-AC-16: a revbump or package.use change rebuilds a cached static consumer, in the pinned builder.
  static-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [changes, toolbox]
    permissions:
      contents: read
      # read: make test-static-rebuild logs in to GHCR to pull the pinned portage tree (make sync-portage).
      packages: read
    if: needs.changes.outputs.build == 'true'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the toolbox image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolbox-${{ github.run_id }}
          path: output/toolbox

      - name: Load the toolbox image
        run: make toolbox-load

      - name: Test the static rebuild
        run: make test-static-rebuild

  # R02: pkgcheck over the overlay at the pinned tree, on the tagged commit. The attestation job needs it.
  overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes, toolbox]
    permissions:
      contents: read
      # read: make test-overlay logs in to GHCR to pull the pinned portage tree (make sync-portage).
      packages: read
    if: needs.changes.outputs.build == 'true'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the toolbox image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolbox-${{ github.run_id }}
          path: output/toolbox

      - name: Load the toolbox image
        run: make toolbox-load

      - name: Scan the overlay
        run: make test-overlay

  # Boots the ISO of this run in every mode (the list of boot-test-workflow.test.sh); see
  # .github/workflows/boot-test.yml and scripts/boot-test.py. The ISO comes from the artifact of this run,
  # so a re-run whose artifact is gone fails at download-artifact.
  boot-test:
    needs: [build, build-a, toolbox]
    if: "!cancelled() && needs.build.result == 'success' || !cancelled() && needs.build-a.result == 'success'"
    uses: ./.github/workflows/boot-test.yml
    with:
      iso-artifact: iso-${{ github.run_id }}
      modes: bios uefi toram ahci nvme usb virtio nicless nic vga fbdev-modprobe nat gui stele-acid2 clock-epoch clock-1996 persist persist-init entry serial-net smoke

  # The O02 artifact checks and the S01 gates on the same ISO, then (P01) the checks only a release needs, the
  # report files, SHA256SUMS, and on a tag the platform attestations of the ISO and its SBOM. It needs everything
  # that can fail a release: compare, every boot mode (persist-init, every entry leg, smoke included), the static
  # rebuild and the overlay scan. Nothing is signed or published before they have passed.
  attestation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [changes, build, build-a, compare, static-rebuild, overlay, boot-test, toolbox]
    # The iteration path needs its build; the gate path needs compare, which needs both builds.
    if: "!cancelled() && needs.build.result == 'success' && needs.boot-test.result == 'success' && needs.static-rebuild.result == 'success' && needs.overlay.result == 'success' || !cancelled() && needs.compare.result == 'success' && needs.boot-test.result == 'success' && needs.static-rebuild.result == 'success' && needs.overlay.result == 'success'"
    permissions:
      id-token: write
      attestations: write
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the toolbox image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolbox-${{ github.run_id }}
          path: output/toolbox

      - name: Load the toolbox image
        run: make toolbox-load

      - name: Set build version
        run: make build-version

      - name: Download the ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-${{ github.run_id }}
          path: output/iso

      - name: Download the sysroot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sysroot-${{ github.run_id }}
          path: output

      # Only the gate path (a tag or a gate dispatch) ran build A: it wrote the source audit and the fetch job wrote release-inputs.json.
      - name: Download the source audit
        if: needs.changes.outputs.gate == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-audit-${{ github.run_id }}
          path: output

      - name: Download release-inputs.json
        if: needs.changes.outputs.gate == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs-${{ github.run_id }}
          path: output

      - name: Unpack the sysroot
        run: make sysroot-unpack

      - name: Test the artifact checks on the ISO
        env:
          ISO: output/iso/boot-test.iso
        run: make test-artifact

      - name: Test the gates on the ISO (CVE verdict reported, not gating)
        if: github.ref_type != 'tag'
        env:
          ISO: output/iso/boot-test.iso
          BUILD_TAG: ${{ env.BUILD_VERSION }}
          PACKAGE_TREE: output/sysroot
          CVE_REPORT_ONLY: "1"
        run: make test-gates

      - name: Test the gates on the ISO
        if: github.ref_type == 'tag'
        env:
          ISO: output/iso/boot-test.iso
          BUILD_TAG: ${{ env.BUILD_VERSION }}
          PACKAGE_TREE: output/sysroot
        run: make test-gates

      # The release steps that neither sign nor publish run on the gate path too, so a gate dispatch rehearses them.
      # A release ships all 99 atoms of the predecessor's world; an iteration ISO may lack some (B01 change 11).
      - name: Check the package set
        if: needs.changes.outputs.gate == 'true'
        env:
          ISO: output/iso/boot-test.iso
        run: make release-package-set

      - name: Check that the rootfs provenance holds in release mode
        if: needs.changes.outputs.gate == 'true'
        env:
          ISO: output/iso/boot-test.iso
        run: make rootfs-provenance

      - name: Validate the SBOM against the CycloneDX schema
        env:
          BOM: output/attestation/bom.cdx.json
        run: make check-cyclonedx

      - name: Extract the kernel and initrd
        env:
          ISO: output/iso/boot-test.iso
        run: make iso-parts

      - name: Report the sizes (sizes.md) against the budget
        env:
          ISO: output/iso/boot-test.iso
          SQUASHFS: output/rootfs.squashfs
          KERNEL: output/iso-parts/vmlinuz
          INITRD: output/iso-parts/initrd.img
        run: make size-report

      - name: Report the differences from rc1 (rc1-diff.md)
        if: needs.changes.outputs.gate == 'true'
        run: make rc1-diff

      - name: Copy the dynamic-binary allowlist with its count (dynamic-allowlist.txt)
        if: needs.changes.outputs.gate == 'true'
        run: make allowlist-report

      # SHA256SUMS is written once, here, over the ISO and every other asset, before signing.
      - name: Collect the release assets and write SHA256SUMS
        if: needs.changes.outputs.gate == 'true'
        env:
          ISO: output/iso/boot-test.iso
        run: make release-assets

      - name: Upload the release ISO
        if: needs.changes.outputs.gate == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-iso-${{ github.run_id }}
          path: output/release/themonolith-${{ env.BUILD_VERSION }}.iso
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      # release-inputs.json and source-audit.tsv are their own artifacts; the release job takes them from there.
      - name: Upload the SBOM, SHA256SUMS and the reports
        if: needs.changes.outputs.gate == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ github.run_id }}
          path: |
            output/release/SHA256SUMS
            output/release/bom.cdx.json
            output/release/rootfs-provenance.tsv
            output/release/rc1-diff.md
            output/release/sizes.md
            output/release/dynamic-allowlist.txt
            output/release/attestation-summary.json
          retention-days: 14
          if-no-files-found: error

      - name: Attest the build provenance of the ISO
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: output/release/themonolith-${{ env.BUILD_VERSION }}.iso

      - name: Attest the SBOM of the ISO
        if: github.ref_type == 'tag'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: output/release/themonolith-${{ env.BUILD_VERSION }}.iso
          sbom-path: output/release/bom.cdx.json

      - name: Upload the attestation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation-${{ github.run_id }}
          path: |
            output/attestation/
            output/reports/static-audit.txt
          retention-days: 14
          if-no-files-found: warn
