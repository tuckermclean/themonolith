name: Artifact Checks

# Reusable workflow: extracts the rootfs of an ISO and audits it against the all-static doctrines
# (scripts/static-audit.sh) by running `make test-artifact` in the pinned toolbox. For the v0.1.0-rc1 ISO the
# findings must equal configs/attestation/rc1-static-audit.expected; for any other ISO the audit is strict.
#
# The ISO comes either from an Actions artifact of the calling run (`iso-artifact`, a single file named
# boot-test.iso) or from a URL checked against a sha256 (`iso-url`, `iso-sha256`).

on:
  workflow_call:
    inputs:
      iso-artifact:
        description: "Name of an Actions artifact of this run holding the ISO as boot-test.iso (alternative to iso-url)"
        required: false
        type: string
        default: ""
      iso-url:
        description: "URL of the ISO to check (used when iso-artifact is empty)"
        required: false
        type: string
        default: ""
      iso-sha256:
        description: "sha256 the ISO fetched from iso-url must match"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Fetch the ISO and check its sha256
        if: inputs.iso-artifact == ''
        env:
          ISO_URL: ${{ inputs.iso-url }}
          ISO_SHA256: ${{ inputs.iso-sha256 }}
        run: make fetch-iso ISO_OUT=output/iso/boot-test.iso

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.iso-artifact != ''
        with:
          name: ${{ inputs.iso-artifact }}
          path: output/iso

      - name: Audit the rootfs of the ISO
        run: make test-artifact ISO=output/iso/boot-test.iso

      - name: Upload the static-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-audit-${{ github.run_id }}
          path: output/reports/static-audit.txt
          retention-days: 14
          if-no-files-found: warn
