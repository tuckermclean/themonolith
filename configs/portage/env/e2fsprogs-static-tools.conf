# e2fsprogs: link mke2fs, e2fsck, tune2fs etc. against libext2fs.a.
#
# The ebuild always passes --enable-elf-shlibs, so the tools link against the
# freshly built libext2fs.so, which cannot work with -static. econf appends
# EXTRA_ECONF last and configure takes the last of the two options, so
# --disable-elf-shlibs wins and the tools use the .a archives (static-libs).
#
# Applied after static.conf via package.env, and EXTRA_ECONF is replaced, not
# appended, so the static.conf value is repeated here.
EXTRA_ECONF="--disable-shared --enable-static --disable-elf-shlibs"
