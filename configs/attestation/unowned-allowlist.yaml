# unowned-allowlist.yaml
#
# Files present in the rootfs that are not owned by any Portage package.
# These are suppressed from the Pillar 4 unowned-files gate.
#
# Paths are relative to rootfs root (no leading /).
# fnmatch glob patterns: * matches within a path segment, ** matches across.
#
# Every entry is a mapping with a required `source` (check-unowned.py --provenance):
#   build-rootfs.sh      written by the root filesystem assembly; must not also exist in output/sysroot
#   postinst:<cat/pn>    left by that package's pkg_postinst hook; must exist in output/sysroot
#   portage              the package manager's own state (the VDB, news, env-update output)
# `modified:` (below) lists owned package files that an assembly step rewrites, in the same form.
#
# Goal: this list shrinks over time as items move into proper ebuilds.

allowlist:
  # ── Build-generated files (created by our scripts / shadow tools, unowned) ──
  - path: etc/passwd-                        # shadow-util backup of /etc/passwd
    source: "postinst:sys-apps/shadow"
  - path: etc/group-                         # shadow-util backup of /etc/group
    source: "postinst:sys-apps/shadow"
  - path: etc/profile.d/50-dropbear-hint.sh  # generated by build-rootfs.sh (dropbear login hint; Task 6 renamed from 10-dropbear-hint.sh)
    source: "build-rootfs.sh"

  # X core font index + Terminus alias dir (GUI "Terminus by default" pass).
  # build-rootfs.sh runs host mkfontscale/mkfontdir over the PCF dirs (the font
  # ebuilds' pkg_postinst mkfontscale never fires on a cross/ROOT install) and
  # writes our own /usr/share/fonts/monolith alias dir. These are generated at
  # image build, owned by no package.
  - path: usr/share/fonts/*/fonts.dir
    source: "build-rootfs.sh"
  - path: usr/share/fonts/monolith
    source: "build-rootfs.sh"
  - path: usr/share/fonts/monolith/fonts.alias
    source: "build-rootfs.sh"

  # ── FHS structural directories created by build-rootfs.sh ──────────────────
  # Standard mount points and empty directories required by the FHS.
  # Created by build-rootfs.sh mkdir -p; not owned by any Portage package.
  - path: dev
    source: "build-rootfs.sh"
  - path: home
    source: "build-rootfs.sh"
  - path: mnt
    source: "build-rootfs.sh"
  - path: opt
    source: "build-rootfs.sh"
  - path: proc
    source: "build-rootfs.sh"
  - path: root
    source: "build-rootfs.sh"
  - path: run
    source: "build-rootfs.sh"
  - path: sys
    source: "build-rootfs.sh"
  - path: etc/network
    source: "build-rootfs.sh"
  - path: var/log
    source: "build-rootfs.sh"
  - path: var/spool
    source: "build-rootfs.sh"

  # ── Portage system directories ──────────────────────────────────────────────
  # Directories created implicitly by the package manager; not owned by any
  # package, but their contents are tracked by the glob patterns below.
  - path: tmp
    source: "portage"
  - path: var/cache
    source: "portage"
  - path: var/cache/edb
    source: "portage"
  - path: var/db
    source: "portage"
  - path: var/db/pkg
    source: "portage"
  - path: var/lib/portage
    source: "portage"
  - path: var/tmp
    source: "portage"

  # ── Portage metadata ────────────────────────────────────────────────────────
  # The Portage DB itself is not tracked as owned files
  - path: var/db/pkg/**
    source: "portage"
  - path: var/cache/edb/**
    source: "portage"
  - path: var/lib/portage/**
    source: "portage"

  # ── /etc config files written by build-rootfs.sh ────────────────────────────
  # Pending proper ebuilds
  - path: etc/passwd
    source: "build-rootfs.sh"
  - path: etc/group
    source: "build-rootfs.sh"
  - path: etc/shadow
    source: "build-rootfs.sh"
  - path: etc/fstab
    source: "build-rootfs.sh"
  - path: etc/hosts
    source: "build-rootfs.sh"
  - path: etc/hostname
    source: "build-rootfs.sh"
  - path: etc/motd
    source: "build-rootfs.sh"
  - path: etc/issue
    source: "build-rootfs.sh"
  - path: etc/resolv.conf
    source: "build-rootfs.sh"
  - path: etc/profile
    source: "build-rootfs.sh"
  - path: etc/securetty
    source: "build-rootfs.sh"
  - path: etc/shells
    source: "build-rootfs.sh"
  - path: etc/network/interfaces
    source: "build-rootfs.sh"

  # ── Init scripts written by build-rootfs.sh ─────────────────────────────────
  - path: etc/init.d/rcS
    source: "build-rootfs.sh"
  - path: etc/init.d/rcK
    source: "build-rootfs.sh"
  - path: etc/init.d/S20keygen
    source: "build-rootfs.sh"
  - path: etc/init.d/S30gpm
    source: "build-rootfs.sh"
  - path: etc/init.d/S35netprobe
    source: "build-rootfs.sh"
  - path: etc/init.d/S40network
    source: "build-rootfs.sh"
  - path: etc/init.d/S45monolith-time
    source: "build-rootfs.sh"
  - path: etc/init.d/S50advisory
    source: "build-rootfs.sh"
  - path: etc/monolith-release
    source: "build-rootfs.sh"
  - path: etc/os-release
    source: "build-rootfs.sh"

  # NOTE: monolith-advisory-check, 40-advisory.sh (renamed from
  # monolith-advisory.sh, Task 6), monolith-net,
  # monolith-router, monolith-console, /usr/bin/which, the guestbook.cgi
  # fixture (+ its usr/lib/cgi-bin dir), and the prompt square are now owned
  # by app-misc/monolith-base (see configs/overlay/app-misc/monolith-base) —
  # removed from this allowlist. Pillar 4 sees them via the package's VDB
  # CONTENTS instead.

  # ── Root home — bash skel files copied by build-rootfs.sh ───────────────────
  - path: root/.bash_profile
    source: "build-rootfs.sh"
  - path: root/.bashrc
    source: "build-rootfs.sh"
  - path: root/.bash_logout
    source: "build-rootfs.sh"

  # ── Symlinks set by build-rootfs.sh ─────────────────────────────────────────
  - path: bin/sh
    source: "build-rootfs.sh"
  - path: usr/bin/more
    source: "build-rootfs.sh"

  # ── Terminfo case-collision symlinks ────────────────────────────────────────
  # Single-char lowercase → uppercase symlinks created by build-rootfs.sh to fix
  # NTFS case-insensitivity collisions (e.g. l -> L, a -> A)
  - path: usr/share/terminfo/?
    source: "build-rootfs.sh"

  # ── var/run and var/lock — symlinks to /run set by build-rootfs.sh ──────────
  - path: var/run
    source: "build-rootfs.sh"
  - path: var/lock
    source: "build-rootfs.sh"

  # ── /etc postinst artifacts — written by pkg_postinst hooks, not tracked ────
  # env-update generates profile.env and csh.env from /etc/env.d/ fragments.
  # binutils pkg_postinst writes env.d/05binutils and binutils/config-*.
  # shadow pkg_postinst writes gshadow, subgid, subuid, .pwd.lock (and the passwd-/group- backups above).
  # systemd-tmpfiles/environment.d entries come from toolchain postinst.
  - path: etc/.pwd.lock
    source: "postinst:sys-apps/shadow"
  - path: etc/csh.env
    source: "portage"
  - path: etc/env.d/05binutils
    source: "postinst:sys-devel/binutils"
  - path: etc/env.d/binutils/config-*
    source: "postinst:sys-devel/binutils"
  - path: etc/environment.d
    source: "portage"
  - path: etc/environment.d/10-gentoo-env.conf
    source: "portage"
  - path: etc/gshadow
    source: "postinst:sys-apps/shadow"
  - path: etc/profile.env
    source: "portage"
  - path: etc/subgid
    source: "postinst:sys-apps/shadow"
  - path: etc/subuid
    source: "postinst:sys-apps/shadow"

  # ── binutils eselect symlinks — managed by binutils-config in pkg_postinst ──
  # binutils-config uses eselect to install these unversioned /usr/bin/
  # wrappers pointing into /usr/lib/binutils/. They are intentionally absent
  # from CONTENTS because eselect manages them dynamically.
  - path: usr/bin/addr2line
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/ar
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/as
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/c++filt
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/elfedit
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/gprof
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/ld
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/ld.bfd
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/nm
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/objcopy
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/objdump
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/ranlib
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/readelf
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/size
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/strings
    source: "postinst:sys-devel/binutils"
  - path: usr/bin/strip
    source: "postinst:sys-devel/binutils"

  # ── binutils-data info/dir — generated by install-info in pkg_postinst ──────
  # The texinfo 'dir' index is regenerated from .info files; not in CONTENTS.
  - path: usr/share/binutils-data/*/*/info/dir
    source: "postinst:sys-devel/binutils"

  # ── nethack runtime state — created on first run ────────────────────────────
  # nethack initializes these files when the game first starts; they are not
  # installed by the ebuild (no pre-existing content to ship).
  - path: var/games/nethack/logfile
    source: "postinst:games-roguelike/nethack"
  - path: var/games/nethack/perm
    source: "postinst:games-roguelike/nethack"
  - path: var/games/nethack/record
    source: "postinst:games-roguelike/nethack"
  - path: var/games/nethack/xlogfile
    source: "postinst:games-roguelike/nethack"

  # ── kmod OpenRC service — registered by kmod pkg_postinst, unused here ──────
  # kmod's pkg_postinst runs `rc-update add kmod-static-nodes sysinit`, which
  # creates this OpenRC runlevel tree. The symlink and its parent dirs are not
  # tracked in any package's CONTENTS. We boot with sysvinit (see etc/inittab),
  # so the service never runs — it's harmless, and kmod is here only for its
  # modprobe/lsmod/depmod tools (the Tier-2 coldplug), not its init integration.
  - path: etc/runlevels
    source: "postinst:sys-apps/kmod"
  - path: etc/runlevels/sysinit
    source: "postinst:sys-apps/kmod"
  - path: etc/runlevels/sysinit/kmod-static-nodes
    source: "postinst:sys-apps/kmod"

  # ── Portage news — written by emerge during pkg installation ─────────────────
  # emerge writes news items to var/lib/gentoo/news/ during postinst;
  # the skip/unread tracking files are not owned by any package.
  - path: var/lib/gentoo/news/news-gentoo.skip
    source: "portage"
  - path: var/lib/gentoo/news/news-gentoo.unread
    source: "portage"

  # ── nftables service state (SP2) — net-firewall/nftables pkg_postinst / its
  # OpenRC service create /var/lib/nftables/rules-save (ruleset persistence for
  # the `nftables` service, which we do NOT use — monolith-router drives nft
  # directly). Not in the package CONTENTS. Pending the monolith-base sweep.
  - path: var/lib/nftables
    source: "postinst:net-firewall/nftables"
  - path: var/lib/nftables/rules-save
    source: "postinst:net-firewall/nftables"

# Owned package files that an assembly step rewrites, so that their bytes differ from CONTENTS.
# Same entry form as allowlist. Man pages that build-packages.sh decompresses are matched by
# their .bz2 name in CONTENTS and need no entry.
modified:
  - path: etc/inittab                        # sys-apps/sysvinit's file, rewritten by build-rootfs.sh
    source: "build-rootfs.sh"
