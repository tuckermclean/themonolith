# The Monolith — implementation dependency graph.
# Each node has a spec at nodes/<id>.md (template: SPEC.md §9). `deps` are hard dependencies:
# a node's gate cannot pass until every dep's gate has passed. `decisions` names open
# decisions (SPEC.md §10) that must be settled by the owner before the node starts.
apiVersion: themonolith/v1
kind: DependencyGraph
milestones:
  - {id: MS1, name: loop-online, after: [F05], meaning: "Nodes can be built test-first by the /node loop with CI enforcement"}
  - {id: MS2, name: first-iso, after: [B06], meaning: "The new repo builds a bootable ISO from pinned, self-hosted inputs; no S3 anywhere"}
  - {id: MS3, name: oracle-parity, after: [O02, O03, O04, O05, O06, O07], meaning: "The new ISO passes every rc1-era boot mode and doctrine check, and its SBOM diff against v0.1.0-rc1 is explained"}
  - {id: MS4, name: first-attested-release, after: [P02], meaning: "A tag produces a signed, verifiable GitHub release through the new pipeline"}
  - {id: MS5, name: cutover, after: [X01], meaning: "Public surfaces point at the new repo; linux-live-iso-factory is archived"}
nodes:
  # ---------------- F: foundations ----------------
  - {id: F01, phase: F, name: repo-skeleton, deps: [], summary: "Layout, Makefile entry points, README/AGENTS/CLAUDE, MIT LICENSE, fast CI lane (bash -n, shellcheck, py_compile, yaml, actionlint), every action pinned by SHA"}
  - {id: F02, phase: F, name: graph-and-spec-tooling, deps: [F01], summary: "Validator for docs/graph.yaml and nodes/*.md: acyclic, deps exist, every node has a spec, AC ids unique and well-formed, milestone refs valid"}
  - {id: F03, phase: F, name: system-inventory, deps: [F01], summary: "docs/system.yaml schema and a CI check: every workflow, job, script, make target, secret, external URL and store class is listed with owner, inputs, outputs"}
  - {id: F04, phase: F, name: commit-identity-and-tdd-discipline, deps: [F01], decisions: [OD-4], summary: "CI checks run from the trusted base: author/co-author allowlist; RED commit fails the fast tier at that commit and head passes; protected test files untouched after RED"}
  - {id: F05, phase: F, name: agent-loop, deps: [F02, F04], decisions: [OD-4, OD-10], summary: "/node skill, tester/implementer/reviewer agents and guard hook adapted from strange-company, with PROVENANCE; bounded retries with escalation"}
  - {id: F06, phase: F, name: store-interface, deps: [F01], summary: "The `store` contract (classes, content-addressed keys, immutable put, fail-closed get) with a filesystem backend and contract tests every backend must pass"}
  # ---------------- I: inputs pinned and mirrored ----------------
  - {id: I01, phase: I, name: oci-store-backend, deps: [F06], summary: "store backend on GHCR via pinned oras; auth or network errors are fatal, never a cache miss; passes the F06 contract suite"}
  - {id: I02, phase: I, name: portage-snapshot-mirror, deps: [I01], summary: "Fetch + GPG-verify Gentoo snapshots into the store; builds read the pinned epoch only from the store, served to emerge-webrsync on localhost; missing pin fails loud"}
  - {id: I03, phase: I, name: builder-image, deps: [I01, I02], summary: "Builder image from a stage3 pinned by digest, toolchain tree from the store, crossdev from crossdev.lock with the libatomic fix, and every host tool declared and pinned (python3, makewhatis, -m32 gcc, rustup nightly, syft, grype, oras); published by digest"}
  - {id: I04, phase: I, name: distfiles-mirror, deps: [I01, I03], decisions: [OD-5], summary: "Every source tarball and git source fetched by a build is mirrored in the store by hash; builds fetch mirror-first and record any upstream fetch; Rust crates for rl144 and Stele are vendored (including the ebuild edits); an offline rebuild of a mirrored tree succeeds"}
  - {id: I05, phase: I, name: pin-ledger, deps: [F03, I03], summary: "One pins/pins.yaml for epochs, image digests, toolchains and tool versions; CI fails on an unpinned fetch or an unused pin"}
  # ---------------- R: recipes carried forward ----------------
  - {id: R01, phase: R, name: recipes-import, deps: [F01], summary: "Overlay ebuilds, portage config and rootfs files imported from linux-live-iso-factory@b9f533b with dead config removed (study list) and every workaround's reason kept beside it"}
  - {id: R02, phase: R, name: version-lock-completeness, deps: [R01, I03], summary: "versions.lock covers every world atom and overlay package, regenerates deterministically (no timestamp), and CI fails on a gap; also the package.provided drift check and the removed-packages denylist (D-no-readding-removed-things)"}
  - {id: R03, phase: R, name: revbump-gate, deps: [R01], summary: "A change to an overlay ebuild or its files/ without a -rN bump and matching versions.lock line fails CI"}
  - {id: R04, phase: R, name: kernel-config-split, deps: [R01], decisions: [OD-13], summary: "Authored kernel config fragments (tiers 0/1/2, forced settings) kept apart from the resolved config, which becomes a build artifact; fast checks for I2C/DDC, NIC, netfilter and fbdev tiers"}
  - {id: R05, phase: R, name: rootfs-ownership, deps: [R01], summary: "Every hand-authored rootfs file is installed by the monolith-base ebuild; the unowned allowlist shrinks to the irreducible set, each entry justified"}
  # ---------------- B: build pipeline ----------------
  - {id: B01, phase: B, name: package-build, deps: [I02, I03, I04, I05, R02, R03], summary: "emerge in the builder with honest success: each world atom built at its locked version in this run or taken from a cache entry for the exact tree+profile hash; binpkg cache in the store"}
  - {id: B02, phase: B, name: kernel-build, deps: [B01, R04], summary: "Kernel and modules from the authored fragments; resolved .config emitted as an artifact and checked against the R04 assertions and the pinned toolchain"}
  - {id: B03, phase: B, name: initrd-build, deps: [B02, O01], summary: "Initramfs with the required busybox applets and module list, deterministic cpio, no host-executed i486 binaries"}
  - {id: B04, phase: B, name: rootfs-squashfs, deps: [B01, B02, R05], summary: "Sysroot extraction, cleanup, and a deterministic squashfs; records every file with its owning package"}
  - {id: B05, phase: B, name: iso-assembly, deps: [B02, B03, B04, O01], summary: "Hybrid BIOS (ISOLINUX) + UEFI (GRUB) ISO with the documented boot labels and entries, built reproducibly from SOURCE_DATE_EPOCH, with bzImage, initrd and ESP size gates"}
  - {id: B06, phase: B, name: ci-build-pipeline, deps: [B05, F03, I05], summary: "CI workflow from inputs to ISO with artifacts handed between jobs as Actions artifacts (no publishing), including the `oracle-gate` and `evidence` jobs later nodes fill in; `make iso` locally runs the same steps"}
  - {id: B07, phase: B, name: reproducibility-check, deps: [B06], summary: "Two builds from identical inputs produce the same ISO hash, or an explicit, shrinking list of known differences"}
  # ---------------- O: oracle ----------------
  - {id: O01, phase: O, name: boot-harness, deps: [F01], summary: "Port of boot-test.py's core: QEMU launch, serial milestones, the retry discriminator, timeouts, exit codes; fast unit tests with recorded serial fixtures"}
  - {id: O02, phase: O, name: boot-modes-core, deps: [O01, B06], summary: "bios, uefi, toram, ahci, nvme, usb, virtio, nicless modes running in CI against the B06 ISO"}
  - {id: O03, phase: O, name: boot-modes-hardware, deps: [O02, R04], summary: "nic (model matrix), vga, fbdev-modprobe modes, including no taint/oops on legacy fbdev modprobe"}
  - {id: O04, phase: O, name: boot-modes-services, deps: [O02], summary: "nat, persist, clock-epoch, clock-1996 modes; clock-epoch made to match its documented intent (the fetch-and-set path tested for real)"}
  - {id: O05, phase: O, name: boot-modes-gui, deps: [O02], summary: "gui and stele-acid2 modes with assertions stronger than a non-black framebuffer (golden screendump comparison)"}
  - {id: O06, phase: O, name: artifact-doctrine-checks, deps: [B02, B04, S01], decisions: [OD-2], summary: "Checks on built artifacts: no PT_INTERP outside an explicit allowlist, no Python, no freetype/fontconfig/Xft, kernel I2C/DDC invariants, musl loader present only if allowlisted"}
  - {id: O07, phase: O, name: golden-sbom-diff, deps: [S01, B04, I05], summary: "Diff the new SBOM against v0.1.0-rc1's bom.cdx.json; CI passes only when every difference is listed in an expected-differences file with a reason"}
  # ---------------- S: supply chain ----------------
  - {id: S01, phase: S, name: sbom, deps: [B05, I05, R02], summary: "Syft SBOM of the rootfs, enriched with CPE overrides and exclusions, schema-validated (CycloneDX 1.6/1.7, SPDX)"}
  - {id: S02, phase: S, name: license-gate, deps: [S01], summary: "License policy gate over the SBOM with SPDX id validation; unknown licenses fail"}
  - {id: S03, phase: S, name: cve-gate, deps: [S01, I03, I05], decisions: [OD-9], summary: "grype gate with a required policy file, waivers that expire, fix-state gates honoured, the grype DB version recorded, and the builder-image scan as a separate, declared pillar"}
  - {id: S04, phase: S, name: unowned-gate, deps: [S01, R05], summary: "Unowned-files gate that fails on missing or empty input and on any file not owned by a package or the justified allowlist"}
  - {id: S05, phase: S, name: provenance-and-attestation, deps: [B06, S02, S03, S04, O02, O03, O04, O05, O06], summary: "SLSA provenance and actions/attest from the entry workflow; the digest chain sha256(ISO) == summary == SBOM hash == attested subject checked mechanically"}
  # ---------------- P: publish and release ----------------
  - {id: P01, phase: P, name: public-hosting, deps: [I01], decisions: [OD-1], summary: "store backend for the public class on the chosen host and domain: HTTP Range + CORS for the ISO, stable URLs that never name a vendor"}
  - {id: P02, phase: P, name: release-workflow, deps: [S05, O02, O03, O04, O05, O06], summary: "Tag → from-source build → full oracle → attest → GitHub release via workflow_run; -rc/-beta are prereleases never Latest; digest chain re-verified before publish"}
  - {id: P03, phase: P, name: dashboard-and-latest, deps: [P01, P02], decisions: [OD-14], summary: "Dashboard SPA ported with vendored, pinned libraries; builds-index; 'latest' pointers move only after the full oracle and attestation pass"}
  - {id: P04, phase: P, name: boot-demo, deps: [P03], summary: "In-browser v86 boot with vendored, pinned v86 and BIOS images, range-streaming the ISO from the public host"}
  - {id: P05, phase: P, name: advisory-service, deps: [P01, S03], summary: "status/<tag>.json on the stable domain; nightly re-scan that applies the CVE policy, never flip-flops, and feeds monolith-advisory-check on the disc"}
  # ---------------- M: maintenance automation ----------------
  - {id: M01, phase: M, name: pin-bump-automation, deps: [B06, O02, I05], decisions: [OD-11], summary: "Scheduled BUILD_EPOCH bump PRs validated by build + core oracle; merged by a human, never --admin"}
  - {id: M02, phase: M, name: toolchain-bump, deps: [M01, I02, I03], summary: "TOOLCHAIN_EPOCH and crossdev bumps as validated PRs, including a builder-image rebuild from mirrored inputs"}
  - {id: M03, phase: M, name: retention-and-gc, deps: [I01], summary: "Per-class retention policy for the store (snapshots and release inputs kept forever, CI outputs pruned) with dry-run-by-default GC and tests"}
  - {id: M04, phase: M, name: action-and-tool-updates, deps: [F01, I05, M01], summary: "Automated PRs for SHA-pinned actions and pinned tools, each with changelog link and CI evidence"}
  # ---------------- G: gaps the old repo promised but never tested ----------------
  - {id: G01, phase: G, name: persistence-on-disk, deps: [O04], summary: "monolith-persist init on a real virtual disk, the GRUB persistent entry, swap; boot-tested"}
  - {id: G02, phase: G, name: boot-entry-coverage, deps: [O02], summary: "Every ISOLINUX label and GRUB entry boot-tested, including default fb800, toram via GRUB, rescue and root="}
  - {id: G03, phase: G, name: hyperv, deps: [O02], decisions: [OD-12], summary: "Hyper-V Gen1/Gen2 support stated in the README made true and tested, or the claim removed"}
  - {id: G04, phase: G, name: serial-network-protocols, deps: [O04], summary: "SLIP, PPP and dropbear paths exercised in QEMU, or claims removed"}
  - {id: G05, phase: G, name: package-smoke-coverage, deps: [O02], summary: "A smoke test per world package (runs, prints version, does one real thing) in a batched boot mode"}
  # ---------------- X: cutover ----------------
  - {id: X01, phase: X, name: parity-and-cutover, deps: [P02, P03, P04, P05, O07, B07, M01, M03, G01, G02, G03, G04, G05], summary: "First release from the new repo (v0.2.0), docs complete, README verification steps for both repos, linux-live-iso-factory archived with a pointer"}
