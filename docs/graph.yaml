# The Monolith — implementation dependency graph (v0.4).
# Each node has a spec at nodes/<id>-<name>.md (template: SPEC.md §9). `deps` are hard dependencies:
# a node's gate cannot pass until every dep's gate has passed. `decisions` names open decisions
# (SPEC.md §10) the owner settles before the node starts.
# `track`: critical = P02 and its ancestors (the path to MS2); later = everything else.
# v0.3 had 52 nodes; docs/reviews/2026-10-28-v0.4.md maps each one to its v0.4 successor or removal.
apiVersion: themonolith/v1
kind: DependencyGraph
milestones:
  - {id: MS1, name: first-iso, after: [B03], meaning: "CI on this repository builds an ISO from pinned inputs with no S3 anywhere, and the full oracle and gates pass on it (binary packages allowed)"}
  - {id: MS2, name: first-reproducible-release, after: [P02], meaning: "A tag compiles every package from source, passes the full oracle and gates, is attested and published as a GitHub prerelease with its inputs archived, and an independent rebuild from those inputs has been compared with every difference listed"}
  - {id: MS3, name: cutover, after: [X01], meaning: "The first non-prerelease ships from this repository with an empty dynamic-binary allowlist; the predecessor is archived with a pointer"}
nodes:
  # ---------------- the port ----------------
  - {id: F01, track: critical, name: port-import, deps: [], summary: "Predecessor tree at b9f533b imported verbatim (overlay, portage config, scripts, tests, Makefile, Dockerfile, workflows, docs, AGENTS.md) with IMPORT.md hashes; scheduled and AWS-bound workflows disabled until their node; action references pinned to SHAs with Dependabot and CODEOWNERS added; fast lane (pr-validate.yml, scripts/tests) green"}
  - {id: I01, track: critical, name: off-s3, deps: [F01], summary: "Every S3/AWS use removed: storage is GHCR via oras/docker under one REGISTRY variable, Actions artifacts within a run, GitHub Releases for publishing; binpkg-store.sh treats auth errors as fatal; a repo-wide check finds no aws/s3 reference"}
  - {id: I02, track: critical, name: tree-pin, deps: [I01], decisions: [OD-6], summary: "rc1's Gentoo tree recovered as a gentoo-mirror commit, archived as one OCI artifact and pinned by commit and digest; sync-portage.sh restores it by digest and fails loud; signature checked with Gentoo's published key where possible"}
  - {id: I03, track: critical, name: builder-image, deps: [I01], summary: "rc1's builder image adopted by digest from our namespace; Makefile and workflows pull by digest only; the Dockerfile is ported unchanged; a tool manifest of the image is recorded"}
  - {id: B01, track: critical, name: package-build, deps: [I02, I03], summary: "build-packages.sh, binpkg-store.sh and savedconfig-cache.sh ported; cache tag covers builder, tree and global config; standard emerge binpkg flags plus --rebuild-if-unbuilt; --keep-going false success fixed; versions.lock covers all world atoms; tags build from source"}
  - {id: B02, track: critical, name: kernel-config, deps: [F01], decisions: [OD-13], summary: "Kernel config moved to configs/portage/savedconfig and read through savedconfig.eclass (no bind mount, no silent allnoconfig, no write-back); verified kernel config bugs fixed; ported verify-*.sh checks run in the fast tier"}
  - {id: R01, track: critical, name: disc-fixes, deps: [F01], decisions: [OD-1], summary: "Verified disc-side bugs fixed in the recipes: monolith-advisory-check points at the OD-1 URL and never reports an unreachable service as clean; monolith-base revbumped"}
  # ---------------- the oracle and gates, developed against rc1 ----------------
  - {id: O01, track: critical, name: boot-tests, deps: [F01], summary: "boot-test.py and boot-test.yml ported unchanged (17 modes, -cpu 486, 64 MB floor); a reusable workflow taking an ISO as an Actions artifact name or URL+sha256; all modes pass on the rc1 ISO"}
  - {id: O02, track: critical, name: artifact-checks, deps: [F01], decisions: [OD-2], summary: "static-audit.sh ported and gating, extended with scanelf: no PT_INTERP outside a shrinking allowlist, no musl loader unless allowlisted, EM_386 only, no Python, no freetype/fontconfig/Xft, no X modules; expected rc1 failures recorded"}
  - {id: S01, track: critical, name: sbom-and-gates, deps: [F01], decisions: [OD-9, OD-15], summary: "SBOM (syft + enrich-sbom.py), licence, CVE and unowned gates ported; verified bugs fixed: unowned gate fails on missing or empty input, CVE waivers expire, grype DB recorded; reproduces rc1's SBOM on rc1's rootfs up to listed fields"}
  # ---------------- integration ----------------
  - {id: B03, track: critical, name: ci-build, deps: [B01, B02, R01, O01, O02, S01], summary: "build.yml ported: packages, rootfs, initrd, ISO, then the boot tests, artifact checks and gates on that ISO; jobs hand files over as Actions artifacts, not actions/cache; `make all` runs the same steps locally"}
  - {id: P01, track: critical, name: release, deps: [B03], decisions: [OD-8, OD-16], summary: "Tag build from source; attest with actions/attest-build-provenance and attest-sbom only after every check passes; DISTDIR archived; release-inputs.json, rc1 SBOM diff and size report published; digest chain re-verified; GitHub prerelease, never Latest"}
  - {id: P02, track: critical, name: rebuild-check, deps: [P01], summary: "Independent rebuild of a release from release-inputs.json with upstream fetches disabled; diffoscope against the release; every difference listed in docs/known-differences.md with a cause"}
  # ---------------- after the first release ----------------
  - {id: R02, track: later, name: overlay-qa, deps: [I02], summary: "pkgcheck scan of the overlay against the pinned tree in the fast lane; a changed overlay ebuild or files/ without a -rN bump fails (pkgcheck if it covers this, else a short git-diff check); rl144 and stele moved to cargo.eclass CRATES so their crates are ordinary distfiles"}
  - {id: R03, track: later, name: all-static, deps: [O02, B03], summary: "The dynamic-binary allowlist emptied by package.env/env static-link fixes (util-linux, iproute2, dhcpcd, procps, tar, gawk, ...); the musl loader no longer ships"}
  - {id: M01, track: later, name: tree-bump, deps: [P02], decisions: [OD-11], summary: "pin-bump.yml ported without --admin: scheduled PRs that move TREE_COMMIT and versions.lock, validated by the ci-build workflow, merged by a human; the first one moves off rc1's tree"}
  - {id: M02, track: later, name: builder-rebuild, deps: [I03, M01], summary: "The builder image rebuilt from the ported Dockerfile, a stage3 pinned by digest and an archived tree; toolchain-bump.yml ported without --admin"}
  - {id: P03, track: later, name: advisory-feed, deps: [P01, S01], decisions: [OD-1], summary: "The service behind the OD-1 URL: per-release status JSON on GitHub Pages under the OD-1 name, refreshed by the ported nightly CVE re-scan, which applies the CVE policy and never reports unreachable as clean"}
  - {id: G01, track: later, name: claims-coverage, deps: [O01, B03], decisions: [OD-12], summary: "Every README promise tested or removed: persistence on disk, every boot entry, Hyper-V, SLIP/PPP/dropbear, one smoke check per world package"}
  - {id: X01, track: later, name: cutover, deps: [P02, R03, M01, P03, G01], summary: "First non-prerelease from this repository; README verification steps for both repos; the predecessor gets a pointer commit and is archived (never renamed)"}
