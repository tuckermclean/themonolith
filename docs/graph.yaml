# The Monolith — implementation dependency graph.
# Each node has a spec at nodes/<id>-<name>.md (template: SPEC.md §9). `deps` are hard dependencies:
# a node's gate cannot pass until every dep's gate has passed. `decisions` names open decisions
# (SPEC.md §10) the owner settles before the node starts.
# `track`: critical = P01 and its ancestors (the path to MS2, the first release); later = everything else.
# MS1 comes first: B03 and its ancestors, the fastest route to a working ISO for iteration.
apiVersion: themonolith/v1
kind: DependencyGraph
milestones:
  - {id: MS1, name: iteration-iso, after: [B03], meaning: "The first goal, reached as early as possible: CI on this repository builds a working, testable ISO from pinned inputs (tree and builder by digest, versions.lock), with no S3 anywhere, and the oracle and gates pass on it (16 modes; stele-acid2 waits for R05). Binary packages are allowed, and rl144 and stele may be left out until R05. It is for iteration: nothing is published and it is not a release"}
  - {id: MS2, name: first-release, after: [P01], meaning: "The first official release; nothing earlier is called a release. A tag is built twice from source, in two clean, separate, offline builds from the same pinned and archived inputs; both ISOs have the same SHA-256; it ships all 99 of the predecessor's world packages, rl144 and stele included; that ISO passes the full oracle (all 17 modes) and the gates; only then is it attested and published as a GitHub prerelease with its inputs archived"}
  - {id: MS3, name: cutover, after: [X01], meaning: "The first non-prerelease ships from this repository with an empty dynamic-binary allowlist; the predecessor is archived with a pointer"}
nodes:
  # ---------------- the port ----------------
  - {id: F01, track: critical, name: make-test, deps: [], summary: "make test, the one testing interface every later node adds its tests to: test-lint runs the predecessor's pr-validate checks (bash -n, py_compile, YAML, actionlint, shellcheck), the workflow lint and the migration check, and test-unit runs every scripts/tests file, offline in the toolbox; pr-validate.yml only calls Make; action references pinned to SHAs with Dependabot and CODEOWNERS; the predecessor's agent knowledge base in AGENTS.md. No predecessor code beyond the checks: each node ports what its tests need (docs/capabilities.md)"}
  - {id: I01, track: critical, name: off-s3, deps: [F01], summary: "No S3 or AWS ever arrives: a repo-wide test in make test rejects any aws/s3 reference, so every node strips S3 from what it ports; storage is GHCR under one REGISTRY variable, Actions artifacts within a run, GitHub Releases for publishing; workflows need no secret but GITHUB_TOKEN; GHCR packages pull anonymously"}
  - {id: I02, track: critical, name: tree-pin, deps: [I01], decisions: [OD-3], summary: "rc1's Gentoo tree recovered as a gentoo-mirror commit, archived as one OCI artifact and pinned by commit and digest; sync-portage.sh restores it by digest and fails loud; signature checked with Gentoo's published key where possible"}
  - {id: I03, track: critical, name: builder-image, deps: [I01], summary: "rc1's builder image adopted by digest from our namespace; Makefile and workflows pull by digest only; the Dockerfile is ported unchanged; a tool manifest of the image is recorded"}
  - {id: B01, track: critical, name: package-build, deps: [I02, I03, R01, R04, S01], summary: "The distribution policy (configs/portage) and the overlay recipes world needs ported, with the kernel as it is for B02 to fix and monolith-base from R01; build-packages.sh, binpkg-store.sh (GHCR auth errors fatal) and savedconfig-cache.sh ported; cache tag covers builder, tree and global config; standard emerge binpkg flags plus --rebuild-if-unbuilt; --keep-going false success fixed; versions.lock covers all world atoms; release mode starts from an empty PKGDIR, re-merges from source every package the builder image preinstalled in the target root, never quickpkgs, and audits that every shipped file comes from a package built in this run or a declared toolchain exception; the unowned gate's provenance mode accounts for every file of the final rootfs (unchanged package file, generated by a named step, or declared); an integration test shows a rebuilt static library rebuilds its cached consumers; rl144 and stele left out of world for MS1 iteration ISOs until R05 restores them"}
  - {id: B02, track: critical, name: kernel-config, deps: [B01], decisions: [OD-8], summary: "The kernel B01 ported as it is: config moved to configs/portage/savedconfig and read through savedconfig.eclass (no bind mount, no silent allnoconfig, no write-back); verified kernel config bugs fixed; ported verify-*.sh checks run in make test"}
  - {id: R04, track: critical, name: revbump-check, deps: [F01], summary: "Minimal revision discipline before the cache is relied on: a PR that changes an overlay ebuild or its files/ without adding a new -rN (or new version) ebuild fails make test-revbump; a short git-diff check, pkgcheck later (R02)"}
  - {id: R01, track: critical, name: disc-fixes, deps: [F01], decisions: [OD-1], summary: "monolith-base ported with its tests, tests first (help system, networking, router, persistence, clock honesty, advisory check), and its verified bugs fixed: monolith-advisory-check points at the OD-1 URL and never reports an unreachable service as clean; monolith-base revbumped"}
  # ---------------- the oracle and gates, developed against rc1 ----------------
  - {id: O01, track: critical, name: boot-tests, deps: [F01], summary: "boot-test.py and boot-test.yml ported unchanged (17 modes, -cpu 486, 64 MB floor); a reusable workflow taking an ISO as an Actions artifact name or URL+sha256; all modes pass on the rc1 ISO"}
  - {id: O02, track: critical, name: artifact-checks, deps: [F01], decisions: [OD-2], summary: "static-audit.sh ported and gating, extended with scanelf: no PT_INTERP outside a shrinking allowlist, no musl loader unless allowlisted, EM_386 only, no Python, no freetype/fontconfig/Xft, no X modules; expected rc1 failures recorded"}
  - {id: S01, track: critical, name: sbom-and-gates, deps: [F01], decisions: [OD-5, OD-9], summary: "SBOM (syft + enrich-sbom.py), licence, CVE and unowned gates ported; verified bugs fixed: unowned gate fails on missing or empty input, CVE waivers expire, grype DB recorded; reproduces rc1's SBOM on rc1's rootfs up to listed fields"}
  # ---------------- integration ----------------
  - {id: B03, track: critical, name: ci-build, deps: [B01, B02, R01, O01, O02, S01], summary: "build.yml ported: packages, rootfs, initrd, ISO, then the boot tests (every mode but stele-acid2 until R05), artifact checks and gates on that ISO; jobs hand files over as Actions artifacts, not actions/cache; `make all` runs the same steps locally"}
  - {id: P02, track: critical, name: reproducibility-gate, deps: [B03], summary: "Tag path of build.yml before anything is published: fetch every distfile once into an archive and write release-inputs.json; two clean from-source builds on separate runners, offline (container --network none), from those inputs only; the two ISO SHA-256 digests must be equal or the tag fails; nondeterminism fixed at its source (SOURCE_DATE_EPOCH, kbuild, cpio, mksquashfs, xorriso, ESP, Portage VDB); diffoscope runs only as a diagnostic on a mismatch"}
  - {id: R05, track: critical, name: rust-crates, deps: [B03], summary: "Mandatory before the first release: rl144 and stele return to world; their crates (and the standard library's, for -Z build-std) become cargo.eclass CRATES, so every crate is an ordinary, Manifest-checked distfile; RESTRICT=network-sandbox removed; both build offline; the stele-acid2 boot mode runs again"}
  - {id: P01, track: critical, name: release, deps: [P02, R05, G01, R02], decisions: [OD-4, OD-10], summary: "The first official release. Runs only after P02's gate, the oracle (all 17 modes plus G01's persistence, boot-entry and smoke modes), the overlay QA scan and the supply-chain gates pass for the one reproduced ISO digest, and all 99 predecessor world packages are present and built in that run: attest with actions/attest-build-provenance and attest-sbom; push the distfiles archive (same digest as release-inputs.json); publish release-inputs.json, source-audit.tsv, rc1 SBOM diff and size report; digest chain re-verified; GitHub prerelease, never Latest"}
  # ---------------- after the first release ----------------
  - {id: R02, track: critical, name: overlay-qa, deps: [I02, R04], summary: "pkgcheck scan of the overlay against the pinned tree as make test-overlay, run on every PR and before the first release, with accepted warnings listed; R04's revbump check replaced by pkgcheck's if it covers the same case"}
  - {id: R03, track: later, name: all-static, deps: [O02, B03], summary: "The dynamic-binary allowlist emptied by package.env/env static-link fixes (util-linux, iproute2, dhcpcd, procps, tar, gawk, ...); the musl loader no longer ships"}
  - {id: M01, track: later, name: tree-bump, deps: [P01], decisions: [OD-6], summary: "pin-bump.yml ported without --admin: scheduled PRs that move TREE_COMMIT and versions.lock, validated by the ci-build workflow, merged by a human; the first one moves off rc1's tree"}
  - {id: M02, track: later, name: builder-rebuild, deps: [I03, M01], summary: "The builder image rebuilt from the ported Dockerfile, a stage3 pinned by digest and an archived tree; toolchain-bump.yml ported without --admin"}
  - {id: P03, track: later, name: advisory-feed, deps: [P01, S01], decisions: [OD-1], summary: "The service behind the OD-1 URL: per-release status JSON on GitHub Pages under the OD-1 name, refreshed by the ported nightly CVE re-scan, which applies the CVE policy and never reports unreachable as clean"}
  - {id: G01, track: critical, name: claims-coverage, deps: [O01, B03], decisions: [OD-7], summary: "Every README promise tested or removed before the first release: persistence on disk, every boot entry and one smoke check per world package join the release gate; Hyper-V and SLIP/PPP/dropbear are tested or their claims removed and tracked"}
  - {id: X01, track: later, name: cutover, deps: [P01, R03, M01, P03, G01], summary: "First non-prerelease from this repository; README verification steps for both repos; the predecessor gets a pointer commit and is archived (never renamed)"}
