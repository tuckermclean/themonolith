  - "Does the new design keep a public dashboard at all, and where (GitHub Pages? release assets?). Everything in web/ assumes absolute S3 URLs and index at bucket root."
  - "Who is the 'themonolith.org' domain (details_url in status JSON)? Not referenced elsewhere and not verified to exist."
  - "Is the builder-image pillar (Pillar 5) wanted in the rebuild? It gates overall on CVEs in the Gentoo stage3/crossdev builder (not shipped), and requires per-container-run semantics."
  - "Was docs/cve-gate.md's mocked-grype harness (a ~30-line bash stub) ever committed? Not found under scripts/ or scripts/tests; there are no unit tests for any attestation script."
  - "Real value of attestation-summary.json 'builder.image_digest' in CI: Makefile attestation target omits --builder-digest, so likely empty; confirm from a published summary (S3 unreachable)."
  - "Is there a current published SBOM specVersion? schemas/README says Syft emits 1.7; enrich floors to 1.6. If new Syft emits 1.8 the schema-validation step fails by design."
  - "grype/syft versions in the builder image are installed via an unpinned install.sh (per cve-gate.md/check-cves comments); Dockerfile not in my scope - check build area for pins."
  - "Whether SOURCE_DATE_EPOCH-based reproducibility is ever verified (landing page claims 'same commit always produces the same ISO'); no rebuild-and-compare job seen in my scope."

# ───────────────────────── invariants ─────────────────────────
invariants:
  - id: INV-DIGEST-1
    statement: "sha256sum(ISO) is computed exactly once, inside attestation.sh, and that single value is written to attestation-summary.iso_sha256, SBOM metadata.component.hashes[0].content (+ both distribution externalReferences' hashes), and slsa-provenance subject digest"
    enforced_by: "scripts/attestation.sh:188-195,305,675; scripts/enrich-sbom.py:539-541"
    failure_mode: "n/a (construction); if ISO missing: ISO_SHA256='(not computed)', SBOM gets NO hashes, provenance step FAILS (pillar fail => overall fail)"
    tier: slow
  - id: INV-DIGEST-2
    statement: "Provenance cannot be generated without a real ISO digest"
    enforced_by: "scripts/attestation.sh:641,693-694; scripts/generate-provenance.py:77-83"
    failure_mode: "fail build (provenance_check=fail, overall=fail, exit 1)"
    tier: fast
  - id: INV-DIGEST-3
    statement: "At release time the ISO downloaded from S3 re-hashes to attestation-summary.iso_sha256, and SBOM metadata.component.hashes[0].content equals it"
    enforced_by: ".github/workflows/release.yml:149-162"
    failure_mode: "fail release (exit 1 before gh release create); SLSA subject equality is NOT re-checked here"
    tier: slow
  - id: INV-DIGEST-4
    statement: "The signed SLSA attestation's subject is the ISO file at subject-path (Sigstore/GitHub computes the digest from the file), and signing happens only when attestation overall == pass"
    enforced_by: ".github/workflows/build.yml:~778 (actions/attest@v2 subject-path + if verdict=='pass'); docs/releasing.md:161-166"
    failure_mode: "skip signing on FAIL; job still fails in final step"
    tier: slow
  - id: INV-PILLAR-ALL
    statement: "Every pillar runs to completion regardless of earlier failures; every artifact is always written; exit 1 iff any of sbom, license, cve, unowned, provenance, builder_sbom, builder_cve failed"
    enforced_by: "scripts/attestation.sh:11-12,54,697-718,877-880"
    failure_mode: "fail build (after all artifacts exist)"
    tier: slow
  - id: INV-SBOM-1
    statement: "Syft SBOM generation of the sysroot must succeed (portage-cataloger only) and enrich-sbom.py must exit 0; otherwise pillars 2-3 use the raw SBOM and the SBOM pillar fails"
    enforced_by: "scripts/attestation.sh:259-263,293-347"
    failure_mode: "fail build (sbom_check=fail)"
    tier: slow
  - id: INV-SBOM-2
    statement: "Published SBOM (bom.cdx.json, builder-bom.cdx.json) validates against the vendored CycloneDX schema matching its specVersion, offline"
    enforced_by: ".github/workflows/build.yml:~700-745 (check-jsonschema 0.38.0, schemas in configs/attestation/schemas/)"
    failure_mode: "fail build (step exit; missing schema for new specVersion also fails)"
    tier: slow
  - id: INV-SBOM-3
    statement: "SBOM is a package SBOM: file-type components dropped; synthetic Syft slug CPEs removed; license.id only holds real SPDX ids"
    enforced_by: "scripts/enrich-sbom.py:581-589,659-662,228-263"
    failure_mode: "n/a transform; violation would surface as schema-validation failure (INV-SBOM-2)"
    tier: fast
  - id: INV-SBOM-4
    statement: "Musl (static libc), GRUB and syslinux, which are embedded in the ISO but absent from the sysroot vdb, are propagated into the target SBOM from the host vdb so license/CVE checks cover them"
    enforced_by: "scripts/enrich-sbom.py:779-827 (called with --host-vdb /var/db/pkg at attestation.sh:306)"
    failure_mode: "silent skip if host vdb entry not found"
    tier: slow
  - id: INV-CPE-1
    statement: "CPE mapping is an exception list: packages in cpe-overrides.yaml get a CPE (revision -rN and _pN/_preN stripped); acct-*/virtual/app-alternatives never get a CPE; every other package without a CPE is a counted 'genuine gap' (unmapped_cpe_count), excluded ones counted separately"
    enforced_by: "scripts/enrich-sbom.py:640-666,1256-1304; configs/attestation/cpe-exclusions.yaml"
    failure_mode: "warn / count only (enrich exit 0 always)"
    tier: fast
  - id: INV-LIC-1
    statement: "Every non-file component and metadata.component must have a license expression that is satisfiable (DNF over Portage || ( ) / SPDX OR/AND) using only licenses in allowed_spdx (after gentoo_to_spdx), none in denied_spdx"
    enforced_by: "scripts/check-licenses.py:200-267,319-362; configs/attestation/license-policy.yaml:16-134"
    failure_mode: "fail build (license_check=fail, exit 1)"
    tier: fast
  - id: INV-LIC-2
    statement: "Components with NO license info are 'unknown', never failed"
    enforced_by: "scripts/check-licenses.py:17-18,227-235,362"
    failure_mode: "warn (counted as unknown in report)"
    tier: fast
  - id: INV-LIC-3
    statement: "Policy file identity (sha256) is recorded in license-report.json"
    enforced_by: "scripts/check-licenses.py:325-332"
    failure_mode: "n/a record"
    tier: fast
  - id: INV-CVE-1
    statement: "CVE gate threshold: any grype finding with severity in {Critical,High,Unknown} that is not waived fails the scan; Medium/Low/Negligible are informational only; fix state never downgrades a finding"
    enforced_by: "scripts/check-cves.sh:253,319,343-353,434; configs/attestation/cve-policy.yaml:37-71"
    failure_mode: "fail build (cve_check=fail; also builder: builder_cve fail) - both target AND builder image are gated"
    tier: fast
  - id: INV-CVE-2
    statement: "Waiver exception: allowlist entry matching (cve id, optional component name) marks a finding WAIVED (not gating) but it is still listed and counted (waived_findings). allowlist is currently empty. `expires`/approver are NOT enforced"
    enforced_by: "scripts/check-cves.sh:256-264,318-319,344"
    failure_mode: "skip (finding waived)"
    tier: fast
  - id: INV-CVE-3
    statement: "fail_on_unscanned (default false): when true, any component with no CPE fails the gate. Unscanned components are always reported as UNSCANNED, never counted clean"
    enforced_by: "scripts/check-cves.sh:216-219,351-353; configs/attestation/cve-policy.yaml:56"
    failure_mode: "default: warn/note; if flag true: fail build"
    tier: fast
  - id: INV-CVE-4
    statement: "No CVE verdict is emitted without recording scanner name+version, grype DB built/schema/checksum, policy path+sha256 and scanned/matched/clean/unscanned counts; DB older than 3 days or unparseable sets age_warning"
    enforced_by: "scripts/check-cves.sh:120-130,266-303,355-394; scripts/attestation.sh:404-429,754-772"
    failure_mode: "warn (age_warning string on dashboard); missing policy => WARNING + built-in default gate"
    tier: fast
  - id: INV-CVE-5
    statement: "Scanner liveness canary: grype scanning the OpenSSL 1.0.1 fixture must report >0 raw findings and include CVE-2014-0160 (CVE-2014-0160 must never be in the allowlist)"
    enforced_by: "scripts/run-cve-canary.sh:97-111; .github/workflows/cve-gate-canary.yml"
    failure_mode: "fail the canary workflow only (not a gate in build.yml)"
    tier: slow
  - id: INV-CVE-6
    statement: "grype DB is refreshed (make grype-db-update, weekly-keyed cache) immediately before every attestation run; check-cves.sh itself never updates it"
    enforced_by: ".github/workflows/build.yml:~650-662; Makefile:491-494; scripts/check-cves.sh:120-126"
    failure_mode: "warn (stale DB only flagged)"
    tier: slow
  - id: INV-CVE-7
    statement: "Retroactive revocation: every nightly run re-scans all synced build SBOMs with a fresh DB; any match => status/<tag>.json status=revoked and summary cve_check revoked/fail, overall fail; the live ISO fetches status/<tag>.json and shows a banner if revoked"
    enforced_by: "scripts/nightly-cve-monitor.py:278-296; configs/overlay/app-misc/monolith-base/files/monolith-advisory-check:29-60"
    failure_mode: "advisory only (workflow only fails if nothing could be scanned); S3-hard"
    tier: slow
  - id: INV-OWN-1
    statement: "Every file on the sysroot disk (Syft file cataloger) must be owned by a Portage package (Syft installedFiles + CONTENTS obj/sym/dir, with .bz2 alias) or match a unowned-allowlist glob; otherwise unowned"
    enforced_by: "scripts/check-unowned.py:243-269,308; configs/attestation/unowned-allowlist.yaml"
    failure_mode: "fail build (unowned_check=fail)"
    tier: fast
  - id: INV-OWN-2
    statement: "Pillar 4 only works if Syft is run with SYFT_FILE_METADATA_SELECTION=all (files[] populated); otherwise it warns and trivially passes with 0 files"
    enforced_by: "scripts/attestation.sh:259; scripts/check-unowned.py:246-250"
    failure_mode: "warn (SILENT PASS) - weak invariant"
    tier: slow
  - id: INV-OWN-3
    statement: "If sbom.syft.json is missing, pillar 4 is skipped with a warning and counts as PASS"
    enforced_by: "scripts/attestation.sh:463-473"
    failure_mode: "skip (warn)"
    tier: slow
  - id: INV-PROV-1
    statement: "SLSA provenance uses GitHub canonical buildType (https://actions.github.io/buildtypes/workflow/v1), records resolvedDependencies (git commit, stage3 epoch+digest, portage snapshot epoch+sha256, kernel tarball url+sha512, builder image), byproduct sha256 of the other attestation files, and real started/finished timestamps"
    enforced_by: "scripts/generate-provenance.py:113,128-211,121-123"
    failure_mode: "n/a record; missing optional inputs silently omitted (never fabricated)"
    tier: fast
  - id: INV-PIN-1
    statement: "Build inputs are recorded in the SBOM formulation: stage3 (epoch+digest), versions.lock sha256, kernel tarball SHA-512, busybox tarball SHA-512 (from signed Portage Manifests)"
    enforced_by: "scripts/enrich-sbom.py:837-921"
    failure_mode: "silently omitted if inputs unresolved (never fabricated)"
    tier: slow
  - id: INV-DASH-1
    statement: "builds-index.json is sorted newest-first by attestation timestamp (not tag) and cpeDelta is computed vs the previous entry"
    enforced_by: "scripts/generate-dashboard.py:78-91"
    failure_mode: "n/a"
    tier: fast
  - id: INV-REL-1
    statement: "A release is published only if the Build run for that exact tag commit succeeded (workflow_run conclusion success, event push, head_branch starts with 'v') and the tag resolves to the built SHA"
    enforced_by: ".github/workflows/release.yml:55-60,88-97"
    failure_mode: "skip publish / fail"
    tier: slow
  - id: INV-REL-2
    statement: "Tag builds publish SHA256SUMS (iso + bom.cdx.json) to the GitHub Release and mirror it to s3://$S3_BUCKET/attestation/<version>/SHA256SUMS"
    enforced_by: ".github/workflows/release.yml:166-170,265-278"
    failure_mode: "fail release"
    tier: slow

# ───────────────────────── data contracts ─────────────────────────
data_contracts:
  - name: attestation-summary.json
    producer: script.attestation
    consumers: "script.generate-dashboard, script.nightly-cve-monitor (rewrites), job.build.attestation (reads .overall), wf.release (reads .iso_sha256), web.app/data.js (fetchBuild/fetchSummary), web.app/view-downloads.js, web.app/view-landing.js"
    location: "build artifact dir output/attestation/ -> s3://$S3_BUCKET/attestation/<BUILD_VERSION>/attestation-summary.json (public-read, no-store fetch)"
    key_fields:
      - "build_tag, timestamp (ISO8601Z), iso_sha256, package_count, unmapped_cpe_count, excluded_cpe_count"
      - "sbom_check, license_check, cve_check, unowned_check, provenance_check, overall: 'pass'|'fail' (cve_check may become 'revoked' via nightly)"
      - "cve_scanner{name,version}, cve_db{built,schema_version,checksum,age_warning}, cve_policy{path,sha256}, cve_coverage{scanned,matched,clean,unscanned,total_findings,waived_findings}"
      - "unowned_count, cve_failures[] ('pkg-ver: CVE,..'), license_failures[], unowned_files[]"
      - "builder{attested(int 1),epoch,cross_target,image_digest,package_count,unmapped_cpe_count,excluded_cpe_count,cve_scanner,cve_db_built,cve_coverage{scanned,matched,clean,unscanned,total_findings},sbom_check,cve_check,cve_failures[]} - builder.cve_check/sbom_check are 'not_run' when not attested"
    evidence: "scripts/attestation.sh:744-801"
    notes:
      - "Hand-assembled by a python heredoc with shell interpolation; no schema."
      - "NOT validated by any JSON schema; web code defensively handles missing keys (older builds lack cve_* fields)."
  - name: builds-index.json (+ latest-build.json)
    producer: script.generate-dashboard (also regenerated nightly by script.nightly-cve-monitor)
    consumers: "web.app/data.js fetchBuildIndex -> landing, downloads, index, compare, package views"
    location: "s3://$S3_BUCKET/builds-index.json and latest-build.json (bucket ROOT), https://themonolith.s3.us-west-2.amazonaws.com/builds-index.json; also make dashboard -> output/web/"
    key_fields: "array newest-first of {tag,timestamp,date,packages,unmappedCPEs,excludedCPEs,cpeDelta,licenses,cves,unowned,overall(UPPERCASE),cveScanner,cveScannerVer,cveDbBuilt,cveDbAgeWarning,cveScanned,cveMatched,cveClean,cveUnscanned,cveTotalFindings,cveWaivedFindings,cvePolicyPath}"
    evidence: "scripts/generate-dashboard.py:51-103"
  - name: bom.cdx.json (enriched SBOM, CycloneDX >=1.6, today 1.7)
    producer: script.enrich-sbom (via script.attestation); input is Syft sbom.cdx.json
    consumers: "script.check-licenses, script.check-cves, script.nightly-cve-monitor (grype rescans it), wf.release (metadata.component.hashes[0].content; also attached to GitHub Release + SHA256SUMS), job.build.attestation (schema validation), web view-build/compare/package (components[].name/version/cpe/purl/licenses)"
    location: "output/attestation/bom.cdx.json -> s3://$S3_BUCKET/attestation/<tag>/bom.cdx.json -> GitHub Release asset bom.cdx.json (tags)"
    key_fields: "metadata.component{type:operating-system,bom-ref:themonolith-<tag>,name,version,hashes[0]{alg:SHA-256,content=ISO sha},externalReferences[vcs,build-system,distribution(s3),distribution(release)]}; components[]{name 'cat/pkg',version,cpe,purl pkg:ebuild/...?arch=&distro=gentoo,licenses,supplier,authors,type,bom-ref}; dependencies[]; formulation[0]{components,properties}; metadata.tools.components[]; metadata.authors, lifecycles"
    evidence: "scripts/enrich-sbom.py:454-1028"
  - name: builder-bom.cdx.json (+ builder-sbom.cdx.json raw)
    producer: script.enrich-sbom (--product-name themonolith-builder) via script.attestation Pillar 5
    consumers: "script.check-cves, web view-build Builder tab, job.build.attestation schema validation"
    location: "s3://$S3_BUCKET/attestation/<tag>/builder-bom.cdx.json"
    key_fields: "same shape as bom.cdx.json but metadata.component.name=themonolith-builder, no hashes, no dependency graph, no formulation"
    evidence: "scripts/attestation.sh:544-556"
  - name: sbom.cdx.json / sbom.syft.json (raw Syft)
    producer: syft in script.attestation
    consumers: "script.enrich-sbom (cdx), script.check-unowned (syft native)"
    location: "output/attestation/ -> synced to s3 attestation/<tag>/ (sbom.syft.json is huge: files[] of whole rootfs). Not fetched by web."
    key_fields: "syft native: artifacts[].type=='portage' .metadata.installedFiles[].path, files[].location.{realPath,path}, schema.version"
    evidence: "scripts/attestation.sh:259-263; scripts/check-unowned.py:85-155"
  - name: cve-report.cdx.json (+ builder-cve-report.cdx.json)
    producer: grype -o cyclonedx-json via script.check-cves
    consumers: "web view-build (vulnerabilities[].id, ratings[0].severity, affects[].ref, source.url, analysis.response), attestation.sh (cve_failures), script.generate-provenance (byproduct hash)"
    location: "s3://$S3_BUCKET/attestation/<tag>/cve-report.cdx.json"
    key_fields: "vulnerabilities[]{id,ratings[0].severity,affects[].ref,source.url}"
    evidence: "scripts/check-cves.sh:178-184; scripts/attestation.sh:434-458; web/app/view-build.js:403-452"
  - name: cve-report.grype.json (+ builder-)
    producer: grype -o json via script.check-cves
    consumers: "script.check-cves coverage builder only"
    location: "output/attestation/ (also synced to S3; not fetched by web)"
    key_fields: "matches[]{vulnerability{id,severity,fix{state,versions},dataSource},artifact{name,version,cpes}}"
    evidence: "scripts/check-cves.sh:171,228,308-335"
  - name: cve-report-coverage.json (+ builder-cve-report-coverage.json)
    producer: script.check-cves
    consumers: "script.attestation (folds into summary), script.run-cve-canary (summary.total_findings, findings[].cve), web view-build CVEs tab"
    location: "s3://$S3_BUCKET/attestation/<tag>/cve-report-coverage.json"
    key_fields: "timestamp, sbom_path, cve_report_path, native_report_path, scanner{name,version}, db{built,schema_version,checksum,status,age_days,age_warning}, policy{path,sha256,loaded,gating_severities,informational_severities,fail_on_unscanned,allowlist_size}, coverage{total_components,scanned,unscanned,matched,clean}, unscanned_components[{name,version}], findings[{cve,severity,component,version,cpe,fix_state,fix_versions,gating,waived,waiver_justification,waiver_approved_by,waiver_expires,url}], summary{total_findings,gating_findings,waived_findings}, verdict, verdict_reasons[]"
    evidence: "scripts/check-cves.sh:355-394"
  - name: license-report.json
    producer: script.check-licenses
    consumers: "script.attestation (license_failures), web view-build Licenses tab + overview donut + compare, script.generate-provenance (byproduct)"
    location: "s3://$S3_BUCKET/attestation/<tag>/license-report.json"
    key_fields: "build_tag,timestamp,sbom_path,policy_path,policy_sha256,summary{total,pass,fail,unknown},components[{name,version,raw_license,normalized[],status pass|fail|unknown,reason}]"
    evidence: "scripts/check-licenses.py:327-346"
  - name: unowned-report.json
    producer: script.check-unowned
    consumers: "script.attestation (unowned_count/unowned_files), web view-build Unowned tab/overview, script.generate-provenance (byproduct)"
    location: "s3://$S3_BUCKET/attestation/<tag>/unowned-report.json"
    key_fields: "timestamp,syft_schema,sysroot,summary{total_files,owned,allowlisted,unowned},unowned_files[]"
    evidence: "scripts/check-unowned.py:272-283"
  - name: slsa-provenance.json
    producer: script.generate-provenance
    consumers: "\"job.build.attestation: 'Read SLSA predicate' extracts .predicate and passes to actions/attest@v2 (predicate-type https://slsa.dev/provenance/v1, subject-path ISO)\", \"NOT consumed by web/ or release.yml\""
    location: "output/attestation/slsa-provenance.json -> s3 attestation/<tag>/; signed copy lives in GitHub's attestation store (ext.github-attestations / ext.sigstore) keyed by ISO sha256"
    key_fields: "_type in-toto Statement v1; subject[0]{name themonolith-<tag>.iso,digest.sha256}; predicateType https://slsa.dev/provenance/v1; predicate.buildDefinition{buildType,externalParameters.workflow,internalParameters{github{...},build{tag,source_date_epoch}},resolvedDependencies[git repo, gentoo-stage3, gentoo-portage-snapshot, linux-kernel-source, monolith-builder]}; runDetails{builder.id,metadata{invocationId,startedOn,finishedOn},byproducts[{name,mediaType,digest.sha256}]}"
    evidence: "scripts/generate-provenance.py:214-279"
  - name: cpe-gap-count.txt / cpe-exclusions-count.txt / cpe-exclusions.json
    producer: script.enrich-sbom (fixed names, overwritten by builder pass; attestation.sh then mv's to builder-*)
    consumers: "script.attestation (reads counts), none for json"
    location: "output/attestation/ and s3 attestation/<tag>/"
    key_fields: "int; int; {build_tag,timestamp,excluded_count,genuine_gap_count,exclusions[{name,version,pattern,justification,detail}]}"
    evidence: "scripts/enrich-sbom.py:1301-1324; scripts/attestation.sh:349-357,561-574"
  - name: status/<tag>.json (retroactive advisory)
    producer: script.nightly-cve-monitor
    consumers: "monolith-advisory-check on the live ISO (POSIX sh, curl/wget, 5s timeout), none in web/"
    location: "s3://$S3_BUCKET/status/<tag>.json, fetched at https://themonolith.s3.amazonaws.com/status/<BUILD_TAG>.json (BUILD_TAG from /etc/monolith-release)"
    key_fields: "{build_tag, checked, status: clean|revoked, advisories[CVE ids] (revoked only), details_url (revoked only, https://themonolith.org/builds/<tag>)}"
    evidence: "scripts/nightly-cve-monitor.py:133-150; configs/overlay/app-misc/monolith-base/files/monolith-advisory-check:17-60"
  - name: SHA256SUMS
    producer: wf.release (job publish) - `sha256sum *.iso bom.cdx.json`
    consumers: "humans, GitHub Release asset, s3 mirror"
    location: "GitHub Release asset SHA256SUMS; s3://$S3_BUCKET/attestation/<version>/SHA256SUMS (release.yml:277-278)"
    key_fields: "two lines: sha256 themonolith-<version>.iso ; sha256 bom.cdx.json"
    evidence: ".github/workflows/release.yml:166-170,273-278"
  - name: ISO objects
    producer: job.build.build (not my area)
    consumers: "wf.release, web view-downloads/view-build (ISO_BASE/themonolith-<tag>.iso), web view-boot + boot.html (themonolith.iso)"
    location: "s3://$S3_BUCKET/themonolith-<BUILD_VERSION>.iso and themonolith.iso (latest pointer, server-side copy), https://themonolith.s3.us-west-2.amazonaws.com/..."
    key_fields: "binary; must be range-readable + CORS-open for v86"
    evidence: ".github/workflows/build.yml:540-546; web/app/data.js:137; web/app/view-boot.js:5"
  - name: dashboard site (web/**)
    producer: make.dashboard (cp -r web/. output/web/) + generate-dashboard
    consumers: "browsers"
    location: "s3 bucket root: index.html, styles.css, app/*.js, builds-index.json, latest-build.json (aws s3 sync output/web/ s3://$S3_BUCKET/ --exclude attestation/* packages/* builds/*)"
    key_fields: "static"
    evidence: "Makefile:480-490; .github/workflows/build.yml:~802-806"

# ───────────────────────── web runtime dependencies ─────────────────────────
web_runtime_fetches:
  s3_data:
    root: "https://themonolith.s3.us-west-2.amazonaws.com   (bucket themonolith, region us-west-2; data.js:135-137)"
    urls:
      - "GET {S3_ROOT}/builds-index.json  (cache:no-store)  [landing, downloads, index, compare, package]"
      - "GET {S3_ROOT}/attestation/<tag>/attestation-summary.json  [landing, downloads (N+1), build, compare, package]"
      - "GET {S3_ROOT}/attestation/<tag>/bom.cdx.json"
      - "GET {S3_ROOT}/attestation/<tag>/cve-report.cdx.json"
      - "GET {S3_ROOT}/attestation/<tag>/cve-report-coverage.json"
      - "GET {S3_ROOT}/attestation/<tag>/license-report.json"
      - "GET {S3_ROOT}/attestation/<tag>/unowned-report.json"
      - "GET {S3_ROOT}/attestation/<tag>/builder-bom.cdx.json"
      - "GET {S3_ROOT}/attestation/<tag>/builder-cve-report.cdx.json"
      - "GET {S3_ROOT}/attestation/<tag>/builder-cve-report-coverage.json"
      - "link/download {ISO_BASE}/themonolith-<tag>.iso  (anchor download)"
      - "link only (not fetched): {S3_ROOT}/builds-index.json footer; byproduct downloads of bom/builder-bom/cve-report/license-report/unowned-report"
  isos_for_boot:
    - "GET https://themonolith.s3.us-west-2.amazonaws.com/themonolith.iso via v86 async cdrom (HTTP Range chunks)"
  cdn_libs:
    - "https://cdn.jsdelivr.net/npm/v86/build/libv86.js     (UNPINNED latest; index.html:16, boot.html:285)"
    - "https://cdn.jsdelivr.net/npm/v86/build/v86.wasm       (UNPINNED; view-boot.js:93, boot.html:290+wasm_path)"
    - "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin   (branch ref 'master'; view-boot.js:97)"
    - "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin   (branch ref 'master'; view-boot.js:98)"
  fonts:
    - "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap (index.html:10) + gstatic font files; boot.html uses system monospace only"
  other_links:
    - "https://github.com/tuckermclean/linux-live-iso-factory/blob/master/<policy> (view-build.js:362)"
    - "GitHub attestation docs/commands only in text (gh attestation verify --owner tuckermclean)"
  other_origins_on_iso: "monolith-advisory-check -> https://themonolith.s3.amazonaws.com/status/<tag>.json; scripts/build-rootfs.sh:266 HOME_URL https://themonolith.s3.us-west-2.amazonaws.com (not my area)"
  cors_and_range_requirements: >
    Every JSON fetch is cross-origin unless the page is served from the exact same regional S3 host, so the bucket
    needs CORS (GET, HEAD; origin of the dashboard; for v86 also allowed request header Range and exposed headers
    Content-Length, Content-Range, Accept-Ranges, ETag). v86 async CDROM streams the ISO with Range requests (partial 206),
    so the ISO host MUST support byte ranges (S3 does natively) and must NOT use a transfer that strips Content-Length.
    COOP/COEP are NOT required (no SharedArrayBuffer use in repo code; unverified for current v86 builds).
    No put-bucket-cors/CORS rule file is in the repo: configuration lives only in the AWS console (UNKNOWN).
  per_view_data_needs:
    landing: ["builds-index.json[0]", "attestation/<latest>/attestation-summary.json (iso_sha256)"]
    boot: ["themonolith.iso (ranges)", "v86 libv86.js + v86.wasm + seabios.bin + vgabios.bin"]
    downloads: ["builds-index.json", "attestation-summary.json for EVERY build (lazy, parallel)", "ISO links"]
    builds_index: ["builds-index.json"]
    build_detail: ["all 9 attestation files; Overview/SBOM/Licenses/Unowned/CVEs/Builder tabs derive from them; Provenance + Verify tabs use pageMeta only"]
    compare: ["builds-index.json", "all 9 files x 2 builds"]
    package: ["builds-index.json", "all 9 files x 8 builds"]
