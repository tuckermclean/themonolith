        value: "https://cdn.jsdelivr.net/gh/copy/v86@master/  (branch master, unpinned) -> bios/seabios.bin, bios/vgabios.bin"
        evidence: "web/app/view-boot.js:7,97-98"
    s3_coupling: hard
    notes:
      - "v86 config: memory_size 256MiB, vga_memory 8MiB, cdrom {url: ISO_URL, async:true}, boot_order 0x132 (CD first), autostart true (view-boot.js:92-102)."
      - "REQUIREMENTS on the ISO host: (1) CORS: Access-Control-Allow-Origin for the page origin AND Access-Control-Expose-Headers: Content-Length/Content-Range/Accept-Ranges so v86 can read sizes; (2) HTTP Range support (206 partial content) - async cdrom issues Range GETs per chunk and also needs a HEAD or a first range probe for the file size; (3) CORS must allow the Range request header (non-simple header => preflight OPTIONS). The UI's own error text: 'The S3 bucket must allow GET requests with Range headers from this origin' (view-boot.js:70). The exact CORS rule on the bucket is not in the repo (no put-bucket-cors anywhere) - UNKNOWN/ manual console config."
      - "Because v86 and the page are both served from the bucket root, same-origin applies when the page is served from the S3 bucket's REGIONAL endpoint; but the README advertises the global host themonolith.s3.amazonaws.com while data.js uses s3.us-west-2.amazonaws.com => cross-origin fetches (hence CORS needed even for JSON)."
      - "~135MB ISO (UI text) vs 131MB (README:22) vs reality unknown."
      - "setInterval(flushSerial,100) never cleared; navigating away and back leaks timers and re-adds pointerlock listeners (view-boot.js:134-136)."
      - "download-error handler shows 'CORS error' notice for any download failure, including 404."
      - "Uses window.V86 || window.V86Starter, so works across v86 versions only because unpinned/untested; wasm_path is explicit so wasm and libv86.js can mismatch if jsDelivr 'latest' changes between them."

