area: supplychain
scope_note: >
  Read in full: scripts/attestation.sh, check-cves.sh, check-licenses.py, check-unowned.py,
  enrich-sbom.py, generate-provenance.py, generate-dashboard.py, nightly-cve-monitor.py,
  run-cve-canary.sh, configs/attestation/*.yaml, web/index.html + web/app/*.js, boot.html,
  docs/cve-gate.md, docs/releasing.md. Skimmed: canary-sbom.cdx.json, web/styles.css (no external URLs in it),
  schemas (listed only). Cross-read (not my area, only to establish callers/consumers): Makefile 440-500,
  build.yml 640-830, release.yml 60-280, nightly-cve-scan.yml, cve-gate-canary.yml,
  configs/overlay/app-misc/monolith-base/files/monolith-advisory-check.
  No tests exist for any of these scripts (grep of scripts/tests for check-licenses/check-unowned/enrich/etc = none).
  The whole supply-chain is Python3 + pyyaml + bash + syft + grype; no extra Python deps (stdlib only).

components:
  # ───────────────────────── scripts ─────────────────────────
  - id: script.attestation
    kind: script
    path: scripts/attestation.sh
    purpose: >
      Orchestrator. Runs ALL pillars to completion (set -uo pipefail, no -e), writes every artifact, then writes
      attestation-summary.json and exits 1 if any pillar failed.
    triggers: ["called by make.attestation / make.attest-builder inside the builder container (Makefile:452,466)"]
    invokes:
      - script.enrich-sbom
      - script.check-licenses
      - script.check-cves
      - script.check-unowned
      - script.generate-provenance
      - "tool syft, grype, python3 (inline python heredocs), curl, sha256sum"
    invoked_by: [make.attestation, make.attest-builder, "job.build.attestation (via make attestation, build.yml ~L660)"]
    inputs:
      - what: "sysroot dir with /var/db/pkg (extracted rootfs sysroot)"
        from: "--sysroot, /output/sysroot"
        evidence: "scripts/attestation.sh:18,133"
      - what: "ISO file (for sha256sum; may be absent)"
        from: "--iso /output/themonolith-$BUILD_VERSION.iso"
        evidence: "scripts/attestation.sh:188-195"
      - what: "policy/config files"
        from: "/configs/attestation/{cpe-overrides,license-policy,cve-policy,unowned-allowlist}.yaml (container bind mount), fallback ./config/*.yaml"
        evidence: "scripts/attestation.sh:66-69,150-161"
      - what: "cpe-exclusions.yaml"
        from: "${SCRIPT_DIR}/../configs/attestation/cpe-exclusions.yaml (hard-wired, NOT overridable by flag)"
        evidence: "scripts/attestation.sh:307,553"
      - what: "world, versions.lock, kernel Manifest"
        from: "${SCRIPT_DIR}/../configs/portage/{world,versions.lock}, ../configs/overlay/sys-kernel/monolith-kernel/Manifest"
        evidence: "scripts/attestation.sh:311-314"
      - what: "host portage vdb (to propagate musl/grub/syslinux) and portage tree"
        from: "/var/db/pkg, /var/db/repos/gentoo inside builder container"
        evidence: "scripts/attestation.sh:306,312"
      - what: "portage snapshot tarball (streamed, only to hash it)"
        from: "ext.gentoo-distfiles https://distfiles.gentoo.org/snapshots/gentoo-$BUILD_EPOCH.tar.xz"
        evidence: "scripts/attestation.sh:650-656"
      - what: "grype vulnerability DB (already updated upstream)"
        from: "ext.grype-db via make grype-db-update / GRYPE_CACHE_DIR"
        evidence: "scripts/check-cves.sh:120-130"
    outputs:
      - what: "sbom.cdx.json (raw Syft CycloneDX), sbom.syft.json (Syft native, large), bom.cdx.json (enriched)"
        to: "$OUTPUT_DIR (/output/attestation)"
        evidence: "scripts/attestation.sh:36-48,232-234"
      - what: "license-report.json, cve-report.cdx.json, cve-report.grype.json, cve-report-coverage.json, unowned-report.json, cpe-gap-count.txt, cpe-exclusions-count.txt, cpe-exclusions.json"
        to: "$OUTPUT_DIR"
        evidence: "scripts/attestation.sh:364,383,470; scripts/check-cves.sh:100-103; scripts/enrich-sbom.py:1301-1324"
      - what: "builder-sbom.cdx.json, builder-bom.cdx.json, builder-cve-report.cdx.json (+ .grype.json, -coverage.json), builder-cpe-gap-count.txt, builder-cpe-exclusions-count.txt"
        to: "$OUTPUT_DIR"
        evidence: "scripts/attestation.sh:500-501,582-585,562-565"
      - what: "slsa-provenance.json"
        to: "$OUTPUT_DIR"
        evidence: "scripts/attestation.sh:678"
      - what: "attestation-summary.json"
        to: "$OUTPUT_DIR"
        evidence: "scripts/attestation.sh:722-807"
    secrets: []
    external: [ext.gentoo-distfiles, ext.grype-db]
    pins: []
    env:
      - "BUILD_STARTED_ON (default: now) attestation.sh:59"
      - "BUILD_EPOCH (empty ok; also recorded as builder.epoch, stage3 epoch, portage snapshot epoch) attestation.sh:315,643"
      - "STAGE3_DIGEST (set by build.yml:596-599, forwarded by Makefile:152) attestation.sh:316,687"
      - "CROSS_TARGET (-> --arch, builder.cross_target) attestation.sh:302,505"
      - "S3_BUCKET (only used to fabricate s3:// distribution externalReference) attestation.sh:202-204"
      - "GITHUB_REF, GITHUB_REPOSITORY, GITHUB_SERVER_URL, GITHUB_SHA, GITHUB_RUN_ID (tag build => release-asset URL) attestation.sh:218-220,300-301,308"
      - "SYFT_FILE_METADATA_SELECTION=all (set inline for syft) attestation.sh:259"
    s3_coupling: soft
    s3_detail: >
      Never touches S3 itself. S3_BUCKET only feeds a *string* (s3://$S3_BUCKET/themonolith-$TAG.iso) into the SBOM
      distribution externalReference; omitted when unset (attestation.sh:198-204). With S3 gone this reference is dead/misleading.
    pillars:
      - n: "1"
        name: "SBOM generation + CPE enrichment"
        what: "syft dir:SYSROOT with --override-default-catalogers portage-cataloger emitting cyclonedx-json + syft native json; then enrich-sbom.py. Fail if syft rc!=0 OR enrich rc!=0 (enrich failure is rolled into SBOM_RC)"
        evidence: "scripts/attestation.sh:246-347"
      - n: "2"
        name: "License compliance"
        what: "check-licenses.py on enriched SBOM vs license-policy.yaml; any component status=fail => pillar fail"
        evidence: "scripts/attestation.sh:359-364"
      - n: "3"
        name: "CVE scan"
        what: "check-cves.sh on enriched SBOM vs cve-policy.yaml; folds coverage JSON into summary"
        evidence: "scripts/attestation.sh:378-429"
      - n: "4"
        name: "Unowned files audit"
        what: "check-unowned.py on sbom.syft.json + sysroot CONTENTS; skipped with WARN (and UNOWNED_RC stays 0 => PASS!) if sbom.syft.json missing"
        evidence: "scripts/attestation.sh:461-473"
      - n: "5"
        name: "Builder environment SBOM + CVE"
        what: "syft dir:/ of the running builder container (excludes /proc /sys /dev /run /output /configs /scripts /rootfs /build /var/db/repos /var/cache/distfiles /var/log/portage /root/.cache), enrich, grype via check-cves.sh. Both builder sbom rc and builder cve rc gate overall"
        evidence: "scripts/attestation.sh:488-637"
      - n: "6"
        name: "SLSA v1 provenance"
        what: "generate-provenance.py; hard-fails (rc=1) if ISO sha is '(not computed)' i.e. ISO absent. Not a *pillar* in the header (header says five pillars)"
        evidence: "scripts/attestation.sh:639-695"
    notes:
      - "INCLUDE_BUILDER defaults to 1 (attestation.sh:70) although header/help call it 'Pillar 5 (--include-builder only)' (L9,L27). make.attestation does NOT pass --include-builder yet builder pillar always runs. make.attest-builder is therefore redundant except it passes --builder-digest."
      - "make.attestation never passes --builder-digest (Makefile:452-459) so summary builder.image_digest and provenance builder-digest are empty in CI (only make.attest-builder passes it, L475, and CI calls make attestation, build.yml ~L664)."
      - "Builder enrichment run reuses output dir and enrich-sbom.py writes fixed names cpe-gap-count.txt / cpe-exclusions-count.txt / cpe-exclusions.json. The target's values were already read into shell vars (L351-357) but then the files are mv'd to builder-* names (L562-565) => the target's cpe-gap-count.txt is OVERWRITTEN/renamed away; and cpe-exclusions.json in the output dir ends up being the BUILDER's report, the target's is lost. Dashboard docs say cpe-exclusions.json is surfaced per build; it is not fetched by web/ at all."
      - "Pillar-5 enrichment is called WITHOUT --sysroot, --world, --versions-lock, --kernel-manifest, --host-vdb, --iso-sha256, --arch, --stage3-*: builder SBOM has no dep graph, no purl arch qualifiers, no formulation."
      - "attestation-summary.json 'builder.attested' is the shell int ${INCLUDE_BUILDER} => JSON number 1, not boolean true (L781)."
      - "Summary python heredoc interpolates shell variables directly into python source (${BUILD_TAG}, ${CVE_FAILURES} ...). A BUILD_TAG or package name containing a quote breaks it. Optional strings were moved to MONO_* env to mitigate (L724-733) but build_tag/epoch/cross_target/image_digest/CVE_POLICY_PATH/CVE_SCANNER_VERSION are still interpolated."
      - "KERNEL_SHA512 read from hard-coded /configs/overlay/sys-kernel/monolith-kernel/Manifest (L667) whereas enrich-sbom gets ${SCRIPT_DIR}/../configs/... (L314): two different paths for the same file; works only because both resolve inside the container."
      - "Portage snapshot sha256 is obtained by re-downloading ~60-100MB tarball from distfiles at attestation time (L650-656) because emerge-webrsync discards it. Silently dropped on failure (L658-659). Comment in generate-provenance.py:62 claims it comes from a .sha256 sidecar (stale)."
      - "SYFT_VERSION/GRYPE_VERSION use `|| ... || echo ''` fallbacks that mask failure (L278-283). DB metadata parsed from `grype db status` text with regexes (Built:/Version:/Checksum:) => brittle to grype output format changes; check-cves.sh repeats the same parsing (L271-274)."
      - "overall gating: sbom, license, cve, unowned, provenance, builder_sbom, builder_cve each flips overall=fail (L698-718). cve_scanner/db/policy keys are informational only."
      - "A pass requires NO gating CVE in the *builder* image too: builder CVEs fail the whole build (L717). Builder image is a stock Gentoo stage3 + crossdev so this is a standing source of failures independent of the shipped ISO."
    rebuild_notes:
      - "Preserve: run-all-then-fail-at-end semantics; single sha256sum of ISO feeding SBOM+provenance+summary; summary schema (see data_contracts)."
      - "Redesign: S3_BUCKET-derived distribution URL; the builder-image pillar needs a new definition of 'builder' if the Docker factory changes; stop mv-ing shared fixed filenames (parametrise enrich-sbom output names)."
      - "Replace shell->python heredoc interpolation with a real summary writer (e.g. one python script taking JSON of pillar results)."

  - id: script.check-cves
    kind: script
    path: scripts/check-cves.sh
    purpose: "Grype wrapper: records DB status, runs grype twice (native json + cyclonedx-json), applies cve-policy.yaml, writes <base>-coverage.json, exit code = policy verdict"
    triggers: []
    invokes: ["tool grype (db status, version, sbom:<file> -o json, sbom:<file> -o cyclonedx-json)", "inline python3 + pyyaml"]
    invoked_by: [script.attestation, script.run-cve-canary]
    inputs:
      - what: "enriched CycloneDX SBOM"
        from: "--sbom"
        evidence: "scripts/check-cves.sh:22,82"
      - what: "cve-policy.yaml"
        from: "--policy default /configs/attestation/cve-policy.yaml, fallback configs/attestation/cve-policy.yaml"
        evidence: "scripts/check-cves.sh:106-118"
      - what: "grype DB (local cache, not updated here)"
        from: "ext.grype-db (updated by make.grype-db-update)\""
        evidence: "scripts/check-cves.sh:120-130"
    outputs:
      - what: "cve-report.cdx.json (grype CycloneDX VEX), cve-report.grype.json (native), cve-report-coverage.json"
        to: "dirname(--output); names derived by stripping .cdx.json (builder-cve-report* for pillar 5)"
        evidence: "scripts/check-cves.sh:100-103"
    secrets: []
    external: [ext.grype-db, ext.nvd]
    pins: []
    env: []
    s3_coupling: none
    notes:
      - "Exit 1 on: gating finding, fail_on_unscanned && unscanned>0, grype rc!=0, SBOM parse error, native JSON parse error (L172-184,211,225,434)."
      - "POLICY MISSING => WARNING and built-in default (Critical/High/Unknown, no allowlist, policy sha empty). NOT a failure (L113-118)."
      - "POLICY PARSE ERROR => WARNING + built-in default (L249-251) also not a failure. Missing pyyaml => exit 1 (L246)."
      - "policy.update({k:v}) merges loaded YAML over the default; keys consumed: gating_severities, informational_severities (reported only), fail_on_unscanned, allowlist. `fix_state_gates` in cve-policy.yaml is documentation only - NOT read by code (L231-253)."
      - "allowlist entry `expires` is recorded in findings (waiver_expires, L333) but NEVER enforced: an expired waiver still waives. cve-policy.yaml:81-90 says `expires` is required and 'forces a fresh look' - not true in code. `justification`/`approved_by` presence is also not validated."
      - "waiver_for matches by cve id (case-insens) and optional exact `component` == grype artifact.name (L256-264)."
      - "DB age >3 days => age_warning string only (L290-296); unparseable build time => warning too. Never a failure (docs/cve-gate.md:225-232 admits; no max_db_age_days key)."
      - "Pre-scan 'unscanned' = components with no `cpe` field, type!=file. This INCLUDES acct-*/virtual/* excluded components, so cve_coverage.unscanned >= unmapped_cpe_count (which excludes policy-exempt ones). Two different 'gap' numbers on the dashboard."
      - "matched_count counts distinct (name,version) from grype matches; clean = max(scanned - matched, 0): matches against components without a CPE (e.g. via purl) would make clean undercount."
      - "grype is run twice (native, then cyclonedx) for 'cross-version stability'; second pass overwrites GRYPE_RC=$? (L179) fine."
      - "Verdict printout says 'See cve-coverage.json' (L428) but file is *-coverage.json."
    rebuild_notes:
      - "Keep gating_severities {Critical,High,Unknown}, fail_on_unscanned=false, fix_state_gates=always semantics, coverage file schema (consumed by web)."
      - "Decide: enforce waiver `expires` and required fields (currently dead promise), add max_db_age_days if DB freshness should gate."
      - "grype install is `curl .../main/install.sh | sh` unpinned in nightly-cve-scan.yml:43 and cve-gate-canary.yml:37-38; the builder image's grype version comes from the Dockerfile (not my area)."

  - id: script.check-licenses
    kind: script
    path: scripts/check-licenses.py
    purpose: "Evaluate each SBOM component (and metadata.component) license expression against license-policy.yaml allowlist; DNF semantics"
    triggers: []
    invokes: []
    invoked_by: [script.attestation]
    inputs:
      - what: "enriched SBOM bom.cdx.json"
        from: "--sbom"
        evidence: "scripts/check-licenses.py:285,300"
      - what: "license-policy.yaml (allowed_spdx, gentoo_to_spdx, denied_spdx)"
        from: "--policy"
        evidence: "scripts/check-licenses.py:48-55"
    outputs:
      - what: "license-report.json {build_tag,timestamp,sbom_path,policy_path,policy_sha256,summary{total,pass,fail,unknown},components[{name,version,raw_license,normalized[],status,reason}]}"
        to: "$OUTPUT_DIR/license-report.json"
        evidence: "scripts/check-licenses.py:327-346"
    secrets: []
    external: []
    pins: []
    env: []
    s3_coupling: none
    notes:
      - "Exit 1 iff n_fail>0 (L362). `unknown` (no license field) is NOT a failure (L17-18, L227-235)."
      - "denied_spdx wins over allowed_spdx (L208-211); currently denied_spdx: [] (license-policy.yaml:134)."
      - "Unmapped license names are matched literally against allowed_spdx; gentoo_to_spdx maps e.g. GPL-2 -> GPL-2.0-or-later (note: Gentoo 'GPL-2' is really GPL-2.0-only; policy over-approximates but both are allowed)."
      - "Failure reason only reports the FIRST conjunction's failing licenses (L259) even when other alternatives exist."
      - "Compound SPDX expression 'GPL-2.0-only WITH Font-exception-2.0' is allow-listed as a literal string with spaces (license-policy.yaml:62) but the tokenizer splits on whitespace (L87), so the string can never match as a single token; works only through the Gentoo alias GPL-2-with-font-exception."
      - "Policy is a flat allowlist of ~54 ids: permissive + copyleft all allowed (GPL/LGPL/MPL/EUPL/CC-BY-SA/OFL/etc.). No copyleft deny. Non-SPDX tokens (openssl, curl, nethack, netcat, Toyoda, lsof, man-pages, tcp_wrappers_license, BEER-WARE...) are allowed by literal name."
      - "Includes metadata.component (product, MIT) in the report; dedupes by name (L312-317)."
    rebuild_notes:
      - "Any new package whose Portage LICENSE is not covered fails the build; the allowlist grows by hand. Keep gentoo_to_spdx table with the recipes."

  - id: script.check-unowned
    kind: script
    path: scripts/check-unowned.py
    purpose: "Pillar 4: files on disk (Syft files[]) minus Portage-owned paths (Syft installedFiles + direct CONTENTS parse of sym/dir/obj) minus allowlist globs = unowned; fail if any"
    triggers: []
    invokes: []
    invoked_by: [script.attestation]
    inputs:
      - what: "sbom.syft.json (native Syft JSON with files[] and artifacts[].metadata.installedFiles)"
        from: "--syft-json"
        evidence: "scripts/check-unowned.py:198,217"
      - what: "sysroot (prefix to strip + /var/db/pkg/**/CONTENTS)"
        from: "--sysroot"
        evidence: "scripts/check-unowned.py:58-82,223"
      - what: "unowned-allowlist.yaml (key: allowlist)\""
        from: "--allowlist (optional; missing file => WARN, empty allowlist)"
        evidence: "scripts/check-unowned.py:209-215"
    outputs:
      - what: "unowned-report.json {timestamp,syft_schema,sysroot,summary{total_files,owned,allowlisted,unowned},unowned_files[]}"
        to: "$OUTPUT_DIR/unowned-report.json"
        evidence: "scripts/check-unowned.py:272-283"
    secrets: []
    external: []
    pins: []
    env: []
    s3_coupling: none
    notes:
      - "Exit 1 iff n_unowned>0 (L308)."
      - "Ownership precedence: exact path in owned set > path+'.bz2' in owned (extract-packages.sh bunzips man pages, L259-263) > allowlist glob > unowned."
      - "Matching uses fnmatch.fnmatch, where `*` matches across `/` (fnmatch has no path-segment semantics) so `**` == `*`; unowned-allowlist.yaml:7 documents '* matches within a path segment' which is false. usr/share/fonts/*/fonts.dir etc. are looser than documented. `?` also matches '/'."
      - "If files[] is empty (file cataloger not enabled) it WARNs but does NOT fail: total=0 => unowned=0 => PASS (L246-250). SYFT_FILE_METADATA_SELECTION=all must stay set in attestation.sh:259 or pillar 4 silently passes."
      - "get_owned_paths only warns if portage pkgs exist but no file list found (L116-127); falls back to CONTENTS so still works."
      - "Directories: only paths that Syft's file cataloger lists are checked; dir entries owned via CONTENTS dir lines."
      - "Allowlist is ~103 entries (hand-authored rootfs files, shadow backups, binutils eselect symlinks, nethack state, ld.so.cache, kmod runlevels, nftables state ...). Header says list should shrink as files move into ebuilds (app-misc/monolith-base owns many already, allowlist.yaml:89-95)."
    rebuild_notes:
      - "Allowlist content is tied to what build-rootfs.sh writes by hand; every new hand-installed rootfs file requires an entry (AGENTS.md rootfs trap). Rebuild should prefer owning files via ebuilds and delete allowlist entries; keep the test (it is a strong oracle that the rootfs == packages)."

  - id: script.enrich-sbom
    kind: script
    path: scripts/enrich-sbom.py
    purpose: "Turn raw Syft CycloneDX into the published bom.cdx.json: product component + ISO hash, CPE overrides, license normalisation, dep graph, propagated builder components, formulation, tools"
    triggers: []
    invokes: ["subprocess version probes: i486-linux-musl-gcc, i486-linux-musl-ld, gcc, portageq/emerge, crossdev (5s timeout, fail-silent)"]
    invoked_by: [script.attestation]
    inputs:
      - what: "raw Syft CycloneDX SBOM"
        from: "--sbom"
        evidence: "scripts/enrich-sbom.py:1053"
      - what: "cpe-overrides.yaml (key `overrides`: bare-name -> full CPE 2.3 template with * version)"
        from: "--overrides"
        evidence: "scripts/enrich-sbom.py:60-63"
      - what: "license-policy.yaml gentoo_to_spdx; spdx-license-ids.txt next to the policy (fallback /configs/attestation/spdx-license-ids.txt)"
        from: "--license-policy"
        evidence: "scripts/enrich-sbom.py:211-225,557-572"
      - what: "cpe-exclusions.yaml (`exclusions[{pattern,justification,detail}]`)"
        from: "--cpe-exclusions"
        evidence: "scripts/enrich-sbom.py:1237-1239"
      - what: "sysroot var/db/pkg RDEPEND/DEPEND/HOMEPAGE"
        from: "--sysroot"
        evidence: "scripts/enrich-sbom.py:275-346,702-708"
      - what: "host vdb: cross-i486-linux-musl/musl, sys-boot/grub, sys-boot/syslinux (PVR, LICENSE)"
        from: "--host-vdb /var/db/pkg"
        evidence: "scripts/enrich-sbom.py:779-827"
      - what: "portage tree metadata.xml (<upstream><maintainer>) and sys-apps/busybox/Manifest"
        from: "--portage-tree /var/db/repos/gentoo"
        evidence: "scripts/enrich-sbom.py:387-419,887-901"
      - what: "configs/portage/world, versions.lock, monolith-kernel Manifest"
        from: "--world --versions-lock --kernel-manifest"
        evidence: "scripts/enrich-sbom.py:737-750,856-883"
    outputs:
      - what: "bom.cdx.json (enriched)"
        to: "--output"
        evidence: "scripts/enrich-sbom.py:1292-1298"
      - what: "cpe-gap-count.txt, cpe-exclusions-count.txt, cpe-exclusions.json {build_tag,timestamp,excluded_count,genuine_gap_count,exclusions[]}"
        to: "dirname(--output) fixed names"
        evidence: "scripts/enrich-sbom.py:1301-1324"
    secrets: []
    external: []
    pins:
      - thing: "tool version string recorded in metadata.tools"
        value: "enrich-sbom.py 2.0"
        evidence: "scripts/enrich-sbom.py:1020-1025"
      - thing: "specVersion floor"
        value: "1.6 (never caps; Syft currently emits 1.7)"
        evidence: "scripts/enrich-sbom.py:471-476; configs/attestation/schemas/README"
    env: []
    s3_coupling: none
    enrichments:
      - "metadata.component: type operating-system, bom-ref themonolith-<tag>, supplier 'Tucker McLean', license MIT, hashes[0]=SHA-256 of ISO (only if sha given and != '(not computed)'), externalReferences vcs/build-system/distribution(s3)/distribution(release) (L484-541)"
      - "drops Syft's OS distro component (properties syft:distro:*) (L545-551); drops type=file components (L581-589); drops binary-cataloger bare-name dupes of portage entries and shell-quoted junk names (L598-608)"
      - "assigns bom-ref to all components (L611-624)"
      - "CPE: skip categories acct-group/ acct-user/ app-alternatives/ virtual/ (strip cpe, L640-653); override via bare_name lookup; else strip synthetic Syft slug CPE (vendor/product containing '/') (L659-662); version in CPE has -rN, _pN, _preN stripped and '_'->'.' (L86-135)"
      - "supplier 'Gentoo Linux'; authors from metadata.xml upstream maintainers; website externalReference from vdb HOMEPAGE (L684-708)"
      - "component type reclass by category (acct-=>data, virtual/dev-/lib-=>library, app-/net-/sys-/www-/mail-/x11-/media-/games-=>application) (L161-182,712-713)"
      - "purl gets ?arch=<CROSS_TARGET>&distro=gentoo (L716-717); license ids not in spdx-license-ids.txt moved to license.name; compound names -> {expression} (L228-263)"
      - "dependencies[]: from vdb RDEPEND+DEPEND atoms, best-effort; root entry product->world atoms; deduped (L726-773)"
      - "propagated components musl/grub/syslinux from host vdb with properties syft:monolith:source=builder and bom-ref propagated-<pkg>-<ver> (L779-827)"
      - "formulation[0] bom-ref monolith-build-formula: gentoo/stage3 container (epoch+digest), versions.lock sha256, kernel tarball SHA-512 from Manifest, busybox tarball SHA-512, properties monolith:workflow:{path,commit,run_id} (L837-921). workflow_path default .github/workflows/build.yml (L1213-1217)"
      - "metadata.tools.components: syft, grype (with cdx:tool:db:{built,schema,checksum} properties), enrich-sbom.py, + build toolchain probes (L923-1026); metadata.authors, lifecycles[build] (L554-555)"
    notes:
      - "Exit code ALWAYS 0 on success path; CPE gaps are informational (L31,1326). Only exits 1 on missing --sbom or missing pyyaml."
      - "Missing overrides file only WARNs and proceeds with {} (L1226-1233) => every package becomes a CPE gap and CVE scanning degrades silently (cve-policy fail_on_unscanned=false)."
      - "metadata.component.hashes[0] is the digest-chain anchor; it is only written if --iso-sha256 valid. If ISO absent, release.yml:157 would KeyError => release blocked (fail closed)."
      - "bare_name() strips version via regex -\\d.*$ ; packages whose name contains '-<digit>' (e.g. 'gtk-3', 'lib32-foo') collide/mis-key (L82). Matching to overrides is by bare name only so category is ignored (hence _NO_CPE_CATEGORIES guard)."
      - "The formulation cannot be validated against anything; the hashes are read from the ebuild Manifest (SHA512 of upstream tarball), not recomputed."
      - "cpe-overrides.yaml has 87 override entries (header comment in docs/cve-gate.md:25 says ~50)."
      - "builder pass (pillar 5) re-runs this script with a subset of flags; see script.attestation notes about fixed output names being overwritten."
    rebuild_notes:
      - "Output contract (bom.cdx.json) is consumed by web/ (components[].name/version/cpe/purl/licenses), release.yml (metadata.component.hashes[0].content), check-cves (components[].cpe), check-licenses. Keep these paths stable."
      - "Largest single piece of logic in the supply chain (1330 lines). Candidate for splitting; Syft-specific workarounds (binary-cataloger dupes, quoted names, slug CPEs) are there because of portage-cataloger quirks."

  - id: script.generate-provenance
    kind: script
    path: scripts/generate-provenance.py
    purpose: "Emit an in-toto Statement v1 with SLSA Build v1 predicate (self-generated) for the ISO"
    triggers: []
    invokes: []
    invoked_by: [script.attestation]
    inputs:
      - what: "--iso-sha256 --iso-name --build-tag --output (+optional epochs, digests, kernel version/sha512, builder digest, started/finished)"
        from: "attestation.sh args"
        evidence: "scripts/generate-provenance.py:52-74; scripts/attestation.sh:674-691"
      - what: "GitHub Actions env: GITHUB_SERVER_URL, GITHUB_REPOSITORY, _ID, _OWNER_ID, _VISIBILITY, REF, SHA, RUN_ID, RUN_NUMBER, RUN_ATTEMPT, EVENT_NAME, WORKFLOW_REF, WORKFLOW_SHA, ACTOR, ACTOR_ID, SOURCE_DATE_EPOCH"
        from: "forwarded into container via Makefile GITHUB_ENV"
        evidence: "scripts/generate-provenance.py:88-105,254"
      - what: "sibling attestation files to hash as byproducts"
        from: "dirname(--output)"
        evidence: "scripts/generate-provenance.py:190-211"
    outputs:
      - what: "slsa-provenance.json (in-toto Statement; subject[0]={name: themonolith-<tag>.iso, digest.sha256}; predicate used by actions/attest)"
        to: "$OUTPUT_DIR/slsa-provenance.json"
        evidence: "scripts/generate-provenance.py:214-279"
    secrets: []
    external: [ext.github-api, ext.gentoo-distfiles, ext.kernel-org, ext.dockerhub, ext.ghcr]
    pins:
      - thing: "buildType"
        value: "https://actions.github.io/buildtypes/workflow/v1 (GitHub Attestations API rejects others)"
        evidence: "scripts/generate-provenance.py:113"
      - thing: "workflow_path"
        value: ".github/workflows/build.yml (hard-coded)"
        evidence: "scripts/generate-provenance.py:108"
    env: ["see inputs"]
    s3_coupling: none
    notes:
      - "Exit 1 only if iso-sha256 empty/'(not computed)' (L77-83)."
      - "Defaults when env missing: repository 'unknown/unknown', sha 'unknown', run_id '0' — provenance is still written with placeholders (local dev). Fine locally; in CI a missing env would produce a bogus-but-signed statement. No guard."
      - "Only the `predicate` (not the full statement) is used by CI: build.yml read-predicate step extracts d['predicate'] and passes to actions/attest@v2 with subject-path=ISO; GitHub builds the real signed statement. The `subject` here and slsa-provenance.json itself are NOT what is signed - they are an informational copy."
      - "SOURCE_DATE_EPOCH recorded (L254) but this is the Dockerfile ENV value (1786406400 = 2026-08-10) - not per-build."
      - "Kernel URL assumes cdn.kernel.org/pub/linux/kernel/v<major>.x/linux-<ver>.tar.xz (L166-172); resolvedDependencies is descriptive only (nothing verifies it)."
      - "builder digest is `docker inspect .Id` (image config ID), not a registry manifest digest; uri pkg:docker/ghcr.io/<owner>/monolith-builder."
    rebuild_notes:
      - "If the new factory is not GitHub Actions, buildType/builder.id/workflow_ref semantics and the 'actions/attest' signing path must be redesigned; digest-chain step 5 (docs/releasing.md:161-166) depends on actions/attest verifying subject-path hash."

