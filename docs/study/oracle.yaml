harness:
  summary: >
    scripts/boot-test.py (2528 lines) is a pexpect-driven QEMU harness. main() parses args, picks a RAM default per
    mode, requires the ISO to exist (exit 2 if not), and runs up to 3 launch attempts of _run_once. _run_once builds
    the argv from MODE_BUILDERS[mode], pexpect.spawn()s QEMU with encoding utf-8, optionally tees the serial stream to
    --log-file, calls MODE_RUNNERS[mode](child, args), converts BootTestError/pexpect errors into FAIL, force-kills
    QEMU if still alive. All guest interaction is over the serial console (-nographic -serial mon:stdio); there is
    no login (agetty -n -l monolith-console) and no PS1 matching. Exit 0 = PASS, 1 = FAIL, 2 = ISO missing or pexpect
    missing (:119-123, :2499). Requires python pexpect, qemu-system-i386 (BIOS modes), qemu-system-x86_64 + OVMF (UEFI
    modes), mkfs.ext4 (persist). Not runnable from this repo without a built ISO. 17 modes in MODE_RUNNERS (:2323).
  guest_command_protocol: >
    run_check(child,name,cmd,validator,timeout=30) sends `cmd; echo MONOLITH_CHECK_<hex>:$?`, expects the sentinel
    regex, hands (exit_code, output) to a validator; never raises (timeouts/EOF become failed checks). Validators:
    contains, contains_with_exit, regex_matches, regex_absent, exit_code_only, exact_value, epoch_close_to (the last
    is DEAD CODE - unused since clock-epoch dropped the fixture server). Results are collected, all printed as
    [PASS]/[FAIL] lines via report_results, then poweroff.
  full_smoke_suite:
    used_by: [bootmode.bios, bootmode.uefi]
    checks:
      - "uname -r contains --kernel-version (substring match, so an empty expected version would always pass)"
      - "lsmod ^e1000 (NIC is a module, coldplugged)"
      - "ip link show eth0 matches eth0:.*UP"
      - "DHCP: if udhcpc exists run `udhcpc -i eth0 -n -q -t 5 -T 3`, else assert `ip -4 addr show eth0` has an IPv4 inet (lease from boot-time dhcpcd, S40network)"
      - "curl --version contains curl"
      - "sqlite3 :memory: 'select 41+1;' contains 42"
      - "perl -e 'print $];' contains 5.0 (loose; comment says tighten once major known)"
      - "perl strict+warnings program prints ok"
      - "perl -Mutf8 -CS uc(e-acute) exit 0 (unicore tables survived pruning)"
      - "perl -MCGI CGI->new(q(x=42))->param(q(x)) contains 42"
      - "guestbook.cgi (REQUEST_METHOD=GET QUERY_STRING name=Ada&message=Hello+from+1996) output contains 'Ada|Hello from 1996', and independent `sqlite3 -list -separator '|'` re-query of /tmp/guestbook.db returns same row"
      - "mount output matches `type overlay`"
      - "`MANPAGER=cat PAGER=cat man ls | head -5` matches LS or ls (mandoc)"
      - "monolith help exit 0; monolith tools contains monolith-router; `notacommand` exits 127 with 'not on the disc'"
  reduced_smoke_suite: {used_by: [bootmode.toram], checks: [uname -r, e1000 module, eth0 UP, overlay mount]}
  storage_smoke_suite: {used_by: [bootmode.ahci, bootmode.nvme, bootmode.usb, bootmode.virtio], checks: [uname -r, overlay mount]}
  retry:
    mechanism: >
      STARTUP_FLAKE_MAX_ATTEMPTS = 3 (:2422). should_retry_launch(ok, reached_init, attempt, max) (:2425) retries ONLY
      if the run failed AND the guest never reached "[init] Starting init..." (flag child._reached_init set in
      expect_milestone :806-807) AND attempts remain. Any failure after /init is reported without retry. Pure logic,
      unit-tested by test.boot-test-retry. Retry restarts QEMU from scratch (and for persist reformats the disk because
      build_persist_cmd re-runs make_persist_disk). No retry wrapper exists in the workflows (grep for retry/nick-fields: none).
    known_gaps: >
      A hung bootloader prompt (ISOLINUX 'boot:' not seen) sends label blindly and then fails at the first milestone
      -> counts as pre-init flake and is retried up to 3x, i.e. 3 x 300 s = 15 min worst case plus 90s/180s bootloader waits.
      nat: client guest is not covered by the launch-flake discriminator.
  timeouts_s: {boot_milestone_default: 300, isolinux_prompt: 90, grub_menu: 180, shell_ready: 60, check_default: 30, poweroff: 90 (x2 with -f fallback), qmp_screendump: 25, stele_render: 180, nat_dhcp: 45, nat_curl_poll: 120, router_up: 60, monolith_net_probe: 60}
  output_files:
    - "--log-file <path>: full serial transcript (child.logfile). nat adds <path>.client; persist adds <path>.boot2"
    - "--gui-screendump <path> (default output/gui-screendump.ppm) + <path>.qmp.sock (gui/stele-acid2)"
    - "--persist-disk <path> (default output/monolith-persist-test.img)"
    - "CI uploads logs as actions/upload-artifact retention-days 14 (boot-test.yml per job), if: always()"
  flags:
    - "--iso PATH (required)"
    - "--mode {bios,uefi,toram,ahci,nvme,usb,virtio,nicless,nic,vga,fbdev-modprobe,nat,gui,stele-acid2,clock-epoch,clock-1996,persist} (required)"
    - "--kernel-version STR (required; expected uname -r substring)"
    - "--ram-mb INT (default per MODE_DEFAULT_RAM :2343: bios64 uefi512 toram512 ahci512 nvme512 usb512 virtio512 nicless64 nic256 vga64 fbdev-modprobe64 nat256 gui128 stele-acid2256 clock-epoch64 clock-1996 64 persist128)"
    - "--qemu-i386 (default qemu-system-i386), --qemu-x86_64 (default qemu-system-x86_64)"
    - "--ovmf-code PATH (autodetect: /usr/share/OVMF/OVMF_CODE.fd, OVMF_CODE_4M.fd, /usr/share/edk2/ovmf/OVMF_CODE.fd, /usr/share/edk2-ovmf/OVMF_CODE.fd)"
    - "--boot-timeout SEC (default 300)"
    - "--cdrom-monitor-id (default ide1-cd0; toram only)"
    - "--log-file PATH"
    - "--nic-model {pcnet,rtl8139,tulip,ne2k_pci,ne2k_isa} (nic mode)"
    - "--vga-model {cirrus} (vga mode)"
    - "--gui-screendump PATH"
    - "--rtc-date STR (QEMU -rtc base=; clock modes default it)"
    - "--persist-disk PATH"
  ci_runner_environment: >
    ubuntu-latest, actions/setup-python@v5 python 3.12, `apt-get install qemu-system-x86` (+ ovmf for ahci/nvme/usb/virtio/uefi),
    `pip install pexpect` (unpinned), actions/checkout@v4, actions/cache/restore@v4, actions/upload-artifact@v4. No KVM
    (TCG only; slow). No timeout-minutes set on any job (default 360 min). All 17 jobs repeat the same 6 setup steps (no composite action).
  ci_job_map:
    - {job: job.boot-test.expected-kernel, modes: []}
    - {job: job.boot-test.bios, modes: [bootmode.bios], matrix: "ram_mb [64,256]"}
    - {job: job.boot-test.uefi, modes: [bootmode.uefi]}
    - {job: job.boot-test.toram-eject, modes: [bootmode.toram]}
    - {job: job.boot-test.ahci, modes: [bootmode.ahci]}
    - {job: job.boot-test.nvme, modes: [bootmode.nvme]}
    - {job: job.boot-test.usb, modes: [bootmode.usb]}
    - {job: job.boot-test.virtio, modes: [bootmode.virtio]}
    - {job: job.boot-test.nicless, modes: [bootmode.nicless]}
    - {job: job.boot-test.gui, modes: [bootmode.gui]}
    - {job: job.boot-test.stele-acid2, modes: [bootmode.stele-acid2]}
    - {job: job.boot-test.nic-models, modes: [bootmode.nic], matrix: "shell loop 5 models"}
    - {job: job.boot-test.vga-models, modes: [bootmode.vga], matrix: "shell loop 1 model"}
    - {job: job.boot-test.fbdev-modprobe, modes: [bootmode.fbdev-modprobe]}
    - {job: job.boot-test.nat-router, modes: [bootmode.nat]}
    - {job: job.boot-test.clock-epoch, modes: [bootmode.clock-epoch]}
    - {job: job.boot-test.clock-1996, modes: [bootmode.clock-1996]}
    - {job: job.boot-test.persist, modes: [bootmode.persist]}
  workflow_wiring: >
    boot-test.yml is `on: workflow_call` only (input build-version). build.yml job `boot-test` (build.yml:559) calls it
    with needs: build and passes `secrets: inherit` (the callee uses no secrets). The build.yml `attestation` job and the
    release path hang off needs.boot-test.result == success. pr-validate.yml never boots anything. Trigger conditions
    for build.yml: push / schedule / PR with label 'full-ci' (build.yml:18-60).
  s3_coupling: >
    boot-test.yml and boot-test.py have NO S3 dependency: the ISO is passed via the GitHub Actions cache (key
    ci-artifacts-<run_id>-iso). The coupling is upstream: the ISO is produced by build.yml `build` job which also uploads
    to S3 (build.yml:~540). test.sync-portage and test.s3-gc exercise S3 behaviours (stubbed aws).
  gotchas_for_rebuild:
    - "The ISO file name must be themonolith-<BUILD_VERSION>.iso under output/ (boot-test.yml paths); the harness itself takes any --iso path."
    - "Boot flow depends on exact serial strings from rootfs/init and build-rootfs.sh (:135-140). Any init rewrite must keep them or update the constants."
    - "Boot flow depends on isolinux label names (serial) and GRUB menu index 2 = (serial) (build-iso.sh:305-344)."
    - "Guest-side expectations: /usr/sbin/monolith-console lazy shell, bash with PROMPT_COMMAND chain, busybox applets hostname/nslookup in the booted rootfs (nat), netstat (net-tools), dhcpcd, nft, dnsmasq, sqlite3, perl+CGI, man/mandoc, /usr/lib/cgi-bin/guestbook.cgi, /usr/share/stele/acid2.html, startx, Xfbdev/dwm/st."
    - "Busybox in booted rootfs has no awk applet (comment :2222-2227)."
    - "QEMU TCG emulation of -cpu 486 with 64 MB RAM is slow: 300 s per milestone budget."
gaps:
  - "Hyper-V Gen 1 / Gen 2 boot: README.md:167 claims '-iso_mbr_part_type 0x00 targets Hyper-V Gen 1' and Hyper-V paravirtual NICs (HYPERV_NET=m, kernel.config:1731); no QEMU test can emulate Hyper-V; no test of the hybrid MBR type or hv_netvsc/hv_storvsc."
  - "Real-disk persistence: persist mode uses a host-formatted virtio-blk file. Nothing boots the guest and runs `monolith-persist init` against a block device end to end (unit test is stubbed), nor the GRUB 'persistent' entry (UEFI), nor swapfile creation/swapon."
  - "ISOLINUX labels linux, fb, fb800 (the DEFAULT, 30s timeout), fb640, vga (vga=ask), debug, persist(without serial), rescue are never selected by any test; only 'serial', 'serial toram', 'serial vga=788', 'serial persist'. The default boot path real users hit (fb800 with no keypress, TIMEOUT 300) is untested."
  - "GRUB menu entries plain (default), framebuffer, debug, rescue, toram, persistent are never selected; only entry 2 (serial). GRUB toram is not tested at all (README.md:154 documents it)."
  - "Rescue shell (`rescue` kernel param / label / GRUB entry) boot behaviour untested."
  - "`root=/dev/sdXN` real-root boot (README.md:157-163) untested."
  - "UEFI 32-bit is documented as not built; no negative test or placeholder. UEFI toram, UEFI persist, UEFI+nicless etc. not covered."
  - "BIOS boot from USB/AHCI/NVMe/virtio: the storage-controller variants are UEFI-only; BIOS-from-hybrid-disk (the 'Hybrid USB' row, README:136) is never booted as a disk (only as -cdrom)."
  - "Minimum RAM claim: only bios mode at 64 MB is tested (README does not state a minimum). No test at a smaller RAM or 32 MB / 486 real-hardware-ish limits; toram needs 512 MB in tests."
  - "Networking promises (README:280-300): SLIP (slattach), PPP/pppd, dropbear SSH + S20keygen host key generation, iperf3/mtr/tcpdump/socat/whois/iftop/ethtool, wget, udhcpc in initrd - none exercised. NIC drivers named in README (3Com Vortex CONFIG_VORTEX=y built-in, e100, 8139cp, r8169, virtio_net, tulip variants) only partly boot-tested: e1000 (default), pcnet, rtl8139, tulip, ne2k_pci, ne2k_isa; e100/e1000e/igb/r8169/sky2/virtio_net/vmxnet3/hyperv_net/3c509/wd/smc-ultra/lance etc. only checked as .ko existence in build.yml (config presence in verify-nic-zoo)."
  - "NIC rtl8139 assertion regex ^8139(too|cp) is satisfied by either driver; does not prove which was intended."
  - "Package set (99 world atoms): smoke suite exercises only curl, sqlite3, perl/CGI, man, monolith tools, startx stack, stele, nft, dnsmasq, dhcpcd; no execution test of the other ~80 packages (bash, util-linux, procps, tar, gawk, lynx, rl144 game, dropbear, ppp, etc.). Static-link claim is checked by scripts/static-audit.sh (not in this scope) not by boot."
  - "Dashboard/web demo (v86 browser boot, boot.html, web/) has no automated test of any kind; the hosted ISO is streamed via HTTP range requests (no test)."
  - "Release verification promises (README 'Verify a release': attestation, cosign/SLSA) not covered by boot-test or tests/ (supplychain area)."
  - "Reproducibility (same BUILD_EPOCH gives same toolchain/tree) has no test beyond sync-portage pin test."
  - "Stele Acid2: gate is exit 0 + non-black framebuffer, never compares to the Acid2 reference smiley; a wrong-but-nonblack render passes."
  - "GUI: the 'dwm bar + terminal drawn' claim (:1827) is asserted only as >0.5% non-black pixels (a gray stipple root alone would also satisfy it)."
  - "Clock: fetch-and-set correction never exercised under QEMU (only unit test with stubs); the login hint (30-clock-hint.sh) has no unit test or boot test; S45 hook ordering in rcS untested beyond flag existence."
  - "No unit tests for: 40-advisory.sh / monolith-advisory-check, 30-clock-hint.sh, 99-monolith-square.bash, monolith-console (lazy shell), startx, which, topics content beyond file existence, guestbook.cgi directly, rootfs/init, build-iso.sh, build-rootfs.sh, build-initrd.sh (only grep-based wiring checks)."
  - "No fast test for check-licenses.py, check-unowned.py, enrich-sbom.py, generate-provenance.py, generate-dashboard.py, nightly-cve-monitor.py, check-cves.sh, attestation.sh, update-build-pins.sh, update-versions.sh, extract-packages.sh, run-cve-canary.sh (scripts/fixtures has only canary-sbom.cdx.json). cve-canary workflow is the only exercise of the CVE gate."
  - "Kernel tier invariants: no test checks Tier-0 size (bzImage size budget) or that kernel config has no unexpected =y growth other than CONFIG_I2C."
  - "boot-test.py has no unit tests besides should_retry_launch: ppm_not_black, validators, qemu cmd builders, QMP client untested."
contradictions:
  - {claim: "boot-test.py module docstring (:36-42) says clock-epoch uses a host fixture HTTP server and asserts 'the automatic boot hook corrects the clock to ~now and the ignorance flag clears'", where: "scripts/boot-test.py:36-42", fact: "run_clock_epoch asserts the OPPOSITE: flag /run/monolith-clock-ignorant IS present and year is still 1970; NIC is removed (-nic none) so no server is reachable. epoch_close_to() (:519) is leftover dead code.", evidence: "scripts/boot-test.py:488-509,543-585"}
  - {claim: "boot-test.yml clock-epoch job starts a host http.server fixture 'monolith-time reads its Date header from' and step is named 'RTC at epoch + fixture server'", where: ".github/workflows/boot-test.yml:796-805", fact: "Guest has -nic none and can never reach it; the server step is dead.", evidence: "scripts/boot-test.py:507-509"}
  - {claim: "README Testing section says CI runs boot-test across bios, uefi, toram, ahci, nvme, usb, virtio and a nicless control", where: "README.md:340-344", fact: "CI also runs nic (5 models), vga (cirrus), fbdev-modprobe, nat, gui, stele-acid2, clock-epoch, clock-1996, persist (17 jobs total); README list is stale. The bios job also runs a 64M and 256M matrix.", evidence: ".github/workflows/boot-test.yml job list"}
  - {claim: "boot-test.py module docstring (:5-14 and :89-98) lists only bios/uefi/toram + storage + nicless and GRUB menu '0-5'", where: "scripts/boot-test.py:144-148", fact: "17 modes exist; GRUB menu has 7 entries (0..6, persistent added) as correctly stated at :760-761. Docstring header :144-146 says 0..5.", evidence: "scripts/build-iso.sh:305-344"}
  - {claim: "boot-test.py docstring (:100-102) says it 'cannot be exercised on the authoring machine ... meant to be proven out by CI logs'", where: "scripts/boot-test.py:100-102", fact: "stale; harness has been run in CI for many modes and carries many CI-derived fixes in comments.", evidence: "comments throughout, e.g. :628-634, :2077-2082"}
