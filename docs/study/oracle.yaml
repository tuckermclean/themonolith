area: oracle
common:
  # Facts shared by every boot mode (scripts/boot-test.py)
  milestones_serial_strings:
    init_start: '"[init] Starting init..." (boot-test.py:135)'
    overlay_ready: '"[init] Overlay root ready" (:136)'
    toram_ejectable: '"[init] Boot media can now be ejected" (:137)'
    exec_init: '"[init] Executing /sbin/init..." (:138)'
    rcs_start: '"Starting system initialization..." (:139)'
    rcs_complete: '"System initialization complete." (:140)'
  common_boot_sequence: >
    select bootloader entry -> expect the 5 milestones in order (each timeout = --boot-timeout, default 300s,
    :151) -> wait_for_shell (send "", then loop sendline "echo MONOLITH_SHELL_READY_<hex>" expect_exact 3s per try,
    60s total, :810-841) -> per-mode checks via run_check (command + "; echo MONOLITH_CHECK_<hex>:$?" sentinel,
    30s default, :844-880) -> report_results -> poweroff_and_wait (sendline poweroff, expect EOF 90s; fallback
    "poweroff -f" another 90s; :1392-1409).
  bootloader_nav:
    isolinux: 'select_isolinux_label (:732): expect_exact "boot:" up to 90s; on timeout WARN and send label blindly. Label text after the label name is appended to that label APPEND line by SYSLINUX (used for "serial toram", "serial vga=788", "serial persist"). Visible on serial only via SeaBIOS -nographic VGA-text mirroring (isolinux.cfg has no SERIAL directive; scripts/build-iso.sh grep for SERIAL = none).'
    grub: 'select_grub_serial_entry (:753): expect_exact "(serial)" up to 180s (blind fallback if not seen), sleep .5, send 2x Down (GRUB_SERIAL_ENTRY_DOWN_PRESSES=2, :149), sleep .5, send CR. Relies on grub.cfg mirroring menu to serial and on menu order plain,framebuffer,serial,... (scripts/build-iso.sh:305-344).'
  tier_note: >
    Every bootmode is tier=slow: needs the built ISO (themonolith-<BUILD_VERSION>.iso) plus qemu-system-x86 +
    pexpect (+ ovmf for UEFI modes). Nothing can run without a built ISO.
bootmodes:
  - id: bootmode.bios
    runner: run_bios (scripts/boot-test.py:1602); builder build_bios_cmd (:191)
    boots: ISO as -cdrom, BIOS/SeaBIOS + ISOLINUX label "serial". No firmware file needed.
    qemu: >
      qemu-system-i386 -cdrom ISO -m <ram> -cpu 486 -boot d -nographic -serial mon:stdio -no-reboot
      (:193-202); machine = QEMU default pc/i440fx, default NIC (e1000) and default VGA; -rtc base=... only if
      --rtc-date given (:209). Default RAM 64 (:2344); CI matrix overrides to 64 and 256.
    asserts:
      -
        what: "5 boot milestones reached"
        how: "expect_exact on serial"
        timeout_s: "300 each"
        evidence: "boot-test.py:1604-1608"
      -
        what: "interactive shell"
        how: "marker echo loop"
        timeout_s: "60"
        evidence: ":1609"
      -
        what: "run_full_smoke_suite (17 checks, see harness.full_smoke_suite)"
        how: "guest commands via run_check"
        timeout_s: "30 each (60 for monolith-net probe)"
        evidence: ":1338-1354,1610"
      -
        what: "poweroff terminates QEMU"
        how: "expect EOF"
        timeout_s: "90 (+90 fallback)"
        evidence: ":1612"
    flake_handling: 'Global launch-flake retry only (harness.retry): up to 3 launches if guest never reached /init. No per-check retries.'
    ci: 'job.boot-test.bios (.github/workflows/boot-test.yml:58), matrix ram_mb [64,256] (:64), --mode bios --ram-mb <m> (:89-94). tier: slow'
    proves: The ISO boots via BIOS/ISOLINUX on an emulated i486 with 64 MB RAM to a usable shell with modular e1000 NIC, DHCP, curl, sqlite, perl+CGI, guestbook CGI, overlay root, man, monolith front door.
  - id: bootmode.uefi
    runner: run_uefi (:1616); builder build_uefi_cmd (:214)
    boots: ISO as -cdrom, UEFI via OVMF_CODE.fd + GRUB serial entry (index 2). Firmware = OVMF_CODE.fd auto-detected from 4 candidate paths (:153-158) or --ovmf-code.
    qemu: >
      qemu-system-x86_64 -drive if=pflash,format=raw,readonly=on,file=<OVMF_CODE> -cdrom ISO -m <ram> -boot d
      -nographic -serial mon:stdio -no-reboot (:223-232). No -cpu, no -machine (default pc), default e1000 NIC.
      Default RAM 512 (:2345). No OVMF_VARS file is supplied (read-only code image only).
    asserts:
      -
        what: "5 milestones + shell + full smoke suite (same as bios)"
        how: "serial + guest commands"
        timeout_s: "300/60/30"
        evidence: ":1617-1627"
    flake_handling: Global launch-flake retry. GRUB menu wait has a blind-navigation fallback after 180s (:772-773).
    ci: 'job.boot-test.uefi (boot-test.yml:105), --mode uefi, no --ram-mb (default 512). tier: slow'
    proves: The same ISO boots via UEFI 64-bit GRUB (BOOTX64.EFI, serial entry) under OVMF to the same working userland as BIOS.
  - id: bootmode.toram
    runner: run_toram (:1630); builder = build_bios_cmd (MODE_BUILDERS :2306)
    boots: ISO -cdrom, BIOS/ISOLINUX, label typed as "serial toram" (:1631).
    qemu: Identical argv to bios (:193-202). Default RAM 512 (:2346; comment "128M OOMs"). CI passes no --ram-mb. Also --cdrom-monitor-id default "ide1-cd0" (:2388).
    asserts:
      -
        what: "toram milestone \"[init] Boot media can now be ejected\" appears between init-start and overlay-ready"
        how: "expect_exact"
        timeout_s: "300"
        evidence: ":1633-1636"
      -
        what: "reduced smoke suite (uname -r contains expected kernel, e1000 module loaded, eth0 UP, overlay mounted)"
        how: "guest cmds"
        evidence: ":1357-1363,1643"
      -
        what: "system survives CD eject"
        how: "send Ctrl-A c to switch to QEMU monitor, expect \"(qemu)\", \"eject -f ide1-cd0\", back, then \"uname -r\" exit 0"
        timeout_s: "30 each step"
        evidence: ":1412-1435,1646"
    flake_handling: Global launch-flake retry only. Eject uses expect_exact "(qemu)" with 30s timeouts; an exception here is pexpect.TIMEOUT which is a pexpect.ExceptionPexpect -> caught in _run_once as FAIL (not retried because init was reached).
    ci: 'job.boot-test.toram-eject (boot-test.yml:147), --mode toram. tier: slow'
    proves: The toram kernel parameter copies the squashfs to RAM and the boot media can be ejected while the system keeps running.
  - id: bootmode.ahci
    runner: run_ahci (:1682) -> run_uefi_driver_variant (:1654); builder build_ahci_cmd (:247)
    boots: ISO (isohybrid) as an AHCI CD-ROM behind ich9-ahci on q35, UEFI/OVMF + GRUB serial entry.
    qemu: >
      qemu-system-x86_64 -machine q35 -drive if=pflash,...OVMF_CODE -device ich9-ahci,id=ahci
      -drive id=cd,if=none,media=cdrom,file=ISO -device ide-cd,bus=ahci.0,drive=cd -boot d -m <ram> -nographic
      -serial mon:stdio -no-reboot (:258-270). Default RAM 512; CI passes --ram-mb 512. q35 default NIC is e1000e
      which the kernel lacks (comment :1368-1371) so no networking assertions.
    asserts:
      -
        what: "\"ahci\" module in lsmod (regex ^ahci\\b multiline)"
        how: "lsmod"
        timeout_s: "30"
        evidence: ":1140-1153,1685"
      -
        what: "storage smoke suite = uname -r contains expected kernel + overlay mounted"
        how: "guest cmds"
        evidence: ":1366-1375"
    flake_handling: Global launch-flake retry.
    ci: 'job.boot-test.ahci (boot-test.yml:201), --mode ahci --ram-mb 512. tier: slow'
    proves: CONFIG_SATA_AHCI=m is coldplug-loaded from the initrd by modalias so the ISO can be found/mounted on SATA hardware.
  - id: bootmode.nvme
    runner: run_nvme (:1689) -> run_uefi_driver_variant; builder build_nvme_cmd (:274)
    boots: ISO as raw NVMe namespace (hybrid MBR/GPT), UEFI/OVMF + GRUB.
    qemu: >
      qemu-system-x86_64 -drive if=pflash,...OVMF_CODE -drive id=nvm,if=none,format=raw,file=ISO
      -device nvme,serial=cafe1234,drive=nvm -boot c -m <ram> -nographic -serial mon:stdio -no-reboot (:284-294).
      RAM 512 default and in CI. Default pc machine, default e1000 NIC.
    asserts:
      -
        what: "\"nvme\" module loaded"
        how: "lsmod regex ^nvme\\b"
        evidence: ":1156-1167,1692"
      -
        what: "uname -r + overlay mounted"
        how: "storage smoke suite"
        evidence: ":1366-1375"
    flake_handling: Global launch-flake retry.
    ci: 'job.boot-test.nvme (boot-test.yml:244), --mode nvme --ram-mb 512. tier: slow'
    proves: CONFIG_BLK_DEV_NVME=m is coldplug-loaded; the isohybrid ISO is bootable as an NVMe disk.
  - id: bootmode.usb
    runner: run_usb (:1696) -> run_uefi_driver_variant; builder build_usb_cmd (:298)
    boots: ISO as USB mass storage behind qemu-xhci, UEFI/OVMF + GRUB.
    qemu: >
      qemu-system-x86_64 -drive if=pflash,...OVMF_CODE -device qemu-xhci,id=xhci
      -drive id=usbdisk,if=none,format=raw,file=ISO -device usb-storage,bus=xhci.0,drive=usbdisk -boot c
      -m <ram> -nographic -serial mon:stdio -no-reboot (:308-319). RAM 512.
    asserts:
      -
        what: "xhci_hcd loaded"
        how: "lsmod regex ^xhci_hcd\\b"
        evidence: ":1170-1181,1703"
      -
        what: "usb_storage loaded"
        how: "lsmod regex ^usb_storage\\b"
        evidence: ":1184-1195,1704"
      -
        what: "uname -r + overlay mounted"
        how: "storage smoke suite"
    flake_handling: Global launch-flake retry.
    ci: 'job.boot-test.usb (boot-test.yml:287), --mode usb --ram-mb 512. tier: slow'
    proves: The modular USB host-controller chain (xhci_hcd then usb_storage) boots the hybrid ISO as a USB stick under UEFI.
  - id: bootmode.virtio
    runner: run_virtio (:1709) -> run_uefi_driver_variant; builder build_virtio_cmd (:323)
    boots: ISO as virtio-blk-pci disk, UEFI/OVMF + GRUB.
    qemu: >
      qemu-system-x86_64 -drive if=pflash,...OVMF_CODE -drive id=vblk,if=none,format=raw,file=ISO
      -device virtio-blk-pci,drive=vblk -boot c -m <ram> -nographic -serial mon:stdio -no-reboot (:332-342). RAM 512.
    asserts:
      -
        what: "virtio_blk loaded"
        how: "lsmod regex ^virtio_blk\\b"
        evidence: ":1198-1208,1712"
      -
        what: "uname -r + overlay mounted"
        how: "storage smoke suite"
    flake_handling: Global launch-flake retry.
    ci: 'job.boot-test.virtio (boot-test.yml:330), --mode virtio --ram-mb 512. tier: slow'
    proves: CONFIG_VIRTIO_BLK=m is coldplug-loaded so the ISO boots as a paravirtual cloud-style disk.
  - id: bootmode.nicless
    runner: run_nicless (:1716); builder build_nicless_cmd (:346)
    boots: ISO -cdrom, BIOS/ISOLINUX "serial".
    qemu: >
      qemu-system-i386 -cdrom ISO -m <ram> -cpu 486 -boot d -nic none -nographic -serial mon:stdio -no-reboot
      (:357-368). RAM 64 (default and CI --ram-mb 64).
    asserts:
      -
        what: "e1000 NOT in lsmod"
        how: "regex_absent ^e1000\\b"
        evidence: ":1211-1225,1733"
      -
        what: "uname -r + overlay mounted"
        evidence: ":1734-1735"
    flake_handling: Global launch-flake retry.
    ci: 'job.boot-test.nicless (boot-test.yml:373), --mode nicless --ram-mb 64. tier: slow'
    proves: Negative control - modalias coldplug loads drivers only for present hardware, not unconditionally.
  - id: bootmode.nic
    runner: run_nic (:1895); builder build_nic_cmd (:419) = build_bios_cmd + NIC args
    boots: ISO -cdrom, BIOS/ISOLINUX "serial". Needs --nic-model (pcnet|rtl8139|tulip|ne2k_pci|ne2k_isa), else BootTestError (:423).
    qemu: >
      build_bios_cmd argv (-cpu 486 -cdrom ... -nographic) + "-net nic,model=<m> -net user" (:426). Legacy -net form
      replaces the default e1000 so exactly one card of the model exists. RAM default 256 (:2352), CI passes none.
    asserts:
      -
        what: "\"PCI models: driver module resident (pcnet32 | 8139too/8139cp | tulip | ne2k_pci)"
        how: "lsmod regex from NIC_MODEL_MODULE (:1231-1236)\""
        evidence: ":1911"
      -
        what: "ne2k_isa: (1) ne NOT loaded by coldplug, (2) `monolith-net probe` output contains 'found' (60s), (3) ne resident after"
        evidence: ":1321-1335,1909"
      -
        what: "uname -r + overlay mounted"
        evidence: ":1912-1913"
    flake_handling: Global launch-flake retry per invocation. CI runs the 5 models sequentially in ONE job in a shell loop; failures are collected (FAILED var) and job fails after all models run (boot-test.yml:563-583).
    ci: 'job.boot-test.nic-models (boot-test.yml:538); loop over pcnet rtl8139 tulip ne2k_pci ne2k_isa, logs output/boot-test-nic-<m>.log. tier: slow'
    proves: Representative legacy/PCI NIC drivers coldplug by modalias, and the ISA NE2000 (no modalias) is found by the monolith-net probe sweep.
  - id: bootmode.vga
    runner: run_vga (:1920); builder build_vga_cmd (:430) = build_bios_cmd + "-vga <model>"
    boots: 'ISO -cdrom, BIOS/ISOLINUX, label "serial vga=788". Needs --vga-model (only choice: cirrus, VGA_MODEL_MODULE :1252).'
    qemu: build_bios_cmd argv + "-vga cirrus" (:443). RAM 64.
    asserts:
      -
        what: "cirrusfb resident in lsmod (module residency, not fb0 ownership)"
        how: "regex ^cirrusfb\\b"
        evidence: ":1304-1319,1943"
      -
        what: "uname -r + overlay mounted"
        evidence: ":1944-1945"
    flake_handling: Global launch-flake retry. CI shell loop identical in shape to nic-models.
    ci: 'job.boot-test.vga-models (boot-test.yml:602), loop for m in cirrus (:632). tier: slow'
    proves: Legacy fbdev Tier-2 drivers coldplug by PCI modalias for a graphics device (one positive sample of 27 modules).
  - id: bootmode.fbdev-modprobe
    runner: run_fbdev_modprobe (:1952); builder = build_bios_cmd (MODE_BUILDERS :2314); boot helper _boot_isolinux_to_shell (:2019)
    boots: ISO -cdrom, BIOS/ISOLINUX "serial". Default VGA (QEMU std).
    qemu: Identical to bios argv. RAM 64 default, CI passes none.
    asserts:
      -
        what: "uname -r"
        evidence: ":1970"
      -
        what: "each of tdfxfb sm712fb matroxfb_base s3fb lxfb: `modprobe <m>` output has no /Oops|Kernel panic|BUG:/ (any exit code OK)"
        evidence: ":1265,1268-1284,1975-1979"
      -
        what: "/proc/sys/kernel/tainted == \"0\" exactly"
        evidence: ":1981-1984"
      -
        what: "dmesg lines added since baseline (tail -n +N in guest) contain no Oops|BUG:|WARNING:"
        evidence: ":1998-2012"
    flake_handling: _boot_isolinux_to_shell adds a throwaway "serial warmup" `true` command to absorb a known serial-read race that loses the first command's output (:2030-2035). vga16fb deliberately excluded because it coldplugs unconditionally on -vga std (:1256-1264).
    ci: 'job.boot-test.fbdev-modprobe (boot-test.yml:666), --mode fbdev-modprobe. tier: slow'
    proves: Hand-loading legacy fbdev modules with no matching hardware does not oops, taint, or warn the kernel.
  - id: bootmode.nat
    runner: run_nat (:2038); builders build_nat_router_cmd (:639) and build_nat_client_cmd (:656)
    boots: Two concurrent guests from the SAME ISO, both BIOS/ISOLINUX "serial" (via _boot_isolinux_to_shell). Router is the pexpect child from main(); client spawned inside run_nat. Needs a HOST fixture http.server on 0.0.0.0:8000 serving probe.txt containing NAT_OK_marker (started by the CI job, NOT by boot-test.py).
    qemu: >
      Router: qemu-system-i386 -cdrom ISO -m 256 -cpu 486 -boot d -nographic -serial mon:stdio -no-reboot -nic none
      -netdev user,id=wan -device e1000,netdev=wan -netdev socket,id=lan,udp=127.0.0.1:12421,localaddr=127.0.0.1:12420
      -device e1000,netdev=lan (:644-653). Client: same base, -nic none, -netdev socket,id=lan,udp=127.0.0.1:12420,
      localaddr=127.0.0.1:12421 -device e1000,netdev=lan (:659-667). Ports NAT_ROUTER_PORT 12420 / NAT_CLIENT_PORT 12421
      (:635-636). UDP socket netdev chosen because TCP listen/connect raced and left the link dead (:628-634).
      Guests reach host as 10.0.2.2 (SLIRP). RAM 256 each (:2355).
    asserts:
      -
        what: "router: `monolith-router eth0 eth1 --dhcp --yes` output contains 'DHCP+DNS up'"
        timeout_s: "60"
        evidence: ":2043-2046"
      -
        what: "router: `nft list ruleset` contains masquerade"
        evidence: ":2047-2049"
      -
        what: "router: ip_forward=1 (echoed as ipfwd=1)"
        evidence: ":2054-2057"
      -
        what: "router: dnsmasq UDP :53 bound to 192.168.99.1 and NOT to 0.0.0.0 (netstat -lnu)"
        evidence: ":2060-2067"
      -
        what: "client: hostname set via busybox, boot dhcpcd killed, fresh `dhcpcd -1 -t 30 --hostname=natclient eth0` exits 0"
        timeout_s: "45"
        evidence: ":2103-2119"
      -
        what: "client: leased address in 192.168.99.50-200"
        evidence: ":2123-2127"
      -
        what: "client: `busybox nslookup monolith.home.arpa 192.168.99.1` contains 192.168.99.1"
        evidence: ":2133-2136"
      -
        what: "client: natclient.home.arpa resolves into the lease range (DHCP option-12 hostname registered in dnsmasq zone)"
        evidence: ":2145-2149"
      -
        what: "client: curl http://10.0.2.2:8000/probe.txt through NAT returns NAT_OK_marker (poll up to 20x, 4s timeout each)"
        timeout_s: "120"
        evidence: ":2163-2168"
      -
        what: "negative control: after `monolith-router down` (output 'NAT down') curl exits 28 (RC=28)"
        evidence: ":2170-2174"
      -
        what: "diagnostics (non-gating) - ip addr/link, ping gateway, neigh, /proc/net/dev on both nodes"
        evidence: ":2096-2155"
    flake_handling: >
      Historical nat flake root-caused to a monolith-router bug (LAN gateway CIDR skipped when eth1 had a 169.254
      link-local), now fixed and unit-tested (monolith-router.test.sh test 9) (:2077-2082). drain_router() hygiene
      reads the router pty between client steps. Curl polled 20x for ARP/conntrack warm-up. Client closed with
      force in finally. Global launch-flake retry applies to the router only (client _reached_init not tracked).
    ci: 'job.boot-test.nat-router (boot-test.yml:714): starts `python3 -m http.server 8000 --bind 0.0.0.0` in /tmp/natsrv (:739-744), --mode nat, uploads output/boot-test-nat.log* (router log + .client). tier: slow'
    proves: The kernel netfilter/conntrack/NAT stack, nftables, dnsmasq (DHCP+DNS, LAN-only bind) and monolith-router work end to end between two guests, and NAT teardown really cuts access.
  - id: bootmode.gui
    runner: run_gui (:1742); builder build_gui_cmd (:372)
    boots: ISO -cdrom, BIOS/ISOLINUX label "serial vga=788" (graphical vesafb 800x600x16; plain serial label gives text mode and Xfbdev dies "no screens found", :1755-1760). BIOS only - kernel has FB_VESA not efifb.
    qemu: >
      qemu-system-i386 -cdrom ISO -m <ram> -cpu 486 -boot d -vga std -nographic -serial mon:stdio
      -qmp unix:<screendump>.qmp.sock,server,nowait -no-reboot (:404-415). Stale socket removed first (:402-403).
      RAM 128 default and CI --ram-mb 128. Screendump path via --gui-screendump (default output/gui-screendump.ppm).
    asserts:
      -
        what: "after `startx >/tmp/startx.log 2>&1 &` + sleep 8: pgrep Xfbdev, dwm, st all alive and /tmp/Xfbdev.log has no Fatal|could not open default font|giving up"
        timeout_s: "15"
        evidence: ":1784-1808"
      -
        what: "QMP screendump to PPM succeeds and >0.5% of pixels have a channel >16 (ppm_not_black, pure python P6 parser)"
        evidence: ":1444-1595,1816-1828"
      -
        what: "debug-only (non-gating) fb0 info and Xfbdev/startx log dumps to serial"
        evidence: ":1771-1795"
    flake_handling: Global launch-flake retry. Fixed sleeps (1s, 8s) rather than polling for X readiness - timing-dependent on 486 emulation. QMP used instead of HMP so it doesn't disturb the serial mux.
    ci: 'job.boot-test.gui (boot-test.yml:424), --mode gui --ram-mb 128 --gui-screendump output/gui-screendump.ppm; uploads log and PPM artifacts (:459-478). tier: slow'
    proves: startx brings up the TinyX Xfbdev + dwm + st stack on vesafb with Terminus fonts and actually paints pixels.
  - id: bootmode.stele-acid2
    runner: run_stele_acid2 (:1834); builder = build_gui_cmd (MODE_BUILDERS :2317)
    boots: Same as gui ("serial vga=788", BIOS, -vga std, QMP socket).
    qemu: Same argv as gui (:404-415). RAM 256 default and CI.
    asserts:
      -
        what: "`stele --headless --render-fb /usr/share/stele/acid2.html; echo RENDER_RC=$?` output contains RENDER_RC=0"
        timeout_s: "180"
        evidence: ":1871-1875"
      -
        what: "QMP screendump of framebuffer is not uniformly black (same ppm_not_black thresholds)"
        evidence: ":1877-1889"
    flake_handling: Global launch-flake retry. 180s render window for Acid2 CSS layout on emulated 486.
    ci: 'job.boot-test.stele-acid2 (boot-test.yml:481), --mode stele-acid2 --ram-mb 256 --gui-screendump output/stele-acid2-screendump.ppm; uploads log + PPM ("headline browser demo", :476-480). tier: slow'
    proves: The Stele browser binary runs on the target, lays out and paints Acid2 to /dev/fb0 offline, exit 0. (Gate is only exit 0 + non-black; it does NOT compare against the Acid2 reference image.)
  - id: bootmode.clock-epoch
    runner: run_clock_epoch (:543); builder build_clock_epoch_cmd (:488)
    boots: ISO -cdrom, BIOS/ISOLINUX "serial", RTC seeded at 1970-01-01T00:00:00 (CLOCK_EPOCH_RTC :463).
    qemu: build_bios_cmd argv + "-rtc base=1970-01-01T00:00:00" + "-nic none" (:505-509). RAM 64.
    asserts:
      -
        what: "/run/monolith-clock-ignorant exists (S45 monolith-time-check raised the flag)"
        how: "test -e"
        evidence: ":575-577"
      -
        what: "`date +%Y` contains 1970 (clock untouched, no correction without a time source)"
        evidence: ":578-581"
    flake_handling: 'Historic misdiagnosis recorded (:455-462): hang blamed on 1970 RTC was really a long monolith_time_url= typed at the ISOLINUX prompt; fixture-URL approach abandoned, NIC removed instead. Global launch-flake retry.'
    ci: 'job.boot-test.clock-epoch (boot-test.yml:771): still starts a host http.server on :8000 (:796-801) that the guest can NEVER reach (-nic none) - dead step. tier: slow'
    proves: A dead-RTC (epoch) clock is judged ignorant (flag raised) and not silently stomped. The fetch-and-set half is covered only by scripts/tests/monolith-time.test.sh (unit, stubbed).
  - id: bootmode.clock-1996
    runner: run_clock_1996 (:588); builder build_clock_1996_cmd (:512)
    boots: ISO -cdrom, BIOS/ISOLINUX "serial", RTC 1996-06-15T12:00:00 (:464). Default NIC kept (build_bios_cmd only), so guest has e1000+SLIRP with real-internet egress on CI runners.
    qemu: build_bios_cmd argv + "-rtc base=1996-06-15T12:00:00" (:514-516). RAM 64.
    asserts:
      -
        what: "`date +%Y` contains 1996 (not stomped to today)"
        evidence: ":614-617"
      -
        what: "/run/monolith-clock-ignorant absent"
        how: "test ! -e"
        evidence: ":618-621"
    flake_handling: Global launch-flake retry only.
    ci: 'job.boot-test.clock-1996 (boot-test.yml:824), --mode clock-1996. tier: slow'
    proves: 'Negative control - a plausible in-era clock is never judged ignorant nor corrected toward the present (invariant: trigger is demonstrated ignorance, never plausibility).'
  - id: bootmode.persist
    runner: run_persist (:2196); builder build_persist_cmd (:717) / _persist_qemu_argv (:693); helper make_persist_disk (:673); shared boot _persist_boot_to_shell (:2185)
    boots: Two sequential boots of the same ISO, BIOS/ISOLINUX label "serial persist". Host creates a 64 MB sparse file, `mkfs.ext4 -F -q -L MONOLITH_PERSIST` (needs mkfs.ext4 on host PATH, :685-690). First boot formats at build_persist_cmd; second boot reuses the file (does NOT reformat).
    qemu: >
      qemu-system-i386 -cdrom ISO -drive id=persist,if=none,format=raw,file=<persist_disk> -device
      virtio-blk-pci,drive=persist -m <ram> -cpu 486 -boot d -nographic -serial mon:stdio -no-reboot (:703-714).
      RAM 128. --persist-disk default output/monolith-persist-test.img.
    asserts:
      -
        what: "boot 1: /overlay fstype == ext4 (pure-shell /proc/mounts read printing overlay_fstype=ext4)"
        evidence: ":472-475,2220-2233"
      -
        what: "boot 1: `echo MONOLITH_PERSIST_MARK_<hex>` runs"
        evidence: ":2235-2238"
      -
        what: "boot 1: one blank prompt + sleep 1 + `sync`, then QEMU SIGKILLed via child.close(force=True) (unclean)"
        evidence: ":2252-2262"
      -
        what: "boot 2 (fresh pexpect.spawn, log to <log>.boot2): /overlay still ext4"
        evidence: ":2277-2283"
      -
        what: "boot 2: grep -qF marker /root/.bash_history -> FOUND_<marker>"
        evidence: ":2284-2287"
    flake_handling: No retry specific to this mode; boot 2 spawned outside _run_once so its init is not tracked by the launch-flake discriminator. Explicit sync is the documented durability boundary (history -a only reaches page cache).
    ci: 'job.boot-test.persist (boot-test.yml:876), --mode persist. tier: slow'
    proves: With a labeled MONOLITH_PERSIST ext4 disk, /overlay is the persistent partition and shell history appended per-prompt survives an unclean power-off across a reboot.
