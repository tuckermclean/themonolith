  - {claim: "Plan/spec docs and code comments cite .superpowers/sdd/2026-08-19-monolith-ux-pass/task-2-brief.md and docs/superpowers/specs/2026-09-17-legacy-fbdev-design.md", where: "scripts/boot-test.py:208,452,1920, boot-test.yml:768", fact: ".superpowers/ does not exist in the repo checkout (ls fails); docs/superpowers/plans/ exists. Referenced brief is unavailable.", evidence: "ls .superpowers -> no such file"}
  - {claim: "build.yml NIC-module assertion comment says boot-test NIC matrix 'only proves 6 of the 21 new symbols'", where: ".github/workflows/build.yml:316", fact: "5 models are boot-tested (pcnet, rtl8139[8139too/cp], tulip, ne2k_pci, ne2k_isa) plus default e1000; count in comment is loose. The MODULES list in the same step has 23 names, not 21.", evidence: ".github/workflows/build.yml:337-341"}
  - {claim: "README says kernel ships 3Com Vortex (CONFIG_VORTEX), Intel e100 ...", where: "README.md:167", fact: "CONFIG_VORTEX=y (built-in), CONFIG_E100=m; verify-nic-zoo-config.sh checks E100 =m but never VORTEX; build.yml module list lacks vortex (built-in).", evidence: "configs/kernel.config:1495,1545; scripts/tests/verify-nic-zoo-config.sh:12-13"}
open_questions:
  - "Real runtimes of boot modes in CI (TCG on ubuntu-latest) are unknown from the repo; only the 300 s per-milestone budget and 180 s stele render window are known. Need a CI log sample to size the rebuild's job timeouts."
  - "Is the 'serial warmup' race (first command output lost) reproducible only on storage jobs (comment :2030-2033 says 'storage jobs') yet warmup is only wired into _boot_isolinux_to_shell (fbdev-modprobe, nat) and not into run_uefi_driver_variant or run_bios? Unclear whether UEFI/bios modes are exposed to the race."
  - "ci.boot-test.expected-kernel has no guard against an empty version string; with empty --kernel-version smoke_kernel_version passes trivially. Intentional?"
  - "Whether any workflow other than build.yml (release.yml calls build.yml?) invokes boot-test.yml directly; grep shows only build.yml:562 uses it."
  - "scripts/tests/verify-router-wiring.sh greps the allowlist for usr/sbin/monolith-router while the ebuild installs via exeinto /usr/bin (per verify-rootfs-net-wiring.sh); path in the allowlist check may be vacuous - not verified against the ebuild (recipes area)."
  - "pcf-fontname.test.sh and boot-test-retry.test.sh require python3 on the PR runner; PyYAML also needed by pr-validate - are these meant to be kept given the no-Python doctrine (doctrine is for target image only)?"
  - "Which tests can be skipped for the rebuild vs kept: s3-gc.test.sh and the S3 half of sync-portage.test.sh test dead-S3 code."
