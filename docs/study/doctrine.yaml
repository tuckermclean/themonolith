  - id: T-git-dubious-ownership
    symptom: "git: 'detected dubious ownership'; agent concludes 'there is no checkout here' and redoes work."
    cause: "/workspace owned by root, runs as uid 1000; env exports GIT_CONFIG_KEY_0/VALUE_0 but GIT_CONFIG_COUNT is empty so git ignores the pair; GIT_CONFIG_GLOBAL/SYSTEM=/dev/null so the suggested git config --global fix also fails."
    fix_in_repo: "scripts/agent-git-env.sh (export GIT_CONFIG_COUNT=2 / ensure safe.directory)"
