  # ---------------- CI / release / attestation traps ----------------
  - id: T-attest-entry-workflow
    symptom: "actions/attest@v2: 'Failed to persist attestation: Invalid Argument - values do not match: build.yml != release.yml'."
    cause: "GitHub binds the Sigstore cert SAN to the workflow that ran (build.yml) but the persist API validates the ENTRY workflow (release.yml) when build.yml is a workflow_call; only manifests on a real tag."
    fix_in_repo: ".github/workflows/build.yml:18-22 push.tags ['v*.*.*'], no workflow_call; .github/workflows/release.yml:32-60 workflow_run [Build] completed, publish-only, gated on conclusion==success, event==push, head_branch startswith v"
    source: "AGENTS.md:182-185; docs/releasing.md:75-138; docs/version-pinning.md:548-559; commit dcb7ff4 (#55)"
    regression_check: null
    proposed_regression_check: "actionlint + a static check that build.yml has no workflow_call and that attest step is in a job of build.yml (fast); only a real tag exercises it (slow, manual)."
    still_relevant_in_rebuild: "yes - core constraint on how build/attest/publish are split"
    cost_when_hit: "release v0.1.0-rc1 failed once; whole build+19 boot tests passed before the failure"
