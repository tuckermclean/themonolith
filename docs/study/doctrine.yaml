decisions:
  - {id: DEC-clock-1970, decision: "Origin sentinel is the Unix epoch 1970-01-01; Y2K rejected; detection sentinels 0/1980/2000 stay.", why: "Owner mythology + misdiagnosis revert; 'Y2K is too late'.", source: "AGENTS.md:32-39; boot-test.py:463"}
  - {id: DEC-build-yml-owns-tag, decision: "build.yml triggers on v*.*.* tags and is the OIDC entry; release.yml is publish-only via workflow_run; no workflow_call on build.yml.", why: "Sigstore cert SAN binds entry workflow.", source: "docs/releasing.md:75-138; #55"}
  - {id: DEC-prerelease-never-latest, decision: "-rcN/-betaN tags publish --prerelease --latest=false; only finals become Latest; dashboard LATEST independent (sorted by attestation timestamp).", why: "GitHub API 422.", source: "docs/releasing.md:38-49; #56"}
  - {id: DEC-no-g-slash-shortcuts, decision: "Dashboard keeps only the 't' (theme) keyboard shortcut; g and / removed.", why: "Owner dislikes UI cruft.", source: "AGENTS.md:42-43; README.md:203; web/app/router.js:123; #53"}
  - {id: DEC-tag-from-source, decision: "Tag builds skip --usepkg and binpkg cache.", why: "No cached binary in a signed release.", source: "AGENTS.md:83; build.yml:285"}
  - {id: DEC-fail-closed-attestation, decision: "SLSA signing only when gate verdict pass; failed gate -> no attestation; all pillars run to completion and artifacts always written.", why: "A public attestation for a failing build would verify green.", source: "dacdfd1 body; scripts/attestation.sh:11"}
  - {id: DEC-releases-immutable-tags, decision: "Never re-push a release tag after a failed gate; fix forward on master, delete tag, re-tag. No rollback automation; supersede with a new patch.", why: "Tag immutability.", source: "docs/releasing.md:256-266"}
  - {id: DEC-semver-meaning, decision: "Patch = no change to what ships; minor = backward-compatible ISO change; major = breaking (drop i486, init, layout). Not every build gets a tag.", why: "BUILD_EPOCH bumps shouldn't force tags.", source: "docs/releasing.md:8-36"}
  - {id: DEC-iso-naming, decision: "Tag builds: themonolith-<version>.iso (no epoch/sha); others themonolith-<BUILD_EPOCH>-<sha>.iso; themonolith.iso = latest; attestation prefix attestation/<version>/ or <epoch>-<sha>/.", why: "Traceability.", source: "docs/releasing.md:51-73; scripts/build ... (commit 1282d8e)"}
  - {id: DEC-s3-public-read, decision: "Bucket themonolith public-read; dashboard at bucket root only.", why: "Verifiability without credentials.", source: "AGENTS.md:90-91; #2"}
  - {id: DEC-pin-bump-auto-merge, decision: "BUILD_EPOCH bumps auto-merge on fully-green validation (gh pr merge --squash --admin); TOOLCHAIN_EPOCH bumps are manual-dispatch, never auto-merged.", why: "Routine currency vs consequential toolchain change.", source: "specs/2026-08-12...; .github/workflows/pin-bump.yml:372-396; toolchain-bump.yml:1-30 (docs/version-pinning.md says the opposite - stale)"}
  - {id: DEC-no-s3-for-inner-loop, decision: "ISO/squashfs handoff by actions/cache keyed by run_id; validation builds write nothing to S3; binpkg store on GHCR OCI artifact.", why: "S3 egress cost.", source: "specs/2026-08-11...; #22; #46"}
  - {id: DEC-ip-family-only, decision: "IPv4 only: nft 'table ip', NF_TABLES_IPV4, -ipv6 USE; no iptables/xtables; no DNSSEC/TFTP/DHCPv6.", why: "Lean; IPv6 off in kernel.", source: "specs/2026-08-04-sp2...; specs/2026-08-06-sp3...; #14"}
  - {id: DEC-dhcp-opt-in-fail-closed, decision: "monolith-router --dhcp is off by default, requires typed 'yes' on a TTY or --yes; non-interactive without --yes exits non-zero; dnsmasq binds LAN only (bind-interfaces, except-interface WAN, local-service), stop-dns-rebind, domain home.arpa.", why: "A DHCP server on an existing LAN breaks it.", source: "specs/2026-08-06-sp3 sections 4,5"}
  - {id: DEC-no-firmware-blobs, decision: "No driver requiring runtime firmware in any tier; CONFIG_EXTRA_FIRMWARE unset; WiFi deferred pending an attestation-model decision; modinfo -F firmware must be empty for shipped modules.", why: "Attestation chain.", source: "docs/kernel-tiers.md:116-126; specs/2026-09-17...:'firmware line'"}
  - {id: DEC-tier1-broad, decision: "Tier-1 initrd manifest is deliberately broad (storage/bus controllers 1996-2026); 6 MB uncompressed triggers human review; two-initrd escape hatch is documented-not-built; CI proves mechanism (nicless negative + ahci/nvme/usb/virtio positives), not each controller.", why: "Module that never loads costs the 486 nothing.", source: "docs/kernel-tiers.md:65-151,240-261"}
  - {id: DEC-fbdev-tier2, decision: "27 legacy fbdev modules =m (Tier 2) over generic FB_VESA/FB_EFI; FB_GEODE=y is menu-gate only; FB_ASILIANT/FB_IMSTT excluded (bool needs FB=y); DDC/I2C sub-options forced off; CI proves one cirrusfb coldplug + no-taint hand modprobe.", why: "Tier-0 bar.", source: "specs/2026-09-17...; #60,#61,#62"}
  - {id: DEC-squashfs-gzip-initrd-xz, decision: "SquashFS uses gzip (fast decompression on 486); initrd compression asymmetric; (note: Phase 2 commit says initrd gzip for low-RAM decompression - RELEASE-READINESS says xz).", why: "Runtime decompression cost vs RAM.", source: "RELEASE-READINESS.md:301-303; daee55a message ('gzip initrd (8MB->32KB decompression RAM)')"}
  - {id: DEC-root-passwordless, decision: "Root has no password by default (intentional); /etc/issue states it; dropbear installed but not started (hint printed in profile.d).", why: "Live/rescue ISO.", source: "RELEASE-READINESS.md:78-92; build-rootfs.sh:297-322"}
  - {id: DEC-no-native-compiler, decision: "No sys-devel/gcc on the disc; 'developer ISO variant' left open.", why: "200-400 MB.", source: "RELEASE-READINESS.md:266-269; README.md:111"}
  - {id: DEC-perl-no-target-gentoo-perl, decision: "Perl comes from overlay monolith-perl via perl-cross (5.42.0 + perl-cross 1.6.4 strictly paired), -Uusedl -Uusethreads, no CPAN client, no irssi perl; sqlite from amalgamation (monolith-sqlite), THREADSAFE=0, OMIT_LOAD_EXTENSION; CGI.pm pure-perl rider; busybox httpd (CGI) not thttpd.", why: "Cross-hostile Configure tarpit.", source: "specs/2026-08-13...; #38; #28"}
  - {id: DEC-gui-doctrine, decision: "One GUI stack: TinyX Xfbdev (tinycorelinux/tinyx@feab72c) + minimal client libs (xorg-proto, libxcb, libX11, libXext only) + st + dwm; no Xorg, no display manager, no compositor, no autostart X, no second GUI for the 486; server built lean with 5 vendored header shims instead of client libs.", why: "Zero-dlopen, 8 MB with swap.", source: "specs/2026-08-14-gui-design.md; plans/2026-08-14-gui.md G1"}
  - {id: DEC-lazy-console, decision: "Idle gettys run a dash stub (monolith-console) that execs bash only on first keypress; boot-test wait_for_shell sends a waking newline.", why: "RAM on idle consoles.", source: "commit 1d9a3f4 (#23)"}
  - {id: DEC-lean-boot-ux, decision: "UX pass: no wizards/daemons/menus; hints print once; monolith front door lists curated tools; clock fix only on demonstrated ignorance (HTTP Date over plain http).", why: "Solid, not Red Hat.", source: "plans/2026-08-19-monolith-ux-pass.md"}
  - {id: DEC-recovery-from-artifact, decision: "When build is green but publish failed, recover from verified artifact instead of rebuilding (30-60 min).", why: "Cost.", source: "AGENTS.md:64-66"}
  - {id: DEC-stele-repin, decision: "www-client/stele is a moving upstream: REPIN each build (per-commit GitHub archive, Manifest-pinned); LICENSE=GPL-3; stele tracked at _p20260821 in world/versions.lock.", why: "Owner's own project under active development.", source: "AGENTS.md:211-212; configs/portage/versions.lock:88"}
  - {id: DEC-no-live-ebuilds, decision: "No live (-9999) ebuild may be in the build; mask eigen-9999 and anything pulled that way.", why: "Reproducibility.", source: "commit cc92b3e"}

