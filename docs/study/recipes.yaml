      pin: "Manifest monolith-st-0.9.2.tar.gz 48381 SHA512 1ca484227189d9e92ffc1092183fdc6a162da8bb41b9c18df662212d49a9551a84c3c87784ae16f2294105776b9d58983f29396bc681e367b761610bd7071b61"
      evidence: "ebuild:11; Manifest"
    build_hacks:
      - what: "PATCHES=( files/st-0.9.2-core-fonts.patch ) (964 lines): replaces entire Xft/fontconfig render layer in x.c with XLoadQueryFont / XChar2b / XDrawImageString16; config.mk drops fontconfig/freetype2/-lXft, links -lX11 -lXext -lutil -lm -lrt"
        why: "bitmap-only doctrine. Documented simplifications: single face for bold via '-medium-'->'-bold-' XLFD substitution with fallback, italic reuses regular face, codepoints > U+FFFF draw '?', ATTR_WIDE/CJK not double-width-aware."
        evidence: "ebuild:18-27; files/st-0.9.2-core-fonts.patch:1-40"
      - what: "src_prepare sed: set 'static char *font' in config.def.h to the Terminus XLFD -xos4-Terminus-Medium-R-Normal--16-160-72-72-C-80-ISO10646-1, with a grep -qF verification"
        why: "deterministic font for a flagship client instead of whatever 'fixed' resolves to; -r2 busts -r1's binpkg (which named builtin 'fixed'). Patch's own default is -misc-fixed-... (font-misc-misc), overwritten by the sed."
        evidence: "ebuild:44-57"
      - what: "src_compile overrides CC=$(tc-getCC), INCS and LIBS from cross pkg-config; LIBS uses 'pkg-config --static --libs x11 xext' + -lutil"
        why: "config.mk defaults X11INC/X11LIB to /usr/X11R6 (absent); config.mk hardcodes CC=c99 => HOST gcc (x86-64, -fcf-protection) => dies 'CPU does not support x86-64' on -march=i486; static libX11.a does not auto-pull deps so --static needed for xcb/Xau/Xdmcp"
        evidence: "ebuild:59-78"
    traps_encoded: ["Makefile hardcoded host CC", "static libX11 needs pkg-config --static", "Xft pulls freetype"]
    doctrine: [bitmap-only-no-freetype, all-static]
    deps_cut: ["Xft", "fontconfig", "freetype"]
