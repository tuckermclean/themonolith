    purpose: "dwm 6.5 ported off Xft/fontconfig, Xinerama compiled out; links only libX11 (static)."
    upstream:
      source: "https://dl.suckless.org/dwm/dwm-6.5.tar.gz -> ${P}.tar.gz"
      pin: "Manifest monolith-dwm-6.5.tar.gz 25588 SHA512 6cc3efd8d8a5e96517474fdcb1c1a6192fdf669c1bb02de6aea0a9f1a951360bf73c9576a5a0f06b00e2f839bacc304d60548d5ead0996bf46d82be4121ed248"
      evidence: "ebuild:96; Manifest"
    build_hacks:
      - what: "PATCHES=( files/dwm-6.5-core-fonts.patch ) (413 lines): drw.c/drw.h rewritten to XLoadQueryFont/XFontStruct/XChar2b/XDrawString16/XTextWidth16, Clr is XColor via XParseColor+XAllocColor; drops Xft include in dwm.c"
        why: "bitmap-only doctrine; single font, no per-glyph fallback (missing glyphs draw default_char)"
