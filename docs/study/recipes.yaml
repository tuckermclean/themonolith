  - "monolith-st/monolith-dwm/monolith-sqlite/xcb-proto are not in versions.lock; is that intentional (version-labelled, revbumped by -rN) or an oversight? binpkg-store prune says versions.lock pins are never deleted, so unlocked overlay packages can be pruned like any other."
