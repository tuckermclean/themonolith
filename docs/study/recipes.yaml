    runtime_dep_note: "RDEPEND font package intentionally commented out (ebuild:35-39); Terminus comes from media-fonts/terminus-font[pcf] in world."

  - id: ebuild.x11-wm/monolith-dwm
    path: configs/overlay/x11-wm/monolith-dwm/monolith-dwm-6.5-r2.ebuild
