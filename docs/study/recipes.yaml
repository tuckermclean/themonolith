        why: "Makefile hardcodes cc (host); XINERAMAFLAGS= drops -DXINERAMA (no libXinerama); CRITICAL: dwm's Makefile hard-assigns 'LDFLAGS = ${LIBS}', SHADOWING the env's -static, so without the command-line override dwm links DYNAMIC and fails at boot as 'dwm: not found' (exit 127 - the GUI boot-test black screen, the lone hit in static-audit's 'found 1 dynamically linked'). Command-line LDFLAGS beats config.mk and must carry the libs since link rule is '${CC} -o dwm ${OBJ} ${LDFLAGS}'. st does not need this (its Makefile references $(LDFLAGS))."
