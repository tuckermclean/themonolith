  - {claim: "scripts/tests/verify-legacy-fbdev-config.sh:43-48 says configs/kernel.config has no CONFIG_I2C line at all", where: "scripts/tests/verify-legacy-fbdev-config.sh", fact: "kernel.config:1928 contains '# CONFIG_I2C is not set'", evidence: "configs/kernel.config:1926-1929"}
  - {claim: "kernel.config is the olddefconfig-resolved config", where: "docs/kernel-tiers.md callout; ebuild:76-82", fact: "committed file has FB_MATROX_I2C=m (selects FB_DDC) yet no FB_DDC line and '# CONFIG_I2C is not set'; a true olddefconfig result would have FB_DDC=m and I2C=m. Also tail block at 3592-3600 is out of section order. So the committed file is NOT a faithful resolved config. This is exactly the staleness DCX-99 targets; build-packages.sh now re-derives it from the shipped resolved-kernel.config.gz each run.", evidence: "kernel.config:2146, 1926-1929, 3592-3600"}
  - {claim: "crossdev.lock pins cross gcc 15.3.1_p20260717", where: "configs/portage/crossdev.lock:10", fact: "kernel.config header records CONFIG_CC_VERSION_TEXT gcc 14.3.1 20260401 (Gentoo 14.4.9999), i.e. last regenerated under a GCC 14 toolchain; and the kernel patch comment says GCC 15 is the target", evidence: "kernel.config:5-7"}
  - {claim: "AGENTS.md 'initramfs busybox lacks dd and findfs'", where: "AGENTS.md", fact: "savedconfig has CONFIG_FINDFS=y (only DD is unset); the lack was a stale shipped binpkg for findfs (rootfs/init:447-450). scripts/savedconfig-cache.sh addresses the staleness", evidence: "configs/portage/savedconfig/sys-apps/busybox:240; rootfs/init:430-450"}
  - {claim: "kernel-tiers.md Tier-1 manifest table", where: "docs/kernel-tiers.md", fact: "table lists sdhci_acpi and 'sbp2'; configs/initrd-modules.txt has no sdhci_acpi and names firewire-ohci/firewire-sbp2; file also has eight pata_* add-in card modules not in the doc table", evidence: "configs/initrd-modules.txt:13-61"}
  - {claim: "kernel-tiers.md says legacy fbdev set is 'Twenty-seven .ko' from 24 symbols", where: "docs/kernel-tiers.md", fact: "table lists 27 rows incl. FB_GEODE_LX/GX/GX1, i.e. 27 =m symbols in the table but the git message says 24 symbols + FB_GEODE gate; counting detail varies. kernel.config has 27 FB_* =m excluding FB_HYPERV (FB_HYPERV=m is separate)", evidence: "docs/kernel-tiers.md fbdev table vs a53272f message"}
