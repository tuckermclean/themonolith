  - id: ebuild.x11-base/monolith-xserver
    path: configs/overlay/x11-base/monolith-xserver/monolith-xserver-1.3_p20241113-r1.ebuild
    version: "1.3_p20241113-r1"
    purpose: "TinyX/kdrive Xfbdev: static, framebuffer-native, zero-dlopen X server over /dev/fb0 (vesafb/efifb)."
    upstream:
      source: "https://github.com/tinycorelinux/tinyx/archive/${COMMIT}.tar.gz -> ${P}.tar.gz"
      pin: "COMMIT=feab72ca891bc04b18763763e15ee4e532369cdf; Manifest monolith-xserver-1.3_p20241113.tar.gz 788302 SHA512 71ca2f76ef5c04904c8f00ff83d68c5913c4c842754274ca834b01e6cd62acd7314d5ffe4f86a0a10f40c298fac4a9a72101471cf68fc6234e1bf4dbd50d8530. NOTE: xcb-proto distfile line is in x11-base/xcb-proto/Manifest, not here (cat output shows both)."
      evidence: "ebuild:20-22"
    build_hacks:
      - what: "eautoreconf in src_prepare (tinyx ships configure.ac+autogen.sh only)"
        why: "no ./configure in tarball; needs x11-misc/util-macros (16 XORG_* macros) + pkg-config"
        evidence: "ebuild:48-58"
      - what: "5 vendored server-side headers copied into include/X11 and include/X11/extensions: XShm.h, sync.h, XTest.h (server stub), Xauth.h, Xdmcp.h (from libXext 1.3.7 / libXau 1.0.11 / libXdmcp 1.1.5; MIT)"
        why: "2007-era kdrive reuses CLIENT headers that ::gentoo ships only in libX11/libXext/libXau/libXdmcp, the client stack the minimal server excludes; sub-includes all resolve from xorg-proto; server supplies implementations (or _*_SERVER_ guard blanks client body) so no client lib is linked. XTest.h is an empty stub under _XTEST_SERVER_ because the real one drags in XInput.h (libXi/libXtst). Xpoll.h deliberately absent: xorg-proto generates+installs it."
        evidence: "ebuild:60-83; files/XTest.h:1-20; AGENTS.md TinyX trap ('5 vendored server header shims, no client libs, Xpoll from xorg-proto, GCC-14 -Wno-error quartet')"
      - what: "append-flags -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types; --disable-werror"
        why: "GCC 14+ promotes these K&R-isms to hard errors independent of -Werror; this is the 'GCC-14 -Wno-error quartet'"
        evidence: "ebuild:95-102"
      - what: "append-cppflags -I${S}/include"
        why: "keep vendored headers on the search path for every subdir regardless of its own -I"
        evidence: "ebuild:103"
      - what: "append-cppflags -DKDRIVESERVER (-r1)"
        why: "shipped include/dix-config.h.in is stale: no '#undef KDRIVESERVER' placeholder, so configure's AC_DEFINE under --enable-kdrive never lands. Without it dix/dixfonts.c compiles out BuiltinRegisterFpeFunctions(), the libXfont 'built-ins' FPE is never registered, FontFile FPE mis-claims it and the server dies \"could not open default font 'fixed'\". -r1 pure revbump to rebuild after the fix."
        evidence: "ebuild:105-114; commit 26b780a"
      - what: "econf --enable-kdrive --disable-xvesa --enable-xfbdev --disable-install-setuid --disable-xdmcp --disable-xdm-auth-1 --disable-xres --disable-screensaver --disable-dbe --disable-xf86bigfont --disable-dpms --disable-werror"
        why: "Xvesa needs BIOS int10/vm86/x86emu - inherit vesafb instead; strip unused extensions; no setuid (boots as root); disable-xdmcp drops libXdmcp link"
        evidence: "ebuild:86-127"
      - what: "src_install readelf guard (no INTERP, 80386) on /usr/bin/Xfbdev; dodoc README COPYING"
        why: "all-static i486 rootfs"
        evidence: "ebuild:130-145"
    traps_encoded: ["TinyX Xfbdev static build (AGENTS.md)", "stale dix-config.h.in => KDRIVESERVER undefined => 'could not open default font fixed'", "Lesson (AGENTS.md): enumerate the whole header gap before spending another build cycle"]
    doctrine: [all-static, bitmap-only-no-freetype, 486-minimalism]
    deps_cut: ["no pixman (tinyx 1.2.0-era fb does not PKG_CHECK it)", "no libX11/libXext (server only)", "no xkb/xinput/GL/dlopen"]
    fetches_at_build: ["ext.git-github"]
    revbump_state: "AGREE: versions.lock:14 x11-base/monolith-xserver:1.3_p20241113-r1:0"
    depend: "x11-base/xorg-proto x11-libs/xtrans x11-libs/libXfont x11-libs/libfontenc sys-libs/zlib (ebuild:40-46); xtrans/libfontenc/xorg-proto pulled from ::gentoo"

  - id: ebuild.x11-libs/libXfont
    path: configs/overlay/x11-libs/libXfont/libXfont-1.5.4-r1.ebuild
    version: "1.5.4-r1"
    purpose: "libXfont v1 (::gentoo only has libXfont2, ABI/pkg-config 'xfont2' incompatible with TinyX's 'xfont') built bitmap-only with built-in fonts."
