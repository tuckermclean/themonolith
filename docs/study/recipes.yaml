  - "sys-apps/busybox savedconfig: CONFIG_MODPROBE etc. are =y but ineffective (Gentoo drops modutils for kmod). Is that dead config to keep or prune?"
  - "env/no-static-ldflags.conf is unreferenced: confirm dead and drop."
