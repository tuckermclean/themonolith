    notes: "CVE-gate note in ebuild: libXfont v1 carries historical CVEs; 'flag it if the SBOM/CVE gate trips'. Check configs/attestation/cve-policy.yaml for an exception (not read; out of scope)."

  - id: ebuild.x11-base/xcb-proto
    path: configs/overlay/x11-base/xcb-proto/xcb-proto-1.17.0.ebuild
    version: "1.17.0"
    purpose: "Data-only xcb-proto (XML + pure-python xcbgen) for cross-building libxcb with HOST python and no target python/libxml2."
    upstream:
      source: "https://xorg.freedesktop.org/archive/individual/proto/${P}.tar.xz"
      pin: "Manifest xcb-proto-1.17.0.tar.xz 151748 SHA512 34c3795e5a48a66d89b72ee1777fb0bede489d5ec07018e6c9ef3c13bdd60b0358fc2c04a1f0ed0acb5b681aeeb92033db579036e4f5edd967fe56714c03acdf (x11-base/xcb-proto/Manifest:1)"
      evidence: "ebuild in-file line 5"
    build_hacks:
      - what: "overlay shadows ::gentoo x11-base/xcb-proto (inherit python-r1, RDEPEND target python -> zstd [masked], python_optimize byte-compile, BDEPEND libxml2 [masked])"
        why: "all fatal for no-target-python cross env; xcb-proto is only data. NOTE the ebuild comment says 'priority 20 > ::gentoo' but no priority is set in layout.conf (configs/overlay/metadata/layout.conf); priority must be set in the builder's repos.conf (not in scope; ask build area)."
        evidence: "ebuild in-file lines 9-18"
      - what: "IUSE=+python_targets_python3_14 (no-op flag)"
        why: "libxcb's BDEPEND is python_gen_any_dep 'xcb-proto[${PYTHON_USEDEP}]' = xcb-proto[python_targets_python3_14]; declaring the flag satisfies the USE-dep / python_check_deps has_version match. NOTE: hard-coded to python3_14 - breaks silently if the host python target changes."
        evidence: "ebuild in-file lines 24-28"
      - what: "src_configure: PYTHON=true econf; src_compile no-op; src_install 'emake install DESTDIR=${D} SUBDIRS=src'; doins xcbgen/*.py to /usr/lib/xcb-proto/xcbgen; sed xcb-proto.pc pythondir=${pc_sysrootdir}/usr/lib/xcb-proto"
        why: "AM_PATH_PYTHON wants a python only to compute pythondir; SUBDIRS=src skips xcbgen install-pythonPYTHON (py-compile needs interpreter); libxcb finds xcbgen via pkg-config --variable=pythondir xcb-proto"
        evidence: "ebuild in-file lines 38-65"
    traps_encoded: ["X client libs cross+static: dodge the modern-X Python tar-pit with a data-only overlay xcb-proto (host-python codegen; no target python/libxml2/zstd) (AGENTS.md)"]
    doctrine: [no-python-target, 486-minimalism]
    deps_cut: ["dev-lang/python", "app-arch/zstd (masked)", "dev-libs/libxml2 (masked)"]
    fetches_at_build: ["ext.freedesktop (xorg.freedesktop.org archive)"]
    revbump_state: "NOT IN versions.lock (version-only; no -rN). Not in world; pulled by libxcb."

  - id: ebuild.x11-terms/monolith-st
    path: configs/overlay/x11-terms/monolith-st/monolith-st-0.9.2-r2.ebuild
    version: "0.9.2-r2"
    purpose: "suckless st terminal ported off Xft/fontconfig/freetype to core X11 bitmap fonts; default font Terminus."
