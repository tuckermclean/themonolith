    world_atoms: ["sys-kernel/monolith-kernel","app-misc/monolith-base","sys-apps/busybox","app-shells/bash","app-shells/dash","sys-apps/sysvinit","sys-apps/coreutils","sys-apps/util-linux","sys-apps/findutils","sys-apps/grep","sys-apps/sed","sys-apps/gawk","sys-apps/diffutils","app-arch/tar","app-text/tree","sys-libs/readline","sys-libs/ncurses","sys-libs/zlib","dev-libs/libpcre2","dev-libs/openssl","sys-apps/file","sys-apps/less","app-editors/vim","app-editors/nano","sys-apps/man-pages","app-text/mandoc","sys-devel/binutils","dev-build/make","dev-debug/strace","sys-devel/patch","dev-debug/gdb","dev-lang/lua","dev-lang/monolith-perl","app-arch/xz-utils","app-arch/bzip2","app-arch/gzip","sys-apps/iproute2","sys-apps/net-tools","net-misc/iputils","net-misc/dhcpcd","sys-apps/ethtool","net-firewall/nftables","net-dns/dnsmasq","net-misc/dropbear","net-misc/curl","net-misc/wget","net-misc/whois","net-analyzer/netcat","net-analyzer/traceroute","net-misc/iperf:3","net-dialup/ppp","www-client/lynx","mail-client/mutt","net-irc/irssi","app-misc/tmux","sys-apps/shadow","sys-process/procps","sys-process/htop","sys-process/lsof","app-admin/sysklogd","sys-process/psmisc","app-arch/cpio","<sys-fs/ncdu-2","sys-apps/pv","sys-fs/e2fsprogs","sys-fs/dosfstools","sys-fs/squashfs-tools","app-shells/zsh","app-shells/bash-completion","net-misc/rsync","sys-apps/the_silver_searcher","app-arch/zip","app-arch/unzip","net-misc/socat","net-analyzer/iftop","net-analyzer/tcpdump","net-analyzer/mtr","sys-apps/smartmontools","sys-apps/hdparm","sys-apps/dmidecode","sys-apps/kbd","media-fonts/terminus-font","dev-db/monolith-sqlite","sys-libs/gpm","games-misc/bsd-games","app-misc/figlet","app-misc/cmatrix","app-misc/sl","games-roguelike/rl144","x11-base/monolith-xserver","x11-base/xorg-proto","x11-libs/libxcb","x11-libs/libX11","x11-libs/libXext","x11-terms/monolith-st","x11-wm/monolith-dwm","www-client/stele","=games-roguelike/nethack-3.6.7-r1","sys-apps/kmod"]
    special_handling:
      - {entry: "<sys-fs/ncdu-2", why: "ncdu 2.x is written in Zig (no Zig toolchain); 1.22 last C release", evidence: "world:167-169"}
      - {entry: "=games-roguelike/nethack-3.6.7-r1", why: "pin to last 3.6.x; 5.0.0 needs lua and breaks bashrc makedefs patch; unqualified atom floated to 5.0.0 on 2026-08-02", evidence: "world:302-308"}
      - {entry: "net-misc/iperf:3", why: "also the canary for cross-gcc libatomic.a fix (8-byte atomics on -march=i486): if it builds, the Dockerfile EXTRA_ECONF fix works", evidence: "world:125-129"}
      - {entry: "sys-apps/busybox", why: "initramfs only (savedconfig); the rootfs uses GNU userland", evidence: "world:19-20"}
      - {entry: "blocked-but-wanted: bc, jq (BDEPEND bison -> gettext -> libxml2, masked)", why: "needs libxml2 meson cross-file", evidence: "world:172-175"}
      - {entry: "sys-apps/kmod", why: "modprobe/lsmod/depmod in booted GNU rootfs (busybox module applets initramfs-only; actually Gentoo busybox drops modutils for kmod regardless - build-initrd.sh:97-102)", evidence: "world:310-313"}
      - {entry: "x11 client stack: x11-base/xorg-proto x11-libs/libxcb libX11 libXext (listed for intent; libxcb/libXau/libXdmcp are transitive)", why: "dwm/st link ONLY these; no Xt/Xaw/Xmu/ICE/SM/Xft", evidence: "world:265-274"}
    notes: "Comments reference '.batteries/reports/*.md' (gdb, mtr, ethtool, nethack): that directory is not under configs/ and was not verified to exist."
  - id: cfg.portage/savedconfig/sys-apps/busybox
    path: configs/portage/savedconfig/sys-apps/busybox
    purpose: "BusyBox 1.36.1 savedconfig (1219 lines): 222 symbols =y, 805 '# ... is not set', 273 non-comment lines; STATIC=y, STATIC_LIBGCC=y, EXTRA_CFLAGS='-Os -march=i486', LFS=y, CONFIG_PREFIX=./_install; busybox is used in the INITRAMFS only."
    entries:
      - {entry: "CONFIG_STATIC=y, CONFIG_STATIC_LIBGCC=y, FEATURE_LIBBUSYBOX_STATIC not set", why: "initramfs has no loader/libs", evidence: "savedconfig:43,47,57"}
      - {entry: "CONFIG_FINDFS=y, CONFIG_MOUNT*=y (FEATURE_MOUNT_LABEL), SWITCH_ROOT=y, CAT=y, TR=y, GREP=y, FIND=y, ASH=y, MDEV=y, HTTPD=y + FEATURE_HTTPD_CGI=y, MODPROBE/INSMOD/DEPMOD/LSMOD=y, TRACEROUTE=y", why: "initramfs boot needs; HTTPD+CGI added in commit 0897866 (SP4 busybox httpd CGI)", evidence: "savedconfig grep; git log 0897866, c627319 ('give busybox find so the modalias coldplug works')"}
      - {entry: "# CONFIG_DD is not set; XARGS not set", why: "rootfs/init therefore must read labels with cat|tr|grep, not dd (AGENTS.md: 'initramfs busybox lacks dd and findfs (stale binpkg)')", evidence: "savedconfig:240,482; rootfs/init:430-450"}
    notes: "Gentoo's busybox ebuild drops modutils applets in favour of sys-apps/kmod regardless of savedconfig (build-initrd.sh:97-102), so CONFIG_MODPROBE=y etc. here are ineffective; the initramfs uses the static kmod instead. Header says generated 'Thu Mar 5 15:43:34 2026'. CONFIG_FINDFS=y in savedconfig vs AGENTS.md 'lacks findfs': the shipped binpkg was stale (savedconfig-cache.sh added to prevent recurrence)."
  - id: cfg.initrd-modules.txt
    path: configs/initrd-modules.txt
    purpose: "Tier-1 module manifest (see kernel.initrd_modules)."
    entries: []
  - id: cfg.kernel.config
    path: configs/kernel.config
    purpose: "Machine-managed resolved kernel config, Linux/i386 6.12.80 (3600 lines, 921 '=y', 100 '=m'); overwritten by the kernel ebuild's copy-back on each source build; see kernel section."
    entries: []
  - id: cfg.overlay/metadata
    path: configs/overlay/metadata/layout.conf ; configs/overlay/profiles/repo_name
    purpose: "Overlay identity: repo_name 'monolith'; layout.conf masters=gentoo, thin-manifests=true. No priority set (xcb-proto ebuild claims priority 20) and no profiles/categories file (new categories e.g. x11-terms/x11-wm are tolerated since thin repo inherits ::gentoo categories)."
    entries: []
  - id: cfg.attestation-neighbours-not-in-scope
    path: "configs/attestation/*, configs/bootbg.png, configs/themonolith.ans"
    purpose: "Present under configs/ but belong to supplychain/oracle areas. configs/themonolith.ans is an EMPTY (0 byte) file; configs/bootbg.png is a 6920-line binary PNG (boot background). Not read."
    entries: []

kernel:
  version: "Linux 6.12.80 (ARCH=i386), LOCALVERSION -i486-monolith (kernel.config:36), kernel.config header says built with 'i486-linux-musl-gcc Gentoo 14.4.9999 ... 14.3.1 20260401' and binutils 2.46 (24650)"
  summary_numbers: "3600 lines; 921 =y; 100 =m"
  tiers: >-
    Tier 0 = built-in (=y) the 486 contract: reach a shell from install media with ZERO modules. Boot media (ATA, ATA_PIIX, BLK_DEV_SR, CDROM), filesystems (ISO9660, SQUASHFS, OVERLAY_FS, TMPFS, VFAT), early userland (BLK_DEV_INITRD, DEVTMPFS(+MOUNT)), console (SERIAL_8250(+CONSOLE), FB, FB_EFI, FB_VESA), platform (ACPI for S5 poweroff used by boot-test to terminate QEMU, EFI), module machinery (MODULES, MODULE_UNLOAD). Ceiling not floor: every =y costs the smallest machine RAM forever. Do NOT add drivers to Tier 0 to fix a specific machine unless boot MEDIA unreachable. NICs, mice, sound, USB HID, graphics accelerators go in Tier 2.
    Tier 1 = initramfs modules ('reach the media'): list in configs/initrd-modules.txt, copied with dependency closure (modules.dep) into initramfs by build-initrd.sh; rootfs/init coldplugs by modalias before searching for rootfs.squashfs. Deliberately BROAD because a module that never loads costs a 486 nothing at steady state (initramfs RAM reclaimed after switch_root). Measured ~3 MB .ko uncompressed ~1.2 MB gzipped in cpio (~4 s extra on 2x CD). Budget: ~6 MB uncompressed requires human review for any PR that grows past it. Escape hatch (not built): two initrds, ISOLINUX lean + GRUB full. Firm line: NO firmware-blob drivers anywhere (breaks attestation chain) => WiFi deliberately excluded; covenant also asserted as 'CONFIG_EXTRA_FIRMWARE must not be set'.
    Tier 2 = rootfs squashfs modules (=m): everything else; modules_install into sysroot -> build-rootfs.sh -> squashfs; rcS walks /sys modalias and modprobes matches (udev-less coldplug). Phase 1 moved E1000, 8139CP, 8139TOO, MOUSE_PS2 from =y to =m and added INPUT_EVDEV=m. Later additions: NIC zoo (SP1, PR #12), netfilter =m (SP2, PR #14), Hyper-V Gen2 synthetic drivers (PR #10), 27 legacy fbdev .ko (PR #60).
    Proof model: boot-test asserts lsmod contains e1000 (smoke_nic_is_module) + eth0 DHCP lease; NIC-less negative test; four positive boot paths (AHCI, NVMe, USB, virtio); legacy fbdev via '--mode vga --vga-model cirrus' (cirrusfb). Per-controller proof deliberately NOT attempted in CI ('someone boots it on real hardware').
    Watch-item: CONFIG_TRIM_UNUSED_KSYMS=y (kernel.config:704) can make a newly-modular driver fail 'Unknown symbol' because symbols referenced only by it were trimmed; suspect first if a Tier-2 module won't load.
  tier0_confirmed_in_config:
    - "M486=y, X86_32, HIGHMEM4G=y/HIGHMEM, SMP not set (NR_CPUS=1, X86_UP_APIC), PREEMPT_VOLUNTARY, HZ_250, CC_OPTIMIZE_FOR_SIZE=y, KERNEL_GZIP=y, RD_GZIP+RD_XZ, DEFAULT_HOSTNAME=monolith (kernel.config:36-54,167-179,262,282,332,368)"
    - "EFI=y, EFI_STUB=y, EFI_HANDOVER_PROTOCOL=y, ACPI=y, PCI_GOANY (BIOS+DIRECT+MMCONFIG), ISA=y, ISAPNP=y, ISA_BUS (kernel.config:392-394,461,530-537,1178)"
    - "ATA=y, ATA_SFF/BMDMA, ATA_PIIX=y, PATA_ALI/AMD/OLDPIIX/SIS/VIA/MPIIX=y, ATA_GENERIC=y, PATA_LEGACY=y (satisfies the Tier-0 audit item in kernel-tiers.md about VIA/SiS/ALi southbridges), BLK_DEV_SR=y, BLK_DEV_SD=y, SCSI=y, SCSI_VIRTIO=y, HYPERV_STORAGE=y"
    - "FB=y, FB_VESA=y, FB_EFI=y, FB_SIMPLE=y, FRAMEBUFFER_CONSOLE=y (+LEGACY_ACCELERATION), VGA_CONSOLE=y, FONTS 8x8/8x16; DRM not set (only DRM_PANEL_ORIENTATION_QUIRKS=y)"
    - "SERIAL_8250=y (+CONSOLE, PCI, 4 UARTs), VT_CONSOLE, VIRTIO=y (PCI, legacy), VIRTIO_CONSOLE=y, VIRTIO_INPUT=y"
    - "ISO9660, SQUASHFS (ZLIB+XZ, DECOMP_SINGLE), OVERLAY_FS, VFAT, EFI_PARTITION"
    - "USB=y core, USB_HID=y, HID_GENERIC; host controllers xhci/ehci/ohci/uhci and usb-storage/uas are =m (Tier 1)"
    - "PPP=y (+BSDCOMP, DEFLATE, PPPOE, ASYNC, SYNC_TTY) built-in; INET, IP_ADVANCED_ROUTER, IP_PNP+DHCP; NETFILTER=y, NETFILTER_ADVANCED=y, NF_TABLES_IPV4=y built-in, with NF_CONNTRACK/NF_NAT/NF_TABLES/NFT_CT/NFT_NAT/NFT_MASQ/NF_DEFRAG_IPV4 =m; IPV6 not set; WIRELESS not set; SOUND not set; KVM not set; BPF_SYSCALL not set; SECURITY not set; MODULE_SIG not set; CPU_FREQ not set; PCCARD not set; I2C not set"
    - "NET_9P=y, NET_9P_FD=y, NETFS_SUPPORT=y (present; purpose not documented in-tree - open question)"
  forced_settings:
    - {symbol: "CONFIG_FB_RADEON_I2C", value: "not set", why: "bool default y => forces FB_DDC=y (tristate raised by select to selecting symbol's value) => select I2C => CONFIG_I2C=y built into bzImage, with no error or warning. Cost: radeonfb loses DDC/EDID probing, falls back to built-in mode tables or explicit video= boot param.", evidence: "kernel.config:2148; docs/superpowers/specs/2026-09-17-legacy-fbdev-design.md:133-164; AGENTS.md DDC trap; scripts/tests/verify-legacy-fbdev-config.sh want_off"}
    - {symbol: "CONFIG_FB_3DFX_I2C", value: "not set", why: "same trap (default y bool)", evidence: "kernel.config:2162"}
    - {symbol: "CONFIG_FB_CYBER2000_DDC", value: "not set", why: "same trap (default y bool)", evidence: "kernel.config:2127"}
    - {symbol: "CONFIG_FB_NVIDIA_I2C", value: "not set", why: "already defaults n; written out so a future kernel flipping the default can't re-open the hole and so the verify script has something to assert", evidence: "kernel.config:2139"}
    - {symbol: "CONFIG_FB_SAVAGE_I2C", value: "not set", why: "same as NVIDIA_I2C", evidence: "kernel.config:2155"}
    - {symbol: "CONFIG_FB_MATROX_I2C", value: "m", why: "explicitly =m (tristate) so its select of FB_DDC is =m not =y, keeping I2C modular. Listed among 'must set explicitly' sub-options in spec.", evidence: "kernel.config:2146; spec lines 122"}
    - {symbol: "CONFIG_FB_MATROX_MILLENIUM / _MYSTIQUE / _G", value: "y", why: "matroxfb builds an EMPTY .ko (no chip support) when these bool sub-options are at default n on x86", evidence: "kernel.config:2143-2145"}
    - {symbol: "CONFIG_FB_ATY_CT / CONFIG_FB_ATY_GX", value: "y", why: "atyfb chip support bools default n", evidence: "kernel.config:2151-2152"}
    - {symbol: "CONFIG_FB_SIS_300 / CONFIG_FB_SIS_315", value: "y", why: "sisfb chip support; FB_SIS already selects 300 if !315, both set so symbol list states intent", evidence: "kernel.config:2157-2158"}
    - {symbol: "CONFIG_FB_GEODE", value: "y", why: "bool menu gate with no object file (obj-$(CONFIG_FB_GEODE)+=geode/ only enters the subdir) so adds nothing to bzImage; GEODE_LX/GX/GX1 stay =m", evidence: "kernel.config:2169-2172; kernel-tiers.md"}
    - {symbol: "CONFIG_FB_TILEBLITTING", value: "y (implicit via select)", why: "the one deliberate bzImage growth of the legacy-fbdev change: tiny core helper selected by FB_S3/ARK/VT8623/MATROX, too small to modularize. kernel.config:2193 actually says '# CONFIG_FB_TILEBLITTING is not set' - contradicts docs; see contradictions.", evidence: "kernel-tiers.md; grep"}
    - {symbol: "CONFIG_FB_ASILIANT, CONFIG_FB_IMSTT, FB_VIRTUAL, FB_ARC, FB_N411, FB_METRONOME, FB_IBM_GXT4500, FB_CARMINE, FB_MB862XX, FB_OPENCORES, FB_S1D13XXX, FB_UDL, FB_SMSCUFX", value: "not set", why: "ASILIANT and IMSTT are bool with depends on (FB = y) - no =m form exists, only a Tier-0 decision; the rest are scope-excluded. verify-legacy-fbdev-config.sh asserts these stay off.", evidence: "scripts/tests/verify-legacy-fbdev-config.sh want_excluded; kernel-tiers.md"}
    - {symbol: "CONFIG_EXTRA_FIRMWARE", value: "must be unset", why: "covenant: never bake firmware blobs (attestation chain / opaque blobs)", evidence: "verify-nic-zoo-config.sh, verify-legacy-fbdev-config.sh"}
    - {symbol: "CONFIG_I2C", value: "not set (committed file line 1928 '# CONFIG_I2C is not set')", why: "invariant: I2C must never be a built-in; checked against the RESOLVED post-olddefconfig config by scripts/verify-resolved-i2c-off.sh (hard CI assertion; DCX-99). verify-legacy-fbdev-config.sh comment claims kernel.config has NO CONFIG_I2C line at all - false, see contradictions.", evidence: "kernel.config:1926-1929; verify-legacy-fbdev-config.sh:43-48"}
    - {symbol: "CONFIG_NF_CONNTRACK, NF_NAT, NF_TABLES, NFT_CT, NFT_NAT, NFT_MASQ, NF_DEFRAG_IPV4 = m; NETFILTER, NETFILTER_ADVANCED, NF_TABLES_IPV4 = y", value: "as stated", why: "SP2: NAT router (monolith-router) via nftables with modular netfilter", evidence: "kernel.config:911-920; verify-netfilter-config.sh"}
    - {symbol: "NIC zoo =m: NE2000 WD80x3 ULTRA EL3 LANCE NE2K_PCI PCNET32 TULIP 8139TOO 8139CP E100 VIA_RHINE NATSEMI SIS900 E1000 E1000E IGB R8169 SKY2 VIRTIO_NET VMXNET3 HYPERV_NET; vendor gates NET_VENDOR_{8390,AMD,3COM,INTEL,REALTEK,NATSEMI,SIS,VIA,MARVELL}=y", value: "m / y", why: "SP1 NIC zoo (Tier 2); gates must be =y or the =m symbols vanish on olddefconfig", evidence: "verify-nic-zoo-config.sh; kernel.config:1488-1610"}
    - {symbol: "Hyper-V Gen2: FB_HYPERV=m, HID_HYPERV_MOUSE=m, HYPERV_NET=m, HYPERV_BALLOON=m (plus HYPERV=y, HYPERV_TIMER=y, HYPERV_STORAGE=y, HYPERV_KEYBOARD=y, HYPERV_IOMMU=y)", value: "m", why: "frozen-console fix on Hyper-V Gen2 (hyperv_fb); on QEMU no VMBus devices so they never load; needs real-hardware validation", evidence: "commit ab8705c; kernel.config:1324,1731,1822,2179,2308,2518-2520,2592"}
    - {symbol: "CONFIG_INPUT_EVDEV m; MOUSE_PS2 m", value: "m", why: "Phase 1 modularization (Tier 2)", evidence: "kernel.config:1752; kernel-tiers.md"}
  initrd_modules:
    source: "configs/initrd-modules.txt (61 lines; header says one module per line, '-' and '_' interchangeable, copied with dependency closure resolved from modules.dep by build-initrd.sh, coldplugged by modalias in rootfs/init before searching for rootfs.squashfs; host controllers/libata/scsi_mod are Tier-0 and deliberately absent)"
    modules_by_group:
      ahci_and_pre_ahci_sata: [ahci, sata_sil, sata_via, sata_nv, sata_promise]
      nvme: [nvme]
      usb_host_and_storage: [xhci-pci, ehci-pci, ohci-pci, uhci-hcd, usb-storage, uas]
      virtio: [virtio_blk, virtio_scsi]
      mmc_sd: [sdhci, sdhci-pci, mmc_block]
      sas_raid: [mptspi, mptsas, mpt3sas, megaraid_sas]
      pata_addin_cards: [pata_cmd64x, pata_hpt366, pata_hpt37x, pata_artop, pata_serverworks, pata_sil680, pata_it821x, pata_jmicron]
      firewire: [firewire-ohci, firewire-sbp2]
    count: 31
    drift_vs_doc: "kernel-tiers.md manifest table lists sdhci_acpi and generic 'sbp2'; file has neither sdhci_acpi nor sbp2 (has firewire-sbp2). Also doc lists no pata_* add-in cards but file has 8. Config/file are the fact."
    tier1_config_tail: "kernel.config:3592-3600 carries a trailing block of NVME_CORE=m, VIRTIO_SCSI=m, MMC_BLOCK=m, MMC_SDHCI=m, MMC_SDHCI_PCI=m, FIREWIRE_OHCI=m, FIREWIRE_SBP2=m appended after the normal section ordering - evidence of hand-appended symbols that olddefconfig did not reorder (the file is NOT purely olddefconfig output)."

rootfs_files:
  - {file: monolith-net, installs_to: /usr/bin/monolith-net, purpose: "POSIX sh; bring up pre-PnP ISA NICs (3c509 self-ids; ne/wd/lance need io=); subcommands status/probe; MONOLITH_NET_SYSCLASS override; unit test scripts/tests/monolith-net.test.sh"}
  - {file: which, installs_to: /usr/bin/which, purpose: "POSIX-sh which (-a); GNU which fails on musl, busybox not in rootfs"}
  - {file: startx, installs_to: /usr/bin/startx, purpose: "kills gpm, requires /dev/fb0, starts Xfbdev :0 -fb /dev/fb0 -fp /usr/share/fonts/monolith,/usr/share/fonts/terminus,built-ins, waits up to ~10s for X0 socket, runs dwm then one st; font-path order is the alias tiebreaker (monolith alias first reclaims fixed/variable for Terminus; built-ins LAST only for cursor font); build-rootfs.sh verifies each aliased XLFD exists in terminus fonts.dir"}
  - {file: monolith, installs_to: /usr/bin/monolith, purpose: "front-door command: help / help <topic> / tools, reads topic texts from MONOLITH_SHARE (default /usr/share/monolith); unit test monolith.test.sh"}
  - {file: monolith-router, installs_to: /usr/sbin/monolith-router, purpose: "one-command IPv4 NAT router: ip_forward + nftables table monolith_router masquerade/forward; up/down/status, optional --dhcp via dnsmasq (default LAN 192.168.99.1/24, domain home.arpa); env MONOLITH_LAN_CIDR, MONOLITH_NET_SYSCLASS, MONOLITH_IP_FORWARD, MONOLITH_RUN_DIR; test monolith-router.test.sh (link-local flake fixed per AGENTS.md)"}
  - {file: monolith-console, installs_to: /usr/sbin/monolith-console, purpose: "#!/bin/dash lazy autologin stub run by agetty -n -l on tty1, tty2, ttyS0; blocks on read until Enter then execs interactive bash; sets HOME=/root USER=root LOGNAME=root because agetty -n skips login(1); boot-test wait_for_shell sends newline to wake it"}
  - {file: monolith-advisory-check, installs_to: /usr/sbin/monolith-advisory-check, purpose: "run from /etc/init.d/S50advisory after network; fetches revocation status for BUILD_TAG in /etc/monolith-release from ADVISORY_BASE_URL (default https://themonolith.s3.amazonaws.com - DEAD: AWS S3 account disabled) and writes /run/monolith-advisory; POSIX sh, silent on failure"}
  - {file: monolith-time, installs_to: /usr/sbin/monolith-time, purpose: "set clock from plain-HTTP Date header (not https: dead RTC at epoch makes openssl reject all certs); URL from arg or MONOLITH_TIME_URL; never judges plausibility"}
  - {file: monolith-time-check, installs_to: /usr/sbin/monolith-time-check, purpose: "gate run from /etc/init.d/S45monolith-time (after S40network, before S50advisory); acts only on demonstrated ignorance: SENTINELS='0 315532800 946684800' (1970, 1980, 2000); writes /run/monolith-clock-ignorant when it cannot fix; test monolith-time-check.test.sh"}
  - {file: monolith-persist, installs_to: /usr/sbin/monolith-persist, purpose: "manual tool: 'init <dev> [--swap N] [--yes]' mkfs.ext4 -L MONOLITH_PERSIST with one confirmation naming the device; optional swapfile at /overlay/swapfile; nothing runs it automatically; test monolith-persist.test.sh"}
  - {file: guestbook.cgi, installs_to: /usr/lib/cgi-bin/guestbook.cgi, purpose: "perl+CGI.pm guestbook fixture shelling out to sqlite3 CLI (INSERT then SELECT round trip); GUESTBOOK_DB default /tmp/guestbook.db; boot-test smoke_guestbook; LAMP-invariant proof"}
  - {file: topics/*.txt (dev gui games network persist tools verify web = 8 files)", installs_to: /usr/share/monolith/<topic>.txt, purpose: "curated text for 'monolith help <topic>' / 'monolith tools'; plain text never generated"}
  - {file: 20-persist.sh, installs_to: /etc/profile.d/20-persist.sh, purpose: "STATUS-group login line 'persist: mounted (N MB free)' / 'persist: none ...'; prints every login by design; POSIX guarded; test monolith-persist-profile.test.sh"}
  - {file: 30-clock-hint.sh, installs_to: /etc/profile.d/30-clock-hint.sh, purpose: "STATUS-group; prints only while /run/monolith-clock-ignorant exists; interactive-only; single stat"}
  - {file: 40-advisory.sh, installs_to: /etc/profile.d/40-advisory.sh, purpose: "ACTIONABLE-group; prints security warning while /run/monolith-advisory exists, reads /etc/monolith-release"}
  - {file: 50-persist-history.bash, installs_to: /etc/bash/bashrc.d/50-persist-history.bash, purpose: "incremental history append / persisted HISTFILE wiring in bashrc.d so stock bashrc cannot clobber PROMPT_COMMAND; test monolith-persist-bashrc.test.sh"}
  - {file: 60-monolith-cnf.bash, installs_to: /etc/bash/bashrc.d/60-monolith-cnf.bash, purpose: "command_not_found_handle: \"<cmd>: not on the disc. 'monolith tools' lists what is.\" return 127; test monolith-cnf.test.sh"}
  - {file: 99-monolith-square.bash, installs_to: /etc/bash/bashrc.d/99-monolith-square.bash, purpose: "prepends dark-grey square to PS1 if not already present (runs last after 10-gentoo-color.bash sets PS1)"}
  - {file: "NOT in this dir but referenced: 50-dropbear-hint.sh, /etc/init.d/S40network, S45monolith-time, S50advisory, /etc/inittab, /etc/profile, /etc/monolith-release, rcS, rootfs/init", installs_to: "generated by scripts/build-rootfs.sh / rootfs/ skeleton", purpose: "owned by the factory area; ownership/attestation via configs/attestation/unowned-allowlist.yaml"}

contradictions:
