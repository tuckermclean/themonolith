area: build
repo_head: b9f533b
notes_on_method:
  - All files in scope read in full. Ran scripts/tests/{binpkg-store,ghcr-gc,s3-gc,savedconfig-cache,sync-portage,pcf-fontname,verify-resolved-i2c-off}.test.sh - all report ALL PASS (no network used).
  - No docker run in this repo uses --privileged, --cap-add, --device or --user (grep of Makefile; DOCKER_RUN at Makefile:112-128). Everything runs as container root (default uid 0, default caps incl. MKNOD) so host output/ files are root-owned.
  - There is NO multi-stage Dockerfile. The Dockerfile has exactly one stage (base-tools). The "final" image monolith-builder is produced by `docker commit` of a crossdev container in the Makefile (build-image), not by Dockerfile.

dataflow:
  summary: >
    Docker Hub gentoo/stage3:amd64-openrc-$TOOLCHAIN_EPOCH -> Dockerfile base-tools (emerge-webrsync --revert=$TOOLCHAIN_EPOCH from upstream, host tools,
    syft/grype, rustup nightly, portage overlay config) -> `docker run` crossdev + `docker commit` = image monolith-builder (label base-tools-hash) ->
    pushed to ghcr.io/tuckermclean/monolith-builder:{TOOLCHAIN_EPOCH-DOCKERFILE_HASH,TOOLCHAIN_EPOCH,latest} (+ -base-tools twin).
    Separately: portage snapshot gentoo-$BUILD_EPOCH.tar.xz(+.gpgsig,+.md5sum) fetched on HOST from S3 then upstream into output/portage-mirror/snapshots,
    served by python http.server inside the builder container, emerge-webrsync --revert=$BUILD_EPOCH -> volume monolith-repos (/var/db/repos).
    Then build-packages: cross-emerge world (versions.lock pins) with --buildpkg --usepkg --keep-going -> gpkgs in output/packages (PKGDIR=/output/packages),
    kernel bzImage copied to output/vmlinuz, live sysroot rsynced to output/sysroot, resolved kernel config gunzipped to configs/kernel.config (rw bind mount).
    build-rootfs: output/sysroot -> /rootfs-build (+generated /etc, init.d) -> mksquashfs -> output/themonolith-$BUILD_VERSION.squashfs.
    build-initrd: busybox+kmod+rootfs/init+tier-1 modules from sysroot -> cpio newc | gzip -9 -n -> output/themonolith-$BUILD_VERSION.initrd.
    build-iso: vmlinuz + initrd + squashfs + isolinux + grub-mkstandalone BOOTX64.EFI + efi.img -> xorriso -> python GPT-type patch -> output/themonolith-$BUILD_VERSION.iso.
  artifacts:
    - name: gentoo/stage3 base image
      path_or_ref: docker.io/gentoo/stage3:amd64-openrc-${TOOLCHAIN_EPOCH}
      produced_by: ext.dockerhub
      cached_or_published: pulled by docker daemon each fresh build; NOT digest-pinned (tag only; STAGE3_DIGEST env is forwarded to attestation but never set in Makefile/Dockerfile)
      evidence: Dockerfile:30
    - name: toolchain portage tree baked in image
      path_or_ref: /var/db/repos/gentoo inside base-tools layer (emerge-webrsync --revert=$TOOLCHAIN_EPOCH)
      produced_by: docker.base-tools RUN
      cached_or_published: docker layer cache (buildx --cache-from/--cache-to type=inline), ghcr base-tools image
      evidence: Dockerfile:74
    - name: base-tools image
      path_or_ref: local tag monolith-builder-base-tools ; ghcr.io/tuckermclean/monolith-builder-base-tools:{REGISTRY_TAG,TOOLCHAIN_EPOCH,latest}
      produced_by: make.build-image (docker buildx build --target base-tools)
      cached_or_published: ghcr (push-image)
      evidence: Makefile:277-283,345-350
    - name: builder image (monolith-builder)
      path_or_ref: local tag monolith-builder ; ghcr.io/tuckermclean/monolith-builder:{REGISTRY_TAG,TOOLCHAIN_EPOCH,latest}
      produced_by: docker commit of container monolith-crossdev-build after crossdev; label base-tools-hash=COMBINED_HASH
      cached_or_published: ghcr (push-image); skip-rebuild keyed on label equality
      evidence: Makefile:295-325,339-344
    - name: portage snapshot tarball + gpgsig + md5sum
      path_or_ref: output/portage-mirror/snapshots/gentoo-$BUILD_EPOCH.tar.xz{,.gpgsig,.md5sum}
      produced_by: script.sync-portage fetch-only (host) - from s3://$S3_BUCKET/portage-snapshots/ then https://distfiles.gentoo.org/snapshots
      cached_or_published: S3 (archived back after upstream fetch); local dir output/portage-mirror (bind-mounted ro-ish at /var/monolith-portage-mirror)
      evidence: scripts/sync-portage.sh:25-73; Makefile:380-389
    - name: runtime portage tree
      path_or_ref: docker volume monolith-repos mounted at /var/db/repos
      produced_by: script.sync-portage webrsync-local (emerge-webrsync, GPG verified by portage, GENTOO_MIRRORS=http://127.0.0.1:8899 only)
      cached_or_published: docker volume only (CI behaviour is in workflows area)
      evidence: scripts/sync-portage.sh:80-99; Makefile:79-81
    - name: distfiles
      path_or_ref: docker volume monolith-distfiles at /var/cache/distfiles
      produced_by: portage fetches during emerge (source tarballs, kernel tarball linux-$KVER.tar.xz)
      cached_or_published: docker volume only; Dockerfile `rm -rf /var/cache/distfiles/*` after each emerge layer
      evidence: Makefile:80,101
    - name: binary packages (gpkg)
      path_or_ref: output/packages/<CAT>/<PN>/<PN>-<PVR>-<BUILDID>.gpkg.tar (PKGDIR=/output/packages, BINPKG_FORMAT=gpkg, BINPKG_COMPRESS=xz) + Packages index
      produced_by: script.build-packages (--buildpkg, and quickpkg of preinstalled sysroot pkgs)
      cached_or_published: GHCR OCI artifact ghcr.io/<owner>/monolith-binpkgs:<BUILD_EPOCH> via script.binpkg-store pull/prune/pack/push (previously S3 packages/<epoch>/); make restore-cache still does aws s3 sync s3://$S3_BUCKET/packages/$BUILD_EPOCH/
      evidence: configs/portage/make.conf:44,58-62; scripts/binpkg-store.sh; Makefile:368-377
    - name: savedconfig marker
      path_or_ref: output/packages/sys-apps/busybox/.savedconfig.sha256
      produced_by: script.savedconfig-cache mark
      cached_or_published: travels inside binpkgs tarball
      evidence: scripts/savedconfig-cache.sh:73,92
    - name: build logs and failed list
      path_or_ref: output/logs/emerge-parallel.log, output/logs/*.build.log, output/.failed-packages, output/.built-packages, output/portage-logs/ (LOGS_MOUNT /var/log/portage)
      produced_by: script.build-packages
      cached_or_published: local only (workflows upload)
      evidence: scripts/build-packages.sh:18-22,236,270-280
    - name: kernel bzImage
      path_or_ref: output/vmlinuz (unversioned; copied from /usr/i486-linux-musl/boot/vmlinuz via cp -L)
      produced_by: script.build-packages after emerge (package sys-kernel/monolith-kernel, ebuild in overlay)
      cached_or_published: build-iso prefers output/themonolith-$BUILD_VERSION.vmlinuz if present (CI renames), else output/vmlinuz
      evidence: scripts/build-packages.sh:326-338; scripts/build-iso.sh:22-29
    - name: sysroot export
      path_or_ref: output/sysroot/ (rsync of /usr/i486-linux-musl/ minus headers/pkgconfig/crt/libc.a etc)
      produced_by: script.build-packages (inline) OR script.extract-packages (emerge --usepkgonly alt path)
      cached_or_published: local; consumed by build-rootfs, build-initrd, attestation
      evidence: scripts/build-packages.sh:340-380; scripts/extract-packages.sh:109-135
    - name: resolved kernel config
      path_or_ref: package content /usr/share/monolith-kernel/resolved-kernel.config.gz in sysroot -> gunzipped to configs/kernel.config (REPO working tree via rw CONFIGS_MOUNT)
      produced_by: script.build-packages (hard-fails if missing)
      cached_or_published: consumed by script.verify-resolved-i2c-off; excluded from squashfs by rsync --exclude
      evidence: scripts/build-packages.sh:423-432; scripts/build-rootfs.sh:72
    - name: rootfs-build tree
      path_or_ref: /rootfs-build inside container (ephemeral)
      produced_by: script.build-rootfs
      cached_or_published: none
    - name: squashfs
      path_or_ref: output/themonolith-$BUILD_VERSION.squashfs (gzip, 128K blocks, -no-xattrs, -noappend)
      produced_by: script.build-rootfs
      evidence: scripts/build-rootfs.sh:723-729
    - name: initrd
      path_or_ref: output/themonolith-$BUILD_VERSION.initrd (cpio newc | gzip -9 -n)
      produced_by: script.build-initrd
      evidence: scripts/build-initrd.sh:353
    - name: ISO
      path_or_ref: output/themonolith-$BUILD_VERSION.iso (ISO inner names boot/vmlinuz, boot/initrd.img, rootfs.squashfs, isolinux/*, EFI/BOOT/BOOTX64.EFI, boot/efi.img, boot/grub/bootbg.png; volume label MONOLITH)
      produced_by: script.build-iso
      evidence: scripts/build-iso.sh:97-100,350-357,397-421
  run_order_for_make_all: "all: build-image sync-portage build-packages build-rootfs iso (Makefile:445). build-rootfs target runs build-rootfs.sh then build-initrd.sh as two separate docker runs (Makefile:435-437). `extract` is NOT in `all`."

pins:
  - thing: TOOLCHAIN_EPOCH (stage3 tag + baked toolchain portage tree)
    value: "20260810"
    evidence: Dockerfile:28
    bumped_by: scripts/update-build-pins.sh update-toolchain [YYYYMMDD] (workflow toolchain-bump.yml); NOT exposed as a make target
  - thing: BUILD_EPOCH (runtime portage snapshot; drives default BUILD_VERSION and SOURCE_DATE_EPOCH)
    value: "20260811"
    evidence: Dockerfile:29
    bumped_by: scripts/update-build-pins.sh update [YYYYMMDD] (make update-build-pins; workflow pin-bump.yml). Makefile reads it with grep '^ARG BUILD_EPOCH=' Dockerfile (Makefile:23)
  - thing: ENV SOURCE_DATE_EPOCH (= BUILD_EPOCH midnight UTC)
    value: "1786406400 (verified = 2026-08-11T00:00:00Z)"
    evidence: Dockerfile:37
    bumped_by: update-build-pins.sh cmd_update via sed + date_to_epoch (lines 'ENV SOURCE_DATE_EPOCH=')
  - thing: versions.lock (per world package category/pkg:version:slot)
    value: "e.g. sys-kernel/monolith-kernel:6.12.80-r8:0 ; sys-devel/binutils:2.46.1:2.46"
    evidence: configs/portage/versions.lock; consumed scripts/build-packages.sh:160-166 (atom =pkg-VERSION), extract-packages.sh:56-72, Makefile:31,39
    bumped_by: scripts/update-versions.sh update (make update-versions; depends on sync-portage); workflow regen-pins.yml
  - thing: crossdev.lock (musl, gcc)
    value: "sys-libs/musl:1.2.6:0 ; sys-devel/gcc:15.3.1_p20260717:15 (header says regenerated from stage3 20260727, i.e. lags TOOLCHAIN_EPOCH 20260810)"
    evidence: configs/portage/crossdev.lock:1-9; Makefile:37-38
    bumped_by: update-build-pins.sh update_crossdev_lock, only called from update-toolchain, queries local monolith-builder image (one epoch behind)
  - thing: Rust nightly
