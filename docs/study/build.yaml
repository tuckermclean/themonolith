components:
  # ---------------------------------------------------------------- MAKE
  - id: make.build-image
    kind: make-target
    path: Makefile
    purpose: Obtain builder image monolith-builder - pull from GHCR if present else build base-tools via buildx, run crossdev in a named container, docker commit.
    prerequisites: [ensure-dirs]
    invokes: [docker.base-tools]
    invoked_by: [make.push-image, make.all, make.bump-pins, wf.build]
    inputs:
      - {what: "ghcr image $(REGISTRY_IMAGE):$(REGISTRY_TAG) and -base-tools twin", from: ext.ghcr, evidence: "Makefile:269-272"}
      - {what: "Dockerfile, configs/portage/crossdev.lock, versions.lock (binutils, kernel major.minor)", from: repo, evidence: "Makefile:28-40,284-286"}
      - {what: "gentoo/stage3 tag + upstream portage snapshot (emerge-webrsync in Dockerfile)", from: "ext.dockerhub, ext.gentoo-distfiles", evidence: "Dockerfile:30,74"}
    outputs:
      - {what: "local images monolith-builder-base-tools and monolith-builder", to: local docker, evidence: "Makefile:282,321"}
      - {what: "crossdev logs", to: "output/portage-logs/ via LOGS_MOUNT", evidence: "Makefile:296"}
    docker_flags: "buildx build --target base-tools --cache-from [ghcr base-tools if REGISTRY] --cache-from local base-tools --cache-to type=inline (Makefile:277-283); crossdev step is `docker run --name monolith-crossdev-build` with ONLY the portage-logs mount: no configs/distfiles/portage volumes, no --rm, no --privileged (Makefile:295-297)"
    secrets: []
    external: [ext.ghcr, ext.dockerhub, ext.gentoo-distfiles, ext.gentoo-mirrors, ext.rustup, ext.github-api]
    pins: [{thing: TOOLCHAIN_EPOCH, value: "20260810", evidence: "Makefile:28"}, {thing: crossdev musl/gcc/binutils/headers, value: from lock files, evidence: "Makefile:303-309"}]
    env: [REGISTRY (default ghcr.io/tuckermclean), TOOLCHAIN_EPOCH, BUILD_EPOCH, CROSS_TARGET (image ENV)]
    s3_coupling: none
    notes:
      - "Registry pull failure is swallowed: `docker pull ... 2>/dev/null` falls through to a LOCAL BUILD with only an echo (Makefile:269,275). Because the TOOLCHAIN_EPOCH snapshot has been pruned upstream, that local build now fails (AGENTS.md time-bomb) - so a GHCR miss turns into a hard failure with a misleading message."
      - "The -base-tools pull is `|| true` best effort (Makefile:271-272); if it fails the later local-build path uses stale/absent BASE_TOOLS_IMAGE."
      - "Crossdev script inlines `emerge --update --newuse cross-$CROSS_TARGET/gcc` after crossdev, then rm distfiles and mkdir of /usr/$CROSS_TARGET/etc/portage/{package.use,package.accept_keywords,package.mask,package.env,env} and /build /configs /output /initrd (Makefile:311-315)."
      - "Mask line `=cross-%s/gcc-14.4.9999` is stale (gcc pin is 15.x) and only blocks a 14.x live ebuild (Makefile:299-301). musl-9999 and binutils-9999 live ebuilds masked; musl $(CROSS_MUSL_VER)* explicitly unmasked."
      - "Skip-rebuild cache key (base-tools-hash label) does not include the inline bash -c crossdev script text, so editing the crossdev command in the Makefile does not trigger a rebuild (Makefile:284-290)."
      - "docker commit of a container is not reproducible (timestamps, layer digests) so image identity = label hash, not content."
      - "Final image sets ENV BUILD_DIR=/build CONFIGS_DIR=/configs OUTPUT_DIR=/output via --change (Makefile:317-319); build-packages.sh later `unset BUILD_DIR` because multilib-minimal.eclass breaks on it."
      - "After docker commit the committed image has NO ENTRYPOINT/CMD change; helper stages rely on /scripts bind mounts at runtime."
    rebuild_notes:
      - "Keep the two-pin split (toolchain vs runtime tree) and the registry tag keyed on everything-but-runtime-pins."
      - "Replace docker-commit-of-crossdev with a proper multi-stage Dockerfile if possible; the commit trick exists only to capture portage logs on the host."
      - "Needs a mirrored toolchain snapshot (or a digest-pinned prebuilt builder) - upstream snapshot is gone."

  - id: make.push-image
    kind: make-target
    path: Makefile
    purpose: Tag and push monolith-builder and monolith-builder-base-tools to GHCR as :REGISTRY_TAG, :TOOLCHAIN_EPOCH, :latest.
    prerequisites: [build-image]
    invokes: [make.build-image]
    invoked_by: [wf.build]
    inputs: [{what: local images, from: make.build-image, evidence: "Makefile:339-347"}]
    outputs: [{what: 6 tags (3 per image)", to: ext.ghcr, evidence: "Makefile:342-350"}]
    docker_flags: none (docker tag/push; login done by caller)
    secrets: []
    external: [ext.ghcr]
    s3_coupling: none
    notes:
      - "Overwrites floating tags :latest and :TOOLCHAIN_EPOCH every push; only :REGISTRY_TAG is content-addressed by Dockerfile hash. :TOOLCHAIN_EPOCH is mutable if Dockerfile changes within the same toolchain epoch."
      - "Errors when REGISTRY empty (Makefile:335-338)."
      - "ghcr-gc.sh only GCs monolith-binpkgs, not monolith-builder tags: builder images accumulate."
    rebuild_notes: ["Prefer digest references for consumers; keep a human tag for browsing."]

  - id: make.pull-image
    kind: make-target
    path: Makefile
    purpose: Pull builder image by REGISTRY_TAG and retag locally as monolith-builder (+ base-tools best effort).
    prerequisites: []
    invoked_by: [make.restore-cache, wf.build, wf.attestation-jobs]
    outputs: [{what: local tag monolith-builder, to: docker, evidence: "Makefile:359-362"}]
    external: [ext.ghcr]
    s3_coupling: none
    notes: ["Hard failure if image tag missing (this is why REGISTRY_TAG excludes BUILD_EPOCH; Makefile:50-62 comment)."]

  - id: make.print-registry-tag
    kind: make-target
    path: Makefile
    purpose: Echo REGISTRY_TAG so workflows do not re-derive the Dockerfile hash.
    evidence: Makefile:330-331
    s3_coupling: none

  - id: make.restore-cache
    kind: make-target
    path: Makefile
    purpose: Local equivalent of CI cache restore - pull image, sync portage, aws s3 sync binpkgs.
    prerequisites: [ensure-dirs, ensure-volume]
    invokes: [make.pull-image, make.sync-portage]
    inputs: [{what: "s3://$S3_BUCKET/packages/$BUILD_EPOCH/", from: ext.aws-s3, evidence: "Makefile:377"}]
    outputs: [{what: output/packages/, to: local, evidence: "Makefile:377"}]
    external: [ext.aws-s3, ext.ghcr]
    s3_coupling: hard
    notes:
      - "Dead: binpkg store moved from S3 to GHCR (scripts/binpkg-store.sh) but this target was not updated; it uses --no-sign-request (public-read bucket) so would fail on a disabled account."
      - "Comment says 'AWS credentials in env' but command is anonymous (Makefile:366 vs 377)."
    rebuild_notes: ["Replace with binpkg-store.sh pull; drop S3_BUCKET."]

  - id: make.sync-portage
    kind: make-target
    path: Makefile
    purpose: Two-step runtime portage sync - host fetch of the pinned snapshot into output/portage-mirror, then in-container emerge-webrsync from a local http server.
    prerequisites: [ensure-volume, ensure-dirs]
    invokes: [script.sync-portage]
    invoked_by: [make.update-versions, make.restore-cache, make.all, wf.build, wf.pin-bump]
    inputs:
      - {what: "gentoo-$BUILD_EPOCH.tar.xz(.gpgsig)", from: "ext.aws-s3 then ext.gentoo-distfiles (via script)", evidence: "Makefile:386"}
    outputs:
      - {what: "volume monolith-repos populated", to: docker volume, evidence: "Makefile:388-389"}
    docker_flags: "DOCKER_RUN (all standard mounts) + -v output/portage-mirror:/var/monolith-portage-mirror (read-write; SNAP_MOUNT Makefile:381) + -e BUILD_EPOCH -e SYNC_MIRROR_DIR. Step 1 runs ON THE HOST with `sh scripts/sync-portage.sh fetch-only` (needs aws cli + wget on host)."
    env: [BUILD_EPOCH, S3_BUCKET (exported to host script only via environment; NOT passed with -e into the container), SYNC_MIRROR_DIR]
    secrets: [AWS credentials implicit (secret.AWS_* in workflows area)]
    external: [ext.aws-s3, ext.gentoo-distfiles]
    s3_coupling: hard
    notes:
      - "Hard-coupled for the pinned epoch in practice: S3 is the only place the pinned snapshot is still available because upstream prunes old snapshots; the upstream fallback only works for a fresh/recent epoch."
      - "S3_BUCKET=themonolith default comes from Makefile:67 and is exported to child processes only if the Make variable is exported; Make does NOT export it by default, so on a developer host fetch-only sees S3_BUCKET only if it is set in the caller environment (Makefile:386 passes only SYNC_MIRROR_DIR and BUILD_EPOCH explicitly). CI sets it via env."
    rebuild_notes:
      - "Keep the idea: pin a snapshot by content (store it where you control), serve over loopback http so emerge-webrsync cannot drift to upstream."
      - "Mirror target must be something other than S3."

  - id: make.build-packages
    kind: make-target
    path: Makefile
    purpose: Run scripts/build-packages.sh in the builder container.
    prerequisites: [ensure-volume, ensure-dirs]
    invokes: [script.build-packages]
    invoked_by: [make.all, wf.build]
    docker_flags: "DOCKER_RUN: --rm, -v configs:/configs (rw), -v output:/output (rw), -v scripts:/scripts:ro, -v rootfs:/rootfs:ro, -v output/portage-logs:/var/log/portage, -v monolith-build:/build, -v monolith-repos:/var/db/repos, -v monolith-distfiles:/var/cache/distfiles, -e JOBS -e LOAD_AVG -e MONOLITH_USEPKG (Makefile:93-116,76). No --privileged, no tty."
    env: [JOBS (default nproc), LOAD_AVG (default nproc), MONOLITH_USEPKG (default y)]
    s3_coupling: none
    notes: ["build-packages-resume is identical but passes --resume (Makefile:397-399)."]

  - id: make.build-packages-resume
    kind: make-target
    path: Makefile
    purpose: build-packages.sh --resume (skip entries listed in output/.built-packages).
    invokes: [script.build-packages]
    s3_coupling: none
    evidence: Makefile:397-399

  - id: make.extract
    kind: make-target
    path: Makefile
    purpose: Install binpkgs with emerge --usepkgonly into the sysroot and rsync to output/sysroot (alternative to the inline export done by build-packages).
    invokes: [script.extract-packages]
    docker_flags: "DOCKER_RUN + -e BUILD_VERSION"
    s3_coupling: none
    notes: ["Not in `all` and not called by build-rootfs; help text says 'Alias for build-rootfs install step only' which is wrong (Makefile:181 vs 402-404)."]

  - id: make.menuconfig-kernel
    kind: make-target
    path: Makefile
    purpose: Interactive kernel menuconfig outside portage; writes configs/kernel.config.
    docker_flags: "DOCKER_RUN_IT (-it) + -e TERM"
    inputs: [{what: "/var/cache/distfiles/linux-$KVER.tar.xz + overlay patch linux-<major.minor>-gcc15-std-gnu11.patch", from: "distfiles volume (must already be populated)", evidence: "Makefile:414-418"}]
    outputs: [{what: configs/kernel.config (overwrites the repo file)", to: repo, evidence: "Makefile:423"}]
    s3_coupling: none
    notes:
      - "Uses ARCH=i386 and no CROSS_COMPILE; the same file configs/kernel.config is ALSO overwritten by every build-packages run (resolved config export) - two writers of one tracked file."
    rebuild_notes: ["Decide one canonical source for the kernel config: the pinned input vs the resolved output are conflated at configs/kernel.config."]

  - id: make.menuconfig-busybox
    kind: make-target
    path: Makefile
    purpose: i486-linux-musl-emerge --config sys-apps/busybox (saves to savedconfig).
    docker_flags: DOCKER_RUN_IT
    s3_coupling: none
    evidence: Makefile:426-428

  - id: make.build-rootfs
    kind: make-target
    path: Makefile
    purpose: Two sequential docker runs - build-rootfs.sh then build-initrd.sh.
    prerequisites: [ensure-volume, ensure-dirs]
