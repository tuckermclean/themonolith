  - thing: host build tools (crossdev, gentoolkit, eix, flex, bison, bc, elfutils, syslinux, grub, libisoburn, mtools, dosfstools, squashfs-tools, xz, rsync, file, git, cpio, cmake, mandoc, ncurses, pyyaml, xcb-proto)
