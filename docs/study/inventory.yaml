- id: script.sync-portage
  kind: script
  path: scripts/sync-portage.sh
  purpose: Deterministic runtime portage-snapshot sync. fetch-only (host) copies pinned snapshot from S3 else upstream
    into a local mirror dir (archiving upstream->S3); webrsync-local (container) serves mirror on 127.0.0.1:8899
    and runs emerge-webrsync --revert=$BUILD_EPOCH with GENTOO_MIRRORS pointed at it only.
  triggers:
  - called by make.sync-portage; wf.pin-bump calls `fetch-only` (pin-bump.yml:200)
  invokes: []
  invoked_by:
  - make.sync-portage
  - wf.pin-bump
  - wf.build
  modes:
  - fetch-only
  - webrsync-local
  - default live (fetch + serve + webrsync; builder-image only)
  - --source-only/sourced for tests
  inputs:
  - what: gentoo-$BUILD_EPOCH.tar.xz (required), .gpgsig (required), .md5sum (optional)
    from: ext.aws-s3 s3://$S3_BUCKET/portage-snapshots/ (aws s3 cp, signed creds) then ext.gentoo-distfiles https://distfiles.gentoo.org/snapshots
    evidence: scripts/sync-portage.sh:21-22,33,37,65-73
  outputs:
  - what: $SYNC_MIRROR_DIR/snapshots/<file>
    to: output/portage-mirror (host) / /var/monolith-portage-mirror (container)
    evidence: scripts/sync-portage.sh:31,67
  - what: archive copy of upstream snapshot
    to: s3://$S3_BUCKET/portage-snapshots/
    evidence: scripts/sync-portage.sh:44
  - what: portage tree in monolith-repos volume
    to: docker volume
    evidence: scripts/sync-portage.sh:98
  secrets:
  - AWS credentials (not named in script)
  external:
  - ext.aws-s3
  - ext.gentoo-distfiles
  pins:
  - thing: BUILD_EPOCH
    value: required env, no default
    evidence: scripts/sync-portage.sh:66,81
  - thing: SYNC_HTTP_PORT
    value: '8899'
    evidence: scripts/sync-portage.sh:23
  env:
  - SYNC_MIRROR_DIR (/var/monolith-portage-mirror)
  - SYNC_UPSTREAM (https://distfiles.gentoo.org/snapshots)
  - SYNC_S3_PREFIX (portage-snapshots)
  - SYNC_HTTP_PORT (8899)
  - S3_BUCKET (empty = skip S3)
  - BUILD_EPOCH
  s3_coupling: hard
  s3_coupling_detail: 'Code-level it is soft: S3 is skipped if S3_BUCKET is empty and upstream is a fallback (lines
    33, 37, 43). In practice it is HARD for the pinned epoch: upstream prunes old gentoo-DATE snapshots, so a build
    of an epoch that was never archived into S3 (or whose S3 copy is gone) hits FATAL ''unrecoverable'' (lines 53-56).
    The archive-back step (lines 39-49) is what created the pruning safety net and it only warns (::warning::) on
    failure.

    '
  notes:
  - 'S3 read uses `aws s3 cp ... >/dev/null 2>&1`: ANY S3 error (auth, network, missing key) is silently treated
    as a miss and falls to upstream (line 33). Auth failures on a disabled account would look like ''not in S3''
    and then possibly succeed from upstream, quietly NOT archiving. Failed archive is non-fatal (line 47).'
  - 'Why it exists: emerge-webrsync cannot fetch file:// and silently falls back to distfiles.gentoo.org whose gentoo-DATE
    tarball drifts, making trees non-deterministic and invalidating all binpkgs (header comment lines 8-17). Local
    http + NO upstream makes a missing pin fail loud.'
  - 'Verification trust: relies on emerge-webrsync''s own GPG check of .gpgsig; the .md5sum is optional. Nothing
    in this script verifies the tarball hash against any committed digest, so a poisoned S3 object signed correctly
    is the only check (it must carry a valid Gentoo-signed gpgsig).'
  - python3 -m http.server is started in background with stdout/stderr discarded (line 83); readiness poll 100 x
    0.1 s; trap kills it on exit (line 86). Port collision would be silent until the poll fails.
  - Header says 'DETERMINISTIC' - yes by construction, given same tarball bytes.
  - 'Runs on the HOST in fetch-only mode: needs aws cli and wget installed on host (CI runner has both).'
  - sourced-detection via ${0##*/} basename (lines 106-112), tested by scripts/tests/sync-portage.test.sh (passes).
  rebuild_notes:
  - 'Keep: pinned snapshot served over loopback http with no upstream; GPG verify via emerge-webrsync; fail-loud
    if absent.'
  - Replace S3 with another object store (GHCR OCI artifact like binpkgs would match existing pattern) or commit
    the snapshot digest and fetch by digest.
  - Tests (sync-portage.test.sh) are the oracle for fetch ordering and webrsync invocation.
- id: script.build-packages
  kind: script
  path: scripts/build-packages.sh
  purpose: Cross-compile every world package in ONE `i486-linux-musl-emerge --jobs --load-average --keep-going --buildpkg
    [--usepkg]` call, then quickpkg preinstalled pkgs, export kernel, sysroot and resolved kernel config.
  invokes:
