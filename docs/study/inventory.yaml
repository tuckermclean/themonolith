    vs build-packages:56-91): the two scripts can resolve differently.'
  - Not wired into CI (workflows area to confirm); effectively a dev-only/legacy path since build-packages.sh already
    exports the sysroot.
  rebuild_notes:
  - Drop unless the rebuild wants a separate 'install from binpkgs only' reproducibility check; if kept, make dnsmasq
    drop fatal instead of papering over.
