    tier: fast
    note: stubs mkfs.ext4/mkswap/blkid/mount/umount/fallocate; 45 ok
  - id: test.monolith-router
    path: scripts/tests/monolith-router.test.sh
    subject: cfg.overlay/app-misc/monolith-base/files/monolith-router
    asserts:
    - 'up: nft masquerade on WAN oifname, LAN->WAN forward accept, ip_forward=1'
    - custom lan-cidr applied; malformed CIDR rejected non-zero
    - auto-detect WAN=default-route iface; ambiguous 3-iface rejected
    - down deletes table ip monolith_router, ip_forward=0
    - status queries table
