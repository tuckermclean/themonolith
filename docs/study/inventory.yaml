- id: job.toolchain-bump.bump-and-validate
  kind: job
  path: .github/workflows/toolchain-bump.yml:53
  purpose: Bump TOOLCHAIN_EPOCH, regen crossdev.lock from pre-bump image, rebuild+push image, dispatch+await build.yml,
    open PR with label validated|needs-fixup.
