        ${xlibs}' XINERAMAFLAGS=
      why: 'Makefile hardcodes cc (host); XINERAMAFLAGS= drops -DXINERAMA (no libXinerama); CRITICAL: dwm''s Makefile
        hard-assigns ''LDFLAGS = ${LIBS}'', SHADOWING the env''s -static, so without the command-line override dwm
