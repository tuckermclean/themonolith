  - ext.grype-db
  pins: []
  env:
  - 'BUILD_STARTED_ON (default: now) attestation.sh:59'
  - BUILD_EPOCH (empty ok; also recorded as builder.epoch, stage3 epoch, portage snapshot epoch) attestation.sh:315,643
  - STAGE3_DIGEST (set by build.yml:596-599, forwarded by Makefile:152) attestation.sh:316,687
  - CROSS_TARGET (-> --arch, builder.cross_target) attestation.sh:302,505
  - S3_BUCKET (only used to fabricate s3:// distribution externalReference) attestation.sh:202-204
  - GITHUB_REF, GITHUB_REPOSITORY, GITHUB_SERVER_URL, GITHUB_SHA, GITHUB_RUN_ID (tag build => release-asset URL)
    attestation.sh:218-220,300-301,308
  - SYFT_FILE_METADATA_SELECTION=all (set inline for syft) attestation.sh:259
  s3_coupling: soft
  s3_detail: 'Never touches S3 itself. S3_BUCKET only feeds a *string* (s3://$S3_BUCKET/themonolith-$TAG.iso) into
    the SBOM distribution externalReference; omitted when unset (attestation.sh:198-204). With S3 gone this reference
    is dead/misleading.

    '
  pillars:
  - n: '1'
    name: SBOM generation + CPE enrichment
    what: syft dir:SYSROOT with --override-default-catalogers portage-cataloger emitting cyclonedx-json + syft native
      json; then enrich-sbom.py. Fail if syft rc!=0 OR enrich rc!=0 (enrich failure is rolled into SBOM_RC)
    evidence: scripts/attestation.sh:246-347
  - n: '2'
    name: License compliance
    what: check-licenses.py on enriched SBOM vs license-policy.yaml; any component status=fail => pillar fail
    evidence: scripts/attestation.sh:359-364
  - n: '3'
    name: CVE scan
    what: check-cves.sh on enriched SBOM vs cve-policy.yaml; folds coverage JSON into summary
    evidence: scripts/attestation.sh:378-429
  - n: '4'
    name: Unowned files audit
    what: check-unowned.py on sbom.syft.json + sysroot CONTENTS; skipped with WARN (and UNOWNED_RC stays 0 => PASS!)
      if sbom.syft.json missing
    evidence: scripts/attestation.sh:461-473
  - n: '5'
    name: Builder environment SBOM + CVE
    what: syft dir:/ of the running builder container (excludes /proc /sys /dev /run /output /configs /scripts /rootfs
      /build /var/db/repos /var/cache/distfiles /var/log/portage /root/.cache), enrich, grype via check-cves.sh.
      Both builder sbom rc and builder cve rc gate overall
    evidence: scripts/attestation.sh:488-637
  - n: '6'
    name: SLSA v1 provenance
    what: generate-provenance.py; hard-fails (rc=1) if ISO sha is '(not computed)' i.e. ISO absent. Not a *pillar*
      in the header (header says five pillars)
    evidence: scripts/attestation.sh:639-695
