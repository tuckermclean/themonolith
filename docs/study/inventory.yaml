  tests:
  - id: test.binpkg-store
    path: scripts/tests/binpkg-store.test.sh
    subject: script.binpkg-store
    asserts:
    - prune-predicate keeps only newest PVR per CAT/PN
    - -rN beats base; _p beats plain; plain beats _rc
    - versions.lock pinned older PVR is never deleted
    - mixed packages independent; malformed line skipped not fatal
    - 'pull-is-benign-miss classifier: not found/manifest unknown/name unknown/404/401 unauthorized/denied = benign
      (rc0); connection refused / deadline exceeded = genuine'
    runtime: 0.19s
    passes: true
    tier: fast
    note: Not coupled to live S3/GHCR but is the GHCR binpkg store; shells out to bash (script is bash). 'ok:' lines
      not printed; only FAIL on error
  - id: test.boot-test-retry
    path: scripts/tests/boot-test-retry.test.sh
    subject: script.boot-test
    asserts:
    - 'should_retry_launch decision matrix: silent guest w/ attempts left -> retry; final attempt -> stop; reached_init
      -> never retry; ok -> never retry'
    runtime: 0.05s
    passes: true
    tier: fast
    note: Python heredoc; stubs pexpect module if absent; 6 checks
  - id: test.ghcr-gc
    path: scripts/tests/ghcr-gc.test.sh
    subject: script.ghcr-gc
    asserts:
    - 'classify(): current epoch KEEP, old 8-digit epoch DELETE, non-epoch tags (latest, v1.2.3, 7/9-digit) KEEP'
    - dry-run exits 0; abort guard exits 1 when nothing matches keep-list
    - 404 package listing exits 0; 403 and 401-with-stray-404 are hard failure (exit 1)
    - version with mixed DELETE/KEEP tags kept whole
    - --apply DELETEs only condemned version id
    - empty listing exits 0 with '0 package versions' NOTE
    runtime: 0.13s
    passes: true
    tier: fast
    note: stubs gh on PATH; no network
  - id: test.monolith-cnf
    path: scripts/tests/monolith-cnf.test.sh
    subject: cfg.overlay/app-misc/monolith-base/files/60-monolith-cnf.bash
    asserts:
    - 'unknown command prints "<cmd>: not on the disc. ''monolith tools'' lists what is." on stderr only'
    - exit 127
    - existing commands unaffected
    - sourcing is silent, rc 0
    runtime: 0.02s
    passes: true
    tier: fast
    note: 7 ok
  - id: test.monolith-net
    path: scripts/tests/monolith-net.test.sh
    subject: cfg.overlay/app-misc/monolith-base/files/monolith-net
    asserts:
    - status no-NIC prints 'monolith-net probe' incantation; status lists eth0
    - autoprobe finds 3c509 via stub modprobe; none -> incantation
    - probe finds ne io=0x320 irq=5; none -> 'No ISA card answered' exit 1
    - incantation prints 'modprobe ne io=0x300'
    - bad subcommand exit 2
    runtime: 0.20s
    passes: true
    tier: fast
    note: stubs modprobe/ip/dhcpcd, fake sysfs via MONOLITH_NET_SYSCLASS; 10 ok
  - id: test.monolith-persist-bashrc
    path: scripts/tests/monolith-persist-bashrc.test.sh
