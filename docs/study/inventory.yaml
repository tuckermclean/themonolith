  config:
  - id: cfg.portage/make.conf
    path: configs/portage/make.conf
    purpose: Cross make.conf installed at /usr/i486-linux-musl/etc/portage/make.conf (make.conf:1-4).
    entries:
    - entry: CHOST="i486-linux-musl"
      why: cross target
      evidence: make.conf:7
    - entry: ROOT="/usr/${CHOST}"
      why: crossdev emerge wrapper sets SYSROOT but not ROOT; modern portage requires ROOT to match SYSROOT (or
        both /)
      evidence: make.conf:9-11
    - entry: CFLAGS="-march=i486 -mtune=i486 -Os -pipe -fno-exceptions"; CXXFLAGS=${CFLAGS}
      why: size-optimised i486; -fno-exceptions for smaller binaries (overridden per package by env/fexceptions.conf)
      evidence: make.conf:13-20
    - entry: CFLAGS_FOR_BUILD="-O2 -m32"
      why: host build tools run during cross-compile must use 32-bit longs to match target ABI; native tools like
        nethack makedefs otherwise emit data files with 64-bit longs i486 binaries can't read. IMPLIES the builder
        image has 32-bit (multilib) host gcc support
      evidence: make.conf:22-25
    - entry: LDFLAGS="-Wl,--gc-sections"
      why: 'NO -static here: it breaks shared-lib builds for deps (zlib, xz); static linking comes from env/static.conf
        via package.env'
      evidence: make.conf:27-32
    - entry: USE="-* minimal static static-libs -nls -ipv6 -X -systemd unicode"
      why: start with nothing; everything else opt-in via package.use
      evidence: make.conf:34-36
    - entry: FEATURES="buildpkg strip -sandbox -usersandbox"
      why: buildpkg for binpkg reuse; strip with ${CHOST}-strip so binpkgs install ready; sandbox disabled because
        it often breaks cross-compilation
      evidence: make.conf:38-44
    - entry: ACCEPT_KEYWORDS="*"
      why: embedded crossdev profile has no parent chain into profiles/arch/x86/ so ~x86 matching doesn't work;
        '*' accepts any keyword but not keyword-less (live/9999) ebuilds
      evidence: make.conf:46-49
    - entry: MAKEOPTS="-j${JOBS}"
      why: make.conf supports only ${VAR}, not $(cmd); JOBS env var set by the build script. gdb overrides to -j1.
      evidence: make.conf:51-53
    - entry: PKGDIR="/output/packages"; BINPKG_FORMAT="gpkg"; BINPKG_COMPRESS="xz"
      why: binpkgs persist in the mounted /output volume (default ${ROOT}/var/cache/binpkgs is ephemeral); this
        is the binpkg cache the S3 layer syncs
      evidence: make.conf:55-62
    - entry: 'NOT set: ACCEPT_LICENSE'
      why: defaults to @FREE; stele relies on GPL-3 being in @FREE (stele ebuild:20-26)
      evidence: absence
  - id: cfg.portage/bashrc
    path: configs/portage/bashrc
    purpose: Portage per-phase hook script (361 lines) holding all package-specific cross/static surgery that env
      files can't express.
    entries:
    - entry: 'configure phase: pre_src_configure() wraps meson_src_configure to append -Ddefault_library=static'
      why: with -static in LDFLAGS any .so link via meson fails with 'undefined reference to main' (GCC pulls crt1.o
        into -shared link); static-only eliminates .so links. Uses bash dynamic scoping to append to the ebuild's
        local emesonargs array.
      evidence: bashrc:19-63; commit 4f33968 / e409314
    - entry: 'meson glib: add -Dlibmount=disabled'
      why: glib links libmount.a which pulls blkid symbols; avoid transitive dep
      evidence: bashrc:56-59
    - entry: 'kmod: sed meson.build ''libkmod = shared_library('' -> ''libkmod = library('''
      why: kmod hardcodes shared_library(), ignoring default_library=static, so the .so link collides with -static;
        rewriting yields libkmod.a only and kmod tools link libkmod_internal static. ewarn if the pattern vanishes
        (upstream change).
      evidence: bashrc:31-48; commit 513574d
    - entry: 'cmake: wrap cmake_src_configure to add -DBUILD_SHARED_LIBS=OFF -DCMAKE_FIND_LIBRARY_SUFFIXES=.a'
      why: prevent cmake picking stale .so from sysroot that -static LDFLAGS can't use
      evidence: bashrc:65-78
    - entry: 'post_src_configure: sed every libtool script in WORKDIR to add compile_command/finalize_command +=
        $link_static_flag after prefer_static_libs=built'
      why: libtool swallows -static (prefers static archives but does not pass -static to the compiler) so binaries
        stayed dynamic; makes -static behave like -all-static without breaking configure tests
      evidence: bashrc:6-17,81-87
    - entry: 'coreutils: sed ''s|src/libstdbuf\.so||g'' on ${S}/Makefile in post_src_configure'
      why: --disable-stdbuf is NOT recognised by coreutils configure; libstdbuf.so (LD_PRELOAD helper, useless on
        static system) can't link with -static ('undefined reference to main')
      evidence: bashrc:89-101
    - entry: 'gpm: python3 helper rewrites every Makefile and Makefile.in under WORKDIR: strip -static/-no-pie from
        the libgpm.so link recipe; add target-specific ''override LDFLAGS := $(filter-out -static -no-pie,$(LDFLAGS))'';
        drop $(PROG) from ''all'' and clear PROG=; delete the ''Makefile: Makefile.in'' self-remake rule'
      why: 'gpm has a custom Makefile.in with @LDFLAGS@ baked in as literal text so -static is in the .so recipe
        AND comes via emake''s command line; -no-pie pulls crt1.o even with -shared; programs (mev, gpm-root) link
        libgpm.so.1 with -static => ''attempted static link of dynamic object''; mtime granularity on overlayfs
        can make make regenerate Makefile from the template and undo the patch. Hook placed in post_src_configure
        (not pre_src_compile) because multilib-minimal sets BUILD_DIR inside the ABI loop in src_configure. NOTE:
        uses HOST python3 (python3 - heredoc).'
      evidence: bashrc:103-220; commit 23dbec2
    - entry: 'compile phase: pre_src_compile iproute2: export PATH=${S}:${PATH}'
      why: tc/Makefile calls bare 'yacc-reference' which lives in the source root, not PATH
      evidence: bashrc:241-250; commit 7e8dfda
    - entry: 'compile phase: pre_src_compile gpm: log Makefile ''all:'' and ''PROG='' lines'
      why: diagnose Makefile regeneration undoing post_src_configure patches
      evidence: bashrc:252-263
    - entry: 'compile phase: pre_src_compile nethack: rm include/vis_tab.h src/vis_tab.c; python3 appends to util/Makefile:
        OBJDIR=. (was ../src), CC_FOR_BUILD ?= gcc, CFLAGS_FOR_BUILD := $(CFLAGS_FOR_BUILD) -std=gnu89 -I$(abspath
        ../include) -DDLB -DSECURE -DTIMED_DELAY -DVISION_TABLES -DDUMPLOG -DSCORE_ON_BOTL, and ''makedefs lev_comp
        dgn_comp dlb: override CC/CFLAGS/LFLAGS(-m32)/LDFLAGS(-m32)'''
      why: 'makedefs/lev_comp/dgn_comp/dlb are built for i486 but run on x86_64 host to generate sources. OBJDIR=.
        stops them linking the i486 ../src/monst.o/objects.o. ''override'' needed since ebuild passes CC=/CFLAGS=
        on make command line; target-specific vars propagate to prerequisites. vis_tab.[ch] ship pre-generated so
        make skips ''makedefs -v'' - deleted to force regen. Written for 3.6.x shape; 5.0.0 restructured it (hence
        the pin + mask). NOTE: HOST python3 again.'
      evidence: bashrc:226-317; commit 3bd6abe
    - entry: 'postinst: post_pkg_postinst() deletes *.so, *.so.* regular files and dangling *.so* symlinks under
        ${SYSROOT}/usr/lib and /lib after EVERY package, each find under ''timeout 30'''
      why: 'ncurses etc. install .so+.a regardless of --disable-shared; cmake/meson then pass the .so full path
        to linker, which refuses it under -static. Portage guarantees postinst of dep completes before dependent''s
        configure. Timeout/logging added to diagnose a hanging GitHub runner (commit 4c734e4). Side effect: modules
        (.ko) unaffected since not *.so; but ALSO deletes any intended .so in sysroot (e.g. none shipped).'
      evidence: bashrc:319-342; commits 4c734e4, 513574d
    - entry: 'postinst: override pkg_postinst for app-text/mandoc to run HOST /usr/sbin/makewhatis (60s timeout)
        against ${ROOT}/usr/share/man'
      why: stock pkg_postinst runs 'makewhatis || die' on an i486 binary that can't execute on x86_64 host. Requires
        host mandoc in builder Dockerfile; warns if missing.
      evidence: bashrc:344-361; commit 3bd6abe
    - entry: 'QUIRK: all pre_/post_ hook definitions are nested inside ''if [[ ${EBUILD_PHASE} == ... ]]'' blocks,
        evaluated each time bashrc is sourced'
      why: functions are only defined in the matching phase; hooks therefore must match the phase that sources them
        (post_src_configure defined in configure phase, pre_src_compile in compile phase, post_pkg_postinst in postinst
        phase)
      evidence: bashrc:18,241,330,349
    note: 'Dead/legacy: the package.env/cross-compile comment (lines 17-21) says disable-stdbuf.conf''s --disable-stdbuf
      is ''unrecognised by coreutils configure''; the bashrc sed is the real fix and the env file is belt-and-suspenders.'
  - id: cfg.portage/env/static.conf
    path: configs/portage/env/static.conf
    purpose: Catch-all static non-PIE environment for */* (via package.env).
    entries:
    - entry: CFLAGS+=" -no-pie -fno-pie"; CXXFLAGS+=same; LDFLAGS+=" -no-pie -static"
      why: on i486/musl PIE+static conflict - linker can't produce static-PIE, gcc silently falls back to dynamic-PIE
      evidence: static.conf:1-8
    - entry: EXTRA_ECONF="--disable-shared --enable-static"
      why: 'libtool strips -static from LDFLAGS; --disable-shared forces linking .a only; ignored by non-autotools.
        NOTE: assignment REPLACES (not appends) EXTRA_ECONF, and later env files append with ${EXTRA_ECONF} - ordering
        of package.env files matters.'
      evidence: static.conf:10-13
    - entry: I_KNOW_WHAT_I_AM_DOING=1
      why: xz-utils sanity check dies when liblzma.so missing (expected with --disable-shared); the ebuild's own
        escape hatch
      evidence: static.conf:15-17
  - id: cfg.portage/env/disable-stdbuf.conf
    path: configs/portage/env/disable-stdbuf.conf
    purpose: 'coreutils: EXTRA_ECONF += --disable-stdbuf'
    entries:
    - entry: EXTRA_ECONF="${EXTRA_ECONF} --disable-stdbuf"
      why: 'stdbuf is LD_PRELOAD based and useless on static system; libstdbuf.so with -static fails linking. Actually
        ineffective: configure does not recognise the flag (see bashrc coreutils sed)'
      evidence: disable-stdbuf.conf:1-11; package.env/cross-compile:17-21
  - id: cfg.portage/env/fexceptions.conf
    path: configs/portage/env/fexceptions.conf
    purpose: Re-enable C++ exceptions for smartmontools and gdb.
    entries:
    - entry: CXXFLAGS/CFLAGS += -fexceptions
      why: overrides global -fno-exceptions; gdb's gdbsupport/new-op.cc wraps operator new in try/catch which is
        a hard compile error under -fno-exceptions
      evidence: fexceptions.conf:1-4; package.env/cross-compile:26-32
  - id: cfg.portage/env/gdb-lowmem.conf
    path: configs/portage/env/gdb-lowmem.conf
    purpose: Serialize gdb's internal make.
    entries:
    - entry: MAKEOPTS="-j1"
      why: 'gdb-17.2 C++ TUs are memory-heavy; with MAKEOPTS=-j2 and emerge --jobs=2 peak RAM OOM-kills the CI runner
        silently (no error, no build.log, failure-log upload step never runs). NOTE: comment says global MAKEOPTS=-j2
        but make.conf uses -j${JOBS}.'
      evidence: gdb-lowmem.conf:1-7
  - id: cfg.portage/env/libiconv.conf
    path: configs/portage/env/libiconv.conf
    purpose: 'app-arch/tar only: link libiconv with --whole-archive.'
    entries:
    - entry: LDFLAGS += -Wl,--whole-archive,-liconv,--no-whole-archive
      why: gnulib/librecode code calls libiconv_open/libiconv_close (external-prefixed) instead of musl's built-in
        iconv but omits -liconv; GNU ld single-pass archive scanning leaves refs unresolved if -liconv precedes
        the objects; --whole-archive sidesteps ordering. Requires a libiconv.a in sysroot (provenance not in recipes
        scope).
      evidence: libiconv.conf:1-9; commits 347d044, 4f33968
  - id: cfg.portage/env/mutt-tinfo.conf
    path: configs/portage/env/mutt-tinfo.conf
    purpose: 'mutt: LIBS += -ltinfo'
    entries:
    - entry: LIBS="${LIBS} -ltinfo"
      why: ncurses built USE=tinfo (split libtinfo) so bare -lncurses static link leaves tgetent/cur_term/setupterm
        unresolved; mutt's AC_CHECK_LIB(ncurses, initscr) fails -> 'no curses library found'. mtr sidesteps via
        a Gentoo tinfo patch; mutt has none.
      evidence: mutt-tinfo.conf:1-11; commit c004ca3
  - id: cfg.portage/env/no-static-ldflags.conf
    path: configs/portage/env/no-static-ldflags.conf
    purpose: 'DEAD: replacement LDFLAGS=''-Wl,--gc-sections -no-pie'' for packages that build .so (meson, plain-Makefile).'
    entries:
    - entry: LDFLAGS="-Wl,--gc-sections -no-pie"
      why: plain ${VAR} expansion only in env files so cannot strip -static with ${VAR//..}; overwrite instead
      evidence: no-static-ldflags.conf:1-11
    notes: 'UNREFERENCED: grep finds no package.env line using it (introduced 796d42c / 4f33968, superseded by bashrc
      meson/cmake/libtool hooks). Candidate to drop.'
  - id: cfg.portage/env/ppp-no-plugins.conf
    path: configs/portage/env/ppp-no-plugins.conf
    purpose: 'net-dialup/ppp: --disable-plugins'
    entries:
    - entry: EXTRA_ECONF="${EXTRA_ECONF} --disable-plugins"
      why: plugins are libtool -module -avoid-version .so dlopen'd; dead on a no-dynamic-loader rootfs and risk
        the -static+-shared 'undefined reference to main' class; removes pppd/plugins from SUBDIRS and drops pppd's
        -ldl and -Wl,-E
      evidence: ppp-no-plugins.conf:1-16
  - id: cfg.portage/env/shadow-libdir.conf
    path: configs/portage/env/shadow-libdir.conf
    purpose: 'sys-apps/shadow: --libdir=/usr/lib'
    entries:
    - entry: EXTRA_ECONF="${EXTRA_ECONF} --libdir=/usr/lib"
      why: shadow installs libsubid to /lib but merged-usr requires /usr; fails portage QA otherwise
      evidence: shadow-libdir.conf:1-4
  - id: cfg.portage/package.env/cross-compile
    path: configs/portage/package.env/cross-compile
    purpose: Maps env/*.conf to packages.
    entries:
    - entry: '*/*  static.conf'
      why: force static non-PIE for every package incl. deps; virtuals/man-pages ignore harmlessly
      evidence: cross-compile:7-15
    - entry: sys-apps/coreutils disable-stdbuf.conf
      why: belt-and-suspenders; real fix in bashrc
      evidence: cross-compile:17-21
    - entry: app-arch/tar libiconv.conf
      why: gnulib libiconv_open without -liconv
      evidence: cross-compile:23-24
    - entry: sys-apps/smartmontools fexceptions.conf
      why: C++ exceptions
      evidence: cross-compile:26-27
    - entry: dev-debug/gdb fexceptions.conf gdb-lowmem.conf
      why: new-op.cc try/catch; OOM-kills CI runner
      evidence: cross-compile:28-32
    - entry: sys-apps/shadow shadow-libdir.conf
      why: libsubid to /usr/lib
      evidence: cross-compile:34-35
    - entry: net-dialup/ppp ppp-no-plugins.conf
      why: no dlopen plugin subsystem
      evidence: cross-compile:37-39
    - entry: mail-client/mutt mutt-tinfo.conf
      why: -ltinfo
      evidence: cross-compile:41-43
    notes: 'Ordering: package.env applies multiple files in order; later EXTRA_ECONF appends with ${EXTRA_ECONF}
      rely on static.conf running first (static.conf SETS it). The cross-gcc EXTRA_ECONF for libatomic.a lives in
      the Dockerfile (/etc/portage/env/cross-gcc-static.conf, Dockerfile:191-205), NOT in this repo''s configs -
      builder-side config the rebuild must also carry.'
  - id: cfg.portage/package.accept_keywords/i486
    path: configs/portage/package.accept_keywords/i486
    purpose: Accept ~x86 for everything; '**' for all 11 monolith overlay packages.
    entries:
    - entry: '*/* ~x86'
      why: i486 not an official arch; need unstable keywords
      evidence: i486:1-7
    - entry: sys-kernel/monolith-kernel, games-roguelike/rl144, dev-db/monolith-sqlite, dev-lang/monolith-perl,
        app-misc/monolith-base, x11-libs/libXfont, x11-base/monolith-xserver, x11-base/xcb-proto, www-client/stele,
        x11-terms/monolith-st, x11-wm/monolith-dwm  **
      why: local overlay, no arch support matrix; every overlay ebuild must be listed here or it is unmaskable (a
        new overlay package that is not added fails with keyword mask)
      evidence: i486:9-20
    notes: Redundant with make.conf ACCEPT_KEYWORDS=* but kept; ACCEPT_KEYWORDS '*' does not cover '**' (keyword-less),
      only for overlay ebuilds that have KEYWORDS (all have ~amd64), so the '**' lines are belt-and-suspenders.
  - id: cfg.portage/package.mask/problematic
    path: configs/portage/package.mask/problematic
    purpose: Masks for packages/versions that break the static i486-musl cross build or violate doctrine.
    entries:
    - entry: sys-apps/man-db
      why: pulls virtual/tmpfiles -> systemd-utils[tmpfiles] with REQUIRED_USE PYTHON_SINGLE_TARGET; masking makes
        virtual/man resolve to app-text/mandoc
      evidence: problematic:15-18
      doctrine: no-python-target
    - entry: games-misc/fortune-mod
      why: 'CMake needs a pre-installed NATIVE ''strfile'' in PATH: circular build-tool dep. Re-enable by installing
        fortune-mod natively in Dockerfile first'
      evidence: problematic:20-23
    - entry: app-misc/mc
      why: hard-requires e2fsprogs[tools]; e2fsprogs+tools fails statically (tools link libext2fs.so not .a)
      evidence: problematic:25-27
    - entry: sys-apps/pciutils
      why: cross-linker includes crt1.o building libpci.so; build system incompatible with musl cross toolchain
      evidence: problematic:29-31
    - entry: app-arch/zstd
      why: meson + multilib-minimal eclass fails cross-compilation with the crt1.o error
      evidence: problematic:33-36
    - entry: dev-libs/libxml2
      why: 'same meson/multilib failure; jq pulls bison->gettext->libxml2. Re-enable by providing a meson cross-file
        for i486-linux-musl. Consequence: bc and jq blocked (world:172-175)'
      evidence: problematic:33-37
    - entry: media-libs/libcaca
      why: uses C++ exceptions with -fno-exceptions; needs per-package fexceptions + shared-lib cross fix
      evidence: problematic:39-41
    - entry: app-misc/toilet
      why: depends on libcaca
      evidence: problematic:39-42
    - entry: net-analyzer/nethogs
      why: requires ncurses[cxx]; building ncurses with cxx breaks ncurses build in this musl cross context, cascading
        to ~20 dependents
      evidence: problematic:44-46
    - entry: sys-apps/usbutils
      why: usbutils -> virtual/libudev -> systemd-utils unconditional REQUIRED_USE python_single_target (same root
        as nmap)
      evidence: problematic:48-50
      doctrine: no-python-target
    - entry: net-analyzer/nmap
      why: unconditional REQUIRED_USE python_single_target even with all python features off; re-enable by adding
        dev-lang/python to world and python_single_target_python3_12 in package.use/nmap (file does not exist; note
        python3_12 vs xcb-proto python3_14 hint)
      evidence: problematic:52-56
      doctrine: no-python-target
    - entry: '>=games-roguelike/nethack-5.0.0'
      why: 5.0.0 needs USE=lua (REQUIRED_USE lua_single_target_*) and restructured util/Makefile vars that bashrc
        CC_FOR_BUILD patch was not written for (see .batteries/reports/nethack.md - path not verified); world pins
        =nethack-3.6.7-r1, mask is belt-and-suspenders
      evidence: problematic:58-63
    - entry: '>=dev-python/docutils-0.23'
      why: 0.23 hard-depends on dev-python/pillow (46MB) -> pybind11 -> dev-cpp/eigen; docutils is a HOST BDEPEND
        (rst2man) of dev-libs/glib man pages, unconditional/no USE gate. Mask keeps docutils-0.21.x. NB only effective
        once package.mask is mirrored HOST-side (scripts/build-packages.sh) because BDEPEND resolves against host
        /etc/portage not the cross sysroot. 'Real fix for the post-pin red build'.
      evidence: problematic:65-78; commit 87225c0
    - entry: '>=dev-cpp/eigen-9999'
      why: live (git HEAD) ebuild; its versioned patch eigen-5.0.1-cmake-GNUInstallDirs.patch fails once upstream
        drifts, which turned every full build red; pulled as HOST build-dep through glib->docutils->pillow->pybind11->eigen.
        Mask so stable header-only eigen is chosen. 'A live ebuild has no place in a pinned build.' Belt-and-suspenders
        now.
      evidence: problematic:80-89; commit 87225c0
    notes: Example comments at lines 7-13 are placeholders (not active).
  - id: cfg.portage/package.use/dnsmasq
    path: configs/portage/package.use/dnsmasq
    purpose: dnsmasq USE set for the static image.
    entries:
    - entry: net-dns/dnsmasq dhcp -static -dbus -script -nls -ipv6 -dnssec -tftp
      why: 'dhcp must be explicit since global USE=-* strips default +dhcp (else -DNO_DHCP, DNS-only, useless for
        SP3). ''-static'' is counter-intuitive: static linking comes from env/static.conf LDFLAGS; the ebuild''s
        ''static'' USE flag only emits -DHAVE_DNSSEC_STATIC, making upstream Makefile link -lgmp unconditionally
        even with -dnssec -> ''cannot find -lgmp''. Off => no gmp/nettle and still fully static. No dbus, no lease-change
        script exec, no NLS, IPv4-only, no DNSSEC (needs trust anchor; deferred), no TFTP (netboot deferred).'
      evidence: dnsmasq:1-20
  - id: cfg.portage/package.use/nftables
    path: configs/portage/package.use/nftables
    purpose: Lean nftables.
    entries:
    - entry: net-firewall/nftables -json -python -xtables -readline
      why: only batch mode used by monolith-router (nft -f -, list/add/delete). static -lreadline fails to link
        (readline needs -ltinfo, naive configure probe doesn't add it). -readline => --without-cli keeps every batch
        feature. No python bindings (doctrine), no iptables-compat.
      evidence: nftables:1-7
      doctrine: no-python-target
  - id: cfg.portage/package.use/static
    path: configs/portage/package.use/static
    purpose: Per-package USE flags (351 lines). Only entries that encode workarounds/reasons are listed; plain 'static'
      marker lines are documentation-only because static linking comes from env/static.conf.
    entries:
    - entry: '*/* static static-libs'
      why: global; make.conf also sets USE=static static-libs
      evidence: static:5
    - entry: sys-apps/busybox savedconfig static
      why: busybox built from configs/portage/savedconfig/sys-apps/busybox (initramfs only)
      evidence: static:8
    - entry: sys-apps/kmod tools
      why: global USE=-* strips 'tools' => no modprobe AND meson aborts ('test suite requires also building the
        tools'). Modules are plain uncompressed .ko so no zlib/xz/zstd. Pairs with bashrc kmod shared_library rewrite.
      evidence: static:11-16
    - entry: app-alternatives/* reference; app-alternatives/tar gnu; app-alternatives/cpio gnu; app-alternatives/sh
        dash; app-alternatives/lex flex
      why: global USE=-* strips alternatives' defaults, so choose explicitly; cpio selector REQUIRED_USE exactly-one-of(gnu
        libarchive) not satisfied by wildcard 'reference'
      evidence: static:18-25,87-90
    - entry: app-shells/bash static -net -plugins readline
      why: minimal static bash
      evidence: static:26
    - entry: net-misc/dropbear static minimal -pam -shadow -syslog multicall
      why: minimal ssh; sshd present but off (hint is generated by build-rootfs.sh)
      evidence: static:29
    - entry: net-misc/curl static static-libs ssl openssl curl_ssl_openssl -gnutls -nss -ldap -rtmp -ssh -telnet
      why: openssl TLS only
      evidence: static:32
    - entry: app-editors/nano static minimal -magic -spell -ncurses unicode
      why: minimal
      evidence: static:36 (note -ncurses with nano is unusual; unverified)
    - entry: app-editors/vim static -minimal
      why: -minimal overrides global 'minimal' to keep syntax highlighting
      evidence: static:108
    - entry: sys-libs/ncurses static static-libs tinfo -gpm -minimal unicode
      why: tinfo split => requires mutt-tinfo.conf; -gpm; unicode (ncursesw)
      evidence: static:97
    - entry: dev-libs/gmp static-libs; dev-libs/mpfr static-libs; dev-libs/expat static-libs -unicode
      why: gdb deps. gmp asm/cpudetection left OFF so it builds portable C instead of i386 hand-tuned asm against
        this musl/i486 toolchain. expat -unicode overrides global USE=unicode to avoid redundant libexpatw.a. static-libs
        on mpfr propagates onto gmp.
      evidence: static:140-158
    - entry: dev-debug/gdb static -server xml lzma -python -guile -source-highlight -nls
      why: 'Python mandatory off (doctrine). -server: gdbserver in-process agent (libinproctrap/tdesc-ipa) is a
        -fPIC .so which fails under global -static (same class as ppp plugins/libstdbuf); reviving needs --disable-inprocess-agent.
        +xml pulls expat; +lzma free since xz-utils in world. -debuginfod avoids elfutils; -guile/-source-highlight/-babeltrace/-rocm
        avoid heavy deps.'
      evidence: static:138 (+comments above)
      doctrine: no-python-target
    - entry: sys-fs/e2fsprogs static static-libs -nls
      why: tools USE (libext2fs.so link) fails statically; dropped (also why app-misc/mc is masked)
      evidence: static:244-246
    - entry: sys-apps/shadow static -static-libs -pam -cracklib
      why: libsubid path fix via shadow-libdir.conf
      evidence: static:248-249
    - entry: net-misc/iperf -sctp
      why: avoid lksctp-tools
      evidence: static:178-180
    - entry: net-analyzer/mtr ncurses jansson -gui -filecaps
      why: ncurses UI (Gentoo tinfo patch in mtr-0.96-r1), JSON via jansson, no GTK (-gui avoids glib+gtk3), -filecaps
        avoids fcaps/libcap (disc runs as root)
      evidence: static:182-194
    - entry: net-dialup/ppp static -atm -pam -selinux -systemd -activefilter
      why: no IUSE=static on ppp; -activefilter avoids libpcap and needs kernel CONFIG_PPP_FILTER (unset); plugins
        off via env
      evidence: static:196-204
    - entry: sys-apps/ethtool static netlink; net-libs/libmnl static static-libs
      why: netlink path via libmnl (Alpine ships libmnl-static as evidence static is supported); ioctl fallback
        still compiled
      evidence: static:206-227
    - entry: www-client/lynx static ssl -minimal -nls; www-client/w3m static ssl -minimal -imlib
      why: 'w3m: imlib (needs X) disabled. w3m is NOT in world (dead entry; AGENTS/world comment ''dropped by --keep-going
        like w3m'')'
      evidence: static:257-261
    - entry: mail-client/mutt static ssl imap smtp sasl gsasl -gpgme -autocrypt -idn -kerberos -hcache -doc -nls
      why: smtp requires sasl (REQUIRED_USE); USE=gsasl (net-misc/gsasl) avoids cyrus-sasl -> virtual/tmpfiles ->
        systemd-utils -> Python trap. Leading comment lines 260-264 describe an older 'drop smtp+sasl' decision
        now superseded by the gsasl line (stale comment).
      evidence: static:263-270
    - entry: net-misc/gsasl static-libs client -server
      why: REQUIRED_USE any-of(client server); mutt is a client
      evidence: static:272-275
    - entry: net-irc/irssi -perl -otr -proxy
      why: 'no perl scripting (doctrine: perl stays build-host BDEPEND; NB monolith-perl is nonetheless on disc),
        no libotr/libgcrypt, no BNC. SSL is unconditional openssl RDEPEND; old ''static ssl -minimal -socks -nls''
        tokens don''t exist on irssi-1.4.5 IUSE.'
      evidence: static:277-282
    - entry: dev-libs/glib static static-libs -dbus -debug -doc -elf -introspection -mime -selinux -sysprof -systemtap
        -test -utils -xattr
      why: 'irssi dependency; glib 8-byte atomics needed libatomic.a on -march=i486 (why irssi was masked before
        #32). meson hook forces static and disables libmount. -introspection avoids Python/bison.'
      evidence: static:284-290
    - entry: dev-libs/libffi static static-libs -debug -exec-static-trampoline -pax-kernel -test
      why: glib dep
      evidence: static:292-294
    - entry: games-roguelike/nethack -X
      why: ncurses UI unconditional in 3.6.x; only X togglable
      evidence: static:308-311
    - entry: sys-apps/kbd static zlib -pam -nls -bzip2 -lzma -selinux -test -xkb -zstd
      why: setfont/loadkeys for console (UX Pass Task 5). zlib ON so setfont reads .gz PSF directly. CI-UNVERIFIED
        when written; if it fails '--keep-going silently drops it' (rcS setfont call guarded).
      evidence: static:313-329
    - entry: media-fonts/terminus-font -a-like-o -center-tilde -distinct-l -otf pcf -pcf-8bit pcf-unicode psf -quote
        -ru-dv -ru-g -ru-i -ru-k
      why: +psf for console setfont (installs ter-1*.psf.gz and ter-v*.psf.gz; rcS uses ter-116n.psf.gz). +pcf +pcf-unicode
        added later for X default font (iso10646-1 PCF in /usr/share/fonts/terminus) - the leading comment (psf
        only, -pcf-unicode) is STALE vs the actual flags. -otf drops outline fonts. NOTE flags 'pcf' and 'pcf-unicode'
        pull x11-apps/bdftopcf at build time (host side).
      evidence: static:~331-351 (atom is the last line); commit 428c5f7
    - entry: app-text/mandoc static system-man
      why: satisfy virtual/man (man-db masked)
      evidence: static:111
    - entry: 'dead entries (atoms not in world): sys-process/dcron, www-client/w3m, app-misc/gpm (world has sys-libs/gpm)'
      why: app-misc/gpm static does NOT match sys-libs/gpm; harmless since static comes from env, but evidence of
        drift
      evidence: static:242 (dcron), 261 (w3m), 306 (app-misc/gpm)
  - id: cfg.portage/profile/package.provided
    path: configs/portage/profile/package.provided
    purpose: Atoms treated as installed, to cut doctrine-violating dependency chains.
    entries:
    - entry: virtual/tmpfiles-0-r7
      why: ppp (and mutt via cyrus-sasl) 'inherit tmpfiles' => virtual/tmpfiles, which on a no-systemd image resolves
        ONLY to systemd-utils[tmpfiles] whose REQUIRED_USE demands python_single_target. Other provider sys-apps/seedfiles
        is a keywordless -9999 live ebuild; opentmpfiles removed from ::gentoo. Disc has no tmpfiles.d processor,
        so snippets are inert anyway; pppd creates its own runtime dirs.
      evidence: package.provided:1-17; commit 38edc8c; AGENTS.md tmpfiles trap
      doctrine: no-python-target
    - entry: media-libs/freetype-2.14.3
      why: font.eclass fonts RDEPEND x11-apps/mkfontscale -> freetype; bitmap-only disc generates fonts.dir at image
        build (scripts/pcf-fontname.py) so never needs it. Version must track the pinned tree; if a repin drifts
        them freetype reappears in the build log.
      evidence: package.provided:19-25; commit 428c5f7
      doctrine: bitmap-only-no-freetype
    - entry: x11-apps/mkfontscale-1.2.4
      why: same chain
      evidence: package.provided:26
    - entry: media-fonts/encodings-1.1.0
      why: same chain
      evidence: package.provided:27
    notes: Version-coupled to the portage snapshot (BUILD_EPOCH=20260811 per AGENTS.md); every epoch bump must re-verify
      these three versions and virtual/tmpfiles-0-r7 or the dep chain silently returns/ the provided-version mismatch
      makes portage ignore the entry. Lives under profile/, so builder must install it at /etc/portage/profile/package.provided
      (path mapping lives in Dockerfile/scripts, not verified).
