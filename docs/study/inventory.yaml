  - what: sysroot/lib/modules/<KVER>/ (modules.dep, modules.builtin*, modules.order, *.ko)
    from: sysroot
    evidence: scripts/build-initrd.sh:230-236
  outputs:
  - what: output/themonolith-$BUILD_VERSION.initrd
    to: output
    evidence: scripts/build-initrd.sh:28,353
  env:
  - INITRD_DIR (/initrd)
  - OUTPUT_DIR
  - CONFIGS_DIR
  - CROSS_TARGET
  - BUILD_VERSION (no default)
  - SOURCE_DATE_EPOCH (fallback 0)
  s3_coupling: none
  notes:
  - gzip, not xz, on purpose (decompression window RAM on 16MB machines); kernel has CONFIG_RD_GZIP=y (lines 334-346).
  - Gentoo's busybox lacks modprobe/insmod (kmod provides them), so kmod is copied as /bin/kmod and symlinked as
    modprobe depmod insmod rmmod lsmod modinfo. Static check via readelf INTERP; falls back to `file`; if neither
    tool exists it only warns and proceeds (line 116).
  - 'All busybox applets symlinked from `busybox --list` executed on the build host: runs the i486 binary on x86_64
    host (works because the container host kernel runs 32-bit x86 ELF - requires CONFIG_IA32_EMULATION on the Docker
    host kernel!).'
  - 'Module closure: inline Python resolves manifest names (dash->underscore) via modules.dep; missing modules are
    WARNINGS (''not bundled''), build still succeeds (lines ~295-300). So a typo or a config change silently drops
    a storage driver and the ISO may not boot on that hardware.'
  - 'KVER=$(ls -1 modules | head -1): assumes exactly one kernel version dir (line 232).'
  - depmod -b $INITRD_DIR $KVER regenerates modules.* for exactly the bundled set (line 303); depmod here is kmod's
    depmod from the BUILD HOST (host kmod), not the i486 one.
  - 'mknod of console/null/zero/tty is `2>/dev/null || true` (lines 219-222): relies on root in container; harmless
    since init mounts devtmpfs.'
  - 'REPRODUCIBILITY: touch -d @SOURCE_DATE_EPOCH on non-symlinks; sorted file list; gzip -n. BUT `cpio -o -H newc`
    is called without --reproducible; GNU cpio writes real inode numbers and nlink for hardlinks, so output may
    differ between runs/filesystems. Not verified; flag for the rebuild''s reproducibility test (line 353).'
  - Symlinks keep their build-time mtime (excluded from touch) - cpio newc stores symlink mtime, another potential
    non-determinism (line 352).
  - Debug listing `find ... | head -50 || true` guarded against SIGPIPE under pipefail (line ~322).
  - 'rm -rf ${INITRD_DIR}/* before build: INITRD_DIR=/initrd is image-internal (not a volume), so it is fresh per
    run.'
  rebuild_notes:
  - 'Carry forward behaviours: static kmod gate; module closure + depmod; busybox symlinks; gzip -9 -n; sorted cpio.'
  - Make missing Tier-1 modules fatal or explicitly allow-listed; use cpio --reproducible and normalise symlink
    mtimes.
  - 'Avoid executing target (i486) binaries on the build host: derive applet list from busybox config/ebuild output.'
- id: script.build-iso
  kind: script
  path: scripts/build-iso.sh
  purpose: Assemble hybrid BIOS (ISOLINUX) + UEFI x64 (GRUB standalone) ISO with xorriso, then patch the GPT partition
    2 type GUID to the EFI System Partition GUID.
  invokes:
  - grub-mkstandalone
  - mkfs.vfat
  - mmd
  - mcopy
  - xorriso
  - python3 (inline)
  invoked_by:
  - make.iso
  inputs:
  - what: 'kernel: output/themonolith-$BUILD_VERSION.vmlinuz else output/vmlinuz'
    from: script.build-packages
    evidence: scripts/build-iso.sh:22-29
  - what: output/themonolith-$BUILD_VERSION.initrd and .squashfs
    from: script.build-initrd, script.build-rootfs
    evidence: scripts/build-iso.sh:30-31
  - what: 'syslinux files: isolinux.bin ldlinux.c32 libutil.c32 libcom32.c32 isohdpfx.bin (Gentoo /usr/share/syslinux
      or Debian /usr/lib/ISOLINUX layouts)'
    from: builder image sys-boot/syslinux
    evidence: scripts/build-iso.sh:37-58
  - what: /configs/bootbg.png (optional)
    from: repo
    evidence: scripts/build-iso.sh:271-275
  outputs:
  - what: output/themonolith-$BUILD_VERSION.iso
    to: output
    evidence: scripts/build-iso.sh:34,501
  env:
  - OUTPUT_DIR
  - BUILD_VERSION (no default)
  - SOURCE_DATE_EPOCH (implicit to xorriso/mkfs.vfat)
  s3_coupling: none
  notes:
  - 'ISOLINUX: TIMEOUT 300 (30 s) to give the boot-test time to type a label; DEFAULT fb800; labels linux fb fb800
    fb640 vga serial debug persist rescue; vga=791/788/785. F1 help text embedded. BOOT LABEL SET is a contract
    with scripts/boot-test.py.'
  - 'GRUB cfg: 7 menuentries (plain, framebuffer video=efifb, serial, debug, rescue, toram, persistent), default
    0, timeout 5, search --label MONOLITH, gfxterm + serial mirror. Note ISOLINUX has no ''toram'' label (documented
    as appended param) but GRUB does.'
  - grub-mkstandalone --format=x86_64-efi only - 32-bit UEFI (bootia32.efi) NOT built although GRUB_PLATFORMS includes
    efi-32 in the Dockerfile (header comment lines 4-6).
  - 'ESP image efi.img: size computed (>=8 MB), FAT16, label EFIBOOT, populated via mmd/mcopy; used as second El
    Torito entry with -isohybrid-gpt-basdat; -iso_mbr_part_type 0x00; volume id MONOLITH.'
  - 'Python GPT patch rewrites partition entry #2 type GUID to C12A7328-F81F-11D2-BA4B-00A0C93EC93B and recomputes
    CRCs of primary and backup GPT (requires partition-array offsets: primary LBA 2, backup total-33).'
  - '`log_error` is called in the syslinux-detection block (line 56) BEFORE log_error is defined (line 74): command-not-found,
    but set -e exits anyway; message is lost. Error hints reference non-existent make targets (''make build-kernel'',
    ''make initrd'', ''make rootfs'') (lines 81,87,93).'
  - 'NON-DETERMINISM: no explicit timestamp flags to xorriso (relies on xorriso honouring SOURCE_DATE_EPOCH), mkfs.vfat
    volume serial/time, grub-mkstandalone embedded timestamps, mcopy mtimes use current time, ISO temp via mktemp.
    Whether the ISO digest is reproducible across builds is NOT proven here. The attestation ''digest chain'' only
    requires consistency within a build.'
  - 'Writes ISO to /tmp first (comment: xorriso/libburn fails on some bind mounts), then mv to /output and chmod
    644 (so a host user can read it).'
  - Comment says GRUB pinned to 2.12 (Ubuntu 24.04) to dodge a 2.14 Hyper-V regression; nothing pins it (Dockerfile
    pulls sys-boot/grub from TOOLCHAIN_EPOCH tree).
  - Kernel boots 32-bit bzImage from 64-bit UEFI via EFI handover protocol (comment lines 258-262).
  - 'No privileged operations: xorriso -as mkisofs, dd to a file, mkfs.vfat on a file, mtools - all file-based,
    no loop mounts.'
  rebuild_notes:
  - Boot-test oracle drives which labels/entries must exist; preserve every ISOLINUX label name and GRUB entry flag
    exactly (tests type labels).
  - Carry forward the GPT ESP GUID patch (or find a xorriso flag that does it).
  - Decide on reproducibility goal and pass --set_all_file_dates / -volume_date / SOURCE_DATE_EPOCH explicitly.
- id: script.binpkg-store
  kind: script
  path: scripts/binpkg-store.sh
  purpose: GHCR-backed one-blob-per-epoch store for the binpkg tree. Subcommands pack, push, pull, prune, prune-predicate,
    pull-is-benign-miss.
  invokes:
  - tar
  - zstd
  - oras
  invoked_by:
  - wf.build (build.yml:269 pull
  - 456 prune
  - 458 pack
  - 462 push)
  inputs:
  - what: PKGDIR (default <repo>/output/packages), versions.lock
    from: local
    evidence: scripts/binpkg-store.sh:78-83
  - what: ghcr.io/<owner>/monolith-binpkgs:<epoch> OCI artifact (single layer, media type application/vnd.oci.image.layer.v1.tar+zstd)
    from: ext.ghcr
    evidence: scripts/binpkg-store.sh:84,325-326
  outputs:
  - what: output/binpkgs.tar.zst (tar --sort=name --numeric-owner --owner=0 --group=0 --mtime=@SOURCE_DATE_EPOCH|0
      | zstd -T0)
    to: local
    evidence: scripts/binpkg-store.sh:306-310
  - what: OCI artifact tag = BUILD_EPOCH
    to: ext.ghcr
    evidence: scripts/binpkg-store.sh:338
  secrets:
  - GHCR auth is assumed done by caller (oras/docker login); GITHUB_REPOSITORY_OWNER fallback for owner
  external:
  - ext.ghcr
  pins:
  - thing: IMAGE_REPO
    value: monolith-binpkgs
    evidence: scripts/binpkg-store.sh:87
  env:
  - GHCR_OWNER
  - GITHUB_REPOSITORY_OWNER
  - BUILD_EPOCH
  - PKGDIR
  - VERSIONS_LOCK
  - BINPKG_TARBALL
  - SOURCE_DATE_EPOCH
  s3_coupling: none
  notes:
  - 'prune keeps, per <CAT>/<PN>, only the newest PVR (own Gentoo version comparator _bp_version_gt, documented
    limits: no leading-zero string compare, unknown suffix tokens dropped) PLUS the versions.lock pin; deletes every
    other gpkg; removes Packages and Packages.gz index (rebuilt by emaint binhost --fix in build-packages.sh).'
  - 'BUILDID dimension: gpkgs of the same PVR with different BUILDIDs (multi-instance) are NOT pruned against each
    other; a PVR keeps all its build ids.'
  - 'pull FAILS OPEN on: missing oras (warn, empty dir, exit 0); and benign-miss text match ''not found|manifest
    unknown|name unknown|404|unauthorized|denied|401'' (function _bp_pull_is_benign_miss). Because GHCR returns
    401/denied for a never-pushed repo, the classifier also treats a REAL auth failure as a benign miss => a revoked/wrong
    token silently yields an empty cache and a full source rebuild with exit 0 (smell; documented in the function
    comment).'
  - Real unexpected errors (other text) and unpack failures exit 1.
  - push does `cd $dir && oras push` so the layer title is the basename (oras rejects absolute paths).
  - pack deterministic (sorted, numeric owner, fixed mtime) but compression output of zstd -T0 is deterministic
    for fixed input and level default.
  - 'Replaced the S3 per-object `aws s3 sync packages/<epoch>/` flow (cost reason: egress).'
  rebuild_notes:
  - 'Whole design survives (no S3): keep OCI blob per epoch; consider keying by hash of (BUILD_EPOCH + toolchain
    + configs) instead of epoch alone because savedconfig-cache.sh exists to paper over a key that ignores config
    content.'
  - Treat 401 as benign only when the repository is known not to exist, or distinguish via an explicit existence
    probe.
  - scripts/tests/binpkg-store.test.sh (ALL PASS) pins the prune predicate and benign-miss classifier.
