- id: make.build-image
  kind: make-target
  path: Makefile
  purpose: Obtain builder image monolith-builder - pull from GHCR if present else build base-tools via buildx, run
    crossdev in a named container, docker commit.
  prerequisites:
  - ensure-dirs
  invokes:
  - docker.base-tools
  invoked_by:
  - make.push-image
  - make.all
  - make.bump-pins
  - wf.build
  inputs:
  - what: ghcr image $(REGISTRY_IMAGE):$(REGISTRY_TAG) and -base-tools twin
    from: ext.ghcr
    evidence: Makefile:269-272
  - what: Dockerfile, configs/portage/crossdev.lock, versions.lock (binutils, kernel major.minor)
    from: repo
    evidence: Makefile:28-40,284-286
  - what: gentoo/stage3 tag + upstream portage snapshot (emerge-webrsync in Dockerfile)
    from: ext.dockerhub, ext.gentoo-distfiles
    evidence: Dockerfile:30,74
  outputs:
  - what: local images monolith-builder-base-tools and monolith-builder
    to: local docker
    evidence: Makefile:282,321
  - what: crossdev logs
    to: output/portage-logs/ via LOGS_MOUNT
    evidence: Makefile:296
  docker_flags: 'buildx build --target base-tools --cache-from [ghcr base-tools if REGISTRY] --cache-from local
    base-tools --cache-to type=inline (Makefile:277-283); crossdev step is `docker run --name monolith-crossdev-build`
    with ONLY the portage-logs mount: no configs/distfiles/portage volumes, no --rm, no --privileged (Makefile:295-297)'
  secrets: []
  external:
  - ext.ghcr
  - ext.dockerhub
  - ext.gentoo-distfiles
  - ext.gentoo-mirrors
  - ext.rustup
  - ext.github-api
  pins:
  - thing: TOOLCHAIN_EPOCH
    value: '20260810'
    evidence: Makefile:28
  - thing: crossdev musl/gcc/binutils/headers
    value: from lock files
    evidence: Makefile:303-309
  env:
  - REGISTRY (default ghcr.io/tuckermclean)
  - TOOLCHAIN_EPOCH
  - BUILD_EPOCH
  - CROSS_TARGET (image ENV)
  s3_coupling: none
  notes:
  - 'Registry pull failure is swallowed: `docker pull ... 2>/dev/null` falls through to a LOCAL BUILD with only
    an echo (Makefile:269,275). Because the TOOLCHAIN_EPOCH snapshot has been pruned upstream, that local build
    now fails (AGENTS.md time-bomb) - so a GHCR miss turns into a hard failure with a misleading message.'
  - The -base-tools pull is `|| true` best effort (Makefile:271-272); if it fails the later local-build path uses
    stale/absent BASE_TOOLS_IMAGE.
  - Crossdev script inlines `emerge --update --newuse cross-$CROSS_TARGET/gcc` after crossdev, then rm distfiles
    and mkdir of /usr/$CROSS_TARGET/etc/portage/{package.use,package.accept_keywords,package.mask,package.env,env}
    and /build /configs /output /initrd (Makefile:311-315).
  - Mask line `=cross-%s/gcc-14.4.9999` is stale (gcc pin is 15.x) and only blocks a 14.x live ebuild (Makefile:299-301).
    musl-9999 and binutils-9999 live ebuilds masked; musl $(CROSS_MUSL_VER)* explicitly unmasked.
  - Skip-rebuild cache key (base-tools-hash label) does not include the inline bash -c crossdev script text, so
    editing the crossdev command in the Makefile does not trigger a rebuild (Makefile:284-290).
  - docker commit of a container is not reproducible (timestamps, layer digests) so image identity = label hash,
    not content.
  - Final image sets ENV BUILD_DIR=/build CONFIGS_DIR=/configs OUTPUT_DIR=/output via --change (Makefile:317-319);
    build-packages.sh later `unset BUILD_DIR` because multilib-minimal.eclass breaks on it.
  - After docker commit the committed image has NO ENTRYPOINT/CMD change; helper stages rely on /scripts bind mounts
    at runtime.
  rebuild_notes:
  - Keep the two-pin split (toolchain vs runtime tree) and the registry tag keyed on everything-but-runtime-pins.
  - Replace docker-commit-of-crossdev with a proper multi-stage Dockerfile if possible; the commit trick exists
    only to capture portage logs on the host.
  - Needs a mirrored toolchain snapshot (or a digest-pinned prebuilt builder) - upstream snapshot is gone.
