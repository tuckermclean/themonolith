  outputs:
  - what: output/sysroot
    to: local
    evidence: scripts/extract-packages.sh:109-135
  external: []
  env:
  - CROSS_TARGET
  - CONFIGS_DIR
  - OUTPUT_DIR
  - JOBS
  - LOAD_AVG
  - BUILD_VERSION (passed by Makefile VERSION_ENV
  - unused)
  s3_coupling: none
  notes:
  - 'Uses --keep-going with --usepkgonly (lines 83-89): comment admits it silently dropped net-dns/dnsmasq due to
    an acct-user/dnsmasq UID race (nondeterministic), so it force-installs the binary with --nodeps afterwards (lines
    91-107). Recovery result is only an echo; script still exits 0 if dnsmasq is absent (line 104 `|| true`, WARNING
