    rw: WRITE S3 versioned + latest; output/vmlinuz copied to versioned name first; kernel uploaded BEFORE build-rootfs/iso
      (so a failed ISO build still leaves a new 'latest' vmlinuz)
    evidence: build.yml:498-503
  - cmd: aws s3 cp squashfs -> s3://$S3_BUCKET/themonolith-$BV.squashfs then cp to themonolith.squashfs
    rw: WRITE S3
    evidence: build.yml:517-521
  - cmd: aws s3 cp initrd -> s3://$S3_BUCKET/themonolith-$BV.initrd then cp to themonolith.initrd
    rw: WRITE S3; initrd produced by build-rootfs
    evidence: build.yml:526-530
  - cmd: aws s3 cp iso -> s3://$S3_BUCKET/themonolith-$BV.iso then cp to themonolith.iso
    rw: WRITE S3 (release.yml reads the versioned ISO)
    evidence: build.yml:544-546
  pins:
  - thing: oras
    value: 1.2.0
    evidence: build.yml:234
  - thing: actions/checkout
    value: '@v4'
    evidence: build.yml:188
  - thing: aws-actions/configure-aws-credentials
    value: '@v4'
    evidence: build.yml:212
  - thing: docker/login-action
    value: '@v3'
    evidence: build.yml:219
  - thing: actions/upload-artifact
    value: '@v4'
    evidence: build.yml:298
  - thing: actions/cache/save
    value: '@v4'
    evidence: build.yml:509,536
  caches:
  - action: cache/save
    key: ci-artifacts-${{github.run_id}}-squashfs
    path: output/themonolith-$BUILD_VERSION.squashfs
    evidence: build.yml:508-512
  - action: cache/save
    key: ci-artifacts-${{github.run_id}}-iso
    path: output/themonolith-$BUILD_VERSION.iso
    evidence: build.yml:535-539
  artifacts:
  - upload: package-build-logs-${run_id}
    path: output/logs/
    if: failure()
    retention: 7d
    evidence: build.yml:296-303
  external:
  - ext.ghcr
  - ext.aws-s3
  - ext.github-api
  s3_coupling: hard
  s3_detail: 'Hard: configure-aws-credentials (211) and sync-portage (250) must succeed; S3 uploads gated on PUBLISH_LATEST
    (master/tag only). PR/dispatch builds still hard-fail at AWS cred step and sync-portage because both are unconditional.'
  ci_assertions:
  - id: assert.i2c-off
    step: Assert resolved kernel config did not escalate CONFIG_I2C
    location: build.yml:312-313
    condition: sh scripts/verify-resolved-i2c-off.sh configs/kernel.config (single arg => mode label 'unknown').
      Fails if file missing, or `gunzip -c|cat cfg | grep -q '^CONFIG_I2C=y$'` matches (scripts/verify-resolved-i2c-off.sh:36-48).
    reads: configs/kernel.config on the runner AFTER build-packages overwrote it with the resolved post-olddefconfig
      config (bind-mounted at /configs; copied out by scripts/build-packages.sh from /usr/share/monolith-kernel/resolved-kernel.config.gz
      shipped by the monolith-kernel ebuild - per script header, DCX-99).
    oracle_note: Only CONFIG_I2C=y is checked; =m or unset passes.
  - id: assert.nic-modules
    step: Assert NIC kernel modules built and shipped
    location: build.yml:323-353
    condition: 'KVER = field 2 of line ''^sys-kernel/monolith-kernel:'' in configs/portage/versions.lock with ''-rN''
      suffix stripped (326); LOCALVERSION = value of ''^CONFIG_LOCALVERSION="..."'' in configs/kernel.config (327);
      MODDIR=output/sysroot/lib/modules/${KVER}${LOCALVERSION}; fail if dir missing (330-333); for each of 23 names
      find "$MODDIR" -name "<m>.ko*" must return a hit (345): ne wd smc-ultra lance 3c509 pcnet32 tulip via-rhine
      natsemi sis900 e1000 e1000e igb sky2 r8169 vmxnet3 nf_conntrack nf_nat nf_tables nft_ct nft_nat nft_masq nf_defrag_ipv4.
      Fail (exit 1) listing missing.'
    module_list:
    - ne
    - wd
    - smc-ultra
    - lance
    - 3c509
    - pcnet32
    - tulip
    - via-rhine
    - natsemi
    - sis900
    - e1000
    - e1000e
    - igb
    - sky2
    - r8169
    - vmxnet3
    - nf_conntrack
    - nf_nat
    - nf_tables
    - nft_ct
    - nft_nat
    - nft_masq
    - nf_defrag_ipv4
    note: 'Comment says ''21 new symbols'' but list is 23 incl. 7 netfilter. Runs after build-packages and BEFORE
      build-rootfs: relies on output/sysroot/ from build-packages.'
  - id: assert.fbdev-modules
    step: Assert legacy fbdev kernel modules built and shipped
    location: build.yml:362-423
    condition: same KVER/LOCALVERSION/MODDIR derivation (365-368); installs kmod via apt if `modinfo` absent (373-375);
      all 27 names must exist as <m>.ko* under MODDIR (388-399); then for each found path `modinfo -F firmware <path>`
      must succeed (nonzero exit => fail with stderr, 404-413) and must print EMPTY (non-empty => FIRMWARE_HITS
      => fail 'violates the no-blob doctrine', 415-422).
    module_list:
    - cirrusfb
    - pm2fb
    - pm3fb
    - cyber2000fb
    - vga16fb
    - hgafb
    - nvidiafb
    - rivafb
    - i740fb
    - matroxfb_base
    - radeonfb
    - aty128fb
    - atyfb
    - s3fb
    - savagefb
    - sisfb
    - neofb
    - kyrofb
    - tdfxfb
    - sstfb
    - vt8623fb
    - tridentfb
    - arkfb
    - sm712fb
    - lxfb
    - gxfb
    - gx1fb
    note: Comment (376-379) says names resolved at kernel v6.12.80; module names are coupled to kernel version.
      Firmware doctrine = no module may declare MODULE_FIRMWARE.
  - id: assert.attestation-summary-pass
    step: (in attestation job, see there)
  notes:
  - Kernel version/localversion are read from the checked-in files, but configs/kernel.config on the runner is mutated
    by the build (resolved config copied over it) - the LOCALVERSION grep depends on that file surviving; configs/kernel.config
    in git is the pinned config.
  - 'Savedconfig + prune + push steps run with if: always() even when build failed (partial cache).'
  - Step 'Take ownership' failed in the recorded 10-26 run only because output/packages didn't exist (cascade from
    AWS failure).
  - Disk-space watchdog loop `while true ... &` (287) is a leftover debugging aid; never killed.
  - 'PUBLISH_LATEST is written to GITHUB_ENV in an always() step AFTER ''Save build logs''? No: step order is publish(468)
    then logs(491) - OK. But earlier failed steps skip later non-always steps.'
  - Kernel image uploaded to 'latest' before the ISO is built/tested => 'latest' vmlinuz/squashfs/initrd/iso are
    overwritten BEFORE boot-test runs on master. Only the attestation/release gate is after boot-test. Public latest
    is not gated on boot-test.
  - No timeout; build step needs 30-60min from source per AGENTS.md.
  rebuild_notes:
  - 'Oracle: the three assertions above are the CI acceptance conditions for kernel config; module lists are exact.'
  - Static AWS keys, not OIDC. Replace with GHCR/GitHub-native storage.
  - Publishing 'latest' pointers before boot-test is a design smell to fix.
- id: job.build.boot-test
  kind: job
  path: .github/workflows/build.yml:559
  purpose: Call reusable boot-test workflow for the freshly built ISO.
  triggers:
  - push
  - pull_request
  - dispatch
  - schedule
  - tag
  needs:
  - build
  if: needs.build.result == 'success'
  runner: n/a (reusable workflow call)
  permissions: inherited from workflow (contents:read, packages:write) - callee jobs get no id-token
  timeout: default-360 per callee job
  invokes:
  - wf.boot-test
  inputs:
  - what: build-version = needs.build.outputs.build-version
    from: job.build.build
    evidence: build.yml:563-564
  secrets_passed: 'secrets: inherit (565) - unnecessary; callee uses none'
  s3_coupling: none
  notes:
  - Hands the ISO via actions cache key ci-artifacts-<run_id>-iso.
- id: job.build.attestation
  kind: job
  path: .github/workflows/build.yml:567
  purpose: Generate SBOM/SLSA/CVE/license/unowned attestation for the built ISO, sign provenance with Sigstore,
    publish attestation + dashboard to S3.
  triggers:
  - push
  - pull_request
  - dispatch
  - schedule
  - tag
  needs:
  - build-image
  - build
  - boot-test
  if: always() && build-image.result=='success' && build.result=='success' && boot-test.result=='success' (575-579)
  runner: ubuntu-latest
  permissions:
    contents: read
    packages: read
    id-token: write
    attestations: write
  timeout: default-360
  invokes:
  - make.pull-image
  - make.ensure-dirs
  - make.ensure-volume
  - make.grype-db-update
  - make.attestation
  - make.dashboard
  - script.attestation
  secrets:
  - secret.AWS_ACCESS_KEY_ID
  - secret.AWS_ACCESS_KEY_SECRET
  - secret.AWS_REGION
  - secret.S3_BUCKET
  - secret.GITHUB_TOKEN
  commands:
  - cmd: docker pull gentoo/stage3:amd64-openrc-${BUILD_EPOCH} -q 2>/dev/null || true; docker inspect --format '{{index
      .RepoDigests 0}}' | grep -oP '(?<=@)sha256:\S+' || echo ''
    rw: reads Docker Hub; STAGE3_DIGEST exported to env for attestation.sh; stderr suppressed (2>/dev/null) and
      failure swallowed => empty digest silently
    evidence: build.yml:595-599
  - cmd: sudo apt-get install -y squashfs-tools
    evidence: build.yml:623
  - cmd: unsquashfs -d output/sysroot output/themonolith-$BV.squashfs
    rw: re-extracts sysroot from the cached squashfs (reads cache)
    evidence: build.yml:634
  - cmd: make grype-db-update GRYPE_CACHE_DIR=output/grype-db
    rw: downloads Grype DB (ext.grype-db) into cached dir
    evidence: build.yml:662
  - cmd: 'make attestation BUILD_VERSION=$BV GRYPE_CACHE_DIR=output/grype-db  (continue-on-error: true; env S3_BUCKET)'
    rw: writes output/attestation/{bom.cdx.json,builder-bom.cdx.json,slsa-provenance.json,attestation-summary.json,...};
      S3_BUCKET only used to build SBOM distribution URL
    evidence: build.yml:668-673
  - cmd: python3 -m pip install --user check-jsonschema==0.38.0 (fallback --break-system-packages); timeout 180
      python3 -m check_jsonschema --base-uri file://configs/attestation/schemas/ --schemafile bom-<specVersion>.schema.json
      <sbom>
    rw: validates output/attestation/bom.cdx.json and builder-bom.cdx.json offline
    evidence: build.yml:708-751
  - cmd: python3 -c json.load slsa-provenance.json['predicate'] -> step output predicate
    evidence: build.yml:757-766
  - cmd: actions/attest@v2 subject-path output/themonolith-$BV.iso predicate-type https://slsa.dev/provenance/v1
      predicate=<json>
    rw: Sigstore sign + persist to GitHub attestations store
    evidence: build.yml:772-777
    if: always() && read-predicate.outcome=='success' && verdict.outputs.overall=='pass'
  - cmd: aws s3 sync output/attestation/ s3://$S3_BUCKET/attestation/$BV/
    rw: WRITE S3; only if build.outputs.publish-latest=='true'
    evidence: build.yml:785-786
  - cmd: aws s3 sync s3://$S3_BUCKET/attestation/ output/all-attestation/ --exclude '*' --include '*/attestation-summary.json'
    rw: READ S3 all historical summaries
    evidence: build.yml:798-799
  - cmd: make dashboard ATTEST_INPUT_DIR=output/all-attestation
    rw: generate-dashboard.py builds builds-index.json + copies SPA to output/web/
    evidence: build.yml:802
  - cmd: aws s3 sync output/web/ s3://$S3_BUCKET/ --exclude 'attestation/*' --exclude 'packages/*' --exclude 'builds/*'
    rw: WRITE S3 bucket root (public dashboard SPA)
    evidence: build.yml:808-809
  steps_ordered_names:
  - Set build version(583)
  - Configure AWS(601)
  - GHCR login(608)
  - make pull-image(615)
  - ensure-dirs/volume(620)
  - squashfs-tools(622)
  - restore squashfs cache(625)
  - unsquashfs(632)
  - restore ISO cache(636)
  - grype cache key(643)
  - grype cache(647)
  - make grype-db-update(661)
  - make attestation(664
  - continue-on-error)
  - Read verdict(675)
  - pip cache(691)
  - Validate CycloneDX(704)
  - Read SLSA predicate(753)
  - Sign(768)
  - Upload attestation to S3(779)
  - Generate and upload site(788)
  - Fail if attestation failed(811)
  pins:
  - thing: actions/attest
    value: '@v2'
    evidence: build.yml:772
  - thing: check-jsonschema
    value: 0.38.0
    evidence: build.yml:708
  - thing: actions/cache
    value: '@v4'
    evidence: build.yml:654,699; cache/restore 626,637
  - thing: gentoo/stage3 tag
    value: amd64-openrc-${BUILD_EPOCH}
    evidence: build.yml:595
  caches:
  - action: cache/restore
    key: ci-artifacts-${run_id}-squashfs
    fail-on-cache-miss: true
    evidence: build.yml:625-630
  - action: cache/restore
    key: ci-artifacts-${run_id}-iso
    fail-on-cache-miss: true
    evidence: build.yml:636-641
  - action: cache
    key: grype-db-<date -u +%Y-%V>
    restore-keys: grype-db-
    path: output/grype-db
    evidence: build.yml:643-659
  - action: cache
    key: pip-check-jsonschema-0.38.0
    path: ~/.cache/pip
    evidence: build.yml:698-703
  external:
  - ext.ghcr
  - ext.dockerhub
  - ext.grype-db
  - ext.sigstore
  - ext.github-attestations
  - ext.aws-s3
  - ext.nvd
  s3_coupling: hard
  s3_detail: 'Hard: Configure AWS credentials unconditional (601); S3 writes gated on publish-latest (master/tag).
    Final gate does not depend on S3 but job fails earlier at AWS creds today. The SBOM distribution URL embeds
    S3_BUCKET.'
  ci_assertions:
  - id: assert.sbom-schema
    location: build.yml:704-751
    condition: Both output/attestation/bom.cdx.json and builder-bom.cdx.json (missing file => skipped with return
      0) must validate against vendored configs/attestation/schemas/bom-<specVersion>.schema.json (specVersion default
      1.6); missing vendored schema => hard error; 180s timeout.
  - id: assert.verdict-gates-signing
    location: build.yml:675-689,773
    condition: attestation-summary.json .overall must equal 'pass' for actions/attest to run; missing file => 'fail'.
  - id: assert.attestation-pass
    location: build.yml:811-822
    condition: output/attestation/attestation-summary.json must exist and .overall == 'pass', else exit 1. This
      is what makes the Build run (and therefore Release) red when CVE/license/unowned gate fails. `make attestation`
      itself is continue-on-error so the failure surfaces here.
  notes:
  - 'Order hazard: ''Upload attestation artifacts to S3'' and ''Generate and upload site'' run even if overall!=pass
    (no verdict check on 783/791); only the final step fails. So S3 attestation/<ver>/ and the public dashboard
    are written for FAILED attestations too, and release.yml would never run (Build red) - OK, but dashboard shows
    failure by design.'
  - Signing step and read-predicate use always(); the Validate SBOM step failing does NOT block signing (no dependency)
    - only the end of job fails after signing.
  - STAGE3_DIGEST swallow-errors (595-598) hides pull failure.
  - Re-extracts squashfs (unsquashfs) just to give attestation.sh a sysroot - duplicate work.
  - Release.yml re-verification relies on this job's S3 output.
  rebuild_notes:
  - Must remain build.yml-entry-point for attest@v2 persist (see header). A reusable design would need the same
    trigger/cert identity.
  - 'Digest chain: sha256(ISO) computed once in scripts/attestation.sh -> SBOM metadata.component.hashes[0] and
    SLSA subject.'
- id: wf.boot-test
  kind: workflow
  path: .github/workflows/boot-test.yml
  purpose: 'Reusable workflow: boot the ISO in QEMU across 20 scenarios (BIOS/UEFI/toram/AHCI/NVMe/USB/virtio/nicless/gui/stele/nic/vga/fbdev/nat/clock/persist).
    Acceptance oracle for boot.'
  triggers:
  - workflow_call input build-version (string, required) (boot-test.yml:25-30)
  invokes:
  - job.boot-test.expected-kernel
  - job.boot-test.bios
  - job.boot-test.uefi
  - job.boot-test.toram-eject
  - job.boot-test.ahci
  - job.boot-test.nvme
  - job.boot-test.usb
  - job.boot-test.virtio
  - job.boot-test.nicless
  - job.boot-test.gui
  - job.boot-test.stele-acid2
  - job.boot-test.nic-models
  - job.boot-test.vga-models
  - job.boot-test.fbdev-modprobe
  - job.boot-test.nat-router
  - job.boot-test.clock-epoch
  - job.boot-test.clock-1996
  - job.boot-test.persist
  invoked_by:
  - job.build.boot-test
  permissions: none declared -> inherits caller's (contents:read, packages:write)
  secrets: []
  external: []
  s3_coupling: none
  notes:
  - 'Entire workflow is S3-free: ISO comes from actions cache key ci-artifacts-${{github.run_id}}-iso written by
    build.job. Fully reusable after S3 loss.'
  - Every job repeats the same 5 boilerplate steps (checkout, setup-python 3.12, apt install qemu[+ovmf], pip install
    pexpect, cache restore) ~18x - duplication; pexpect/qemu/ovmf unpinned.
  - Header comment (8-22) says a 'future release.yml' will call this; release.yml no longer builds - stale.
  - Only build.yml calls it; there is NO workflow_dispatch/direct trigger, so a boot test cannot be run standalone
    against an arbitrary ISO.
  - Cache restore uses fail-on-cache-miss; cache is branch-scoped by run so a re-run of boot-test jobs only (partial
    re-run) works while cache lives (7-day eviction).
  - 'No timeout-minutes on any boot job: a hung QEMU relies on boot-test.py''s own timeouts.'
  rebuild_notes:
  - 'Per-job (not one job) structure parallelises ~20 boots; the pexpect-driven scripts/boot-test.py --mode X is
    the real oracle. Preserve: mode list, RAM sizes, args below.'
