    asserts:
    - usage/exit codes (no args 2, --help 0, unknown cmd 2)
    - init <dev> --yes/-y runs `mkfs.ext4 -F -L MONOLITH_PERSIST <dev>`
    - interactive confirm names device, warns ERASE ALL DATA, shows blkid contents; 'no'/EOF abort without mkfs
    - missing mkfs.ext4 and mkfs failure surfaced non-zero
    - --swap N / --swap=N creates swapfile via mkswap with swapon hint; non-numeric and 0 rejected before mkfs
    - unknown option / extra positional rejected
    runtime: 0.32s
