    to: docker volume
    evidence: Makefile:388-389
  docker_flags: DOCKER_RUN (all standard mounts) + -v output/portage-mirror:/var/monolith-portage-mirror (read-write;
    SNAP_MOUNT Makefile:381) + -e BUILD_EPOCH -e SYNC_MIRROR_DIR. Step 1 runs ON THE HOST with `sh scripts/sync-portage.sh
    fetch-only` (needs aws cli + wget on host).
