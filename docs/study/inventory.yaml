  runner: ubuntu-latest
  permissions:
    contents: write
    pull-requests: write
    issues: write
    actions: write
    packages: write
  timeout: 355 minutes
  invokes:
  - make.ensure-dirs
  - script.update-build-pins
  - make.push-image
  - make.build-image
  - wf.build
  commands:
  - cmd: gh label create toolchain-bump|needs-fixup|validated --force
    evidence: toolchain-bump.yml:88-93
  - cmd: docker pull/tag monolith-builder:latest and -base-tools:latest from GHCR (cache)
    evidence: toolchain-bump.yml:106-109
  - cmd: scripts/update-build-pins.sh update-toolchain "$target_epoch"
    rw: edits Dockerfile TOOLCHAIN_EPOCH, regenerates configs/portage/crossdev.lock from pre-bump image (one-cycle
      lag)
    evidence: toolchain-bump.yml:121
  - cmd: make push-image (build + push)
    rw: WRITE GHCR monolith-builder; rc captured non-fatally
    evidence: toolchain-bump.yml:137
  - cmd: git push -u origin toolchain/bump-OLD-NEW; gh workflow run build.yml --ref ...; poll gh run view up to
      240 min; gh pr create --base master --label ...
    evidence: toolchain-bump.yml:177-188
    222-224: null
    309-314: null
  secrets:
