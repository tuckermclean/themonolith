    line: 541
  commands:
  - cmd: aws-actions/configure-aws-credentials@v4 with static keys (not OIDC)
    evidence: build.yml:211-216
  - cmd: curl -fsSL -o oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz;
      tar; sudo mv oras /usr/local/bin
    rw: network read; no checksum verify
    evidence: build.yml:235-241
  - cmd: bash scripts/binpkg-store.sh pull $GHCR_OWNER $BUILD_EPOCH output/packages
    rw: reads oras ghcr.io/<owner>/monolith-binpkgs:<epoch> -> output/packages (fails open); skipped on tags
    evidence: build.yml:269
  - cmd: bash scripts/savedconfig-cache.sh check output/packages
    rw: deletes stale savedconfig-governed binpkgs; non-tag only
    evidence: build.yml:279
  - cmd: bash scripts/savedconfig-cache.sh mark output/packages
    rw: 'writes hash markers into binpkg tree (if: always())'
    evidence: build.yml:440
  - cmd: bash scripts/binpkg-store.sh prune output/packages ; ... pack output/packages ; ... push $GHCR_OWNER $BUILD_EPOCH
    rw: prune superseded gpkgs (keeps newest PVR + versions.lock pins), pack, oras push to GHCR monolith-binpkgs:<epoch>;
      each failure -> ::warning only, never fails job; also runs on TAG builds
    evidence: build.yml:455-466
  - cmd: aws s3 sync output/logs/ s3://$S3_BUCKET/builds/$BUILD_VERSION/logs/
    rw: WRITE S3; if always()&&PUBLISH_LATEST
    evidence: build.yml:493
  - cmd: aws s3 cp output/themonolith-$BV.vmlinuz s3://$S3_BUCKET/themonolith-$BV.vmlinuz then server-side cp to
