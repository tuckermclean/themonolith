  harness:
    summary: 'scripts/boot-test.py (2528 lines) is a pexpect-driven QEMU harness. main() parses args, picks a RAM
      default per mode, requires the ISO to exist (exit 2 if not), and runs up to 3 launch attempts of _run_once.
      _run_once builds the argv from MODE_BUILDERS[mode], pexpect.spawn()s QEMU with encoding utf-8, optionally
      tees the serial stream to --log-file, calls MODE_RUNNERS[mode](child, args), converts BootTestError/pexpect
      errors into FAIL, force-kills QEMU if still alive. All guest interaction is over the serial console (-nographic
      -serial mon:stdio); there is no login (agetty -n -l monolith-console) and no PS1 matching. Exit 0 = PASS,
      1 = FAIL, 2 = ISO missing or pexpect missing (:119-123, :2499). Requires python pexpect, qemu-system-i386
      (BIOS modes), qemu-system-x86_64 + OVMF (UEFI modes), mkfs.ext4 (persist). Not runnable from this repo without
      a built ISO. 17 modes in MODE_RUNNERS (:2323).

      '
    guest_command_protocol: 'run_check(child,name,cmd,validator,timeout=30) sends `cmd; echo MONOLITH_CHECK_<hex>:$?`,
      expects the sentinel regex, hands (exit_code, output) to a validator; never raises (timeouts/EOF become failed
      checks). Validators: contains, contains_with_exit, regex_matches, regex_absent, exit_code_only, exact_value,
      epoch_close_to (the last is DEAD CODE - unused since clock-epoch dropped the fixture server). Results are
      collected, all printed as [PASS]/[FAIL] lines via report_results, then poweroff.

      '
    full_smoke_suite:
      used_by:
      - bootmode.bios
      - bootmode.uefi
      checks:
      - uname -r contains --kernel-version (substring match, so an empty expected version would always pass)
      - lsmod ^e1000 (NIC is a module, coldplugged)
      - ip link show eth0 matches eth0:.*UP
      - 'DHCP: if udhcpc exists run `udhcpc -i eth0 -n -q -t 5 -T 3`, else assert `ip -4 addr show eth0` has an
        IPv4 inet (lease from boot-time dhcpcd, S40network)'
      - curl --version contains curl
      - 'sqlite3 :memory: ''select 41+1;'' contains 42'
      - perl -e 'print $];' contains 5.0 (loose; comment says tighten once major known)
      - perl strict+warnings program prints ok
      - perl -Mutf8 -CS uc(e-acute) exit 0 (unicore tables survived pruning)
      - perl -MCGI CGI->new(q(x=42))->param(q(x)) contains 42
      - guestbook.cgi (REQUEST_METHOD=GET QUERY_STRING name=Ada&message=Hello+from+1996) output contains 'Ada|Hello
        from 1996', and independent `sqlite3 -list -separator '|'` re-query of /tmp/guestbook.db returns same row
      - mount output matches `type overlay`
      - '`MANPAGER=cat PAGER=cat man ls | head -5` matches LS or ls (mandoc)'
      - monolith help exit 0; monolith tools contains monolith-router; `notacommand` exits 127 with 'not on the
        disc'
    reduced_smoke_suite:
      used_by:
      - bootmode.toram
      checks:
      - uname -r
      - e1000 module
      - eth0 UP
      - overlay mount
    storage_smoke_suite:
      used_by:
      - bootmode.ahci
      - bootmode.nvme
      - bootmode.usb
      - bootmode.virtio
      checks:
      - uname -r
      - overlay mount
    retry:
      mechanism: 'STARTUP_FLAKE_MAX_ATTEMPTS = 3 (:2422). should_retry_launch(ok, reached_init, attempt, max) (:2425)
        retries ONLY if the run failed AND the guest never reached "[init] Starting init..." (flag child._reached_init
        set in expect_milestone :806-807) AND attempts remain. Any failure after /init is reported without retry.
        Pure logic, unit-tested by test.boot-test-retry. Retry restarts QEMU from scratch (and for persist reformats
        the disk because build_persist_cmd re-runs make_persist_disk). No retry wrapper exists in the workflows
        (grep for retry/nick-fields: none).

        '
      known_gaps: 'A hung bootloader prompt (ISOLINUX ''boot:'' not seen) sends label blindly and then fails at
        the first milestone -> counts as pre-init flake and is retried up to 3x, i.e. 3 x 300 s = 15 min worst case
        plus 90s/180s bootloader waits. nat: client guest is not covered by the launch-flake discriminator.

        '
    timeouts_s:
      boot_milestone_default: 300
      isolinux_prompt: 90
      grub_menu: 180
      shell_ready: 60
      check_default: 30
      poweroff: 90 (x2 with -f fallback)
      qmp_screendump: 25
      stele_render: 180
      nat_dhcp: 45
      nat_curl_poll: 120
      router_up: 60
      monolith_net_probe: 60
    output_files:
    - '--log-file <path>: full serial transcript (child.logfile). nat adds <path>.client; persist adds <path>.boot2'
    - --gui-screendump <path> (default output/gui-screendump.ppm) + <path>.qmp.sock (gui/stele-acid2)
    - --persist-disk <path> (default output/monolith-persist-test.img)
    - 'CI uploads logs as actions/upload-artifact retention-days 14 (boot-test.yml per job), if: always()'
    flags:
    - --iso PATH (required)
    - --mode {bios,uefi,toram,ahci,nvme,usb,virtio,nicless,nic,vga,fbdev-modprobe,nat,gui,stele-acid2,clock-epoch,clock-1996,persist}
      (required)
    - --kernel-version STR (required; expected uname -r substring)
    - '--ram-mb INT (default per MODE_DEFAULT_RAM :2343: bios64 uefi512 toram512 ahci512 nvme512 usb512 virtio512
      nicless64 nic256 vga64 fbdev-modprobe64 nat256 gui128 stele-acid2256 clock-epoch64 clock-1996 64 persist128)'
    - --qemu-i386 (default qemu-system-i386), --qemu-x86_64 (default qemu-system-x86_64)
    - '--ovmf-code PATH (autodetect: /usr/share/OVMF/OVMF_CODE.fd, OVMF_CODE_4M.fd, /usr/share/edk2/ovmf/OVMF_CODE.fd,
      /usr/share/edk2-ovmf/OVMF_CODE.fd)'
    - --boot-timeout SEC (default 300)
    - --cdrom-monitor-id (default ide1-cd0; toram only)
    - --log-file PATH
    - --nic-model {pcnet,rtl8139,tulip,ne2k_pci,ne2k_isa} (nic mode)
    - --vga-model {cirrus} (vga mode)
    - --gui-screendump PATH
    - --rtc-date STR (QEMU -rtc base=; clock modes default it)
    - --persist-disk PATH
    ci_runner_environment: 'ubuntu-latest, actions/setup-python@v5 python 3.12, `apt-get install qemu-system-x86`
      (+ ovmf for ahci/nvme/usb/virtio/uefi), `pip install pexpect` (unpinned), actions/checkout@v4, actions/cache/restore@v4,
      actions/upload-artifact@v4. No KVM (TCG only; slow). No timeout-minutes set on any job (default 360 min).
      All 17 jobs repeat the same 6 setup steps (no composite action).

      '
    ci_job_map:
    - job: job.boot-test.expected-kernel
      modes: []
    - job: job.boot-test.bios
      modes:
      - bootmode.bios
      matrix: ram_mb [64,256]
    - job: job.boot-test.uefi
      modes:
      - bootmode.uefi
    - job: job.boot-test.toram-eject
      modes:
      - bootmode.toram
    - job: job.boot-test.ahci
      modes:
      - bootmode.ahci
    - job: job.boot-test.nvme
      modes:
      - bootmode.nvme
    - job: job.boot-test.usb
      modes:
      - bootmode.usb
    - job: job.boot-test.virtio
      modes:
      - bootmode.virtio
    - job: job.boot-test.nicless
      modes:
      - bootmode.nicless
    - job: job.boot-test.gui
      modes:
      - bootmode.gui
    - job: job.boot-test.stele-acid2
      modes:
      - bootmode.stele-acid2
    - job: job.boot-test.nic-models
      modes:
      - bootmode.nic
      matrix: shell loop 5 models
    - job: job.boot-test.vga-models
      modes:
      - bootmode.vga
      matrix: shell loop 1 model
    - job: job.boot-test.fbdev-modprobe
      modes:
      - bootmode.fbdev-modprobe
    - job: job.boot-test.nat-router
      modes:
      - bootmode.nat
    - job: job.boot-test.clock-epoch
      modes:
      - bootmode.clock-epoch
    - job: job.boot-test.clock-1996
      modes:
      - bootmode.clock-1996
    - job: job.boot-test.persist
      modes:
      - bootmode.persist
    workflow_wiring: 'boot-test.yml is `on: workflow_call` only (input build-version). build.yml job `boot-test`
      (build.yml:559) calls it with needs: build and passes `secrets: inherit` (the callee uses no secrets). The
      build.yml `attestation` job and the release path hang off needs.boot-test.result == success. pr-validate.yml
      never boots anything. Trigger conditions for build.yml: push / schedule / PR with label ''full-ci'' (build.yml:18-60).

      '
    s3_coupling: 'boot-test.yml and boot-test.py have NO S3 dependency: the ISO is passed via the GitHub Actions
      cache (key ci-artifacts-<run_id>-iso). The coupling is upstream: the ISO is produced by build.yml `build`
      job which also uploads to S3 (build.yml:~540). test.sync-portage and test.s3-gc exercise S3 behaviours (stubbed
      aws).

      '
    gotchas_for_rebuild:
    - The ISO file name must be themonolith-<BUILD_VERSION>.iso under output/ (boot-test.yml paths); the harness
      itself takes any --iso path.
    - Boot flow depends on exact serial strings from rootfs/init and build-rootfs.sh (:135-140). Any init rewrite
      must keep them or update the constants.
    - Boot flow depends on isolinux label names (serial) and GRUB menu index 2 = (serial) (build-iso.sh:305-344).
    - 'Guest-side expectations: /usr/sbin/monolith-console lazy shell, bash with PROMPT_COMMAND chain, busybox applets
      hostname/nslookup in the booted rootfs (nat), netstat (net-tools), dhcpcd, nft, dnsmasq, sqlite3, perl+CGI,
      man/mandoc, /usr/lib/cgi-bin/guestbook.cgi, /usr/share/stele/acid2.html, startx, Xfbdev/dwm/st.'
    - Busybox in booted rootfs has no awk applet (comment :2222-2227).
    - 'QEMU TCG emulation of -cpu 486 with 64 MB RAM is slow: 300 s per milestone budget.'
  gaps:
  - 'Hyper-V Gen 1 / Gen 2 boot: README.md:167 claims ''-iso_mbr_part_type 0x00 targets Hyper-V Gen 1'' and Hyper-V
    paravirtual NICs (HYPERV_NET=m, kernel.config:1731); no QEMU test can emulate Hyper-V; no test of the hybrid
    MBR type or hv_netvsc/hv_storvsc.'
  - 'Real-disk persistence: persist mode uses a host-formatted virtio-blk file. Nothing boots the guest and runs
    `monolith-persist init` against a block device end to end (unit test is stubbed), nor the GRUB ''persistent''
    entry (UEFI), nor swapfile creation/swapon.'
  - ISOLINUX labels linux, fb, fb800 (the DEFAULT, 30s timeout), fb640, vga (vga=ask), debug, persist(without serial),
    rescue are never selected by any test; only 'serial', 'serial toram', 'serial vga=788', 'serial persist'. The
    default boot path real users hit (fb800 with no keypress, TIMEOUT 300) is untested.
  - GRUB menu entries plain (default), framebuffer, debug, rescue, toram, persistent are never selected; only entry
    2 (serial). GRUB toram is not tested at all (README.md:154 documents it).
  - Rescue shell (`rescue` kernel param / label / GRUB entry) boot behaviour untested.
  - '`root=/dev/sdXN` real-root boot (README.md:157-163) untested.'
  - UEFI 32-bit is documented as not built; no negative test or placeholder. UEFI toram, UEFI persist, UEFI+nicless
    etc. not covered.
  - 'BIOS boot from USB/AHCI/NVMe/virtio: the storage-controller variants are UEFI-only; BIOS-from-hybrid-disk (the
    ''Hybrid USB'' row, README:136) is never booted as a disk (only as -cdrom).'
  - 'Minimum RAM claim: only bios mode at 64 MB is tested (README does not state a minimum). No test at a smaller
    RAM or 32 MB / 486 real-hardware-ish limits; toram needs 512 MB in tests.'
  - 'Networking promises (README:280-300): SLIP (slattach), PPP/pppd, dropbear SSH + S20keygen host key generation,
    iperf3/mtr/tcpdump/socat/whois/iftop/ethtool, wget, udhcpc in initrd - none exercised. NIC drivers named in
    README (3Com Vortex CONFIG_VORTEX=y built-in, e100, 8139cp, r8169, virtio_net, tulip variants) only partly boot-tested:
    e1000 (default), pcnet, rtl8139, tulip, ne2k_pci, ne2k_isa; e100/e1000e/igb/r8169/sky2/virtio_net/vmxnet3/hyperv_net/3c509/wd/smc-ultra/lance
    etc. only checked as .ko existence in build.yml (config presence in verify-nic-zoo).'
  - NIC rtl8139 assertion regex ^8139(too|cp) is satisfied by either driver; does not prove which was intended.
  - 'Package set (99 world atoms): smoke suite exercises only curl, sqlite3, perl/CGI, man, monolith tools, startx
    stack, stele, nft, dnsmasq, dhcpcd; no execution test of the other ~80 packages (bash, util-linux, procps, tar,
    gawk, lynx, rl144 game, dropbear, ppp, etc.). Static-link claim is checked by scripts/static-audit.sh (not in
    this scope) not by boot.'
  - Dashboard/web demo (v86 browser boot, boot.html, web/) has no automated test of any kind; the hosted ISO is
    streamed via HTTP range requests (no test).
  - 'Release verification promises (README ''Verify a release'': attestation, cosign/SLSA) not covered by boot-test
    or tests/ (supplychain area).'
  - Reproducibility (same BUILD_EPOCH gives same toolchain/tree) has no test beyond sync-portage pin test.
  - 'Stele Acid2: gate is exit 0 + non-black framebuffer, never compares to the Acid2 reference smiley; a wrong-but-nonblack
    render passes.'
  - 'GUI: the ''dwm bar + terminal drawn'' claim (:1827) is asserted only as >0.5% non-black pixels (a gray stipple
    root alone would also satisfy it).'
  - 'Clock: fetch-and-set correction never exercised under QEMU (only unit test with stubs); the login hint (30-clock-hint.sh)
    has no unit test or boot test; S45 hook ordering in rcS untested beyond flag existence.'
  - 'No unit tests for: 40-advisory.sh / monolith-advisory-check, 30-clock-hint.sh, 99-monolith-square.bash, monolith-console
    (lazy shell), startx, which, topics content beyond file existence, guestbook.cgi directly, rootfs/init, build-iso.sh,
    build-rootfs.sh, build-initrd.sh (only grep-based wiring checks).'
  - No fast test for check-licenses.py, check-unowned.py, enrich-sbom.py, generate-provenance.py, generate-dashboard.py,
    nightly-cve-monitor.py, check-cves.sh, attestation.sh, update-build-pins.sh, update-versions.sh, extract-packages.sh,
    run-cve-canary.sh (scripts/fixtures has only canary-sbom.cdx.json). cve-canary workflow is the only exercise
    of the CVE gate.
  - 'Kernel tier invariants: no test checks Tier-0 size (bzImage size budget) or that kernel config has no unexpected
    =y growth other than CONFIG_I2C.'
  - 'boot-test.py has no unit tests besides should_retry_launch: ppm_not_black, validators, qemu cmd builders, QMP
    client untested.'
invariants:
- id: INV-DIGEST-1
  statement: sha256sum(ISO) is computed exactly once, inside attestation.sh, and that single value is written to
    attestation-summary.iso_sha256, SBOM metadata.component.hashes[0].content (+ both distribution externalReferences'
    hashes), and slsa-provenance subject digest
  enforced_by: scripts/attestation.sh:188-195,305,675; scripts/enrich-sbom.py:539-541
  failure_mode: 'n/a (construction); if ISO missing: ISO_SHA256=''(not computed)'', SBOM gets NO hashes, provenance
    step FAILS (pillar fail => overall fail)'
  tier: slow
- id: INV-DIGEST-2
  statement: Provenance cannot be generated without a real ISO digest
  enforced_by: scripts/attestation.sh:641,693-694; scripts/generate-provenance.py:77-83
  failure_mode: fail build (provenance_check=fail, overall=fail, exit 1)
  tier: fast
- id: INV-DIGEST-3
  statement: At release time the ISO downloaded from S3 re-hashes to attestation-summary.iso_sha256, and SBOM metadata.component.hashes[0].content
    equals it
  enforced_by: .github/workflows/release.yml:149-162
  failure_mode: fail release (exit 1 before gh release create); SLSA subject equality is NOT re-checked here
  tier: slow
- id: INV-DIGEST-4
  statement: The signed SLSA attestation's subject is the ISO file at subject-path (Sigstore/GitHub computes the
    digest from the file), and signing happens only when attestation overall == pass
  enforced_by: .github/workflows/build.yml:~778 (actions/attest@v2 subject-path + if verdict=='pass'); docs/releasing.md:161-166
  failure_mode: skip signing on FAIL; job still fails in final step
  tier: slow
- id: INV-PILLAR-ALL
  statement: Every pillar runs to completion regardless of earlier failures; every artifact is always written; exit
    1 iff any of sbom, license, cve, unowned, provenance, builder_sbom, builder_cve failed
  enforced_by: scripts/attestation.sh:11-12,54,697-718,877-880
  failure_mode: fail build (after all artifacts exist)
  tier: slow
- id: INV-SBOM-1
  statement: Syft SBOM generation of the sysroot must succeed (portage-cataloger only) and enrich-sbom.py must exit
    0; otherwise pillars 2-3 use the raw SBOM and the SBOM pillar fails
  enforced_by: scripts/attestation.sh:259-263,293-347
  failure_mode: fail build (sbom_check=fail)
  tier: slow
- id: INV-SBOM-2
  statement: Published SBOM (bom.cdx.json, builder-bom.cdx.json) validates against the vendored CycloneDX schema
    matching its specVersion, offline
  enforced_by: .github/workflows/build.yml:~700-745 (check-jsonschema 0.38.0, schemas in configs/attestation/schemas/)
  failure_mode: fail build (step exit; missing schema for new specVersion also fails)
  tier: slow
- id: INV-SBOM-3
  statement: 'SBOM is a package SBOM: file-type components dropped; synthetic Syft slug CPEs removed; license.id
    only holds real SPDX ids'
  enforced_by: scripts/enrich-sbom.py:581-589,659-662,228-263
  failure_mode: n/a transform; violation would surface as schema-validation failure (INV-SBOM-2)
  tier: fast
- id: INV-SBOM-4
  statement: Musl (static libc), GRUB and syslinux, which are embedded in the ISO but absent from the sysroot vdb,
    are propagated into the target SBOM from the host vdb so license/CVE checks cover them
  enforced_by: scripts/enrich-sbom.py:779-827 (called with --host-vdb /var/db/pkg at attestation.sh:306)
  failure_mode: silent skip if host vdb entry not found
  tier: slow
- id: INV-CPE-1
  statement: 'CPE mapping is an exception list: packages in cpe-overrides.yaml get a CPE (revision -rN and _pN/_preN
    stripped); acct-*/virtual/app-alternatives never get a CPE; every other package without a CPE is a counted ''genuine
    gap'' (unmapped_cpe_count), excluded ones counted separately'
  enforced_by: scripts/enrich-sbom.py:640-666,1256-1304; configs/attestation/cpe-exclusions.yaml
  failure_mode: warn / count only (enrich exit 0 always)
  tier: fast
- id: INV-LIC-1
  statement: Every non-file component and metadata.component must have a license expression that is satisfiable
    (DNF over Portage || ( ) / SPDX OR/AND) using only licenses in allowed_spdx (after gentoo_to_spdx), none in
    denied_spdx
  enforced_by: scripts/check-licenses.py:200-267,319-362; configs/attestation/license-policy.yaml:16-134
  failure_mode: fail build (license_check=fail, exit 1)
  tier: fast
- id: INV-LIC-2
  statement: Components with NO license info are 'unknown', never failed
  enforced_by: scripts/check-licenses.py:17-18,227-235,362
  failure_mode: warn (counted as unknown in report)
  tier: fast
- id: INV-LIC-3
  statement: Policy file identity (sha256) is recorded in license-report.json
  enforced_by: scripts/check-licenses.py:325-332
  failure_mode: n/a record
  tier: fast
- id: INV-CVE-1
  statement: 'CVE gate threshold: any grype finding with severity in {Critical,High,Unknown} that is not waived
    fails the scan; Medium/Low/Negligible are informational only; fix state never downgrades a finding'
  enforced_by: scripts/check-cves.sh:253,319,343-353,434; configs/attestation/cve-policy.yaml:37-71
  failure_mode: 'fail build (cve_check=fail; also builder: builder_cve fail) - both target AND builder image are
    gated'
  tier: fast
- id: INV-CVE-2
  statement: 'Waiver exception: allowlist entry matching (cve id, optional component name) marks a finding WAIVED
    (not gating) but it is still listed and counted (waived_findings). allowlist is currently empty. `expires`/approver
    are NOT enforced'
  enforced_by: scripts/check-cves.sh:256-264,318-319,344
  failure_mode: skip (finding waived)
  tier: fast
- id: INV-CVE-3
  statement: 'fail_on_unscanned (default false): when true, any component with no CPE fails the gate. Unscanned
    components are always reported as UNSCANNED, never counted clean'
  enforced_by: scripts/check-cves.sh:216-219,351-353; configs/attestation/cve-policy.yaml:56
  failure_mode: 'default: warn/note; if flag true: fail build'
  tier: fast
- id: INV-CVE-4
  statement: No CVE verdict is emitted without recording scanner name+version, grype DB built/schema/checksum, policy
    path+sha256 and scanned/matched/clean/unscanned counts; DB older than 3 days or unparseable sets age_warning
  enforced_by: scripts/check-cves.sh:120-130,266-303,355-394; scripts/attestation.sh:404-429,754-772
  failure_mode: warn (age_warning string on dashboard); missing policy => WARNING + built-in default gate
  tier: fast
- id: INV-CVE-5
  statement: 'Scanner liveness canary: grype scanning the OpenSSL 1.0.1 fixture must report >0 raw findings and
    include CVE-2014-0160 (CVE-2014-0160 must never be in the allowlist)'
  enforced_by: scripts/run-cve-canary.sh:97-111; .github/workflows/cve-gate-canary.yml
  failure_mode: fail the canary workflow only (not a gate in build.yml)
  tier: slow
- id: INV-CVE-6
  statement: grype DB is refreshed (make grype-db-update, weekly-keyed cache) immediately before every attestation
    run; check-cves.sh itself never updates it
  enforced_by: .github/workflows/build.yml:~650-662; Makefile:491-494; scripts/check-cves.sh:120-126
  failure_mode: warn (stale DB only flagged)
  tier: slow
- id: INV-CVE-7
  statement: 'Retroactive revocation: every nightly run re-scans all synced build SBOMs with a fresh DB; any match
    => status/<tag>.json status=revoked and summary cve_check revoked/fail, overall fail; the live ISO fetches status/<tag>.json
    and shows a banner if revoked'
  enforced_by: scripts/nightly-cve-monitor.py:278-296; configs/overlay/app-misc/monolith-base/files/monolith-advisory-check:29-60
  failure_mode: advisory only (workflow only fails if nothing could be scanned); S3-hard
  tier: slow
- id: INV-OWN-1
  statement: Every file on the sysroot disk (Syft file cataloger) must be owned by a Portage package (Syft installedFiles
    + CONTENTS obj/sym/dir, with .bz2 alias) or match a unowned-allowlist glob; otherwise unowned
  enforced_by: scripts/check-unowned.py:243-269,308; configs/attestation/unowned-allowlist.yaml
  failure_mode: fail build (unowned_check=fail)
  tier: fast
- id: INV-OWN-2
  statement: Pillar 4 only works if Syft is run with SYFT_FILE_METADATA_SELECTION=all (files[] populated); otherwise
    it warns and trivially passes with 0 files
  enforced_by: scripts/attestation.sh:259; scripts/check-unowned.py:246-250
  failure_mode: warn (SILENT PASS) - weak invariant
  tier: slow
- id: INV-OWN-3
  statement: If sbom.syft.json is missing, pillar 4 is skipped with a warning and counts as PASS
  enforced_by: scripts/attestation.sh:463-473
  failure_mode: skip (warn)
  tier: slow
- id: INV-PROV-1
  statement: SLSA provenance uses GitHub canonical buildType (https://actions.github.io/buildtypes/workflow/v1),
    records resolvedDependencies (git commit, stage3 epoch+digest, portage snapshot epoch+sha256, kernel tarball
    url+sha512, builder image), byproduct sha256 of the other attestation files, and real started/finished timestamps
  enforced_by: scripts/generate-provenance.py:113,128-211,121-123
  failure_mode: n/a record; missing optional inputs silently omitted (never fabricated)
  tier: fast
- id: INV-PIN-1
  statement: 'Build inputs are recorded in the SBOM formulation: stage3 (epoch+digest), versions.lock sha256, kernel
    tarball SHA-512, busybox tarball SHA-512 (from signed Portage Manifests)'
  enforced_by: scripts/enrich-sbom.py:837-921
  failure_mode: silently omitted if inputs unresolved (never fabricated)
  tier: slow
- id: INV-DASH-1
  statement: builds-index.json is sorted newest-first by attestation timestamp (not tag) and cpeDelta is computed
    vs the previous entry
  enforced_by: scripts/generate-dashboard.py:78-91
  failure_mode: n/a
  tier: fast
- id: INV-REL-1
  statement: A release is published only if the Build run for that exact tag commit succeeded (workflow_run conclusion
    success, event push, head_branch starts with 'v') and the tag resolves to the built SHA
  enforced_by: .github/workflows/release.yml:55-60,88-97
  failure_mode: skip publish / fail
  tier: slow
- id: INV-REL-2
  statement: Tag builds publish SHA256SUMS (iso + bom.cdx.json) to the GitHub Release and mirror it to s3://$S3_BUCKET/attestation/<version>/SHA256SUMS
  enforced_by: .github/workflows/release.yml:166-170,265-278
  failure_mode: fail release
  tier: slow
data_contracts:
- name: attestation-summary.json
  producer: script.attestation
  consumers: script.generate-dashboard, script.nightly-cve-monitor (rewrites), job.build.attestation (reads .overall),
    wf.release (reads .iso_sha256), web.app/data.js (fetchBuild/fetchSummary), web.app/view-downloads.js, web.app/view-landing.js
  location: build artifact dir output/attestation/ -> s3://$S3_BUCKET/attestation/<BUILD_VERSION>/attestation-summary.json
    (public-read, no-store fetch)
  key_fields:
  - build_tag, timestamp (ISO8601Z), iso_sha256, package_count, unmapped_cpe_count, excluded_cpe_count
  - 'sbom_check, license_check, cve_check, unowned_check, provenance_check, overall: ''pass''|''fail'' (cve_check
    may become ''revoked'' via nightly)'
  - cve_scanner{name,version}, cve_db{built,schema_version,checksum,age_warning}, cve_policy{path,sha256}, cve_coverage{scanned,matched,clean,unscanned,total_findings,waived_findings}
  - 'unowned_count, cve_failures[] (''pkg-ver: CVE,..''), license_failures[], unowned_files[]'
  - builder{attested(int 1),epoch,cross_target,image_digest,package_count,unmapped_cpe_count,excluded_cpe_count,cve_scanner,cve_db_built,cve_coverage{scanned,matched,clean,unscanned,total_findings},sbom_check,cve_check,cve_failures[]}
    - builder.cve_check/sbom_check are 'not_run' when not attested
  evidence: scripts/attestation.sh:744-801
  notes:
  - Hand-assembled by a python heredoc with shell interpolation; no schema.
  - NOT validated by any JSON schema; web code defensively handles missing keys (older builds lack cve_* fields).
- name: builds-index.json (+ latest-build.json)
  producer: script.generate-dashboard (also regenerated nightly by script.nightly-cve-monitor)
  consumers: web.app/data.js fetchBuildIndex -> landing, downloads, index, compare, package views
  location: s3://$S3_BUCKET/builds-index.json and latest-build.json (bucket ROOT), https://themonolith.s3.us-west-2.amazonaws.com/builds-index.json;
    also make dashboard -> output/web/
  key_fields: array newest-first of {tag,timestamp,date,packages,unmappedCPEs,excludedCPEs,cpeDelta,licenses,cves,unowned,overall(UPPERCASE),cveScanner,cveScannerVer,cveDbBuilt,cveDbAgeWarning,cveScanned,cveMatched,cveClean,cveUnscanned,cveTotalFindings,cveWaivedFindings,cvePolicyPath}
  evidence: scripts/generate-dashboard.py:51-103
- name: bom.cdx.json (enriched SBOM, CycloneDX >=1.6, today 1.7)
  producer: script.enrich-sbom (via script.attestation); input is Syft sbom.cdx.json
  consumers: script.check-licenses, script.check-cves, script.nightly-cve-monitor (grype rescans it), wf.release
    (metadata.component.hashes[0].content; also attached to GitHub Release + SHA256SUMS), job.build.attestation
    (schema validation), web view-build/compare/package (components[].name/version/cpe/purl/licenses)
  location: output/attestation/bom.cdx.json -> s3://$S3_BUCKET/attestation/<tag>/bom.cdx.json -> GitHub Release
    asset bom.cdx.json (tags)
  key_fields: metadata.component{type:operating-system,bom-ref:themonolith-<tag>,name,version,hashes[0]{alg:SHA-256,content=ISO
    sha},externalReferences[vcs,build-system,distribution(s3),distribution(release)]}; components[]{name 'cat/pkg',version,cpe,purl
    pkg:ebuild/...?arch=&distro=gentoo,licenses,supplier,authors,type,bom-ref}; dependencies[]; formulation[0]{components,properties};
    metadata.tools.components[]; metadata.authors, lifecycles
  evidence: scripts/enrich-sbom.py:454-1028
- name: builder-bom.cdx.json (+ builder-sbom.cdx.json raw)
  producer: script.enrich-sbom (--product-name themonolith-builder) via script.attestation Pillar 5
  consumers: script.check-cves, web view-build Builder tab, job.build.attestation schema validation
  location: s3://$S3_BUCKET/attestation/<tag>/builder-bom.cdx.json
  key_fields: same shape as bom.cdx.json but metadata.component.name=themonolith-builder, no hashes, no dependency
    graph, no formulation
  evidence: scripts/attestation.sh:544-556
- name: sbom.cdx.json / sbom.syft.json (raw Syft)
  producer: syft in script.attestation
  consumers: script.enrich-sbom (cdx), script.check-unowned (syft native)
  location: 'output/attestation/ -> synced to s3 attestation/<tag>/ (sbom.syft.json is huge: files[] of whole rootfs).
    Not fetched by web.'
  key_fields: 'syft native: artifacts[].type==''portage'' .metadata.installedFiles[].path, files[].location.{realPath,path},
    schema.version'
  evidence: scripts/attestation.sh:259-263; scripts/check-unowned.py:85-155
- name: cve-report.cdx.json (+ builder-cve-report.cdx.json)
