  - INCLUDE_BUILDER defaults to 1 (attestation.sh:70) although header/help call it 'Pillar 5 (--include-builder
    only)' (L9,L27). make.attestation does NOT pass --include-builder yet builder pillar always runs. make.attest-builder
    is therefore redundant except it passes --builder-digest.
  - make.attestation never passes --builder-digest (Makefile:452-459) so summary builder.image_digest and provenance
    builder-digest are empty in CI (only make.attest-builder passes it, L475, and CI calls make attestation, build.yml
    ~L664).
  - Builder enrichment run reuses output dir and enrich-sbom.py writes fixed names cpe-gap-count.txt / cpe-exclusions-count.txt
    / cpe-exclusions.json. The target's values were already read into shell vars (L351-357) but then the files are
    mv'd to builder-* names (L562-565) => the target's cpe-gap-count.txt is OVERWRITTEN/renamed away; and cpe-exclusions.json
    in the output dir ends up being the BUILDER's report, the target's is lost. Dashboard docs say cpe-exclusions.json
    is surfaced per build; it is not fetched by web/ at all.
  - 'Pillar-5 enrichment is called WITHOUT --sysroot, --world, --versions-lock, --kernel-manifest, --host-vdb, --iso-sha256,
    --arch, --stage3-*: builder SBOM has no dep graph, no purl arch qualifiers, no formulation.'
  - attestation-summary.json 'builder.attested' is the shell int ${INCLUDE_BUILDER} => JSON number 1, not boolean
    true (L781).
  - Summary python heredoc interpolates shell variables directly into python source (${BUILD_TAG}, ${CVE_FAILURES}
    ...). A BUILD_TAG or package name containing a quote breaks it. Optional strings were moved to MONO_* env to
    mitigate (L724-733) but build_tag/epoch/cross_target/image_digest/CVE_POLICY_PATH/CVE_SCANNER_VERSION are still
    interpolated.
  - 'KERNEL_SHA512 read from hard-coded /configs/overlay/sys-kernel/monolith-kernel/Manifest (L667) whereas enrich-sbom
    gets ${SCRIPT_DIR}/../configs/... (L314): two different paths for the same file; works only because both resolve
    inside the container.'
  - Portage snapshot sha256 is obtained by re-downloading ~60-100MB tarball from distfiles at attestation time (L650-656)
    because emerge-webrsync discards it. Silently dropped on failure (L658-659). Comment in generate-provenance.py:62
    claims it comes from a .sha256 sidecar (stale).
  - SYFT_VERSION/GRYPE_VERSION use `|| ... || echo ''` fallbacks that mask failure (L278-283). DB metadata parsed
    from `grype db status` text with regexes (Built:/Version:/Checksum:) => brittle to grype output format changes;
    check-cves.sh repeats the same parsing (L271-274).
  - 'overall gating: sbom, license, cve, unowned, provenance, builder_sbom, builder_cve each flips overall=fail
    (L698-718). cve_scanner/db/policy keys are informational only.'
  - 'A pass requires NO gating CVE in the *builder* image too: builder CVEs fail the whole build (L717). Builder
    image is a stock Gentoo stage3 + crossdev so this is a standing source of failures independent of the shipped
    ISO.'
  rebuild_notes:
  - 'Preserve: run-all-then-fail-at-end semantics; single sha256sum of ISO feeding SBOM+provenance+summary; summary
    schema (see data_contracts).'
  - 'Redesign: S3_BUCKET-derived distribution URL; the builder-image pillar needs a new definition of ''builder''
    if the Docker factory changes; stop mv-ing shared fixed filenames (parametrise enrich-sbom output names).'
  - Replace shell->python heredoc interpolation with a real summary writer (e.g. one python script taking JSON of
    pillar results).
