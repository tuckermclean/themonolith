    - what: 'src_configure: PYTHON=true econf; src_compile no-op; src_install ''emake install DESTDIR=${D} SUBDIRS=src'';
        doins xcbgen/*.py to /usr/lib/xcb-proto/xcbgen; sed xcb-proto.pc pythondir=${pc_sysrootdir}/usr/lib/xcb-proto'
      why: AM_PATH_PYTHON wants a python only to compute pythondir; SUBDIRS=src skips xcbgen install-pythonPYTHON
        (py-compile needs interpreter); libxcb finds xcbgen via pkg-config --variable=pythondir xcb-proto
      evidence: ebuild in-file lines 38-65
    traps_encoded:
    - 'X client libs cross+static: dodge the modern-X Python tar-pit with a data-only overlay xcb-proto (host-python
      codegen; no target python/libxml2/zstd) (AGENTS.md)'
    doctrine:
    - no-python-target
    - 486-minimalism
    deps_cut:
    - dev-lang/python
    - app-arch/zstd (masked)
    - dev-libs/libxml2 (masked)
    fetches_at_build:
    - ext.freedesktop (xorg.freedesktop.org archive)
    revbump_state: NOT IN versions.lock (version-only; no -rN). Not in world; pulled by libxcb.
  - id: ebuild.x11-terms/monolith-st
