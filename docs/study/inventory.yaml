recipes:
  packages:
  - id: ebuild.sys-kernel/monolith-kernel
    path: configs/overlay/sys-kernel/monolith-kernel/monolith-kernel-6.12.80-r8.ebuild
    version: 6.12.80-r8
    purpose: Cross-compile Linux 6.12.80 (ARCH=i386, i486) from the pinned configs/kernel.config; install bzImage
      as /boot/vmlinuz-6.12.80, modules into the sysroot, and the gzipped resolved config as package content.
    upstream:
      source: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${PV}.tar.xz (ebuild:8)
      pin: tarball linux-6.12.80.tar.xz, size 148229368, SHA512 e1444aeb771db0f0bd885a03585577d4507b5d6adca3e7c8c522a464458ee014d94df8c63b57857c3696cb644ccaab5f7bdc094755c20bb6e710f2368ab1c42f
        (configs/overlay/sys-kernel/monolith-kernel/Manifest:1)
      evidence: ebuild:8, Manifest:1
    build_hacks:
    - what: 'PATCHES=( files/linux-6.12-gcc15-std-gnu11.patch ): adds -std=gnu11 to KBUILD_CFLAGS in drivers/firmware/efi/libstub/Makefile'
      why: GCC 15 defaults to C23, where bool/true/false are keywords that the kernel defines itself; the EFI stub
        Makefile resets KBUILD_CFLAGS without carrying -std=gnu11. The sibling arch/x86/boot/compressed/Makefile
        fix landed upstream in 6.12.80 so is NOT in the patch.
      evidence: files/linux-6.12-gcc15-std-gnu11.patch:1-15; ebuild:24; git c4617f7
    - what: 'src_configure: cp ${CONFIGS_DIR}/kernel.config .config, then ''make ARCH=i386 CROSS_COMPILE=${CROSS_COMPILE}
        olddefconfig''; falls back to allnoconfig with a warning if no config'
      why: pinned config is machine-managed; olddefconfig normalises it (and erases hand comments, hence docs/kernel-tiers.md
        as the policy home)
      evidence: ebuild:26-36; docs/kernel-tiers.md (callout 'Why this lives in a doc')
    - what: src_compile uses emake -j1 (bzImage + modules)
      why: '''cross-gcc is memory-heavy; higher parallelism OOMs CI runners'''
      evidence: ebuild:39-40
    - what: modules_install with INSTALL_MOD_PATH=${D} INSTALL_MOD_STRIP=1; delete lib/modules/<krel>/build and
        source symlinks; re-run 'depmod -b ${D} <krel>'
      why: strip keeps modules small for 486 disk + gzip budget; build/source symlinks dangle into the ephemeral
        tree; depmod rooted at the image so on-target modprobe resolves deps. Modules ride into squashfs via build-rootfs.sh
        rsync of sysroot (Tier 2).
      evidence: ebuild:48-61
    - what: Ship gzip -9 of resolved .config to /usr/share/monolith-kernel/resolved-kernel.config.gz as package
        content (DCX-99)
      why: src_install copy-back to configs/kernel.config is a no-op on binpkg cache hit, so scripts/verify-resolved-i2c-off.sh
        used to pass vacuously; content inside the binpkg is identical on source and cache paths. scripts/build-packages.sh
        re-derives configs/kernel.config from this artifact each run and hard-fails if missing; proof artifact excluded
        from the shipped rootfs (486 minimalism).
      evidence: ebuild:63-74; commit 982b50d/16affed/b9f533b messages
    - what: src_install still does 'cp .config ${CONFIGS_DIR}/kernel.config || die'
      why: dev convenience for 'make kernel-config'; formerly '|| true' swallowed failures (made loud in DCX-99)
      evidence: ebuild:76-82
    - what: 'pkg_config(): re-extract tarball from portageq distdir into ${T}, eapply the patch via ${EBUILD%/*}/files,
        olddefconfig, interactive menuconfig, copy back'
      why: interactive config path; FILESDIR/DISTDIR not populated in pkg_* phases
      evidence: ebuild:85-116
    traps_encoded:
    - GCC15/C23 vs kernel-defined bool (patch)
    - binpkg-cache hit skips src_install, so anything not in CONTENTS is invisible (DCX-99); 'Overlay-ebuild revbump
      busts binpkg cache' in AGENTS.md (r7->r8 in b9f533b)
    - DDC sub-option -> CONFIG_I2C=y trap is guarded in kernel.config + resolved-config assertion (AGENTS.md 'DDC
      sub-option')
    doctrine:
    - 486-minimalism
    deps_cut: []
    fetches_at_build:
    - ext.kernel-org (cdn.kernel.org tarball)
    revbump_state: 'AGREE: ebuild file is -r8 and versions.lock:8 says sys-kernel/monolith-kernel:6.12.80-r8:0.
      Manifest present.'
    bdepend: sys-devel/bc sys-devel/flex app-alternatives/lex sys-devel/bison dev-libs/elfutils (ebuild:16-22)
  - id: ebuild.app-misc/monolith-base
    path: configs/overlay/app-misc/monolith-base/monolith-base-0.1.0-r6.ebuild
    version: 0.1.0-r6
    purpose: No-source ebuild that owns every hand-authored rootfs helper/profile.d/bashrc.d/topic file so attestation
      Pillar 4 sees them as package-owned (not in unowned-allowlist).
    upstream:
      source: none (S=${WORKDIR}, no SRC_URI; files from FILESDIR) (ebuild:9-14)
      pin: n/a (in-tree files; no Manifest file exists for this package)
      evidence: ebuild:9-14; ls configs/overlay/app-misc/monolith-base shows no Manifest
    build_hacks:
    - what: S=${WORKDIR}
      why: EAPI 8 default S=${WORKDIR}/${P} would not exist with no SRC_URI
      evidence: ebuild:14
    - what: 'Numeric ordering contract for /etc/profile.d: STATUS lines first (20-persist, 30-clock-hint) then ACTIONABLE
        (40-advisory, 50-dropbear-hint); budget <=10 lines of output on clean boot'
      why: /etc/profile sources profile.d in lexical order; dropbear hint (50-dropbear-hint.sh) is NOT installed
        by this ebuild, it is generated by scripts/build-rootfs.sh
      evidence: ebuild:72-98
    - what: bash-only hooks go in /etc/bash/bashrc.d (50-persist-history.bash, 60-monolith-cnf.bash, 99-monolith-square.bash),
        not profile.d
      why: /etc/profile sources profile.d BEFORE /etc/bash/bashrc, and Gentoo's stock bashrc may assign PROMPT_COMMAND/PS1
        unconditionally and clobber profile.d settings; bashrc.d runs after stock setup
      evidence: files/50-persist-history.bash header; ebuild:115-128
    - what: own startx here
      why: hand-authored => must be owned or attestation Pillar 4 fails (AGENTS.md rootfs-files-unowned trap)
      evidence: ebuild:28-31
    traps_encoded:
    - rootfs files unowned by attestation (AGENTS.md)
    - GNU sys-apps/which does not build against musl (bundled gnulib getopt conflicts with musl getopt) and busybox
      is initramfs-only, hence POSIX-sh files/which (files/which header)
    doctrine:
    - 486-minimalism
    - all-static
    - no-python-target
    deps_cut: []
    fetches_at_build: []
    revbump_state: 'AGREE: -r6 ebuild, versions.lock:9 app-misc/monolith-base:0.1.0-r6:0'
    contradictions_local:
    - world comment (configs/portage/world:11-17) lists files 'formerly hand-installed by scripts/build-rootfs.sh';
      but configs/attestation/unowned-allowlist.yaml:93 and :190 still reference a pending 'monolith-base sweep'
      (see its lines) - allowlist not fully pruned; out of recipes scope, flag to doctrine/oracle owner
  - id: ebuild.dev-lang/monolith-perl
    path: configs/overlay/dev-lang/monolith-perl/monolith-perl-5.42.0-r5.ebuild
    version: 5.42.0-r5 (perl 5.42.0 + perl-cross 1.6.4 + CGI.pm 4.10)
    purpose: Static, -Uusedl, no-threads Perl for the i486 disc, cross-built with arsv/perl-cross, with CGI.pm baked
      in as pure-perl for the guestbook boot-test fixture.
    upstream:
      source: https://www.cpan.org/src/5.0/perl-${PV}.tar.xz ; https://github.com/arsv/perl-cross/releases/download/${PC_PV}/perl-cross-${PC_PV}.tar.gz
        ; https://cpan.metacpan.org/authors/id/L/LE/LEEJO/CGI-${CGI_PV}.tar.gz (ebuild:52-56)
      pin: 'PC_PV=1.6.4 (ebuild:23), CGI_PV=4.10 (ebuild:50). Manifest SHA512: perl-5.42.0.tar.xz 14400988 b10f74d1245a879ae51d3ad93ad519a148df126ec865715474c801548ccfc3f542ef3bbb1f59568cea2ec77302d428dc772aba605357d7faf13eb6a351917275
        ; perl-cross-1.6.4.tar.gz 119502 SHA512 0a6152cfaef1da7611554fa8fc93ff1edb3ce is truncated in this note
        - authoritative value in Manifest:3 ; CGI-4.10.tar.gz 185980 b11125ec8aaca06ab68ff1ca71cb0bd320c3c9e9bdbe69680a9e61d8b6a42be7b1357583b52dae5aa7b59cb6ceeb5b8f21332c66ae3e33566d6c631f4f555a98
        (Manifest:1)'
      evidence: configs/overlay/dev-lang/monolith-perl/Manifest:1-3
    build_hacks:
    - what: STRICT version pairing perl 5.42.0 <-> perl-cross 1.6.4; do not float perl
      why: each perl-cross release ships per-exact-perl-version patchsets (cnf/diffs/perl5-X.Y.Z/); a perl without
        a matching patchset risks silent 'strangely broken' configure/miniperl failures. 1.6.4 has 5.42.0 but no
        5.42.1+ patchset.
      evidence: ebuild:9-23
    - what: 'src_prepare: cp -a perl-cross tree over the perl source (== README''s tar --strip-components=1); stage
        CGI-4.10 into cpan/CGI'
      why: perl-cross's documented install method; CGI needs no --static-ext because it has no .xs/.c/.h => classified
        nonxs_ext by cnf/configure_mods.sh
      evidence: ebuild:81-124
    - what: CGI.pm pinned to 4.10 (not 4.72 current)
      why: 'every CGI release >= 4.11 hard-depends on HTML::Entities, which ships in the XS HTML-Parser dist; 4.10
        is the newest release with zero XS in its dep tree (checked Makefile.PL and tarball *.xs/*.c/*.h grep).
        Risk: predates post-2014 bugfixes unrelated to param()/header().'
      evidence: ebuild:25-50; world:73-82
    - what: './configure invoked directly (never via econf): --target=${CHOST} --prefix=/usr -Dcc=${CHOST}-gcc -Uusedl
        -Uusethreads -Duse64bitint -Duselargefiles -Dman1dir=none -Dman3dir=none -Accflags=''${CFLAGS} -D_GNU_SOURCE
        -DNO_LOCALE'' -Aldflags=''${LDFLAGS} -Wl,--allow-multiple-definition'' --all-static'
      why: see sub-entries
      evidence: ebuild:197-206
    - what: do NOT pass EXTRA_ECONF (--disable-shared --enable-static from env/static.conf)
      why: 'perl-cross''s hand-rolled configure_args.sh dies ''Unknown argument'' on those tokens; not routed through
        econf so they never reach it. Planned fix if ever needed: an env/perl-cross.conf blanking EXTRA_ECONF (does
        not exist in configs/portage/env/ - never needed).'
      evidence: ebuild:127-143; ls configs/portage/env
    - what: --all-static (not '--static')
      why: bare '--static' is not in the arg parser's no-value list so it swallows the next token (would silently
        eat -Accflags). -Uusedl alone does NOT make perl core XS exts (POSIX, Fcntl, IO, Socket) static; --all-static
        sets $allstatic so all XS is baked in.
      evidence: ebuild:150-169
    - what: -D_GNU_SOURCE in ccflags
      why: perl-cross link-detects memrchr/setresuid/setresgid/eaccess (present in musl) and sets HAS_*, but musl
        declares them only under _GNU_SOURCE; perl adds it itself only for glibc (d_gnulibc). Without it GCC 14
        errors on implicit declarations. Same fix as Buildroot/OpenWrt.
      evidence: ebuild:171-177
    - what: -DNO_LOCALE in ccflags
      why: perl-cross 1.6.4 hardcodes a glibc locale profile (d_perl_lc_all_uses_name_value_pairs=define, no positional
        map) but musl setlocale(LC_ALL,'') returns positional 'C.UTF-8;C;C;C;C;C', so perl panics at boot in locale.c
        ('needs an = to split name=value'). Undef of the macro alone is not enough; config.h is regenerated from
        config.sh during make so post-configure patches don't stick. -DNO_LOCALE compiles the whole USE_LOCALE machinery
        out; perl-scoped (other tools keep C.UTF-8); Unicode (use utf8, -C, unicore) is independent.
      evidence: ebuild:179-196; commit 7926f71
    - what: -Wl,--allow-multiple-definition in ldflags
      why: the 're' ext recompiles regcomp.c as re_comp.c (-DPERL_EXT_RE_BUILD) exporting Perl_get_ANYOFHbbm_contents
        etc. also in libperl.a(regcomp.o); under -Uusedl --all-static both land in one binary and modern binutils
        rejects duplicate strong symbols. Same source, so first-wins is safe. Deliberately NOT in env/static.conf
        (perl-specific quirk).
      evidence: ebuild:208-216
    - what: 'src_compile: after emake, for every ext/dist/cpan Makefile: rm -f <dir>/pm_to_blib; emake -C <dir>
        PERL_CORE=1 pm_to_blib (ewarn on failure)'
      why: 'THE BUG: perl-cross builds static exts via MakeMaker ''static'' target which compiles XS into .a but
        does not run pm_to_blib, then touches a FAKE pm_to_blib stamp. With -Uusedl EVERY module is static ext,
        so NO .pm gets staged; installperl then ships a binary with all XS baked in but Fcntl.pm/File::Spec/Cwd
        missing => "Can''t locate X.pm in @INC" (breaks File::Temp, CGI.pm). Confirmed by DIAG build.'
      evidence: ebuild:219-247; AGENTS.md 'perl-cross static musl ... force per-module pm_to_blib or ship NO static-ext
        .pm'
    - what: 'src_install backfill: cp -a ${S}/lib/. and every */blib/lib tree into ${ED}/usr/lib/perl5/5.42.0; die
        if Fcntl.pm, File/Spec.pm, File/Spec/Unix.pm, Cwd.pm still missing (dumps find candidates)'
      why: perl-cross static install skips baked-XS .pm even after the pm_to_blib fix; belt-and-braces so File::Temp/CGI
        work. NOTE privlib path hardcodes 5.42.0 (ebuild:269).
      evidence: ebuild:258-291
    - what: 'Prune: delete *.pod; CPAN/CPANPLUS dirs and CPAN.pm/CPANPLUS.pm; ExtUtils/ dirs; Pod/ dirs; usr/bin/h2ph,
        h2xs. Explicitly keep lib/unicore.'
      why: 'size budget (spec §3): perl binary <=12 MiB stripped, /usr/lib/perl5 <=35 MiB. No CPAN client, no MakeMaker/XS
        build at runtime (no dlopen), no perldoc/man pipeline (mandoc+man-pages is the man reader). unicore kept
        because smoke_perl_utf8 uc() on non-ASCII reads unicore tables.'
      evidence: ebuild:293-347
    - what: explicit ${CHOST}-strip on the perl binary and MONOLITH-PERL-SIZE log markers
      why: portage auto-strip runs after src_install so the logged size would be unstripped; markers are greppable
        from the CI log (budgets 12MB / 35MB)
      evidence: ebuild:349-381
    - what: RESTRICT=test
      why: cannot run i486 binaries on x86_64 build container; acceptance is boot-test time
      evidence: ebuild:72-76
    traps_encoded:
    - 'perl-cross static musl (-Uusedl perl 5.42): _GNU_SOURCE, --allow-multiple-definition, -DNO_LOCALE, force
      per-module pm_to_blib or ship NO static-ext .pm (AGENTS.md, matches verbatim)'
