doctrines:
- id: D-486-minimalism
  statement: 'Everything must run on an i486 with a few MB of RAM; do not pull in heavy dependencies. Reflex challenge
    to any addition: ''we are trying to run this on a 486, remember?''. Corollaries seen in specs: Tier 0 (=y) kernel
    drivers are a ceiling not a floor; a driver is only =y if a machine with nothing else cannot boot without it;
    no native gcc on disc; mandoc not man-db; no CPAN client; hint text prints once, no daemons/wizards/menus.'
  source: AGENTS.md:19-23; docs/kernel-tiers.md:30-51; docs/superpowers/specs/2026-08-14-gui-design.md (section
    0); plans/2026-08-19-monolith-ux-pass.md:6-9; RELEASE-READINESS.md:266-269
  rationale: Project brand is one ISO from a 1996 486 to a 2026 UEFI box; every resident byte is paid forever by
    the smallest machine.
  existing_check:
  - path: scripts/tests/verify-legacy-fbdev-config.sh:30-55
    what: asserts DDC/I2C sub-options off so CONFIG_I2C is not escalated into bzImage (Tier-0 growth guard)
    tier: fast
  - path: scripts/verify-resolved-i2c-off.sh:45
    what: asserts the RESOLVED (post-olddefconfig) kernel config has no CONFIG_I2C=y; reads gz artifact shipped
      in the binpkg
    tier: slow
  - path: docs/kernel-tiers.md:130-138
    what: initrd size budget ~6 MB uncompressed triggers human review (policy only, no mechanical check found)
    tier: null
  proposed_check: '(1) Kernel: diff the set of ''=y'' symbols in resolved-kernel.config.gz against a committed Tier-0
    allowlist; any new ''=y'' fails (fast against configs/kernel.config, slow against resolved config). (2) Record
    bzImage, initrd, squashfs and ISO byte sizes per build and fail if bzImage or initrd grows more than N% vs previous
    master without an explicit override label. (3) initrd uncompressed size > 6 MB fails (cpio -t sizes of output/initrd).'
  tier: slow
  contradicted_by:
  - 'README.md:127 and RELEASE-READINESS.md:208-213: util-linux mount/agetty/mountpoint etc. build dynamic PIE;
    not a design goal but a tracked gap.'
  - initrd-modules.txt Tier-1 manifest is deliberately 'broad' (docs/kernel-tiers.md:19,72) - a documented, reasoned
    exception to minimalism, bounded by the 6 MB review budget.
- id: D-all-static
  statement: 'rootfs is all-static. Dynamic binaries fail at boot; the build-time warning ''musl libc not found
    ... dynamically-linked binaries will fail'' means static-only, not benign. Global mechanism: USE=''-* minimal
    static static-libs'', env/static.conf (-static -no-pie, EXTRA_ECONF=--disable-shared --enable-static), package.use/static
    ''*/* static static-libs'' plus ~50 per-package overrides; overlay ebuilds readelf-assert no PT_INTERP and EM_386.
    perl is -Uusedl (no dlopen anywhere); gdb USE=-server (in-process agent is a .so); dnsmasq/nftables/kmod/libxml2
    had shared_module/shared_library targets rewritten to static.'
  source: AGENTS.md:24-25; README.md:127; configs/portage/make.conf:36; configs/portage/env/static.conf:13; specs/2026-08-13-perl-for-the-monolith-design.md:7-12;
    specs/2026-08-14-gui-design.md section 1 (zero dlopen)
  rationale: No dynamic loader policy on the disc; also enables dwm/st/Xfbdev to be single binaries; musl static
    is small.
  existing_check:
  - path: scripts/static-audit.sh (called from scripts/build-rootfs.sh:745-754)
    what: walks rootfs with file(1), writes output/reports/static-audit.txt; REPORT-ONLY (|| log_warn), --strict
      flag exists but is not used anywhere
    tier: slow
  - path: configs/overlay/x11-base/monolith-xserver/monolith-xserver-1.3_p20241113-r1.ebuild:137-140
    what: 'readelf: no INTERP and Intel 80386 for Xfbdev in src_install'
    tier: slow
  - path: configs/overlay/games-roguelike/rl144/rl144-0.1.0_p20260805.ebuild:110-115
    what: same readelf static+i386 assert for rl144
    tier: slow
  proposed_check: 'On output/sysroot (or mounted squashfs): for every ELF with ''readelf -lW f | grep -q INTERP''
    fail, with an explicit allowlist file (initially util-linux mount/agetty/mountpoint and whatever static-audit.txt
    lists today) that may only shrink; also assert ''readelf -h'' Machine is Intel 80386 for every ELF (no x86-64
    host leakage) and that no *.so (other than the kernel modules under /lib/modules) exists under /usr/lib /lib.
    Equivalent to ''static-audit.sh --strict'' plus the allowlist. Artifact: squashfs rootfs. Also assert the ld-musl-i386.so.1
    copy (extract-packages.sh:155) disappears once the allowlist is empty.'
  tier: slow
  contradicted_by:
  - 'README.md:127: ''not universally static yet: util-linux, iproute2, dhcpcd, procps, tar, gawk and a few others
    ... build as dynamically-linked PIE binaries''. (AGENTS.md:24 says dynamic binaries fail at boot - they only
    work because of the next item.)'
  - scripts/extract-packages.sh:147-157 and scripts/build-packages.sh:384-385 copy musl libc.so to /lib/ld-musl-i386.so.1,
    i.e. a dynamic loader DOES ship on the disc. specs/2026-08-13-perl... line 8 ('no dynamic loader on the disc
    AT ALL') and specs/2026-08-14-gui... section 1 ('no loader on the disc') are therefore stale.
  - 'RELEASE-READINESS.md:108-118: util-linux mount/agetty/mountpoint known dynamic; /etc/inittab still spawns util-linux
    agetty; static-audit never gated (RELEASE-READINESS.md:304).'
  - Whether the squashfs currently contains zero dynamic ELFs is UNKNOWN from the repo alone; needs a build.
- id: D-no-python-on-target
  statement: Python stays out of the target rootfs. Nothing in the ISO may depend on dev-lang/python; Python is
    allowed only as a host (builder) tool and for build/CI scripts. Packages whose REQUIRED_USE or RDEPEND forces
    target python are rejected or have the chain broken.
  source: AGENTS.md:26,131-133; README.md:111; RELEASE-READINESS.md:257-264; configs/portage/profile/package.provided:4-17
  rationale: Python cannot be cross-built lean/static for i486 and costs far too many MB; many packages (systemd-utils[tmpfiles],
    nmap, man-db, usbutils, xcb-proto) drag it in.
  existing_check:
  - path: 'none found (grep of scripts/tests, workflows, scripts/*.sh for python/PYTHON_TARGETS on the rootfs: no
      assertion)'
    what: enforced only indirectly - emerge fails at dep resolution when python is demanded
    tier: null
  proposed_check: 'Assert the SBOM / portage VDB of the sysroot contains no dev-lang/python, dev-python/*, virtual/tmpfiles
    real provider, systemd-utils; and squashfs contains no python3* binary, no /usr/lib/python*. Cheap fast variant:
    parse configs/portage/versions.lock for dev-lang/python|dev-python/. Artifact: configs/portage/versions.lock
    (fast) + SBOM bom.cdx.json (slow). Host-side python (xcbgen, pcf-fontname.py at image build) must stay OUT of
    this check.'
  tier: fast
  contradicted_by:
  - scripts/build-rootfs.sh:119 runs host python3 scripts/pcf-fontname.py at rootfs build time (host-only; not a
    violation but the checker must scope to the target).
  - 'docs/superpowers/plans/2026-08-14-gui.md G2: xcb-proto needs python codegen; resolved by a data-only overlay
    (configs/overlay/x11-base/xcb-proto) + HOST python - so host python is legitimate.'
- id: D-bitmap-fonts-no-freetype
  statement: Bitmap-only fonts. NO freetype / fontconfig / Xft anywhere on the disc. Terminus (PCF) is the default
    X font; builtin libXfont 6x13 'fixed' and cursor only for the server's cursor. Any package dragging freetype
    (e.g. font.eclass -> x11-apps/mkfontscale -> media-libs/freetype) is rejected or the chain is satisfied with
    package.provided. suckless clients (st, dwm) are patched off Xft onto core X11 XLoadQueryFont.
  source: 'AGENTS.md:27-30,128-130; README.md:304-310; specs/2026-08-14-gui-design.md:0 and 7; configs/portage/profile/package.provided:19-27;
    commit 428c5f7 (#52) message ''verified: 0 scalable-font emerges'''
  rationale: Brand aesthetic (bitmap) and 486 size/RAM; freetype+fontconfig are a large dependency tree and Xft
    makes every X client heavier.
  existing_check:
  - path: configs/portage/profile/package.provided:25-27
    what: provides freetype-2.14.3, mkfontscale-1.2.4, encodings-1.1.0 so they are never merged (version atoms track
      the pinned tree; drift re-introduces freetype silently per the file comment)
    tier: fast
  - path: scripts/build-rootfs.sh (terminus fonts.dir generation, build-time guard that each aliased XLFD exists
      in fonts.dir; see commits 010aac6/428c5f7)
    what: build-time guard for XLFD existence
    tier: slow
  proposed_check: 'On SBOM / VDB: fail if any of media-libs/freetype, media-libs/fontconfig, x11-libs/libXft, x11-apps/mkfontscale,
    media-fonts/font-misc-misc, font-cursor-misc, x11-libs/libXrender is installed; on squashfs: fail on files matching
    libfreetype*, libfontconfig*, libXft*, fonts.conf, and on any ELF that has NEEDED/strings ''FT_Init_FreeType''.
    Also assert versions of package.provided atoms still equal the versions in versions.lock/tree (fast: compare
    package.provided freetype/mkfontscale/encodings versions to the pinned snapshot) so version drift cannot silently
    re-merge them.'
  tier: slow
  contradicted_by:
  - none found in code. (The Rust browser www-client/stele carries its own compiled-in 8x8 bitmap font - consistent.)
- id: D-no-readding-removed-things
  statement: 'Do not add back things deliberately removed (the maintainer notices). Known removals: w3m, nmap, man-db,
    gcc on target, usbutils, fortune-mod, thttpd, dashboard g and / shortcuts, /dashboard/ mirror, loadable ppp
    plugins, dnsmasq TFTP/DNSSEC/script/dbus, nftables inet family/readline, IPv6.'
  source: AGENTS.md:31,42-43; README.md:111,203; RELEASE-READINESS.md:173-176,257-269; commits a93559a/88db40b (#53),
    e065a77/3acaee7, 8c7fc1a
  rationale: Each removal was a cost/size/Python/policy decision; re-adding re-opens a closed argument.
  existing_check:
  - path: configs/portage/package.mask/problematic
    what: man-db, eigen-9999, docutils>=0.23 etc masked
    tier: fast
  - path: web/app/router.js:123
    what: only 't' keyboard shortcut remains (convention, no test)
    tier: null
  proposed_check: Committed 'forbidden-atoms' list (w3m is currently in the README contradiction - see contradictions;
    nmap, man-db, sys-devel/gcc, dev-lang/python, net-www/thttpd, fortune-mod, usbutils) diffed against configs/portage/world
    + versions.lock in pr-validate (fast). Plus a grep guard that web/app has no keydown handler for 'g' or '/'.
  tier: fast
  contradicted_by:
  - 'configs/portage/world:219 still mentions w3m in a comment; plans/2026-08-19-monolith-ux-pass.md:24 lists w3m
    among tools on the disc; commit b42f8af/a72723c re-added w3m/bc/jq attempts on branches - README.md:111 says
    w3m excluded and bc/jq blocked. Real state of w3m/bc/jq in world: not in world (grep world shows only a comment).'
  - 'RELEASE-READINESS.md:173-176 says gdb was dropped (replaced by strace); README.md:87 and configs/portage/world:68
    ship dev-debug/gdb (commit 12e8819 #31). RELEASE-READINESS is stale.'
- id: D-no-dynamic-loading-no-dlopen
  statement: 'ZERO dlopen on the disc: no loadable plugins (ppp --disable-plugins), no sqlite load-extension, no
    perl XS .so (-Uusedl), no X input/driver modules (kdrive built-in drivers), no gdbserver in-process agent. Full
    Xorg disqualified on this alone.'
  source: specs/2026-08-13-perl-for-the-monolith-design.md:7-12 (D2,D3); specs/2026-08-14-gui-design.md:1; configs/portage/env/ppp-no-plugins.conf;
    README.md:93,306; commit 3899e6f
  rationale: Static-only toolchain has no loader policy; a dlopen target would silently break at runtime.
  existing_check:
  - path: scripts/boot-test.py smoke_perl_* / smoke_sqlite_cli / run_gui
    what: runtime smokes prove perl, sqlite3, Xfbdev, dwm, st actually run
    tier: slow
  proposed_check: 'On squashfs: no ELF contains dlopen@ in dynamic symbol table (static ELFs have none) and ''strings
    | grep -c libdl'' is zero; and no *.so outside /lib/modules. Same artifact as D-all-static.'
  tier: slow
  contradicted_by:
  - ld-musl-i386.so.1 shipped (see D-all-static).
- id: D-clock-origin-1970
  statement: 'The clock-epoch origin sentinel is 1970-01-01 (Unix epoch), NOT Y2K. CLOCK_EPOCH_RTC = ''1970-01-01T00:00:00''
    in boot-test.py. Runtime monolith-time-check treats 1970/1980/2000 (SENTINELS=''0 315532800 946684800'') as
    dead-clock ''ignorance'' sentinels (detection breadth, not origin). The disc never assumes what year it is:
    trigger is IGNORANCE not plausibility; a correct 1996 clock must produce no warning and no network call.'
  source: AGENTS.md:32-39; scripts/boot-test.py:463; configs/overlay/app-misc/monolith-base/files/monolith-time-check:58;
    plans/2026-08-19-monolith-ux-pass.md:42-80; commits b8d42c4, 3b2f8a7
  rationale: Maintainer's project mythology; 2000 move was a misdiagnosis (hanging long ISOLINUX label, not the
    RTC) and was reverted.
  existing_check:
  - path: scripts/boot-test.py:463 (CLOCK_EPOCH_RTC) + modes clock-epoch, clock-1996 (MODE_RUNNERS)
    what: clock-epoch asserts dead RTC at 1970 is detected and left untouched (-nic none, hermetic); clock-1996
      asserts no warning/no network call
    tier: slow
  - path: scripts/tests/monolith-time-check.test.sh, scripts/tests/monolith-time.test.sh
    what: unit tests of detection and HTTP-Date setter
    tier: fast
  proposed_check: grep -n 'CLOCK_EPOCH_RTC *= *"1970-01-01T00:00:00"' scripts/boot-test.py in pr-validate (fast);
    keep clock-epoch + clock-1996 modes in the rebuilt oracle.
  tier: fast
  contradicted_by:
  - 'git history: commit e6fd44b moved the sentinel to 2000-01-01 claiming -rtc base=1970 is a deterministic hang
    under -cpu 486; b8d42c4 reverted it saying the cause was the long monolith_time_url ISOLINUX label. So the e6fd44b
    claim is considered wrong by the owner, but the clock-epoch test uses -nic none so a 1970 RTC under -cpu 486
    is only exercised when hermetic; if the rebuild changes the QEMU CPU/flags, re-verify.'
- id: D-supply-chain-honesty
  statement: 'Releases come through the verifiable pipeline. Digest-chain invariant: sha256(ISO) == bom.cdx.json
    metadata.component.hashes[0].content == SLSA attestation subject digest == attestation-summary.json iso_sha256;
    computed ONCE in attestation.sh. SLSA/Sigstore attestation is only issued when the gate verdict (CVE, license,
    unowned) passes. CVE PASS must be falsifiable (scanner+db+policy identity, scanned/unscanned coverage, daily
    canary scanning a Heartbleed fixture, canary asserts raw pre-policy findings not exit code). fail_on_unscanned
    defaults false (documented gap).'
  source: AGENTS.md:41-43; docs/releasing.md:140-192; docs/cve-gate.md (whole); README.md:171-185; dacdfd1 commit
    body 'only issue the signed Sigstore attestation when the gate verdict is pass'
  rationale: Project credibility is the attestation; an unfalsifiable PASS or a mismatched digest defeats it.
  existing_check:
  - path: .github/workflows/release.yml (digest re-verify before gh release create)
    what: re-hashes downloaded ISO against summary and SBOM
    tier: slow
  - path: .github/workflows/cve-gate-canary.yml + scripts/run-cve-canary.sh
    what: scanner liveness canary on scripts/fixtures/canary-sbom.cdx.json (Heartbleed)
    tier: fast
  - path: scripts/attestation.sh (five pillars, all run to completion; verdict aggregated)
    what: gate
    tier: slow
  proposed_check: 'Keep: digest-chain equality assert (3 values) in the attestation job; canary workflow; assertion
    that actions/attest step is skipped when summary.verdict != pass; assertion that cve-policy.yaml sha256 recorded
    in attestation-summary equals sha256sum of file (docs/cve-gate.md:321-323).'
  tier: slow
  contradicted_by:
  - docs/cve-gate.md:57-60 and :190-199 and README.md:185 say nightly-cve-monitor.py is orphaned/not scheduled;
    .github/workflows/nightly-cve-scan.yml (cron '0 4 * * *') now schedules it (commit dacdfd1 'schedule the previously-orphaned
    nightly CVE monitor'). Docs stale.
  - 'Hard S3 dependence: the release publish job downloads from S3, so the verify path is dead until redesigned.'
- id: D-tag-builds-from-source
  statement: 'Tag (release) builds compile every package from source: MONOLITH_USEPKG=n drops --usepkg so no cached
    binary package enters a signed release.'
  source: AGENTS.md:83-84; .github/workflows/build.yml:264-288; scripts/build-packages.sh:216-224; commit b0e0ca6
    (#54)
  rationale: Signed releases must not contain unattested/cached binaries.
  existing_check:
  - path: .github/workflows/build.yml:285
    what: MONOLITH_USEPKG expression startsWith(github.ref,'refs/tags/') -> 'n'
    tier: fast
  proposed_check: In the tag build, assert emerge log contains no 'Emerging binary' lines / assert classification
    in build-packages.sh reports source for every package (build-packages.sh classifies source-vs-binpkg since 16affed).
  tier: slow
  contradicted_by: []
- id: D-revbump-on-overlay-change
  statement: 'Any change to an overlay ebuild, or to a savedconfig-governed package config, or to configs/kernel.config,
    must revbump (-rN, git mv) AND bump versions.lock, because Portage binpkg reuse keys on version+USE+CHOST, not
    content. extract-packages.sh enforces versions.lock matches. Cost seen: three identical failed runs of perl
    (same stale binary), gui startx r5 stale, monolith-base console HOME.'
  source: AGENTS.md:134-136; docs/version-pinning.md:624-663; specs/2026-08-04-sp1...:3.1; specs/2026-09-17-legacy-fbdev...:'Ebuild
    revbump'; commits 2fda3a2, 63c5b3b, 5902b70, 0fbbb51
  rationale: Stale S3/GHCR binpkg silently replaces the edited build; failure looks like the fix does nothing.
  existing_check:
  - path: scripts/savedconfig-cache.sh (+ scripts/tests/savedconfig-cache.test.sh)
    what: stores SHA-256 of each tracked savedconfig beside its binpkg and purges when changed (busybox only; kernel
      intentionally excluded)
    tier: fast
  - path: scripts/extract-packages.sh (versions.lock pin enforcement)
    what: pinned version must match installed
    tier: slow
  - path: scripts/verify-resolved-i2c-off.sh + build-packages.sh classification
    what: kernel resolved config shipped as package content so a cache hit still proves CONFIG_I2C
    tier: slow
  proposed_check: 'git-diff gate in pr-validate: if a PR touches configs/overlay/<cat>/<pkg>/(files/*|*.ebuild)
    or configs/kernel.config or configs/portage/savedconfig/* or configs/initrd-modules.txt, then the same PR must
    contain a git rename of the ebuild to a higher -rN (or a new PV) and a changed versions.lock line for that atom.
    Artifact: git diff base...HEAD.'
  tier: fast
  contradicted_by:
  - 'docs/version-pinning.md:624-663 still tells operators to ''aws s3 rm'' the binpkg; superseded by savedconfig-cache.sh
    (0fbbb51) and, after #46, the binpkg store moved from S3 to GHCR (scripts/binpkg-store.sh). Doc stale.'
- id: D-hand-authored-rootfs-files-owned
  statement: Every hand-authored file in the rootfs must be owned by a package (app-misc/monolith-base) or listed
    in configs/attestation/unowned-allowlist.yaml, else attestation Pillar 4 fails the build. New file => new ownership
    or allowlist entry (also directories created by install -D).
  source: AGENTS.md:137-139; docs/cve-gate.md:325-330 (table row unowned-allowlist.yaml); commit 89ac9b3 (#41);
    commit 5b79b9e (cgi-bin dir)
  rationale: 'Pillar 4 ''unowned files'' honesty: nothing on disk may be unaccounted for.'
  existing_check:
  - path: scripts/check-unowned.py invoked by scripts/attestation.sh (Pillar 4)
    what: fails on unowned file not matching allowlist
    tier: slow
  proposed_check: 'Same, plus shrink-only rule: allowlist must not grow without a justification line (fast diff
    check on configs/attestation/unowned-allowlist.yaml).'
  tier: slow
  contradicted_by:
  - README.md:79 says monolith-base owns 'formerly installed by build-rootfs.sh' files, but scripts/build-rootfs.sh
    still heredoc-installs /etc/profile.d/50-dropbear-hint.sh, rcK, rcS, inittab etc. (build-rootfs.sh:297-322,
    479). Migration partial.
- id: D-state-and-no-hidden-stderr
  statement: 'Debugging discipline: capture stderr before theorizing (never 2>/dev/null while debugging); instrument
    both sides of a boundary early; every boot test must mean something and be de-flaked not retried (bounded launch-retry
    only for a silent QEMU startup that never reached /init).'
  source: 'AGENTS.md:58-63; commits 49cccbd (dd: not found masked), e5ab01c (wrong serial-starvation story corrected),
    7a7081e (bounded relaunch)'
  rationale: Several multi-run debugging sessions chased wrong causes because of swallowed output.
  existing_check:
  - path: scripts/tests/boot-test-retry.test.sh
    what: locks the flake-vs-real-failure retry decision matrix (retry only when guest never reached /init)
    tier: fast
  proposed_check: 'lint: no ''2>/dev/null'' on commands in scripts/boot-test.py guest commands added without a comment
    (advisory); keep retry decision matrix test.'
  tier: fast
  contradicted_by:
  - rootfs/init:465,483 still uses 2>/dev/null around the persist label cat|tr|grep probe (acceptable there; was
    the original masking site for dd).
- id: D-486-tier-regime
  statement: 'Three-tier kernel driver regime. Tier 0 =y: boot-critical (ATA/PIIX/PATA southbridges, SR/CDROM, ISO9660/SQUASHFS/OVERLAY/TMPFS/VFAT,
    INITRD/DEVTMPFS, serial/FB/FB_EFI/FB_VESA, ACPI/EFI, MODULES+UNLOAD). Tier 1: initramfs modules, broad, ''reach
    the boot media'' (configs/initrd-modules.txt), loaded by kmod. Tier 2: rootfs squashfs =m, coldplugged by modalias
    (NICs, mouse, evdev, legacy fbdev x27, netfilter). No firmware-blob drivers (CONFIG_EXTRA_FIRMWARE must be unset;
    WiFi deferred). NICs/mouse/graphics belong in Tier 2. A bool symbol with depends on FB=y (FB_ASILIANT, FB_IMSTT)
    can never be Tier 2 so it is excluded.'
  source: docs/kernel-tiers.md (all); specs/2026-08-04-sp1...:3,6; specs/2026-09-17-legacy-fbdev-design.md; AGENTS.md:169-170
  rationale: Resolve 486 RAM vs modern-hardware coverage by when a driver is needed.
  existing_check:
  - path: scripts/tests/verify-nic-zoo-config.sh, verify-netfilter-config.sh, verify-legacy-fbdev-config.sh
    what: per-feature config intent checks incl. EXTRA_FIRMWARE unset (verify-nic-zoo-config.sh:18, verify-legacy-fbdev-config.sh:54)
    tier: fast
  - path: .github/workflows/build.yml (steps 'Assert legacy fbdev kernel modules built and shipped', NIC .ko assertion,
      modinfo -F firmware empty)
    what: .ko ship + no firmware
    tier: slow
  - path: scripts/boot-test.py modes nicless, nic, vga (cirrus), fbdev-modprobe, ahci, nvme, usb, virtio
    what: 'mechanism proof: negative NIC-less + 4 storage positive paths + coldplug of cirrusfb + no taint/oops
      on hand modprobe'
    tier: slow
  proposed_check: 'Keep all of the above. Add: (a) TRIM_UNUSED_KSYMS watch: after any =y->=m flip, boot-test lsmod/modprobe
    of every changed module must not log ''Unknown symbol'' (dmesg grep); (b) CONFIG_ATA_PIIX plus pata_via/sis/ali/legacy
    =y audit (docs/kernel-tiers.md:53-63 says audit still ''tracked separately'' - open); (c) record bzImage before/after
    size per tier-changing PR.'
  tier: slow
  contradicted_by:
  - docs/kernel-tiers.md:173 says 'Twenty-seven .ko modules' / 'Twenty-seven' while the spec says '24 symbols, 27
    modules' and the table lists 27 symbols incl. 3 Geode - consistent count only for modules, not symbols; AGENTS.md:174-175
    says '24 =m framebuffer drivers'. Minor count drift.
  - RELEASE-READINESS.md:247-255 says no module support (modules_install not run); now false (kernel ebuild runs
    modules_install since 513574d).
  - README.md:167 lists Tulip/e100/e1000/8139/r8169/virtio as CONFIG_*; after SP1 these are =m, not built-in; text
    is not wrong but hides that they are modules.
- id: D-s3-publish-only
  statement: 'S3 is publish-only: nothing produced and consumed within one workflow run touches S3 (inner loop on
    actions/cache; versioned S3 uploads and ''latest'' pointers only from master/tag builds; validation builds leave
    zero S3 footprint). K3s self-hosted runners deferred. (Binpkg store later moved from S3 to GHCR OCI artifact
    in #46.)'
  source: specs/2026-08-11-ci-transfer-cost-design.md; plans/2026-08-18-ci-efficiency-round2.md; AGENTS.md:198-200;
    commits 31f4b67 (#22), 49a21e1 (#46)
  rationale: S3 egress was the dominant AWS cost (~17 ISO downloads per build).
  existing_check:
  - path: .github/workflows/build.yml (PUBLISH_LATEST gating, actions/cache handoff keyed by run_id)
    what: implementation
    tier: slow
  proposed_check: 'grep boot-test/attestation job logs/steps for ''aws s3 cp|sync'' reads (spec success criterion
    1) - redesign target moot while S3 is dead: replace with the equivalent for the new object store.'
  tier: slow
  contradicted_by:
  - 'AGENTS.md:198-200 says spec/plan live on branch feat/ci-transfer-cost - they are merged (#21,#22). AGENTS.md:195-197
    says bucket has no lifecycle policy; scripts/s3-gc.sh + gc.yml apply weekly since #59 (1bcb2fe).'
- id: D-two-epoch-pin-model
  statement: 'Two independent pins: TOOLCHAIN_EPOCH (Dockerfile ARG; stage3 base + baked toolchain portage tree
    via emerge-webrsync --revert; bumped rarely, human-gated, drives crossdev.lock) and BUILD_EPOCH (runtime portage
    snapshot injected by scripts/sync-portage.sh from the self-hosted mirror; drives versions.lock and SOURCE_DATE_EPOCH,
    bumped routinely). A BUILD_EPOCH bump must NOT rebuild the builder image. Builder-image registry tag = TOOLCHAIN_EPOCH
    + hash of Dockerfile minus the two runtime-injected lines, and must be pushed on EVERY build (consumers pull
    by exact tag). SOURCE_DATE_EPOCH == BUILD_EPOCH at midnight UTC.'
  source: docs/version-pinning.md:7-125; specs/2026-08-12-decouple-portage-epoch-design.md; Dockerfile:28-44; commits
    abacc23 (#25), e30a034, b35e8fa
  rationale: Snapshot pruning broke every build (20260803 outage); data refresh was forcing 100-min toolchain rebuilds.
  existing_check:
  - path: scripts/tests/sync-portage.test.sh
    what: S3-first/upstream-fallback/archive logic with stubbed aws+wget
    tier: fast
  - path: scripts/update-build-pins.sh check/update (verify_portage_snapshot)
    what: refuses to bump to a date lacking a published snapshot; fail-closed assertion that Dockerfile changed
    tier: fast
  proposed_check: 'Fast: assert Dockerfile SOURCE_DATE_EPOCH == date -u -d "$BUILD_EPOCH" +%s (current 1786406400
    == 2026-08-11 00:00 UTC: verify) ; assert exactly the two ARGs exist. Slow: with the cached image, a BUILD_EPOCH-only
    diff leaves build-image reporting ''up to date'' (acceptance criterion 1 of the spec).'
  tier: fast
  contradicted_by:
  - docs/version-pinning.md:299-304 and :417-418 say no TOOLCHAIN_EPOCH bump automation exists; .github/workflows/toolchain-bump.yml
    and 'update-build-pins.sh update-toolchain' exist.
  - docs/version-pinning.md:531-534 (and :491-514 flow diagram header) say a bump PR is never auto-merged; .github/workflows/pin-bump.yml:372-396
    auto-merges fully-green BUILD_EPOCH bumps (gh pr merge --squash --admin). Spec 2026-08-12 intended auto-merge.
  - 'AGENTS.md:201-204 / docs/version-pinning.md:337-360: the toolchain portage tree (Dockerfile:74 plain emerge-webrsync)
    and stage3 base are NOT mirrored to S3; a pruned TOOLCHAIN_EPOCH snapshot or GHCR eviction makes the image un-rebuildable.
    STILL OPEN.'
- id: D-static-musl-cross-all-the-way
  statement: Cross-compile to i486-linux-musl via crossdev; CFLAGS -march=i486 -mtune=i486 -Os -fno-exceptions;
    host-native build tools use CFLAGS_FOR_BUILD='-O2 -m32' so 64-bit longs do not leak into 32-bit data files (nethack
    dlb); Dockerfile verifies host gcc -m32 multilib; IPv6 off (-ipv6, nft 'ip' family only); every source Manifest-pinned
    (BLAKE2B+SHA512); overlay ebuilds need '<cat>/<pkg> **' in package.accept_keywords/i486.
  source: configs/portage/make.conf:15-36; RELEASE-READINESS.md:41-57; Dockerfile:55-64; specs/2026-08-04-sp2...:3;
    commit 77ca4b3
  rationale: ABI correctness and size.
  existing_check:
  - path: Dockerfile:55-64 (m32check)
    what: build fails if host gcc lacks -m32
    tier: slow
  proposed_check: 'Fast: every dir in configs/overlay/*/* with an ebuild has a ''<cat>/<pkg> **'' line in configs/portage/package.accept_keywords/i486
    and a Manifest with BLAKE2B+SHA512 for every SRC_URI. Slow: all ELFs are EM_386.'
  tier: fast
  contradicted_by:
  - RELEASE-READINESS.md:200-202 states CFLAGS_FOR_BUILD; in make.conf it is present (line 25-ish). Consistent.
