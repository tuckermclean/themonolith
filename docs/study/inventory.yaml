    notes: 'Gentoo''s busybox ebuild drops modutils applets in favour of sys-apps/kmod regardless of savedconfig
      (build-initrd.sh:97-102), so CONFIG_MODPROBE=y etc. here are ineffective; the initramfs uses the static kmod
      instead. Header says generated ''Thu Mar 5 15:43:34 2026''. CONFIG_FINDFS=y in savedconfig vs AGENTS.md ''lacks
      findfs'': the shipped binpkg was stale (savedconfig-cache.sh added to prevent recurrence).'
