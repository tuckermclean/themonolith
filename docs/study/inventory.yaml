apiVersion: themonolith/v0
kind: SystemInventory
source:
  repo: tuckermclean/linux-live-iso-factory
  head: b9f533b
  studied: '2026-10-27'
components:
- id: wf.build
  kind: workflow
  path: .github/workflows/build.yml
  purpose: Single definition of build + boot-test + SLSA attest; entry point (OIDC) for releases and pin-bump validation.
  triggers:
  - push branches [master] (build.yml:20)
  - push tags ['v*.*.*'] (21)
  - pull_request types opened/reopened/synchronize/labeled (28) - only runs if label full-ci (gated in job changes,
    58-60)
  - workflow_dispatch (29) - used by pin-bump/toolchain-bump via gh workflow run
  - schedule cron '0 3 * * 1' (31) Mondays 03:00 UTC
  invokes:
  - job.build.changes
  - job.build.build-image
  - job.build.build
  - job.build.boot-test
  - job.build.attestation
  invoked_by:
  - wf.pin-bump
  - wf.toolchain-bump
  permissions: workflow-level contents:read, packages:write (33-35); job-level overrides below
  env:
  - REGISTRY=ghcr.io/${{ github.repository_owner }} (49) - NOT lowercased here; build job separately lowercases
    for GHCR_OWNER (199)
  secrets:
  - secret.AWS_ACCESS_KEY_ID
  - secret.AWS_ACCESS_KEY_SECRET
  - secret.AWS_REGION
  - secret.S3_BUCKET
  - secret.GITHUB_TOKEN
  external:
  - ext.ghcr
  - ext.aws-s3
  - ext.github-attestations
  - ext.sigstore
  - ext.github-api
  - ext.dockerhub
  s3_coupling: hard
  notes:
  - 'concurrency group: PRs ''build-pr-<n>'' cancel-in-progress; all other events get unique group build-<run_id>
    so never cancel (41-46). cancel-in-progress is true but only effective for PRs.'
  - Header comment (3-17) documents why build.yml must be OIDC entry point (attest persist fails with 'build.yml
    != release.yml' when run via workflow_call). This is a hard constraint for the rebuild's signing design.
  - 'No timeout-minutes on any job: default 360.'
  - Comment at 553-558 says release.yml calls this ENTIRE workflow via workflow_call - STALE; release.yml no longer
    does (see contradictions).
  rebuild_notes:
  - 'Preserve: tag build = from-source/no binpkg; PUBLISH_LATEST only on master/tag; attestation signs only if gate
    verdict pass; ISO handed to boot-test via cache (any replacement store must be per-run).'
  - 'Rebuild must replace: S3 (iso/squashfs/initrd/vmlinuz/attestation/dashboard/portage snapshot) - e.g. GHCR OCI
    artifacts + GitHub Release/Pages.'
  - The build job needs ~2h+ and 2 jobs / load 2; JOBS=2 LOAD_AVG=2 hard-coded for 4-vCPU runner (288, 506).
- id: job.build.changes
  kind: job
  path: .github/workflows/build.yml:52
  purpose: paths-filter to decide whether packages/Dockerfile changed; also gate (label full-ci) for PRs.
  triggers:
  - push
  - pull_request(label full-ci)
  - workflow_dispatch
  - schedule
  needs: []
  if: github.event_name != 'pull_request' || contains(labels.*.name,'full-ci') (58-60)
  runner: ubuntu-latest
  permissions: 'inherited: contents:read packages:write'
  timeout: default-360
  invokes: []
  outputs:
  - dockerfile
  - packages
  pins:
  - thing: actions/checkout
    value: '@v4'
    evidence: build.yml:65
  - thing: dorny/paths-filter
    value: '@v3 (third-party, tag-pinned)'
    evidence: build.yml:66
  inputs:
  - what: 'path filters: dockerfile=[Dockerfile]; packages=[configs/portage/world, configs/portage/versions.lock,
      configs/overlay/**, scripts/**, rootfs/**]'
    evidence: build.yml:69-77
  secrets: []
  external:
  - ext.github-api
  s3_coupling: none
  notes:
  - Filter for 'packages' does NOT include configs/kernel.config, configs/portage/{make.conf,package.*,savedconfig},
    web/ - config-only changes on a push to master do not trigger the build job unless image-changed/dispatch/schedule/tag/PR
    (see build job `if`).
  - On tag/schedule/dispatch the filter's value is irrelevant as the build job `if` is OR'd.
- id: job.build.build-image
  kind: job
  path: .github/workflows/build.yml:79
  purpose: Build+push the builder (crossdev toolchain) Docker image only when Dockerfile changed or registry tag
    missing.
  triggers:
  - push
  - pull_request
  - workflow_dispatch
  - schedule
  - tag
  needs:
  - changes
  if: (implicit; skipped if changes skipped)
  runner: ubuntu-latest
  permissions:
    contents: read
    packages: write
    id-token: none
    attestations: none
  timeout: default-360
  invokes:
  - make.print-registry-tag
  - make.ensure-dirs
  - make.build-image
  - make.push-image
  outputs:
  - 'image-changed = (gate.image-exists==''true'' ? ''false'' : ''true'')'
  commands:
  - cmd: docker login ghcr.io (docker/login-action@v3, user github.actor, GITHUB_TOKEN)
    rw: writes ~/.docker/config.json
    evidence: build.yml:90-95
  - cmd: docker manifest inspect $REGISTRY/monolith-builder:$TAG
    rw: reads GHCR manifest only; TAG from `make -s print-registry-tag REGISTRY=...`
    evidence: build.yml:109-112
    note: skip build iff dockerfile filter != true AND tag exists
  - cmd: docker pull $REGISTRY/monolith-builder:latest and monolith-builder-base-tools:latest (|| true) then docker
      tag to local names monolith-builder / monolith-builder-base-tools
    rw: reads GHCR, writes local docker tags to warm --cache-from
    evidence: build.yml:135-138
  - cmd: make build-image (REGISTRY env)
    evidence: build.yml:142
  - cmd: make push-image (REGISTRY env)
    rw: pushes builder image tags to GHCR
    evidence: build.yml:163
  secrets:
  - secret.GITHUB_TOKEN
  pins:
  - thing: actions/checkout
    value: '@v4'
    evidence: build.yml:88
  - thing: docker/login-action
    value: '@v3'
    evidence: build.yml:91
  - thing: actions/upload-artifact
    value: '@v4'
    evidence: build.yml:148
  artifacts:
  - upload: crossdev-logs-${run_id}
    path: output/portage-logs/
    if: failure() && image not skipped
    retention: 7d
    evidence: build.yml:146-152
  caches:
  - docker layer warm via pulled :latest tags (not actions/cache)
  external:
  - ext.ghcr
  s3_coupling: none
  notes:
  - Gate inspects only the manifest tag from Makefile REGISTRY_TAG (hash of Dockerfile etc.). Gate comment 97-103.
  - 'Builds on a hosted runner: crossdev from-scratch is ~50-100 min.'
  rebuild_notes:
  - Content-addressed builder-image tag + 'exists? skip' pattern is worth preserving.
- id: job.build.build
  kind: job
  path: .github/workflows/build.yml:167
  purpose: Cross-compile all packages in the builder container, assemble squashfs/initrd/ISO, run in-CI kernel assertions,
    publish to S3 (master/tag), save binpkg cache to GHCR.
  triggers:
  - push master
  - tag
  - pull_request(full-ci)
  - workflow_dispatch
  - schedule
  needs:
  - changes
  - build-image
  if: changes.packages=='true' || build-image.image-changed=='true' || event is workflow_dispatch|schedule|pull_request
    || ref startsWith refs/tags/ (176-182)
  runner: ubuntu-latest
  permissions:
    contents: read
    packages: write (binpkg push to GHCR)
    id-token: none
    attestations: none
  timeout: default-360
  outputs:
  - build-started-on
  - build-version
  - publish-latest
  invokes:
  - make.pull-image
  - make.ensure-dirs
  - make.ensure-volume
  - make.sync-portage
  - script.binpkg-store
  - script.savedconfig-cache
  - make.build-packages
  - script.verify-resolved-i2c-off
  - make.build-rootfs
  - make.iso
  secrets:
  - secret.AWS_ACCESS_KEY_ID
  - secret.AWS_ACCESS_KEY_SECRET
  - secret.AWS_REGION
  - secret.S3_BUCKET
  - secret.GITHUB_TOKEN
  env_vars_derived:
  - BUILD_EPOCH=$(grep '^ARG BUILD_EPOCH=' Dockerfile | cut -d= -f2) (193) -> GITHUB_ENV
  - GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,} (199)
  - BUILD_STARTED_ON=date -u (200)
  - BUILD_VERSION = tag minus 'v' | '<BUILD_EPOCH>-<git short HEAD>' (203-207)
  - MONOLITH_USEPKG = 'n' on tag else 'y' (285)
  - PUBLISH_LATEST = true iff ref==refs/heads/master or any tag (481)
  steps_ordered:
  - n: 1
    name: Set build version
    line: 190
  - n: 2
    name: Configure AWS credentials
    line: 211
    note: THIS is the step failing in all current Build failures (S3 account disabled) - fails the job before anything
      is built
  - n: 3
    name: Log in to GHCR
    line: 218
  - n: 4
    name: Install oras 1.2.0
    line: 231
  - n: 5
    name: make pull-image
    line: 243
  - n: 6
    name: make ensure-dirs ensure-volume
    line: 248
  - n: 7
    name: make sync-portage (S3_BUCKET)
    line: 250
    note: 'S3 HARD: scripts/sync-portage.sh reads portage snapshot from S3 (script in other area)'
  - n: 8
    name: Pull binary package cache from GHCR (non-tag)
    line: 267
  - n: 9
    name: Purge stale savedconfig binpkgs (non-tag)
    line: 271
  - n: 10
    name: 'Build packages: make build-packages JOBS=2 LOAD_AVG=2 MONOLITH_USEPKG=...; background `while true; do
      date; df -h; free -h; sleep 60; done &` monitor'
    line: 281
  - n: 11
    name: Upload package build logs on failure
    line: 296
  - n: 12
    name: ASSERT resolved kernel config no CONFIG_I2C
    line: 312
  - n: 13
    name: ASSERT NIC kernel modules built and shipped
    line: 323
  - n: 14
    name: ASSERT legacy fbdev modules built/shipped + no firmware
    line: 362
  - n: 15
    name: chown output/packages (always)
    line: 425
  - n: 16
    name: savedconfig-cache.sh mark (always)
    line: 435
  - n: 17
    name: Save binary package cache to GHCR (always, non-fatal)
    line: 448
  - n: 18
    name: Determine publish-latest (always)
    line: 468
  - n: 19
    name: Save build logs to S3 (always && PUBLISH_LATEST)
    line: 491
  - n: 20
    name: Save kernel image to S3
    line: 495
  - n: 21
    name: make build-rootfs JOBS=2 LOAD_AVG=2
    line: 505
  - n: 22
    name: cache/save squashfs
    line: 508
  - n: 23
    name: Save squashfs to S3
    line: 514
  - n: 24
    name: Save initrd to S3
    line: 523
  - n: 25
    name: make iso
    line: 532
  - n: 26
    name: cache/save ISO
    line: 535
  - n: 27
