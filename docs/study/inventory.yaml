  where: .github/workflows/boot-test.yml:8-22
  fact: Only build.yml calls it; release.yml does not.
  evidence: 'grep ''uses: ./.github/workflows/boot-test.yml'' -> only build.yml:562'
  area: workflows
- claim: build.yml:316-319 says NIC boot matrix proves 6 of the 21 new symbols
  where: .github/workflows/build.yml:316-319
  fact: boot matrix lists 5 NIC models (pcnet rtl8139 tulip ne2k_pci ne2k_isa, boot-test.yml:567); module assertion
    list has 23 names incl. 7 netfilter modules.
  evidence: boot-test.yml:567; build.yml:337-342
  area: workflows
- claim: build.yml:497-503 etc. imply 'latest' pointers published only after validation; header says 'no release
    without a proven boot' (boot-test.yml:5-6)
  where: .github/workflows/build.yml:495-546 vs 559-565
  fact: latest vmlinuz/squashfs/initrd/iso are copied to S3 inside the build job BEFORE boot-test runs. Boot-test
    gates only attestation and release, not the public 'latest' pointer.
  evidence: build.yml:495-546 precede boot-test at 559
  area: workflows
- claim: build.yml binpkg cache moved from S3 to GHCR ('replaces old whole-tree aws s3 sync')
  where: .github/workflows/build.yml:255-261,442
  fact: Cache itself is GHCR, but build.yml:809 still excludes 'packages/*' from site sync and gc.yml/s3-gc.sh still
    operates on S3 keep-lists (vestige of S3 binpkg tree).
  evidence: build.yml:809; gc.yml:26-29
  area: workflows
- claim: AGENTS.md says tag builds skip binpkg cache entirely ('no cached binary enters a signed release')
  where: AGENTS.md (Release flow), build.yml:262-266
  fact: Tag builds skip pull and purge, but still run prune/pack/push of the freshly built packages to GHCR monolith-binpkgs:<epoch>
    (no tag guard at build.yml:448-466). A tag build can therefore populate the cache non-master builds later consume;
    harmless for the tag itself.
  evidence: 'build.yml:448-466 has no `if: !startsWith(github.ref, ''refs/tags/'')`'
  area: workflows
- claim: 'scripts/verify-resolved-i2c-off.sh header: build.yml invocation is single-argument, mode label ''unknown''
    in CI'
  where: scripts/verify-resolved-i2c-off.sh:25-27
  fact: Consistent with build.yml:313, but the recent commits (DCX-99) claim CI 'names build mode'; the workflow
    does not pass a mode, so CI output always says 'unknown'.
  evidence: build.yml:313
  area: workflows
- claim: pin-bump.yml header comment states cron is 3h after build.yml's weekly build
  where: .github/workflows/pin-bump.yml:41-43
  fact: Timing is correct (03:00/06:00) but a from-source/master build takes 30-60 min+; relation is only loose;
    not a contradiction in values.
  evidence: build.yml:31, pin-bump.yml:44
  area: workflows
- claim: docs say release.yml is self-contained for provenance
  where: docs/releasing.md:75-106 (not fully read)
  fact: Workflow code matches the post-#54/#55/#56 flow (build owns tag, release is workflow_run). No disagreement
    found except the stale comments above.
  evidence: release.yml:3-29
  area: workflows
