  - builder digest is `docker inspect .Id` (image config ID), not a registry manifest digest; uri pkg:docker/ghcr.io/<owner>/monolith-builder.
  rebuild_notes:
  - If the new factory is not GitHub Actions, buildType/builder.id/workflow_ref semantics and the 'actions/attest'
    signing path must be redesigned; digest-chain step 5 (docs/releasing.md:161-166) depends on actions/attest verifying
    subject-path hash.
