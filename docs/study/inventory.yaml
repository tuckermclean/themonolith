  key_fields: timestamp, sbom_path, cve_report_path, native_report_path, scanner{name,version}, db{built,schema_version,checksum,status,age_days,age_warning},
    policy{path,sha256,loaded,gating_severities,informational_severities,fail_on_unscanned,allowlist_size}, coverage{total_components,scanned,unscanned,matched,clean},
    unscanned_components[{name,version}], findings[{cve,severity,component,version,cpe,fix_state,fix_versions,gating,waived,waiver_justification,waiver_approved_by,waiver_expires,url}],
    summary{total_findings,gating_findings,waived_findings}, verdict, verdict_reasons[]
  evidence: scripts/check-cves.sh:355-394
- name: license-report.json
  producer: script.check-licenses
  consumers: script.attestation (license_failures), web view-build Licenses tab + overview donut + compare, script.generate-provenance
    (byproduct)
  location: s3://$S3_BUCKET/attestation/<tag>/license-report.json
  key_fields: build_tag,timestamp,sbom_path,policy_path,policy_sha256,summary{total,pass,fail,unknown},components[{name,version,raw_license,normalized[],status
    pass|fail|unknown,reason}]
  evidence: scripts/check-licenses.py:327-346
- name: unowned-report.json
  producer: script.check-unowned
  consumers: script.attestation (unowned_count/unowned_files), web view-build Unowned tab/overview, script.generate-provenance
    (byproduct)
  location: s3://$S3_BUCKET/attestation/<tag>/unowned-report.json
  key_fields: timestamp,syft_schema,sysroot,summary{total_files,owned,allowlisted,unowned},unowned_files[]
  evidence: scripts/check-unowned.py:272-283
- name: slsa-provenance.json
  producer: script.generate-provenance
  consumers: '"job.build.attestation: ''Read SLSA predicate'' extracts .predicate and passes to actions/attest@v2
    (predicate-type https://slsa.dev/provenance/v1, subject-path ISO)", "NOT consumed by web/ or release.yml"'
  location: output/attestation/slsa-provenance.json -> s3 attestation/<tag>/; signed copy lives in GitHub's attestation
    store (ext.github-attestations / ext.sigstore) keyed by ISO sha256
  key_fields: _type in-toto Statement v1; subject[0]{name themonolith-<tag>.iso,digest.sha256}; predicateType https://slsa.dev/provenance/v1;
    predicate.buildDefinition{buildType,externalParameters.workflow,internalParameters{github{...},build{tag,source_date_epoch}},resolvedDependencies[git
