  - id: ebuild.games-roguelike/rl144
    path: configs/overlay/games-roguelike/rl144/rl144-0.1.0_p20260805.ebuild
    version: 0.1.0_p20260805
    purpose: Cross-build rl144 (Rust, integer-only roguelike) as a static i486-musl binary using rustup nightly
      + -Zbuild-std for a custom JSON target.
    upstream:
      source: https://github.com/tuckermclean/rl144/archive/${COMMIT}.tar.gz -> ${P}.tar.gz (ebuild:16)
      pin: 'COMMIT=f33a80efc4b0b02ce72e708182594b84695e742d (ebuild:15). Manifest: rl144-0.1.0_p20260805.tar.gz
        636169 SHA512 cbec2b7ead488367419b6b6c1cc524a54fd47093cbaf6b9a7530e41e32b89ebe472f01657a32726eafb0495049827c6c3cf7d22e6187983798e1455fc9a34239.
        Fallback plan if GitHub archive gzip drifts: host tarball in project S3 (ebuild:12-14).'
      evidence: ebuild:9-17; Manifest:1
    build_hacks:
    - what: RESTRICT=network-sandbox
      why: '-Zbuild-std fetches std''s own pinned crates (libc, object, gimli, ...) from crates.io during src_compile;
        versions pinned by the nightly''s rust-src Cargo.lock so deterministic. Future hardening: vendor into builder
        image.'
      evidence: ebuild:26-31
    - what: 'Toolchain from the builder image''s rustup, NOT portage: RUST_NIGHTLY=nightly-2026-07-15; RUSTUP_HOME
        defaults /opt/rustup; PATH+=/opt/cargo/bin; CARGO_HOME=${T}/cargo; CARGO_TARGET_DIR=${WORKDIR}/cargo-target'
      why: nightly + -Zbuild-std for a custom JSON target is a rustup workflow; i486 has no prebuilt Rust std. Pin
        MUST match Dockerfile (Dockerfile:170 --default-toolchain nightly-2026-07-15 --component rust-src).
      evidence: ebuild:33-50; Dockerfile:164,170
    - what: 'files/i486-unknown-linux-musl.json custom target spec: cpu i486, features -cmov,-mmx,-sse,-sse2, max-atomic-width
        32, panic-strategy abort, crt-static-default true, env musl, crt-objects-fallback musl, pre-link-args -m32
        -Wl,-melf_i386, relro full, std true, tier 2'
      why: no rustc built-in i486 musl target; no cmov/MMX/SSE; 32-bit atomics only (i486 has no cmpxchg8b)
      evidence: files/i486-unknown-linux-musl.json:1-106
    - what: CARGO_TARGET_I486_UNKNOWN_LINUX_MUSL_LINKER=${CHOST}-gcc (env var name derived from JSON filename stem)
      why: link with the same crossdev musl gcc as the rest of the ISO
      evidence: ebuild:52-56
    - what: RUSTFLAGS=-Clink-self-contained=no -Clink-arg=-L${T}/unwindlib
      why: by default rustc links 'self-contained' (-nostartfiles -nodefaultlibs, own crt objects from its rustlib
        dir, empty for this custom target) giving 'cannot find crtend.o/crtn.o'. Disabling lets the i486-linux-musl-gcc
        driver supply crt objects from its own paths (crtn.o under /usr/i486-linux-musl/usr/lib/, crtend.o under
        /usr/lib/gcc/i486-linux-musl/15/).
      evidence: ebuild:66-92
    - what: alias libgcc_eh.a (fallback libgcc.a) as ${T}/unwindlib/libunwind.a
      why: even with panic=abort std's backtrace support references _Unwind_* so rustc links -lunwind; crossdev
        musl/gcc has no standalone libunwind, the unwinder lives in libgcc
      evidence: ebuild:77-91
    - what: cargo +nightly-2026-07-15 -Z build-std=std,panic_abort -Z json-target-spec build --release --no-default-features
        --features backend-term --target <json> --manifest-path ${S}/Cargo.toml
      why: terminal backend only; panic_abort to match Cargo profile panic=abort
      evidence: ebuild:94-102
    - what: 'src_install readelf guard: die if PT_INTERP present; ewarn if not Intel 80386; install to /usr/bin
        (not /usr/games/bin)'
      why: 'all-static i486 rootfs: dynamic/wrong-arch would fail at boot; /usr/games/bin not on rootfs PATH (mirrors
        bsd-games)'
      evidence: ebuild:105-127
    - what: diagnostic prints of gcc -print-file-name=crtn.o/crtend.o and -print-search-dirs
      why: leftover debugging of crossdev sysroot layout (kept; '|| true')
      evidence: ebuild:58-64
    traps_encoded:
    - 'Rust: rustup nightly + build-std + link fixes -> static i486-musl (AGENTS.md ''Static cross-build recipes'').
      Link fixes visible in this ebuild: (1) custom target JSON, (2) self-contained=no, (3) libunwind alias, (4)
      panic-strategy abort, (5) CARGO_TARGET_*_LINKER=${CHOST}-gcc, (6) network-sandbox off for build-std crates.
      AGENTS says ''6 link fixes''; this ebuild shows these six.'
    doctrine:
    - all-static
    - 486-minimalism
    deps_cut: []
    fetches_at_build:
    - ext.rustup (toolchain baked into builder image at image-build time, not at emerge)
    - ext.crates-io (std deps during build-std; network-sandbox disabled)
    - ext.git-github (source tarball)
    revbump_state: 'AGREE: versions.lock:85 games-roguelike/rl144:0.1.0_p20260805:0 matches ebuild; Manifest present.
      Pinned by commit + date (_p), not -rN.'
