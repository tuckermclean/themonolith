- id: script.generate-provenance
  kind: script
  path: scripts/generate-provenance.py
  purpose: Emit an in-toto Statement v1 with SLSA Build v1 predicate (self-generated) for the ISO
  triggers: []
  invokes: []
  invoked_by:
  - script.attestation
  inputs:
  - what: --iso-sha256 --iso-name --build-tag --output (+optional epochs, digests, kernel version/sha512, builder
      digest, started/finished)
    from: attestation.sh args
    evidence: scripts/generate-provenance.py:52-74; scripts/attestation.sh:674-691
  - what: 'GitHub Actions env: GITHUB_SERVER_URL, GITHUB_REPOSITORY, _ID, _OWNER_ID, _VISIBILITY, REF, SHA, RUN_ID,
      RUN_NUMBER, RUN_ATTEMPT, EVENT_NAME, WORKFLOW_REF, WORKFLOW_SHA, ACTOR, ACTOR_ID, SOURCE_DATE_EPOCH'
    from: forwarded into container via Makefile GITHUB_ENV
    evidence: scripts/generate-provenance.py:88-105,254
  - what: sibling attestation files to hash as byproducts
    from: dirname(--output)
    evidence: scripts/generate-provenance.py:190-211
  outputs:
  - what: 'slsa-provenance.json (in-toto Statement; subject[0]={name: themonolith-<tag>.iso, digest.sha256}; predicate
      used by actions/attest)'
    to: $OUTPUT_DIR/slsa-provenance.json
    evidence: scripts/generate-provenance.py:214-279
  secrets: []
  external:
  - ext.github-api
  - ext.gentoo-distfiles
  - ext.kernel-org
  - ext.dockerhub
  - ext.ghcr
  pins:
  - thing: buildType
    value: https://actions.github.io/buildtypes/workflow/v1 (GitHub Attestations API rejects others)
    evidence: scripts/generate-provenance.py:113
  - thing: workflow_path
    value: .github/workflows/build.yml (hard-coded)
    evidence: scripts/generate-provenance.py:108
  env:
  - see inputs
  s3_coupling: none
  notes:
  - Exit 1 only if iso-sha256 empty/'(not computed)' (L77-83).
  - 'Defaults when env missing: repository ''unknown/unknown'', sha ''unknown'', run_id ''0'' — provenance is still
    written with placeholders (local dev). Fine locally; in CI a missing env would produce a bogus-but-signed statement.
    No guard.'
  - 'Only the `predicate` (not the full statement) is used by CI: build.yml read-predicate step extracts d[''predicate'']
    and passes to actions/attest@v2 with subject-path=ISO; GitHub builds the real signed statement. The `subject`
    here and slsa-provenance.json itself are NOT what is signed - they are an informational copy.'
  - SOURCE_DATE_EPOCH recorded (L254) but this is the Dockerfile ENV value (1786406400 = 2026-08-10) - not per-build.
  - Kernel URL assumes cdn.kernel.org/pub/linux/kernel/v<major>.x/linux-<ver>.tar.xz (L166-172); resolvedDependencies
