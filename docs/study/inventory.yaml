      why: initramfs has no loader/libs
      evidence: savedconfig:43,47,57
    - entry: CONFIG_FINDFS=y, CONFIG_MOUNT*=y (FEATURE_MOUNT_LABEL), SWITCH_ROOT=y, CAT=y, TR=y, GREP=y, FIND=y,
        ASH=y, MDEV=y, HTTPD=y + FEATURE_HTTPD_CGI=y, MODPROBE/INSMOD/DEPMOD/LSMOD=y, TRACEROUTE=y
      why: initramfs boot needs; HTTPD+CGI added in commit 0897866 (SP4 busybox httpd CGI)
      evidence: savedconfig grep; git log 0897866, c627319 ('give busybox find so the modalias coldplug works')
    - entry: '# CONFIG_DD is not set; XARGS not set'
      why: 'rootfs/init therefore must read labels with cat|tr|grep, not dd (AGENTS.md: ''initramfs busybox lacks
        dd and findfs (stale binpkg)'')'
