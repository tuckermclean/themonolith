- id: wf.release
  kind: workflow
  path: .github/workflows/release.yml
  purpose: 'Publish-only: after a successful Build on a v* tag, pull the attested ISO+SBOM+summary from S3, re-verify
    digest chain, create the GitHub Release.'
  triggers:
  - workflow_run workflows:[Build] types:[completed] (release.yml:32-34)
  invokes:
  - job.release.publish
  invoked_by:
  - wf.build via workflow_run
  permissions: 'contents: write (workflow 44-45)'
  concurrency: group release-${{ workflow_run.head_branch }}, cancel-in-progress false (37-39)
  secrets:
  - secret.AWS_ACCESS_KEY_ID
  - secret.AWS_ACCESS_KEY_SECRET
  - secret.AWS_REGION
  - secret.S3_BUCKET
  external:
  - ext.aws-s3
  - ext.github-api
  s3_coupling: hard
  notes:
  - Runs (skipped) on EVERY Build completion; the 'skipped' runs seen in gh run list are expected.
  - Has never been observed succeeding in the last 34 listed runs (all skipped) - no tag releases in window.
- id: job.release.publish
  kind: job
  path: .github/workflows/release.yml:48
  purpose: Verify tag, download artifacts from S3, verify digest chain, generate SHA256SUMS + notes, gh release
    create, mirror SHA256SUMS to S3.
  triggers:
  - workflow_run
  needs: []
  if: workflow_run.conclusion=='success' && workflow_run.event=='push' && startsWith(workflow_run.head_branch,'v')
    (57-60)
  runner: ubuntu-latest
  permissions:
    contents: write
    id-token: none
    attestations: none
    packages: none
  timeout: default-360
  env:
  - GH_TOKEN=${{ github.token }} (65)
  invokes: []
  commands:
  - cmd: git fetch --tags --force; git rev-parse refs/tags/$TAG^{commit} == workflow_run.head_sha
    rw: refuse to publish if head_branch is not a tag or tag moved
    evidence: release.yml:75
    88-97: null
  - cmd: git describe --tags --abbrev=0 ${TAG}^
    rw: PREV_TAG for changelog
    evidence: release.yml:108
  - cmd: aws s3 cp s3://$S3_BUCKET/themonolith-$BV.iso release-assets/
    rw: READ S3
    evidence: release.yml:129-130
  - cmd: aws s3 cp s3://$S3_BUCKET/attestation/$BV/bom.cdx.json release-assets/bom.cdx.json
    rw: READ S3
    evidence: release.yml:131-132
  - cmd: aws s3 cp s3://$S3_BUCKET/attestation/$BV/attestation-summary.json ./attestation-summary.json
    rw: READ S3 (not shipped in release)
    evidence: release.yml:133-134
  - cmd: sha256sum ISO; python3 -c json iso_sha256 from attestation-summary.json; python3 -c bom['metadata']['component']['hashes'][0]['content']
    rw: digest chain re-check
    evidence: release.yml:149-162
  - cmd: (cd release-assets && sha256sum *.iso bom.cdx.json > SHA256SUMS)
    evidence: release.yml:168-170
  - cmd: git log --no-merges --pretty=format:'- %s (%h)' PREV..TAG
    rw: changelog
    evidence: release.yml:189
  - cmd: gh release create $TAG [--prerelease --latest=false] --title 'The Monolith $TAG' --notes-file release-notes.md
      release-assets/themonolith-*.iso SHA256SUMS bom.cdx.json
