  - make.build-packages-resume
  inputs:
  - what: configs/portage/world (package list)
    from: repo bind mount /configs
    evidence: scripts/build-packages.sh:16,184
  - what: configs/portage/versions.lock (pins -> =cat/pkg-VER atoms)
    from: repo
    evidence: scripts/build-packages.sh:160-166,190-195
  - what: portage configs make.conf bashrc package.{use,accept_keywords,mask,env} env savedconfig profile
    from: /configs/portage -> copied to /usr/i486-linux-musl/etc/portage
    evidence: scripts/build-packages.sh:56-67
  - what: overlay /configs/overlay registered in sysroot repos.conf
    from: repo
    evidence: scripts/build-packages.sh:70-72
  - what: package.mask mirrored into HOST /etc/portage/package.mask for BDEPEND resolution
    from: repo
    evidence: scripts/build-packages.sh:84-91
  - what: runtime portage tree + distfiles + existing gpkgs
    from: volumes monolith-repos, monolith-distfiles, output/packages
    evidence: Makefile:99-101
  outputs:
  - what: gpkgs
    to: output/packages (PKGDIR)
    evidence: scripts/build-packages.sh:19,122,323
  - what: logs
    to: output/logs/emerge-parallel.log + <cat>_<pkg-ver>.build.log from /var/tmp/portage on failure
    evidence: scripts/build-packages.sh:236,270-280
  - what: .failed-packages/.built-packages
    to: output/
    evidence: scripts/build-packages.sh:20-21,286-300
  - what: vmlinuz
    to: output/vmlinuz
    evidence: scripts/build-packages.sh:326-338
  - what: sysroot
    to: output/sysroot/ (rm -rf first)
    evidence: scripts/build-packages.sh:340-380
  - what: resolved kernel config
    to: configs/kernel.config (repo tree)
    evidence: scripts/build-packages.sh:428-432
  secrets: []
  external:
  - ext.gentoo-mirrors
  - ext.kernel-org
  - ext.gentoo-distfiles
  - plus whatever SRC_URI each ebuild fetches (ext.git-*)
  env:
  - CROSS_TARGET (i486-linux-musl)
  - CONFIGS_DIR (/configs)
  - OUTPUT_DIR (/output)
  - JOBS
  - LOAD_AVG
  - MONOLITH_USEPKG (y; n = source-only release build)
  s3_coupling: none
  notes:
  - 'FAILURE MASKING 1: with --keep-going, emerge exits non-zero if anything failed, but then the script decides
    success per package by `compgen -G .../<PN>-*.gpkg.tar` (lines 286-300). A package that failed THIS run but
    has an older gpkg from a previous epoch/cache counts as built (stale binpkg masks a failing rebuild). Dependents
    dropped by --keep-going and never attempted are only detected if no gpkg exists at all.'
  - 'FAILURE MASKING 2: quickpkg is `2>/dev/null || true` (line 323) - errors hidden; it also packages EVERY installed
    sysroot package (''*/*'') including crossdev-installed ones into PKGDIR (these then go into the GHCR binpkg
    artifact).'
  - 'FAILURE MASKING 3: all config sync cp calls are `2>/dev/null || true` (lines 59-64,90): a missing/failed copy
    yields an emerge run against stale baked config with no warning. `cp -r dir/*` also does not delete removed
    files from the sysroot copy, so deleting a package.use file in configs does not remove it in the persistent
    sysroot (only matters when the sysroot dir persists across runs; with --rm containers + committed image it persists
    only inside the image).'
  - bunzip2 of man pages is `2>/dev/null || true` (line 395).
  - 'Default behaviour keeps going: the sysroot export, kernel copy, and rootfs prerequisites still run after failures;
    final exit code is `[ FAIL_COUNT -eq 0 ]` (line 435). In the all-success path FAIL_COUNT is never initialised
    from emerge, set to 0 (lines ~254-258).'
  - Kernel build mode detection greps the emerge log for '>>> Emerging binary (N of M) sys-kernel/monolith-kernel-'
    vs '>>> Emerging (N of M) ...' (lines 412-417); unknown -> ::warning::. This depends on emerge's English output
    format.
  - 'MONOLITH_USEPKG=n drops --usepkg but keeps --buildpkg; release workflow sets it and also skips the GHCR cache
    pull. Note: pre-existing gpkgs in PKGDIR are still on disk.'
  - 'Build side-effects on the host (container): appends games/gamestat groups to /etc/group (lines 97-98) and seeds
    root/portage/games/gamestat in sysroot passwd/group (lines 109-117). portage uid/gid 250.'
  - Writes resolved kernel config OVER configs/kernel.config in the repo working tree (rw bind mount). In CI this
    dirties the checkout; for local dev it silently changes a tracked file. verify-resolved-i2c-off.sh then reads
    that same file.
  - rsync exclude list (usr/include, usr/i486-linux-musl, crossdev wrappers, etc/portage, pkgconfig, libc.a & friends,
    crt*.o, libssp_nonshared.a) is duplicated verbatim in extract-packages.sh (lines 355-380 vs extract 114-135)
    with a comment 'keep in sync'.
  - Replaces dangling musl ld symlink with a copy of /usr/i486-linux-musl/usr/lib/libc.so at /lib/ld-musl-i386.so.1
    (lines 383-392); warns (not fatal) if missing.
  - unset BUILD_DIR before emerge (multilib-minimal.eclass); also JOBS exported for make.conf MAKEOPTS=-j${JOBS}
    (configs/portage/make.conf:53).
  - 'FEATURES include -sandbox -usersandbox (configs/portage/make.conf:44): builds are unsandboxed and run as container
    root.'
  rebuild_notes:
  - 'Preserve: pinned atoms from versions.lock, single emerge graph with --keep-going but a STRICT post-check that
    every world atom installed (new build should fail if any world package missing - the current gpkg-glob check
    is weaker than needed).'
  - 'Preserve: resolved kernel config as package content; kernel build mode (binpkg vs source) reporting.'
  - 'Preserve: host-side package.mask mirror for BDEPENDs; baseline passwd/group seeding; ld-musl copy; exclude
    list (single source of truth).'
  - Consider writing the resolved kernel config to output/ not configs/.
- id: script.extract-packages
  kind: script
  path: scripts/extract-packages.sh
  purpose: Alternative sysroot population - cross-emerge --usepkgonly of the world list from PKGDIR, with dnsmasq
    recovery, then rsync to output/sysroot.
  invoked_by:
  - make.extract
  inputs:
  - what: world + versions.lock + gpkgs in output/packages
    from: repo/PKGDIR
