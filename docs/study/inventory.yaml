  path: rootfs/init
  purpose: Initramfs /init (POSIX sh, PID 1). Copied verbatim into the initrd by build-initrd.sh.
  invoked_by:
  - script.build-initrd
  steps:
  - 1. set -m; PATH=/sbin:/usr/sbin:/bin:/usr/bin. Define helpers msg/err/dbg, cmdline_get/has, wait_for_device,
    coldplug_once, load_storage_modules, load_manifest_fallback, rescue_shell.
  - 2. Verify PID 1. Mount /proc, /sys (failure -> rescue_shell), /dev as devtmpfs (fallback tmpfs + mknod console/null/zero/tty),
    /dev/pts; run mdev -s if present.
  - '3. Parse /proc/cmdline: debug, rescue (-> rescue shell immediately), root=, rootfstype= (auto), rootflags=
    (ro), init= (/sbin/init), toram, persist, nomodules.'
  - '4. Unless nomodules: load_storage_modules - locate /lib/modules/*/modules.dep, resolve module loader (/sbin/modprobe,
    /bin/modprobe, /usr/bin/kmod, /bin/kmod), coldplug: for every /sys modalias run modprobe -q <modalias>, sleep
    1, coldplug again, mdev -s.'
  - '5. If root= given: wait up to 30 s for the device, mount it ro at /newroot (OVERLAY_MODE=0).'
  - '6. Else overlay mode: search boot media in up to 8 attempts - pass1 /dev/sr0 sr1 cdrom hdc hdd as iso9660;
    pass2 /dev/disk/by-label/{MONOLITH,LIVECD}; pass3 every /sys/block device and partitions (mount -o ro autodetect)
    - success = /media/rootfs.squashfs exists; between attempts sleep 2 + recoldplug; after attempt 2 force-load
    whole /etc/initrd-modules manifest once. No media -> rescue shell.'
  - '7. toram: tmpfs 80% at /ram, cp rootfs.squashfs, umount /media (failure -> continue from media).'
  - 8. mount -t squashfs -o ro (loop) at /squashfs.
  - '9. persist: poll up to 8 s for a block device whose raw content contains the string MONOLITH_PERSIST (cat |
    tr -d NUL | grep -q over /dev/vd* sd* nvme*n* mmcblk* hd*; findfs LABEL=... tried first); fsck if available;
    mount -t auto -o rw at /overlay; on failure fall back to tmpfs. Otherwise tmpfs size=50% at /overlay.'
  - 10. mount -t overlay lowerdir=/squashfs upperdir=/overlay/upper workdir=/overlay/work at /newroot; move/bind
    /squashfs /overlay /media (/ram if toram) into /newroot.
  - 11. Verify /newroot$INIT_PROG executable (else /sbin/init or /bin/sh); mount --move /proc /sys /dev into /newroot.
  - 12. pivot_root . mnt/initramfs; on failure (overlayfs) exec switch_root /newroot $INIT_PROG; last resort exec
    chroot . init; else rescue_shell.
  external: []
  s3_coupling: none
  contract_with_other_components:
  - ISO must contain rootfs.squashfs at ISO root with volume label MONOLITH (build-iso.sh:100,414).
  - 'ISOLINUX/GRUB cmdline tokens recognised: debug rescue toram persist root= rootfstype= rootflags= init= nomodules;
    vga=/console=/quiet are kernel-level.'
  - initrd must ship /etc/initrd-modules (manifest) and /lib/modules/<KVER>/ built by build-initrd.sh, plus /bin/kmod.
  - Persist label is MONOLITH_PERSIST (ext*); detection is a raw-device string scan, NOT blkid/findfs, because the
    shipped busybox lacks findfs and dd (comment lines 436-450 in init).
  notes:
  - The persist label scan false-positive risk is acknowledged and avoided by not scanning loop*/sr* (squashfs contains
    this script).
  - Sleeps are fixed (1 s, 2 s) - latency on slow hardware, race tolerance on fast.
  - 'Many `2>/dev/null || true` around module loading and mdev: failures are intentionally silent; load_manifest_fallback
    does print modprobe errors.'
  - rootflags default ro; root= path uses mount -t auto-type 'auto' -o ro with NO overlay (no writable root).
  - No ISO checksum / media verification (no sha check of squashfs).
  - debug mode toggles `DEBUG=1` only via `cmdline_has debug && DEBUG=1`.
  rebuild_notes:
  - 'Part of the boot oracle: copy verbatim, then verify with boot-test modes (cd, usb/sata/nvme, persist, toram,
    rescue).'
