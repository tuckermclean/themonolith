- id: script.nightly-cve-monitor
  kind: script
  path: scripts/nightly-cve-monitor.py
  purpose: Re-scan every historical build SBOM with a fresh grype DB; mark builds with any CVE as revoked; write
    status/<tag>.json for the on-ISO advisory check; regenerate builds-index
  triggers:
  - wf.nightly-cve-scan cron 0 4 * * * + dispatch (.github/workflows/nightly-cve-scan.yml:17-20)
  invokes:
  - script.generate-dashboard
  - tool grype (db update; sbom:<f> -o json)
  - tool aws (s3 sync)
  invoked_by:
  - wf.nightly-cve-scan
  inputs:
  - what: per-build dirs with bom.cdx.json (fallback sbom-enriched.cdx.json, sbom.cdx.json) + attestation-summary.json
    from: ext.aws-s3 s3://$S3_BUCKET/attestation/ synced to --data-dir
    evidence: scripts/nightly-cve-monitor.py:54-78,238-240
  - what: prior status files
    from: ext.aws-s3 s3://$S3_BUCKET/status/
    evidence: scripts/nightly-cve-monitor.py:241-242
  outputs:
  - what: 'status/<tag>.json {build_tag,checked, status: revoked|clean, advisories[], details_url https://themonolith.org/builds/<tag>}'
    to: ext.aws-s3 s3://$S3_BUCKET/status/<tag>.json
    evidence: scripts/nightly-cve-monitor.py:133-150,314-315
  - what: 'rewritten attestation-summary.json (cve_check->revoked|fail, overall->fail, cve_failures += ''retroactive:
      <CVE>'')'
    to: s3://$S3_BUCKET/attestation/<tag>/attestation-summary.json (in place)
    evidence: scripts/nightly-cve-monitor.py:153-183,317-319
  - what: builds-index.json + latest-build.json
    to: s3://$S3_BUCKET/ (bucket root)
    evidence: scripts/nightly-cve-monitor.py:321-329
  secrets:
  - secret.AWS_ACCESS_KEY_ID
  - secret.AWS_ACCESS_KEY_SECRET
  - secret.AWS_REGION
  - secret.S3_BUCKET
  external:
  - ext.aws-s3
  - ext.grype-db
  pins: []
  env: []
  s3_coupling: hard
  notes:
  - 'Has NO relationship to cve-policy.yaml: ANY grype match of ANY severity (even Negligible) => revoked (L278-291).
    Disagrees with the build-time gate (docs/cve-gate.md:209-217 admitted this; still true).'
  - 'State machine bug: a build previously ''revoked'' with unchanged CVEs gets cve_check=''fail'' on the next night
    (prior_status==''clean'' is the only path to ''revoked'', L291). status/<tag>.json stays revoked. Flip-flops
    ''revoked'' -> ''fail''.'
  - A build whose CVEs disappear gets status/<tag>.json=clean but the attestation-summary.json is never reverted
    from revoked/fail.
  - Newly-found CVEs are appended into cve_failures but summary.cve_check for a build that ALREADY failed build-time
    gate (never would have been published as tag release though) is also rewritten.
  - s3_sync(data_dir -> attestation/) uploads data_dir's status/ and dashboard/ subdirs INTO the attestation/ prefix
    (L319) - junk objects attestation/status/*, attestation/dashboard/*. (find_sboms skips them as no SBOM but generate-dashboard
    rglob does not matter.)
  - Scans ALL builds (every CI build dir), not just 'tagged release SBOMs' as docstring/doc claim. Whole attestation/
    prefix incl. large syft json is synced down nightly (egress cost).
  - Fails (exit 1) only if zero builds scanned & errors>0; old SBOM formats are skipped (L346-355).
  - 'The ISO side consumer is configs/overlay/app-misc/monolith-base/files/monolith-advisory-check: GET ${ADVISORY_BASE_URL:-https://themonolith.s3.amazonaws.com}/status/<BUILD_TAG>.json,
    greps ''"status"..."revoked"'', copies JSON to /run/monolith-advisory. BUILD_TAG from /etc/monolith-release.'
  - details_url points to a different domain (themonolith.org) than anything else (S3 website).
  - Wired to cron since after docs were written; docs/cve-gate.md:209 and README.md ~L185 still say it is orphaned
    (see contradictions).
  rebuild_notes:
  - Whole thing is S3-hard-coupled; needs a new store for status/<tag>.json that the ISO can fetch with plain HTTP
    from i486 (curl/wget, 5s timeout) and a new place for rewritten summaries.
  - Decide whether revocation should honour cve-policy.yaml (it currently does not).
