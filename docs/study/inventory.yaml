    evidence: scripts/check-cves.sh:100-103
  secrets: []
  external:
  - ext.grype-db
  - ext.nvd
  pins: []
  env: []
  s3_coupling: none
  notes:
  - 'Exit 1 on: gating finding, fail_on_unscanned && unscanned>0, grype rc!=0, SBOM parse error, native JSON parse
    error (L172-184,211,225,434).'
  - POLICY MISSING => WARNING and built-in default (Critical/High/Unknown, no allowlist, policy sha empty). NOT
    a failure (L113-118).
  - POLICY PARSE ERROR => WARNING + built-in default (L249-251) also not a failure. Missing pyyaml => exit 1 (L246).
  - 'policy.update({k:v}) merges loaded YAML over the default; keys consumed: gating_severities, informational_severities
    (reported only), fail_on_unscanned, allowlist. `fix_state_gates` in cve-policy.yaml is documentation only -
    NOT read by code (L231-253).'
  - 'allowlist entry `expires` is recorded in findings (waiver_expires, L333) but NEVER enforced: an expired waiver
    still waives. cve-policy.yaml:81-90 says `expires` is required and ''forces a fresh look'' - not true in code.
    `justification`/`approved_by` presence is also not validated.'
  - waiver_for matches by cve id (case-insens) and optional exact `component` == grype artifact.name (L256-264).
  - DB age >3 days => age_warning string only (L290-296); unparseable build time => warning too. Never a failure
    (docs/cve-gate.md:225-232 admits; no max_db_age_days key).
  - Pre-scan 'unscanned' = components with no `cpe` field, type!=file. This INCLUDES acct-*/virtual/* excluded components,
    so cve_coverage.unscanned >= unmapped_cpe_count (which excludes policy-exempt ones). Two different 'gap' numbers
    on the dashboard.
  - 'matched_count counts distinct (name,version) from grype matches; clean = max(scanned - matched, 0): matches
    against components without a CPE (e.g. via purl) would make clean undercount.'
  - grype is run twice (native, then cyclonedx) for 'cross-version stability'; second pass overwrites GRYPE_RC=$?
    (L179) fine.
  - Verdict printout says 'See cve-coverage.json' (L428) but file is *-coverage.json.
  rebuild_notes:
  - Keep gating_severities {Critical,High,Unknown}, fail_on_unscanned=false, fix_state_gates=always semantics, coverage
    file schema (consumed by web).
  - 'Decide: enforce waiver `expires` and required fields (currently dead promise), add max_db_age_days if DB freshness
    should gate.'
  - grype install is `curl .../main/install.sh | sh` unpinned in nightly-cve-scan.yml:43 and cve-gate-canary.yml:37-38;
    the builder image's grype version comes from the Dockerfile (not my area).
- id: script.check-licenses
  kind: script
  path: scripts/check-licenses.py
  purpose: Evaluate each SBOM component (and metadata.component) license expression against license-policy.yaml
    allowlist; DNF semantics
  triggers: []
  invokes: []
  invoked_by:
  - script.attestation
  inputs:
  - what: enriched SBOM bom.cdx.json
    from: --sbom
    evidence: scripts/check-licenses.py:285,300
  - what: license-policy.yaml (allowed_spdx, gentoo_to_spdx, denied_spdx)
    from: --policy
    evidence: scripts/check-licenses.py:48-55
  outputs:
  - what: license-report.json {build_tag,timestamp,sbom_path,policy_path,policy_sha256,summary{total,pass,fail,unknown},components[{name,version,raw_license,normalized[],status,reason}]}
    to: $OUTPUT_DIR/license-report.json
    evidence: scripts/check-licenses.py:327-346
  secrets: []
  external: []
  pins: []
  env: []
  s3_coupling: none
  notes:
  - Exit 1 iff n_fail>0 (L362). `unknown` (no license field) is NOT a failure (L17-18, L227-235).
  - 'denied_spdx wins over allowed_spdx (L208-211); currently denied_spdx: [] (license-policy.yaml:134).'
  - 'Unmapped license names are matched literally against allowed_spdx; gentoo_to_spdx maps e.g. GPL-2 -> GPL-2.0-or-later
    (note: Gentoo ''GPL-2'' is really GPL-2.0-only; policy over-approximates but both are allowed).'
  - Failure reason only reports the FIRST conjunction's failing licenses (L259) even when other alternatives exist.
  - Compound SPDX expression 'GPL-2.0-only WITH Font-exception-2.0' is allow-listed as a literal string with spaces
    (license-policy.yaml:62) but the tokenizer splits on whitespace (L87), so the string can never match as a single
    token; works only through the Gentoo alias GPL-2-with-font-exception.
  - 'Policy is a flat allowlist of ~54 ids: permissive + copyleft all allowed (GPL/LGPL/MPL/EUPL/CC-BY-SA/OFL/etc.).
    No copyleft deny. Non-SPDX tokens (openssl, curl, nethack, netcat, Toyoda, lsof, man-pages, tcp_wrappers_license,
    BEER-WARE...) are allowed by literal name.'
  - Includes metadata.component (product, MIT) in the report; dedupes by name (L312-317).
  rebuild_notes:
  - Any new package whose Portage LICENSE is not covered fails the build; the allowlist grows by hand. Keep gentoo_to_spdx
    table with the recipes.
