# ===================================================================== release.yml
  - id: wf.release
    kind: workflow
    path: .github/workflows/release.yml
    purpose: "Publish-only: after a successful Build on a v* tag, pull the attested ISO+SBOM+summary from S3, re-verify digest chain, create the GitHub Release."
    triggers: ["workflow_run workflows:[Build] types:[completed] (release.yml:32-34)"]
    invokes: [job.release.publish]
    invoked_by: ["wf.build via workflow_run"]
    permissions: "contents: write (workflow 44-45)"
    concurrency: "group release-${{ workflow_run.head_branch }}, cancel-in-progress false (37-39)"
    secrets: [secret.AWS_ACCESS_KEY_ID, secret.AWS_ACCESS_KEY_SECRET, secret.AWS_REGION, secret.S3_BUCKET]
    external: [ext.aws-s3, ext.github-api]
    s3_coupling: hard
    notes: ["Runs (skipped) on EVERY Build completion; the 'skipped' runs seen in gh run list are expected.", "Has never been observed succeeding in the last 34 listed runs (all skipped) - no tag releases in window."]

  - id: job.release.publish
    kind: job
    path: .github/workflows/release.yml:48
    purpose: "Verify tag, download artifacts from S3, verify digest chain, generate SHA256SUMS + notes, gh release create, mirror SHA256SUMS to S3."
    triggers: [workflow_run]
    needs: []
    if: "workflow_run.conclusion=='success' && workflow_run.event=='push' && startsWith(workflow_run.head_branch,'v') (57-60)"
    runner: ubuntu-latest
    permissions: {contents: write, id-token: none, attestations: none, packages: none}
    timeout: default-360
    env: ["GH_TOKEN=${{ github.token }} (65)"]
    invokes: []
    commands:
      - {cmd: "git fetch --tags --force; git rev-parse refs/tags/$TAG^{commit} == workflow_run.head_sha", rw: "refuse to publish if head_branch is not a tag or tag moved", evidence: release.yml:75,88-97}
      - {cmd: "git describe --tags --abbrev=0 ${TAG}^", rw: "PREV_TAG for changelog", evidence: release.yml:108}
      - {cmd: "aws s3 cp s3://$S3_BUCKET/themonolith-$BV.iso release-assets/", rw: "READ S3", evidence: release.yml:129-130}
      - {cmd: "aws s3 cp s3://$S3_BUCKET/attestation/$BV/bom.cdx.json release-assets/bom.cdx.json", rw: "READ S3", evidence: release.yml:131-132}
      - {cmd: "aws s3 cp s3://$S3_BUCKET/attestation/$BV/attestation-summary.json ./attestation-summary.json", rw: "READ S3 (not shipped in release)", evidence: release.yml:133-134}
      - {cmd: "sha256sum ISO; python3 -c json iso_sha256 from attestation-summary.json; python3 -c bom['metadata']['component']['hashes'][0]['content']", rw: "digest chain re-check", evidence: release.yml:149-162}
      - {cmd: "(cd release-assets && sha256sum *.iso bom.cdx.json > SHA256SUMS)", evidence: release.yml:168-170}
      - {cmd: "git log --no-merges --pretty=format:'- %s (%h)' PREV..TAG", rw: "changelog", evidence: release.yml:189}
      - {cmd: "gh release create $TAG [--prerelease --latest=false] --title 'The Monolith $TAG' --notes-file release-notes.md release-assets/themonolith-*.iso SHA256SUMS bom.cdx.json", rw: "WRITE GitHub release; prerelease iff TAG#v contains a hyphen", evidence: release.yml:255-271}
      - {cmd: "aws s3 cp release-assets/SHA256SUMS s3://$S3_BUCKET/attestation/$BV/SHA256SUMS", rw: "WRITE S3 (after the release; failure here leaves release published but job red)", evidence: release.yml:277-278}
    secrets: [secret.AWS_ACCESS_KEY_ID, secret.AWS_ACCESS_KEY_SECRET, secret.AWS_REGION, secret.S3_BUCKET]
    pins:
      - {thing: actions/checkout, value: "@v4 (fetch-depth 0, ref workflow_run.head_sha)", evidence: release.yml:67-72}
      - {thing: aws-actions/configure-aws-credentials, value: "@v4", evidence: release.yml:117}
    external: [ext.aws-s3, ext.github-api]
    s3_coupling: hard
    ci_assertions:
      - id: release.tag-matches-sha
        location: release.yml:88-97
        condition: "refs/tags/${head_branch} must exist and its commit == workflow_run.head_sha"
      - id: release.digest-chain
        location: release.yml:149-162
        condition: "sha256sum(downloaded ISO) == attestation-summary.json['iso_sha256'] AND == bom.cdx.json['metadata']['component']['hashes'][0]['content']; else exit 1."
    notes:
      - "Does NOT verify the Sigstore attestation (no `gh attestation verify`); the digest chain is S3-sourced, so release publishes S3 content, not the cached ISO that was attested. Only a sha comparison ties them."
      - "Release notes hard-code `--owner tuckermclean` in gh attestation verify (216) and read kernel/busybox versions from versions.lock at checkout (175-176); kernel version printed with -rN."
      - "Release notes link: https://<S3_BUCKET>.s3.amazonaws.com/#/build/<ver> (230) - dashboard on S3 root."
      - "`id: digest` step defined AFTER its run block at 164; fine in YAML."
      - "Changelog heredoc via GITHUB_OUTPUT with 'CHANGELOG_EOF' delimiter; git log subjects injected via env, OK."
      - "ISO shipped as a GitHub release asset: size limit 2 GiB per asset - ISO size unknown here."
    rebuild_notes:
      - "Keep: tag->head_sha check, digest-chain re-verify, SHA256SUMS, prerelease rule (hyphen => prerelease, not Latest). Replace the S3 hop (e.g. GHCR oras or Actions artifact via workflow_run + gh run download)."
      - "Better: attest and release the SAME bytes; consider `gh attestation verify` before publish."

