    permissions: "contents: read (workflow); job-level elevated"
    env: ["REGISTRY=ghcr.io/${{ github.repository_owner }} (62)"]
    s3_coupling: hard
    notes: ["Last runs: 10-26 success (8s => check found no update), 10-19 FAILED at Configure AWS credentials, 10-12 success (no update), 10-05, 09-28 success."]

  - id: job.pin-bump.check
    kind: job
    path: .github/workflows/pin-bump.yml:67
    purpose: "Host-only: is a newer BUILD_EPOCH available?"
    needs: []
    runner: ubuntu-latest
    permissions: "inherited contents: read"
    timeout: default-360
    invokes: [script.update-build-pins]
    outputs: [update_available, current_epoch, target_epoch, check_output]
    commands:
      - {cmd: "scripts/update-build-pins.sh check", rw: "reads Dockerfile; queries upstream (Docker Hub gentoo/stage3 tags per header) for latest; prints 'BUILD_EPOCH <cur> <latest> *'-style line; gate greps 'BUILD_EPOCH.*\\*' and awk '{print $3}' for latest", evidence: pin-bump.yml:93,112-116}
    secrets: []
    pins: [{thing: actions/checkout, value: "@v4", evidence: pin-bump.yml:75}]
    external: [ext.dockerhub]
    ci_assertions:
      - {id: pinbump.target-epoch-format, location: pin-bump.yml:77-83, condition: "dispatch input target_epoch must match ^[0-9]{8}$"}
    s3_coupling: none
    notes: ["Script injection risk: ${{ inputs.target_epoch }} interpolated into shell (80,102) before validation - low risk (dispatch only, repo writers)."]

  - id: job.pin-bump.bump-and-validate
    kind: job
    path: .github/workflows/pin-bump.yml:122
    purpose: "Bump BUILD_EPOCH+SOURCE_DATE_EPOCH, mirror snapshot to S3, regen versions.lock, dispatch+poll build.yml, open PR, squash --admin auto-merge on green."
    needs: [check]
    if: "needs.check.outputs.update_available == 'true'"
    runner: ubuntu-latest
    permissions: {contents: write, pull-requests: write, issues: write, actions: write, packages: read, id-token: none}
    timeout: 280 minutes
    env: ["GH_TOKEN=github.token", "OLD_EPOCH", "NEW_EPOCH"]
    invokes: [make.ensure-dirs, make.pull-image, script.update-build-pins, script.sync-portage, make.sync-portage, make.update-versions, wf.build]
    secrets: [secret.AWS_ACCESS_KEY_ID, secret.AWS_ACCESS_KEY_SECRET, secret.AWS_REGION, secret.S3_BUCKET, secret.GITHUB_TOKEN]
    commands:
      - {cmd: "gh label create pin-bump|needs-fixup|validated --force", rw: "WRITE GitHub labels", evidence: pin-bump.yml:152-157}
      - {cmd: "scripts/update-build-pins.sh update $NEW_EPOCH", rw: "edits Dockerfile BUILD_EPOCH + SOURCE_DATE_EPOCH", evidence: pin-bump.yml:188}
      - {cmd: "BUILD_EPOCH=$NEW_EPOCH sh scripts/sync-portage.sh fetch-only (env S3_BUCKET)", rw: "downloads portage snapshot from Gentoo and WRITES it to S3 portage-snapshots/ (HARD S3)", evidence: pin-bump.yml:200}
      - {cmd: "make sync-portage update-versions (env S3_BUCKET)", rw: "docker run builder image; reads S3 snapshot; rewrites configs/portage/versions.lock; rc captured not fatal", evidence: pin-bump.yml:207}
      - {cmd: "sudo chown -R configs/portage; git add -A; git diff --cached ...; git commit; git push -u origin pins/bump-OLD-NEW", rw: "pushes branch with GITHUB_TOKEN (no workflow triggers)", evidence: pin-bump.yml:221-236}
      - {cmd: "gh workflow run build.yml --ref pins/bump-OLD-NEW; gh run list --workflow=build.yml --branch ... (30x10s) to find run id", rw: "dispatch; needs actions:write", evidence: pin-bump.yml:245-255}
      - {cmd: "gh run view $RUN_ID --json status / conclusion / jobs (poll 60s up to 240 min)", evidence: pin-bump.yml:279-295}
      - {cmd: "gh pr create --base master --head pins/bump-OLD-NEW --label ...", evidence: pin-bump.yml:365-370}
      - {cmd: "gh pr merge pins/bump-OLD-NEW --squash --admin --delete-branch (if wait.conclusion=='success')", rw: "auto-merge; --admin requires bypass of branch protection (caveat comment 380-391); GITHUB_TOKEN may 403", evidence: pin-bump.yml:392-396}
    pins: [{thing: actions/checkout, value: "@v4"}, {thing: configure-aws-credentials, value: "@v4", evidence: pin-bump.yml:160}, {thing: docker/login-action, value: "@v3", evidence: pin-bump.yml:167}]
    external: [ext.aws-s3, ext.ghcr, ext.github-api, ext.dockerhub, ext.gentoo-mirrors]
    s3_coupling: hard
    notes:
      - "A build.yml dispatch on pins/bump-* branch is a non-master, non-tag ref => PUBLISH_LATEST=false => no S3 writes from build, but build still needs AWS creds + S3 portage snapshot (sync-portage) - the validated flow is dead without S3."
      - "Dispatching build.yml via GITHUB_TOKEN works (workflow_dispatch is allowed from GITHUB_TOKEN)."
      - "Wait budget 240 min inside a 280-min timeout; the hosted cap is 360."
      - "PR creation uses GITHUB_TOKEN => PR creation by bot does not trigger pr-validate (GitHub rule) - pr-validate wouldn't run on these PRs."
      - "Branch pins/bump-* push would trigger regen-pins only for non-GITHUB_TOKEN pushes."
    rebuild_notes: ["Keep the two-pin model (BUILD_EPOCH cheap/auto, TOOLCHAIN_EPOCH human-gated). Replace S3 snapshot mirror."]

# ===================================================================== regen-pins.yml
  - id: wf.regen-pins
    kind: workflow
    path: .github/workflows/regen-pins.yml
    purpose: "On a pins/** or integration/** branch push touching pin files, regenerate crossdev.lock and versions.lock in CI and commit them back."
    triggers: ["push branches ['integration/**','pins/**'] paths Dockerfile, configs/portage/crossdev.lock, configs/portage/versions.lock, scripts/update-versions.sh, scripts/update-build-pins.sh (regen-pins.yml:21-28)", "workflow_dispatch (29)"]
    invokes: [job.regen-pins.regen]
    concurrency: "regen-pins-<ref>, no cancel (35-37)"
    permissions: "contents: write, packages: write (31-33)"
    env: ["REGISTRY=ghcr.io/${{ github.repository_owner }}"]
    s3_coupling: soft
    notes: ["No recent runs in the 300-run window => effectively dormant manual-assist workflow.", "Name is 'Regenerate pin lockfiles'."]

  - id: job.regen-pins.regen
    kind: job
    path: .github/workflows/regen-pins.yml:43
    purpose: "Resolve musl/gcc/binutils pins from pinned stage3 snapshot, rebuild toolchain image, push it, run make update-versions, commit locks."
    needs: []
    runner: ubuntu-latest
    permissions: {contents: write, packages: write, id-token: none}
    timeout: default-360 (comment says ~50min crossdev)
    invokes: [make.ensure-dirs, make.ensure-volume, make.pull-image, make.build-image, make.push-image, make.update-versions, script.update-versions]
    commands:
      - {cmd: "docker pull -q gentoo/stage3:amd64-openrc-$EPOCH; docker run --rm $IMG sh -euc 'emerge-webrsync --revert=$EPOCH ...; echo \"*/* ~*\" > /etc/portage/package.accept_keywords/zz-regen; portageq best_visible / sys-libs/musl ; \"=sys-devel/gcc-15*\"; sys-devel/binutils; ls musl ebuilds'", rw: "reads Docker Hub + Gentoo snapshot (emerge-webrsync, i.e. ext.gentoo-mirrors); NOT S3", evidence: regen-pins.yml:56-70}
      - {cmd: "writes configs/portage/crossdev.lock (musl:<v>:0, gcc:<v>:<major>) and sed-patches sys-devel/binutils line in configs/portage/versions.lock", evidence: regen-pins.yml:91-107}
      - {cmd: "make build-image; make push-image; make update-versions", evidence: regen-pins.yml:130,136,147}
      - {cmd: "git add Dockerfile versions.lock crossdev.lock; git commit -m '... [skip ci]'; git push origin HEAD:${{ github.ref_name }}", rw: "WRITE branch with bot identity monolith-ci[bot]", evidence: regen-pins.yml:174-182}
    secrets: [secret.AWS_ACCESS_KEY_ID, secret.AWS_ACCESS_KEY_SECRET, secret.AWS_REGION, secret.GITHUB_TOKEN]
    pins: [{thing: actions/checkout, value: "@v4 ref: github.ref_name", evidence: regen-pins.yml:46-48}, {thing: configure-aws-credentials, value: "@v4", evidence: regen-pins.yml:111}, {thing: docker/login-action, value: "@v3"}]
    artifacts: [{upload: "regen-crossdev-logs-${run_id}", if: failure(), retention: 7d}, {upload: "regenerated-locks-${run_id}", paths: [Dockerfile, configs/portage/versions.lock, configs/portage/crossdev.lock], if: always(), retention: 14d, evidence: regen-pins.yml:157-169}]
    external: [ext.dockerhub, ext.gentoo-mirrors, ext.ghcr, ext.aws-s3]
    s3_coupling: soft
    s3_detail: "AWS creds configured (110) so `make update-versions` could read the S3 portage snapshot via the mounted env? The make targets in this job (build-image, update-versions) may or may not use S3; S3_BUCKET is NOT passed in env here, so S3 use is unlikely, but the unconditional Configure AWS step will fail with the disabled account => job fails. Treat as hard-failing in practice."
    notes:
      - "Dead-credential effect: fails at Configure AWS credentials step even though the S3 bucket is not used (no S3_BUCKET env set here)."
      - "The `*/* ~*` keyword trick excludes live 9999 ebuilds (the gcc-15.3.9999 incident)."
      - "Comment (regen-pins.yml:53) claims the same mechanism the Dockerfile uses (emerge-webrsync --revert=EPOCH)."
    rebuild_notes: ["The stage3-query trick for musl/gcc/binutils is the recipe worth keeping; drop AWS step."]

# ===================================================================== toolchain-bump.yml
  - id: wf.toolchain-bump
    kind: workflow
    path: .github/workflows/toolchain-bump.yml
    purpose: "Human-triggered TOOLCHAIN_EPOCH bump: rebuild builder image, dispatch build.yml validation, open PR (never auto-merge)."
    triggers: ["workflow_dispatch input target_epoch optional (toolchain-bump.yml:32-40)"]
    invokes: [job.toolchain-bump.bump-and-validate, wf.build]
    concurrency: "toolchain-bump, no cancel (42-44)"
    permissions: "contents: read; job elevated"
    env: ["REGISTRY=ghcr.io/${{ github.repository_owner }}"]
    s3_coupling: soft
    notes: ["No AWS step in this workflow; but the build.yml run it dispatches hard-needs S3. No recent runs in window."]

  - id: job.toolchain-bump.bump-and-validate
    kind: job
    path: .github/workflows/toolchain-bump.yml:53
    purpose: "Bump TOOLCHAIN_EPOCH, regen crossdev.lock from pre-bump image, rebuild+push image, dispatch+await build.yml, open PR with label validated|needs-fixup."
    needs: []
    runner: ubuntu-latest
    permissions: {contents: write, pull-requests: write, issues: write, actions: write, packages: write}
    timeout: 355 minutes
    invokes: [make.ensure-dirs, script.update-build-pins, make.push-image, make.build-image, wf.build]
    commands:
      - {cmd: "gh label create toolchain-bump|needs-fixup|validated --force", evidence: toolchain-bump.yml:88-93}
      - {cmd: "docker pull/tag monolith-builder:latest and -base-tools:latest from GHCR (cache)", evidence: toolchain-bump.yml:106-109}
      - {cmd: "scripts/update-build-pins.sh update-toolchain \"$target_epoch\"", rw: "edits Dockerfile TOOLCHAIN_EPOCH, regenerates configs/portage/crossdev.lock from pre-bump image (one-cycle lag)", evidence: toolchain-bump.yml:121}
      - {cmd: "make push-image (build + push)", rw: "WRITE GHCR monolith-builder; rc captured non-fatally", evidence: toolchain-bump.yml:137}
      - {cmd: "git push -u origin toolchain/bump-OLD-NEW; gh workflow run build.yml --ref ...; poll gh run view up to 240 min; gh pr create --base master --label ...", evidence: toolchain-bump.yml:177-188,222-224,309-314}
    secrets: [secret.GITHUB_TOKEN]
    pins: [{thing: actions/checkout, value: "@v4"}, {thing: docker/login-action, value: "@v3", evidence: toolchain-bump.yml:96}, {thing: upload-artifact, value: "@v4"}]
    artifacts: [{upload: "crossdev-logs-${run_id}", path: output/portage-logs/, if: "build-image.rc != '0'", retention: 7d}]
    external: [ext.ghcr, ext.github-api, ext.dockerhub, ext.gentoo-mirrors]
    s3_coupling: soft
    ci_assertions:
      - {id: toolchain.target-epoch-format, location: toolchain-bump.yml:73-79, condition: "target_epoch matches ^[0-9]{8}$"}
      - {id: toolchain.epoch-changed, location: toolchain-bump.yml:122-126, condition: "Dockerfile TOOLCHAIN_EPOCH after update != before, else exit 1"}
    notes:
      - "Never auto-merges (header and 315-316)."
      - "If make push-image fails, PR still opened with needs-fixup (non-fatal)."
      - "`git commit` after `git add -A` includes all runner changes (could include unintended files like output/ if not gitignored)."
      - "Dispatched build.yml on toolchain/bump-* hard-needs S3 (aws creds + sync-portage) => validation can never go green today."
    rebuild_notes: ["Keep human-gated model."]

contradictions:
  - claim: "build.yml comment: release.yml calls this ENTIRE workflow via workflow_call"
    where: ".github/workflows/build.yml:553-558"
    fact: "release.yml triggers on workflow_run and does not call build.yml (release.yml:31-34); build.yml header (3-17) itself says so."
    evidence: "release.yml:31-34"
  - claim: "boot-test.yml header: a future release.yml will call boot-test.yml too"
    where: ".github/workflows/boot-test.yml:8-22"
    fact: "Only build.yml calls it; release.yml does not."
    evidence: "grep 'uses: ./.github/workflows/boot-test.yml' -> only build.yml:562"
  - claim: "build.yml:316-319 says NIC boot matrix proves 6 of the 21 new symbols"
    where: ".github/workflows/build.yml:316-319"
    fact: "boot matrix lists 5 NIC models (pcnet rtl8139 tulip ne2k_pci ne2k_isa, boot-test.yml:567); module assertion list has 23 names incl. 7 netfilter modules."
    evidence: "boot-test.yml:567; build.yml:337-342"
  - claim: "build.yml:497-503 etc. imply 'latest' pointers published only after validation; header says 'no release without a proven boot' (boot-test.yml:5-6)"
    where: ".github/workflows/build.yml:495-546 vs 559-565"
    fact: "latest vmlinuz/squashfs/initrd/iso are copied to S3 inside the build job BEFORE boot-test runs. Boot-test gates only attestation and release, not the public 'latest' pointer."
    evidence: "build.yml:495-546 precede boot-test at 559"
  - claim: "build.yml binpkg cache moved from S3 to GHCR ('replaces old whole-tree aws s3 sync')"
    where: ".github/workflows/build.yml:255-261,442"
    fact: "Cache itself is GHCR, but build.yml:809 still excludes 'packages/*' from site sync and gc.yml/s3-gc.sh still operates on S3 keep-lists (vestige of S3 binpkg tree)."
    evidence: "build.yml:809; gc.yml:26-29"
  - claim: "AGENTS.md says tag builds skip binpkg cache entirely ('no cached binary enters a signed release')"
    where: "AGENTS.md (Release flow), build.yml:262-266"
    fact: "Tag builds skip pull and purge, but still run prune/pack/push of the freshly built packages to GHCR monolith-binpkgs:<epoch> (no tag guard at build.yml:448-466). A tag build can therefore populate the cache non-master builds later consume; harmless for the tag itself."
    evidence: "build.yml:448-466 has no `if: !startsWith(github.ref, 'refs/tags/')`"
  - claim: "scripts/verify-resolved-i2c-off.sh header: build.yml invocation is single-argument, mode label 'unknown' in CI"
    where: "scripts/verify-resolved-i2c-off.sh:25-27"
    fact: "Consistent with build.yml:313, but the recent commits (DCX-99) claim CI 'names build mode'; the workflow does not pass a mode, so CI output always says 'unknown'."
    evidence: "build.yml:313"
  - claim: "pin-bump.yml header comment states cron is 3h after build.yml's weekly build"
    where: ".github/workflows/pin-bump.yml:41-43"
    fact: "Timing is correct (03:00/06:00) but a from-source/master build takes 30-60 min+; relation is only loose; not a contradiction in values."
    evidence: "build.yml:31, pin-bump.yml:44"
  - claim: "docs say release.yml is self-contained for provenance"
    where: "docs/releasing.md:75-106 (not fully read)"
    fact: "Workflow code matches the post-#54/#55/#56 flow (build owns tag, release is workflow_run). No disagreement found except the stale comments above."
    evidence: "release.yml:3-29"

