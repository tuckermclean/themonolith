area: workflows
scope_note: >
  10 files in .github/workflows/ read in full (3165 lines). Line numbers are per-file.
  No `vars.*` anywhere (grep). No `workflow_call` secrets declared (boot-test uses `secrets: inherit` but its jobs use no secrets).
  Only 2 timeouts set (pin-bump 280, toolchain-bump 355); every other job runs on the 360-min default.
  All runners are ubuntu-latest. No concurrency on boot-test/regen except where noted.
secrets_inventory:
  - {id: secret.AWS_ACCESS_KEY_ID, used_by: [job.build.build, job.build.attestation, job.release.publish, job.gc.gc, job.nightly-cve-scan.rescan, job.pin-bump.bump-and-validate, job.regen-pins.regen]}
  - {id: secret.AWS_ACCESS_KEY_SECRET, used_by: "same set as AWS_ACCESS_KEY_ID"}
  - {id: secret.AWS_REGION, used_by: "same set as AWS_ACCESS_KEY_ID"}
  - {id: secret.S3_BUCKET, used_by: [job.build.build, job.build.attestation, job.release.publish, job.gc.gc, job.nightly-cve-scan.rescan, job.pin-bump.bump-and-validate], note: "bucket name also interpolated into public URL https://$S3_BUCKET.s3.amazonaws.com/#/build/<ver> in release notes (release.yml:230)"}
  - {id: secret.GITHUB_TOKEN, used_by: "docker/login-action to ghcr.io (build-image, build, attestation, toolchain-bump, pin-bump, regen-pins), gh CLI as GH_TOKEN (release, pin-bump, toolchain-bump, gc ghcr-gc)"}
  - {id: "secret.<none: PAT>", note: "No PAT secret. Pushes of pin branches use GITHUB_TOKEN; pushes by GITHUB_TOKEN do not trigger workflows (regen-pins.yml:9-13) - this is why pin-bump/toolchain-bump explicitly `gh workflow run build.yml --ref branch`."}
pins_summary:
  actions:
    - {thing: actions/checkout, value: "@v4 (floating major tag, 31 uses)", flag: unpinned-to-sha}
    - {thing: actions/setup-python, value: "@v5 (18 uses)", flag: unpinned-to-sha}
    - {thing: actions/upload-artifact, value: "@v4 (25 uses)", flag: unpinned-to-sha}
    - {thing: actions/cache, value: "@v4 (cache, cache/restore x19, cache/save x2)", flag: unpinned-to-sha}
    - {thing: actions/attest, value: "@v2 (build.yml:772)", flag: "unpinned-to-sha; the SLSA signing action"}
    - {thing: aws-actions/configure-aws-credentials, value: "@v4 (7 uses)", flag: unpinned-to-sha}
    - {thing: docker/login-action, value: "@v3 (6 uses)", flag: unpinned-to-sha}
    - {thing: dorny/paths-filter, value: "@v3 (build.yml:66)", flag: "unpinned-to-sha; third-party"}
    - {thing: "./.github/workflows/boot-test.yml", value: local reusable workflow (build.yml:562)}
  tools_fetched_at_runtime:
    - {thing: oras, value: "1.2.0 tarball from github.com/oras-project releases (build.yml:234)", flag: pinned-version-no-checksum}
    - {thing: grype, value: "install.sh from raw.githubusercontent.com/anchore/grype/main (cve-gate-canary.yml:56-57, nightly-cve-scan.yml:43-44)", flag: "UNPINNED - curl|sh of main-branch script, latest grype"}
    - {thing: actionlint, value: "v1.7.7 download script + version 1.7.7 (pr-validate.yml:53)", flag: pinned}
    - {thing: check-jsonschema, value: "0.38.0 pip (build.yml:708); pip cache key pip-check-jsonschema-0.38.0", flag: pinned}
    - {thing: qemu-system-x86, ovmf, pexpect, squashfs-tools, kmod, value: "apt/pip latest of ubuntu-latest runner (unpinned)"}
    - {thing: python, value: "3.12 via setup-python (boot-test jobs, nightly-cve-scan); system python3 elsewhere"}
    - {thing: "ubuntu-latest", value: floating runner image, flag: unpinned}
    - {thing: pyyaml, value: "pip3 install --user pyyaml unpinned (cve-gate-canary.yml:61); pr-validate relies on preinstalled yaml"}
caches_summary:
  - {key: "ci-artifacts-${{ github.run_id }}-squashfs", path: "output/themonolith-$BUILD_VERSION.squashfs", saved_by: "job.build.build (build.yml:509-512)", restored_by: "job.build.attestation (build.yml:626-630, fail-on-cache-miss)"}
  - {key: "ci-artifacts-${{ github.run_id }}-iso", path: "output/themonolith-$BUILD_VERSION.iso", saved_by: "job.build.build (build.yml:536-539)", restored_by: "job.build.attestation (641) + every boot-test job (19 restores incl. attestation; boot-test.yml:80-85 etc.)", note: "in-run handoff of ISO between jobs via the Actions cache (not artifacts); run_id is the caller's run_id when boot-test is workflow_call"}
  - {key: "grype-db-<YYYY-VV>", restore-keys: "grype-db-", path: output/grype-db, job: job.build.attestation, evidence: build.yml:643-659}
  - {key: "pip-check-jsonschema-0.38.0", path: "~/.cache/pip", job: job.build.attestation, evidence: build.yml:699-703}
artifacts_summary:
  - {name: "crossdev-logs-${run_id}", path: output/portage-logs/, retention: 7d, by: [job.build.build-image, job.toolchain-bump.bump-and-validate], evidence: "build.yml:148-152; toolchain-bump.yml:146-150"}
  - {name: "package-build-logs-${run_id}", path: output/logs/, retention: 7d, by: job.build.build, evidence: build.yml:296-303}
  - {name: "boot-test-<mode>-${run_id} (bios-64m,bios-256m,uefi,toram,ahci,nvme,usb,virtio,nicless,gui,gui-screendump,stele-acid2,stele-acid2-screendump,nic,vga,fbdev-modprobe,nat,clock-epoch,clock-1996,persist)", retention: 14d, by: boot-test jobs}
  - {name: nightly-cve-data, path: nightly-data/, retention: 14d, by: job.nightly-cve-scan.rescan, evidence: nightly-cve-scan.yml:64-70}
  - {name: "regen-crossdev-logs-${run_id}", retention: 7d, by: job.regen-pins.regen}
  - {name: "regenerated-locks-${run_id}", paths: [Dockerfile, configs/portage/versions.lock, configs/portage/crossdev.lock], retention: 14d, by: job.regen-pins.regen}
  - {note: "No artifact is DOWNLOADED anywhere (no actions/download-artifact); all inter-job file handoff is via actions/cache save/restore or S3."}

cross_workflow_graph:
  triggers:
    - {from: "git push tag v*.*.*", to: wf.build, evidence: build.yml:21}
    - {from: wf.build (conclusion=completed), to: wf.release, via: workflow_run, filter: "conclusion==success && workflow_run.event==push && head_branch startsWith 'v'", evidence: release.yml:32-34,57-60}
    - {from: wf.build job.build.boot-test, to: wf.boot-test, via: workflow_call with build-version input, secrets inherit, evidence: build.yml:559-565}
    - {from: wf.pin-bump, to: wf.build, via: "gh workflow run build.yml --ref pins/bump-OLD-NEW then polls gh run view up to 240 min", evidence: pin-bump.yml:245,268-295}
    - {from: wf.toolchain-bump, to: wf.build, via: "gh workflow run build.yml --ref toolchain/bump-OLD-NEW, polls 240 min", evidence: toolchain-bump.yml:188,211-238}
    - {from: "push to pins/** or integration/** touching Dockerfile/locks", to: wf.regen-pins, evidence: regen-pins.yml:21-28, note: "pin-bump pushes pins/bump-* with GITHUB_TOKEN => does NOT trigger regen-pins (GitHub rule); human pushes do"}
    - {thing: "qemu-system-x86, ovmf, pexpect, squashfs-tools, kmod", value: "apt/pip latest on ubuntu-latest runner (unpinned)"}
    - {from: pull_request, to: [wf.pr-validate, wf.build (only if label full-ci), wf.cve-gate-canary (path filtered)]}
  produced_consumed:
    - {artifact: "S3 themonolith-$VER.{iso,squashfs,initrd,vmlinuz} + unversioned themonolith.{iso,squashfs,initrd,vmlinuz} (server-side copy)", producer: job.build.build (master+tag only), consumers: [job.release.publish (iso only), public dashboard/web UI]}
    - {artifact: "S3 attestation/$VER/* (aws s3 sync of output/attestation/: bom.cdx.json, builder-bom.cdx.json, slsa-provenance.json, attestation-summary.json, ...)", producer: job.build.attestation, consumers: [job.release.publish (bom.cdx.json, attestation-summary.json), job.build.attestation dashboard step (attestation-summary.json of all builds), job.nightly-cve-scan.rescan (via scripts/nightly-cve-monitor.py aws s3 sync), job.gc.gc]}
    - {artifact: "S3 attestation/$VER/SHA256SUMS", producer: job.release.publish, consumers: public}
    - {artifact: "S3 builds/$VER/logs/", producer: job.build.build, consumers: none visible}
    - {artifact: "S3 bucket-root SPA files (index/web assets, builds-index.json)", producer: job.build.attestation 'Generate and upload site' (excludes attestation/*, packages/*, builds/*), consumers: public dashboard}
    - {artifact: "S3 portage-snapshots/ (gentoo-$BUILD_EPOCH.tar.xz)", producer: "scripts/sync-portage.sh via make sync-portage (job.build.build) and fetch-only (job.pin-bump)", consumers: job.build.build, evidence: "build.yml:250-253; pin-bump.yml:200 (key path inferred from brief; script not in scope)"}
    - {artifact: "S3 packages/<epoch> binpkg tree", status: "RETIRED for build.yml - replaced by GHCR OCI artifact; but build.yml:809 and gc still exclude/reference packages/*", note: "see contradictions"}
    - {artifact: "GHCR ghcr.io/<owner>/monolith-builder:<REGISTRY_TAG> and :latest, monolith-builder-base-tools:latest", producer: [job.build.build-image (make push-image), job.toolchain-bump, job.regen-pins], consumers: [build, attestation, pin-bump(make pull-image), regen-pins, toolchain-bump (cache pull)], tag_source: "make print-registry-tag / Makefile REGISTRY_TAG (build.yml:109)"}
    - {artifact: "GHCR ghcr.io/<owner_lowercase>/monolith-binpkgs:<BUILD_EPOCH> (OCI artifact via oras)", producer: "job.build.build 'Save binary package cache to GHCR' (always(), non-fatal) via scripts/binpkg-store.sh prune/pack/push", consumers: "job.build.build pull (non-tag builds only)", note: "GHCR-only: survives the S3 account death. Tag builds never pull but DO push (build.yml:448-466 has no tag guard)."}
    - {artifact: "GitHub Release assets: themonolith-$VER.iso, SHA256SUMS, bom.cdx.json", producer: job.release.publish, source: "S3 round trip", evidence: release.yml:265-271}
    - {artifact: "GitHub attestation (Sigstore SLSA provenance v1, subject=ISO)", producer: job.build.attestation (actions/attest@v2), consumers: "users via gh attestation verify --owner tuckermclean (release.yml:216 hard-codes owner)"}
  tag_release_flow:
    - "1. human pushes tag vX.Y.Z[-suffix] -> build.yml (push tags v*.*.*). BUILD_VERSION = tag minus leading v (build.yml:204). Non-tag: BUILD_VERSION=<BUILD_EPOCH>-<short sha>."
    - "2. build-image(gate on docker manifest inspect) -> build (from source, MONOLITH_USEPKG=n, no binpkg pull/purge; uploads to S3; PUBLISH_LATEST=true for master and tags) -> boot-test (workflow_call, 20 jobs) -> attestation (OIDC id-token+attestations; grype; SBOM schema validate; attest@v2 only if verdict==pass; S3 attestation/ sync; dashboard regen; final fail if overall!=pass)."
    - "3. release.yml fires on workflow_run completed; publish job only if conclusion==success && event==push && head_branch startsWith 'v'. Checks tag exists and tag commit == head_sha; downloads ISO+bom+summary from S3 by BUILD_VERSION; re-hashes ISO vs attestation-summary.json iso_sha256 and vs bom hashes[0]; builds SHA256SUMS; changelog from git log PREV_TAG..TAG; gh release create (hyphen in tag => --prerelease --latest=false); uploads SHA256SUMS back to S3."
    - "4. Master push also runs build.yml fully and overwrites unversioned latest pointers + dashboard. PR builds only with label full-ci; they write nothing to S3 except... NOTHING (PUBLISH_LATEST false => all S3 write steps skipped) but they still pull/push GHCR."
    - "5. Scheduled Monday 03:00 build is a master-ref build => publishes latest (build.yml:481)."
  weekly_cron_map:
    - "Mon 03:00 UTC build.yml; Mon 06:00 pin-bump; Sun 04:00 gc; daily 04:00 nightly-cve-scan; daily 04:30 cve-gate-canary"

